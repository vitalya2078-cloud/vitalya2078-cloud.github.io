      d.ground(bot + 12, 200, 520);
      d.line(560, top, 560, bot, LC.line, 2); const st = niceStep(h, 4);
      for (let v = 0; v <= h + 1e-9; v += st) { const Y = bot - v * k; d.line(552, Y, 568, Y, LC.mute, 2); d.text(n(v, 0) + ' м', 576, Y, { size: 11 }); }
      for (let s = .25; s < tt; s += .25) d.circle(360, top + (v0 * s + LAB_G * s * s / 2) * k, 9, 'rgba(255,194,75,.25)', 'rgba(255,194,75,.45)', 1.5);
      const Y = top + (v0 * tt + LAB_G * tt * tt / 2) * k; d.circle(360, Y, 14, LC.gold);
      d.arrow(395, Y, 395, Y + 18 + (v0 + LAB_G * tt) * 1.6, LC.mint, 3.5, 'v');
      d.text('Промежутки растут: движение равноускоренное', 22, 56, { size: 12 });
    }
  },
  projectile: {
    calc(v, al) { const L = v * v * Math.sin(2 * al * RAD) / LAB_G, H = (v * Math.sin(al * RAD)) ** 2 / (2 * LAB_G); return { label: 'Дальность полёта', value: L, unit: 'м', expr: `L = v₀²·sin 2α / g = ${n(v, 0)}² · sin ${n(2 * al, 0)}° / 9,81 = ${u(L, 'м', 1)}`, note: `Наибольшая высота H = v₀²sin²α / 2g = ${u(H, 'м', 1)}` }; },
    live(v, al, t) { const T = 2 * v * Math.sin(al * RAD) / LAB_G, tt = Math.min(t, T); return [['Время', u(tt, 'с', 2)], ['x', u(v * Math.cos(al * RAD) * tt, 'м', 1)], ['y', u(Math.max(0, v * Math.sin(al * RAD) * tt - LAB_G * tt * tt / 2), 'м', 1)]]; },
    dur: (v, al) => 2 * v * Math.sin(al * RAD) / LAB_G,
    draw(d, v, al, t) {
      d.title('Бросок под углом к горизонту');
      const q = al * RAD, T = 2 * v * Math.sin(q) / LAB_G, Lmax = v * v / LAB_G, x0 = 70, y0 = 330;
      const k = Math.min(580 / Lmax, 250 / (Lmax / 2)); // масштаб зависит только от скорости — углы удобно сравнивать
      d.ground(y0 + 12); d.ruler(x0, x0 + Lmax * k, y0 + 40, Lmax, 'м', niceStep(Lmax));
      const pts = []; for (let i = 0; i <= 80; i++) { const z = T * i / 80; pts.push([x0 + v * Math.cos(q) * z * k, y0 - (v * Math.sin(q) * z - LAB_G * z * z / 2) * k]); }
      d.path(pts, 'rgba(61,214,160,.55)', 2.5, null, [6, 7]);
      d.line(x0, y0, x0 + 60 * Math.cos(q), y0 - 60 * Math.sin(q), LC.text, 8); d.arc(x0, y0, 34, 0, -q, LC.gold); d.text('α = ' + n(al, 0) + '°', x0 + 44, y0 - 14, { col: LC.gold, size: 12, bold: true });
      const z = Math.min(t, T), X = x0 + v * Math.cos(q) * z * k, Y = y0 - (v * Math.sin(q) * z - LAB_G * z * z / 2) * k;
      d.circle(X, Y, 11, LC.gold);
      if (z > 0 && z < T) { d.arrow(X, Y, X + v * Math.cos(q) * 2.2, Y, LC.blue, 3); d.arrow(X, Y, X, Y - (v * Math.sin(q) - LAB_G * z) * 2.2, LC.coral, 3); }
      if (t >= T) d.tag('L = ' + u(v * v * Math.sin(2 * q) / LAB_G, 'м', 1), X, y0 - 30, LC.mint);
    }
  },
  circular: {
    calc: (r, T) => ({ label: 'Центростремительное ускорение', value: 4 * Math.PI ** 2 * r / T ** 2, unit: 'м/с²', expr: `aₙ = 4π²r / T² = 4π² · ${n(r, 1)} / ${n(T, 1)}² = ${u(4 * Math.PI ** 2 * r / T ** 2, 'м/с²')}`, note: `Линейная скорость v = 2πr/T = ${u(2 * Math.PI * r / T, 'м/с')}` }),
    live: (r, T, t) => [['Время', u(Math.min(t, T), 'с', 1)], ['Угол', n(360 * Math.min(t, T) / T, 0) + '°'], ['v', u(2 * Math.PI * r / T, 'м/с')]],
    dur: (r, T) => T,
    draw(d, r, T, t) {
      d.title('Вращение точки по окружности');
      const R = 50 + r * 17, cx = 290, cy = 215, q = -2 * Math.PI * Math.min(t, T) / T, X = cx + R * Math.cos(q), Y = cy + R * Math.sin(q);
      d.circle(cx, cy, R, 'rgba(108,140,255,.08)', LC.blue, 3); d.circle(cx, cy, 5, LC.mute, null);
      d.line(cx, cy, X, Y, LC.line, 2, [5, 5]); d.text('r = ' + u(r, 'м', 1), cx + 10, cy + 22, { size: 12 });
      d.arc(cx, cy, 26, 0, q, LC.violet);
      d.circle(X, Y, 13, LC.gold);
      d.arrow(X, Y, X + (cx - X) * .45, Y + (cy - Y) * .45, LC.coral, 3.5, 'aₙ');
      d.arrow(X, Y, X + 70 * Math.sin(q), Y - 70 * Math.cos(q), LC.mint, 3.5, 'v');
      d.text('Скорость — по касательной,', 520, 160, { size: 12, col: LC.mint });
      d.text('ускорение — к центру', 520, 182, { size: 12, col: LC.coral });
    }
  },

  /* ===== 2. Силы и равновесие ===== */
  newton: {
    calc: (m, F) => ({ label: 'Ускорение тележки', value: F / m, unit: 'м/с²', expr: `a = F / m = ${u(F, 'Н', 0)} / ${u(m, 'кг', 1)} = ${u(F / m, 'м/с²')}` }),
    live: (m, F, t) => [['Время', u(Math.min(t, 3), 'с', 1)], ['Скорость', u(F / m * Math.min(t, 3), 'м/с', 1)], ['Путь', u(F / m * Math.min(t, 3) ** 2 / 2, 'м', 1)]],
    dur: () => 3,
    draw(d, m, F, t) {
      d.title('Тележка под действием постоянной силы');
      const acc = F / m, S = acc * 4.5, x0 = 100, x1 = 560, k = (x1 - x0) / S, y = 300, tt = Math.min(t, 3);
      d.ground(y + 14); d.ruler(x0, x1, y + 40, S, 'м', niceStep(S));
      const X = x0 + acc * tt * tt / 2 * k, s = 26 + Math.cbrt(m) * 12;
      d.cart(X, y + 14, s * 2, s * 1.05, LC.blue, X - x0, n(m, 1) + ' кг');
      d.arrow(X + s, y - s * .65, X + s + 20 + F * 1.2, y - s * .65, LC.mint, 4, 'F');
      d.text('Больше сила — больше ускорение; больше масса — меньше', 22, 56, { size: 12 });
    }
  },
  friction: {
    calc: (m, mu) => ({ label: 'Сила трения скольжения', value: mu * m * LAB_G, unit: 'Н', expr: `Fтр = μ·m·g = ${n(mu, 2)} · ${n(m, 1)} · 9,81 = ${u(mu * m * LAB_G, 'Н', 1)}`, note: 'Брусок тянут равномерно — динамометр показывает силу трения.' }),
    live(m, mu, t) { const Ff = mu * m * LAB_G, F = Math.min(Ff, Ff * t / 1.5); return [['Динамометр', u(F, 'Н', 1)], ['Состояние', t < 1.5 ? 'покоится' : 'скользит']]; },
    dur: () => 4,
    draw(d, m, mu, t) {
      d.title('Брусок на шероховатой поверхности');
      const y = 290, Ff = mu * m * LAB_G, F = Math.min(Ff, Ff * t / 1.5), shift = Math.max(0, t - 1.5) * 50;
      d.ground(y + 2); for (let x = 30; x < 690; x += 9) d.line(x, y + 2, x + 4, y - 2 - mu * 6, 'rgba(141,151,181,.5)', 1.5);
      const w = 70 + Math.cbrt(m) * 18, X = 180 + shift, Hh = 56 + Math.cbrt(m) * 6;
      d.rect(X, y - Hh, w, Hh, LC.violet, LC.text); d.text(n(m, 1) + ' кг', X + w / 2, y - Hh / 2, { col: LC.text, size: 12, align: 'center', bold: true });
      d.line(X + w, y - Hh / 2, X + w + 60, y - Hh / 2, LC.text, 2); d.rect(X + w + 60, y - Hh / 2 - 12, 90, 24, '#1b2542', LC.gold, 2, 5);
      d.rect(X + w + 64, y - Hh / 2 - 6, 82 * clamp(F / 250, .02, 1), 12, LC.gold, null, 0, 3);
      d.line(X + w + 150, y - Hh / 2, X + w + 190, y - Hh / 2, LC.text, 2);
      d.arrow(X + w + 190, y - Hh / 2, X + w + 205 + F * .6, y - Hh / 2, LC.mint, 3.5, 'F');
      d.arrow(X + w * .3, y - 6, X + w * .3 - 12 - F * .6, y - 6, LC.coral, 3.5, 'Fтр');
      d.arrow(X + w / 2, y - Hh, X + w / 2, y - Hh - 70, LC.blue, 3, 'N'); d.arrow(X + w / 2, y - Hh / 2, X + w / 2, y + 60, LC.gold, 3, 'mg');
      d.text(t < 1.5 ? 'Сила растёт — брусок пока покоится' : 'Брусок скользит равномерно: F = Fтр', 22, 56, { size: 12 });
    }
  },
  incline: {
    calc(al, mu) {
      const acc = LAB_G * (Math.sin(al * RAD) - mu * Math.cos(al * RAD));
      return { label: 'Ускорение бруска', value: Math.max(0, acc), unit: 'м/с²', expr: `a = g(sin α − μ cos α) = 9,81 · (${n(Math.sin(al * RAD), 3)} − ${n(mu, 2)} · ${n(Math.cos(al * RAD), 3)}) = ${u(acc, 'м/с²')}`,
        note: acc > .05 ? 'Брусок соскальзывает с постоянным ускорением.' : `Брусок покоится: mg sin α ≤ μmg cos α. Увеличь угол больше ${n(Math.atan(mu) / RAD, 0)}° или уменьши трение.` };
    },
    live(al, mu, t) { const acc = this.calc(al, mu).value; return [['Время', u(t, 'с', 2)], ['Скорость', u(acc * t, 'м/с', 1)], ['Путь', u(Math.min(4, acc * t * t / 2), 'м', 2)]]; },
    dur(al, mu) { const acc = this.calc(al, mu).value; return acc > .05 ? Math.sqrt(8 / acc) : Infinity; },
    draw(d, al, mu, t) {
      d.title('Наклонная плоскость');
      const q = al * RAD, L = 470, X0 = 120, Y0 = 340, acc = this.calc(al, mu).value, s = Math.min(4, acc * t * t / 2);
      const top = [X0 + L * Math.cos(q) * .0, Y0 - L * Math.sin(q)];
      d.path([[X0, Y0 - L * Math.sin(q)], [X0 + L * Math.cos(q), Y0], [X0, Y0]], LC.line, 2, 'rgba(108,140,255,.12)');
      d.arc(X0 + L * Math.cos(q), Y0, 50, Math.PI, Math.PI + q, LC.gold); d.text('α = ' + n(al, 0) + '°', X0 + L * Math.cos(q) - 110, Y0 - 16, { col: LC.gold, size: 12, bold: true });
      const p = (L - 80) * (s / 4) + 40, bx = top[0] + p * Math.cos(q), by = top[1] + p * Math.sin(q);
      d.c.save(); d.c.translate(bx, by); d.c.rotate(q); d.rect(-30, -44, 60, 44, LC.violet, LC.text); d.c.restore();
      const cx = bx + 22 * Math.sin(q), cy = by - 22 * Math.cos(q);
      d.arrow(cx, cy, cx, cy + 80, LC.gold, 3, 'mg');
      d.arrow(cx, cy, cx + 70 * Math.sin(q), cy - 70 * Math.cos(q), LC.blue, 3, 'N');
      if (mu > 0) d.arrow(cx, cy, cx - 70 * mu / .6 * Math.cos(q) - 10 * Math.cos(q), cy - (70 * mu / .6 + 10) * Math.sin(q), LC.coral, 3, 'Fтр');
      if (acc <= .05) d.tag('Брусок покоится', 360, 70, LC.coral);
    }
  },
  elasticity: {
    calc: (k, x) => ({ label: 'Сила упругости', value: k * x, unit: 'Н', expr: `Fупр = k·x = ${u(k, 'Н/м', 0)} · ${u(x, 'м', 3)} = ${u(k * x, 'Н')}`, note: `Энергия пружины kx²/2 = ${u(k * x * x / 2, 'Дж', 3)}` }),
    live(k, x, t) { const xx = x * Math.min(1, t / 1.5); return [['Удлинение', u(xx, 'м', 3)], ['Динамометр', u(k * xx, 'Н', 2)]]; },
    dur: () => 2,
    draw(d, k, x, t) {
      d.title('Растяжение пружины · закон Гука');
      const xx = x * Math.min(1, t / 1.5), L0 = 120, y0 = 60, cx = 280, ext = xx * 560;
      d.rect(cx - 100, y0 - 14, 200, 14, LC.line, LC.mute, 2, 3);
      d.spring(cx, y0, cx, y0 + L0 + ext, 12, 10 + Math.min(10, k / 25), LC.cyan);
      d.rect(cx - 28, y0 + L0 + ext, 56, 30, LC.violet, LC.text);
      d.line(cx + 60, y0 + L0 + 15, cx + 130, y0 + L0 + 15, LC.mute, 1.5, [5, 5]); d.text('без нагрузки', cx + 136, y0 + L0 + 15, { size: 11 });
      if (ext > 6) { d.line(cx + 90, y0 + L0 + 15, cx + 90, y0 + L0 + ext + 15, LC.gold, 2.5); d.text('x = ' + u(xx, 'м', 3), cx + 100, y0 + L0 + ext / 2 + 15, { col: LC.gold, size: 12, bold: true }); }
      d.arrow(cx, y0 + L0 + ext + 15, cx, y0 + L0 + ext + 15 - 10 - k * xx * 1.2, LC.mint, 4, 'Fупр');
      // график F(x)
      const gx = 470, gy = 330, gw = 210, gh = 230, Fm = 250 * .3;
      d.line(gx, gy, gx + gw, gy, LC.mute, 2); d.line(gx, gy, gx, gy - gh, LC.mute, 2); d.text('x', gx + gw + 8, gy, { size: 12 }); d.text('F', gx - 4, gy - gh - 12, { size: 12 });
      d.line(gx, gy, gx + gw, gy - gh * k * .3 / Fm, 'rgba(61,214,160,.5)', 2.5);
      d.circle(gx + gw * xx / .3, gy - gh * k * xx / Fm, 7, LC.gold);
      d.text('Прямая: F ∝ x', gx + 10, gy - gh + 6, { size: 12, col: LC.mint });
    }
  },
  torque: {
    calc(F, l) { const M = F * l, M0 = 15; return { label: 'Момент силы справа', value: M, unit: 'Н·м', expr: `M = F·l = ${u(F, 'Н', 0)} · ${u(l, 'м')} = ${u(M, 'Н·м')}`, note: `Слева груз 30 Н на плече 0,5 м: M₀ = 15 Н·м. ` + (Math.abs(M - M0) < .26 ? 'Рычаг в равновесии.' : M > M0 ? 'Перевешивает правая сторона.' : 'Перевешивает левая сторона.') }; },
    live(F, l) { const M = F * l; return [['M справа', u(M, 'Н·м', 1)], ['M слева', '15 Н·м'], ['Итог', Math.abs(M - 15) < .26 ? 'равновесие' : M > 15 ? 'вправо' : 'влево']]; },
    dur: () => 2,
    draw(d, F, l, t) {
      d.title('Рычаг · правило моментов');
      const M = F * l, diff = M - 15, target = Math.abs(diff) < .26 ? 0 : clamp(diff / 30, -1, 1) * 14 * RAD, q = target * Math.min(1, t / 1.2);
      const cx = 360, cy = 230, k = 140; // пикселей на метр
      d.path([[cx, cy + 6], [cx + 34, cy + 80], [cx - 34, cy + 80]], LC.text, 2, LC.violet); d.ground(cy + 82, 240, 480);
      const pt = s => [cx + s * Math.cos(q), cy + s * Math.sin(q)];
      const [lx1, ly1] = pt(-300), [lx2, ly2] = pt(300); d.line(lx1, ly1, lx2, ly2, LC.text, 8);
      for (let m = -2; m <= 2; m += .5) { const [px, py] = pt(m * k); d.circle(px, py, 3, LC.bg, LC.mute, 1.5); }
      const [ax, ay] = pt(-.5 * k); d.line(ax, ay, ax, ay + 50, LC.mute, 2); d.rect(ax - 22, ay + 50, 44, 40, LC.blue, LC.text); d.text('30 Н', ax, ay + 70, { col: LC.text, size: 11, align: 'center', bold: true });
      const [bx, by] = pt(l * k); d.arrow(bx, by, bx, by + 30 + F * 1.1, LC.mint, 4, 'F = ' + n(F, 0) + ' Н');
      d.line(cx, cy - 26, bx, by - 26, LC.gold, 2, [4, 4]); d.text('l = ' + u(l, 'м'), (cx + bx) / 2, cy - 40, { col: LC.gold, size: 12, align: 'center', bold: true });
      d.text('Равновесие: F·l = 15 Н·м', 22, 56, { size: 12 });
    }
  },

  /* ===== 3. Жидкости и газы ===== */
  pressure: {
    calc: (h, rho) => ({ label: 'Давление на глубине', value: rho * LAB_G * h / 1000, unit: 'кПа', expr: `p = ρgh = ${big(rho)} · 9,81 · ${n(h, 1)} = ${u(rho * LAB_G * h / 1000, 'кПа', 1)}`, note: 'Это давление столба жидкости; атмосферное (≈ 101 кПа) добавляется сверху.' }),
    live(h, rho, t) { const hh = h * Math.min(1, t / 2.5); return [['Глубина', u(hh, 'м', 2)], ['Давление', u(rho * LAB_G * hh / 1000, 'кПа', 1)]]; },
    dur: () => 3,
    draw(d, h, rho, t) {
      d.title('Датчик давления опускают в жидкость');
      const hh = h * Math.min(1, t / 2.5), tx = 150, ty = 70, tw = 300, th = 290, wy = 100, k = (ty + th - wy - 20) / 10;
      d.rect(tx, ty, tw, th, null, LC.mute, 3, 4);
      d.c.fillStyle = `rgba(${Math.round(40 + (rho - 700) / 6)},${Math.round(130 - (rho - 700) / 12)},230,.28)`; d.c.fillRect(tx + 2, wy, tw - 4, ty + th - wy - 2);
      d.line(tx + 2, wy, tx + tw - 2, wy, LC.waterTop, 3);
      for (let v = 0; v <= 10; v += 2) { const Y = wy + v * k; d.line(tx - 12, Y, tx, Y, LC.mute, 2); d.text(v + ' м', tx - 18, Y, { size: 11, align: 'right' }); }
      const Y = wy + hh * k; d.line(tx + tw / 2, 40, tx + tw / 2, Y, LC.text, 2); d.rect(tx + tw / 2 - 16, Y - 10, 32, 20, LC.coral, LC.text, 2, 4);
      const p = rho * LAB_G * hh / 1000; d.gauge(580, 170, 70, p / 130, 'кПа'); d.tag(u(p, 'кПа', 1), 580, 270, LC.gold);
      d.text('ρ = ' + big(rho) + ' кг/м³', tx + 10, ty + th - 16, { size: 12, col: LC.text });
    }
  },
  buoyancy: {
    calc: (V, rho) => ({ label: 'Выталкивающая сила', value: rho * LAB_G * V, unit: 'Н', expr: `Fₐ = ρж·g·V = ${big(rho)} · 9,81 · ${n(V, 3)} = ${u(rho * LAB_G * V, 'Н', 1)}`, note: `Тело из алюминия (2700 кг/м³) весит ${u(2700 * LAB_G * V, 'Н', 1)}; в жидкости динамометр покажет ${u((2700 - rho) * LAB_G * V, 'Н', 1)}.` }),
    live(V, rho, t) { const f = Math.min(1, Math.max(0, (t - .5) / 2)); return [['Погружено', n(f * 100, 0) + ' %'], ['Fₐ', u(rho * LAB_G * V * f, 'Н', 1)], ['Динамометр', u((2700 - rho * f) * LAB_G * V, 'Н', 1)]]; },
    dur: () => 3,
    draw(d, V, rho, t) {
      d.title('Тело погружают в жидкость');
      const f = Math.min(1, Math.max(0, (t - .5) / 2)), s = 30 + Math.cbrt(V) * 160, wy = 210, tx = 160, tw = 330;
      d.rect(tx, 150, tw, 210, null, LC.mute, 3, 4); d.c.fillStyle = LC.water; d.c.fillRect(tx + 2, wy, tw - 4, 148); d.line(tx + 2, wy, tx + tw - 2, wy, LC.waterTop, 3);
      const by = wy - s + f * (s + 20), bx = tx + tw / 2 - s / 2;
      d.line(bx + s / 2, 40, bx + s / 2, 64, LC.text, 2); d.rect(bx + s / 2 - 14, 64, 28, 50, '#1b2542', LC.gold, 2, 4);
      const P = 2700 * LAB_G * V, Fa = rho * LAB_G * V * f; d.rect(bx + s / 2 - 8, 70, 16, 38 * clamp((P - Fa) / 540, .03, 1), LC.gold, null, 0, 3);
      d.line(bx + s / 2, 114, bx + s / 2, by, LC.text, 2); d.rect(bx, by, s, s, '#9aa7c7', LC.text);
      d.arrow(bx + s + 20, by + s / 2, bx + s + 20, by + s / 2 + 20 + P * .25, LC.gold, 3, 'P');
      if (f > 0) d.arrow(bx - 20, by + s / 2, bx - 20, by + s / 2 - 20 - Fa * .25, LC.mint, 3.5, 'Fₐ');
      d.tag('Динамометр: ' + u(P - Fa, 'Н', 1), 600, 90, LC.gold);
    }
  },
  pascal: {
    calc: (S1, S2) => ({ label: 'Сила на большом поршне', value: 100 * S2 / S1, unit: 'Н', expr: `F₂ = F₁ · S₂/S₁ = 100 · ${n(S2, 0)} / ${n(S1, 0)} = ${u(100 * S2 / S1, 'Н', 0)}`, note: `Выигрыш в силе в ${n(S2 / S1, 1)} раза, но большой поршень проходит во столько же раз меньший путь.` }),
    live(S1, S2, t) { const f = Math.min(1, t / 2.5); return [['F₁', '100 Н'], ['Ход малого', u(6 * f, 'см', 1)], ['Ход большого', u(6 * f * S1 / S2, 'см', 2)]]; },
    dur: () => 3,
    draw(d, S1, S2, t) {
      d.title('Гидравлический пресс');
      const f = Math.min(1, t / 2.5), w1 = 24 + Math.sqrt(S1) * 10, w2 = 40 + Math.sqrt(S2) * 13, x1 = 180, x2 = 470, base = 330, top = 170;
      const h1 = 60 * f, h2 = 60 * f * S1 / S2;
      d.c.fillStyle = LC.water;

  /* ===== 7. Оптика ===== */
  reflection: {
    calc(al, phi) {
      const inc = al - phi; // угол падения относительно новой нормали
      if (Math.abs(inc) >= 89) return { label: 'Угол отражения', value: NaN, unit: '°', expr: 'Луч идёт вдоль зеркала или за ним — отражения нет.', note: 'Уменьши угол падения или поворот зеркала.' };
      return { label: 'Угол отражения', value: Math.abs(inc), unit: '°', expr: `β = α′ = α − φ = ${n(al, 0)}° − (${n(phi, 0)}°) = ${n(Math.abs(inc), 0)}°`, note: phi ? `Зеркало повернули на ${n(Math.abs(phi), 0)}° — отражённый луч повернулся на ${n(Math.abs(2 * phi), 0)}°.` : 'Угол отражения равен углу падения; оба отсчитываются от нормали.' };
    },
    live(al, phi) { const r = this.calc(al, phi); return [['α′ (к нормали)', Number.isFinite(r.value) ? n(r.value, 0) + '°' : '—'], ['β', Number.isFinite(r.value) ? n(r.value, 0) + '°' : '—']]; },
    dur(al, phi) { return Math.abs(al - phi) >= 89 ? Infinity : 2.5; },
    draw(d, al, phi, t) {
      d.title('Плоское зеркало · отражение луча');
      const O = [360, 300], ph = phi * RAD, len = 240, f = clamp(t / 1.2, 0, 1), g = clamp((t - 1.2) / 1.2, 0, 1);
      const mx = Math.cos(ph), my = Math.sin(ph); // направление зеркала (повернуто против часовой при φ > 0)
      d.line(O[0] - 200 * mx, O[1] + 200 * my, O[0] + 200 * mx, O[1] - 200 * my, LC.text, 6);
      for (let s = -190; s <= 190; s += 18) d.line(O[0] + s * mx, O[1] - s * my, O[0] + s * mx - 8 * my + 6 * mx, O[1] - s * my + 8 * mx + 6 * my, LC.line, 2);
      const nx = -Math.sin(ph), ny = -Math.cos(ph); // нормаль (вверх)
      d.line(O[0], O[1], O[0] + nx * 210, O[1] + ny * 210, LC.mute, 2, [6, 6]); d.text('нормаль', O[0] + nx * 214, O[1] + ny * 214 - 10, { size: 11, align: 'center' });
      const din = [Math.sin(al * RAD), Math.cos(al * RAD)]; // падающий луч идёт вправо-вниз под углом al к вертикали
      const S = [O[0] - din[0] * len, O[1] - din[1] * len];
      const dot = din[0] * nx + din[1] * ny, ref = [din[0] - 2 * dot * nx, din[1] - 2 * dot * ny];
      if (Math.abs(al - phi) >= 89) { d.tag('Луч не попадает на зеркало', 360, 80, LC.coral); return; }
      d.arrow(S[0], S[1], S[0] + (O[0] - S[0]) * Math.max(.02, f), S[1] + (O[1] - S[1]) * Math.max(.02, f), LC.gold, 3.5);
      if (g > 0) d.arrow(O[0], O[1], O[0] + ref[0] * len * g, O[1] + ref[1] * len * g, LC.mint, 3.5);
      const an = Math.atan2(ny, nx), ai = Math.atan2(-din[1], -din[0]), ar = Math.atan2(ref[1], ref[0]);
      d.arc(O[0], O[1], 60, an, ai, LC.gold); d.arc(O[0], O[1], 72, an, ar, LC.mint);
      const inc = Math.abs(al - phi);
      d.tag('α′ = ' + n(inc, 0) + '°', O[0] + 95 * Math.cos((an + ai) / 2), O[1] + 95 * Math.sin((an + ai) / 2), LC.gold);
      if (g > .5) d.tag('β = ' + n(inc, 0) + '°', O[0] + 105 * Math.cos((an + ar) / 2), O[1] + 105 * Math.sin((an + ar) / 2), LC.mint);
    }
  },
  refraction: {
    calc(al, n2) { const b = Math.asin(Math.sin(al * RAD) / n2) / RAD; return { label: 'Угол преломления', value: b, unit: '°', expr: `sin β = sin α / n₂ = sin ${n(al, 0)}° / ${n(n2, 2)} = ${n(Math.sin(al * RAD) / n2, 3)} → β = ${n(b, 1)}°`, note: 'Свет переходит в оптически более плотную среду и прижимается к нормали.' }; },

      d.arc(O[0], O[1], 60, -Math.PI / 2, -Math.PI / 2 - a, LC.gold); d.tag('α = ' + n(al, 0) + '°', O[0] - 70 * Math.sin(a / 2) - 20, O[1] - 90 * Math.cos(a / 2), LC.gold);

  interference: {

    live: (lam, dd) => [['λ', u(lam, 'нм', 0)], ['Δx', u(lam * 1e-3 / dd, 'мм', 2)]],

/** Построение изображения в собирающей линзе (mirror = false) или вогнутом зеркале (mirror = true). */
function opticsDraw(d, f, a, t, mirror) {
  d.title(mirror ? 'Вогнутое зеркало · построение изображения' : 'Собирающая линза · построение изображения');
  const o = opticsInfo(f, a), axisY = 220, prog = clamp(t / 2, 0, 1);

  const ho = o.inf ? 70 : clamp(150 / Math.max(1, Math.abs(o.G)), 24, 70);

  const base = Math.max(a, 2 * f), ext = Math.max(base, o.inf ? 0 : Math.min(Math.abs(o.b), 3 * base));
  const L = mirror ? 600 : 360; // положение линзы / зеркала по X
  const room = mirror ? 560 : 330, k = room / (ext * 1.08);
  const X = cm => mirror ? L - cm * k : L - cm * k; // предмет слева: x = L − a·k
  d.line(20, axisY, 700, axisY, LC.line, 2);
  if (mirror) { d.c.strokeStyle = LC.cyan; d.c.lineWidth = 6; d.c.beginPath(); d.c.moveTo(L - 14, axisY - 150); d.c.quadraticCurveTo(L + 14, axisY, L - 14, axisY + 150); d.c.stroke(); for (let y = -140; y <= 140; y += 16) d.line(L + 6 - Math.abs(y) / 15, axisY + y, L + 16 - Math.abs(y) / 15, axisY + y + 6, LC.line, 2); }
  else { d.c.strokeStyle = LC.cyan; d.c.lineWidth = 5; d.c.beginPath(); d.c.moveTo(L, axisY - 150); d.c.quadraticCurveTo(L - 26, axisY, L, axisY + 150); d.c.quadraticCurveTo(L + 26, axisY, L, axisY - 150); d.c.stroke(); }
  const mark = (cm, lab) => { const x = X(cm); if (x < 10 || x > 710) return; d.circle(x, axisY, 4, LC.gold, null); d.text(lab, x, axisY + 18, { size: 12, align: 'center', col: LC.gold, bold: true }); };
  mark(f, 'F'); mark(2 * f, mirror ? 'C' : '2F'); if (!mirror) { const x = L + f * k; if (x < 710) { d.circle(x, axisY, 4, LC.gold, null); d.text('F′', x, axisY + 18, { size: 12, align: 'center', col: LC.gold, bold: true }); } }
  const ox = X(a); d.arrow(ox, axisY, ox, axisY - ho, LC.gold, 4); d.text('предмет', ox, axisY - ho - 16, { size: 11, align: 'center', col: LC.gold });
  if (o.inf) { d.tag('Изображение на бесконечности', 360, 60, LC.coral); return; }
  // Экранные координаты изображения: действительное — справа от линзы / перед зеркалом.
  const ix = mirror ? L - o.b * k : L + o.b * k, iy = axisY - ho * o.G;

  const seg = (p, q, col, dash, w = 2.5) => d.line(p[0], p[1], p[0] + (q[0] - p[0]) * prog, p[1] + (q[1] - p[1]) * prog, col, w, dash);

    // луч через центр кривизны C возвращается сам на себя — второй луч: в вершину зеркала, отражается симметрично оси
    const v = [L, axisY]; seg(top, v, LC.violet);
    if (prog >= 1) d.line(v[0], v[1], v[0] + (top[0] - L) * 3, axisY + (axisY - top[1]) * 3, LC.violet, 2.5);
    if (!o.real && prog >= 1) { d.line(hitParallel[0], hitParallel[1], ix, iy, LC.mint, 1.6, [6, 6]); d.line(v[0], v[1], ix, iy, LC.violet, 1.6, [6, 6]); }
  } else {
    const Fp = [L + f * k, axisY], dir = [Fp[0] - L, Fp[1] - hitParallel[1]], far = [L + dir[0] * 8, hitParallel[1] + dir[1] * 8];
    if (prog >= 1) d.line(hitParallel[0], hitParallel[1], far[0], far[1], LC.mint, 2.5);

  }

    if (vis) { d.arrow(ix, axisY, ix, iy, o.real ? LC.coral : LC.pink, 4); if (!o.real) d.line(ix, axisY, ix, iy, LC.bg, 1, [3, 6]); d.tag(o.real ? 'действительное' : 'мнимое', ix, iy + (iy < axisY ? -22 : 22), o.real ? LC.coral : LC.pink); }

  }
}

    BANK.push(qfix({ key: t.id + '-' + (j + 1), tid: t.id, num: j + 1, topicTitle: t.title, q: q.t, a: q.a, x: q.x || [], self: !(q.x && q.x.length), p: q.p ? 'pics/' + encodeURIComponent(q.p) : '', e: q.e || '', note: q.n || '' }));

  if (Array.isArray(S.wrong) && S.wrong.length) { S.wrong.forEach(k => { if (!S.stat[k]) S.stat[k] = { ok: 0, bad: 1, last: 0, box: 0, due: Date.now() }; }); }

function whyHtml(e) {
  if (!e) return '';
  if (typeof e === 'string') {
    const disputed = e.includes('⚠');
    return `<div class="why">${disputed ? '<p class="why-warn"><b>Ключ спорный.</b></p>' : ''}<p>${vx(e.replace('⚠', '').trim())}</p></div>`;
  }
  const part = (h, t) => t ? `<div class="why-step"><b>${h}</b><p>${nlv(t)}</p></div>` : '';
  return `<div class="why">${part('Что спрашивают', e.s)}${part('Главная идея', e.i)}${part('Решение', e.r)}${e.w ? `<div class="why-warn"><b>Ключ спорный</b><p>${nlv(e.w)}</p></div>` : ''}</div>`;
}

/* ---------- сессия теста ---------- */

const qCurPick = () => Q.picks[Q.i];
function stopQTimer() { if (QT) { clearInterval(QT); QT = null; } }

/** После ответа плавно показываем вердикт и пояснение — без ручной прокрутки. */

function vSelfQ(it, a, src, star, timer, n) {

function startQTimer() {
  const end = Date.now() + Q.timer * 1000, qi = Q.i;

    if (!Q || Q.i !== qi || qCurPick() != null) return stopQTimer();
    const left = Math.max(0, Math.ceil((end - Date.now()) / 1000)), bar = $('#qtbar'), lab = $('#qtleft');
    if (bar) bar.style.width = (left / Q.timer * 100) + '%'; if (lab) { lab.textContent = mmss(left); lab.classList.toggle('warn', left <= 15); }
    if (left <= 0) { stopQTimer(); answer(-1); }
  };
  tick(); QT = setInterval(tick, 250);
}
function answer(k) {
  if (!Q || qCurPick() != null) return;
  const it = Q.items[Q.i], ok = pickOk(it, k);
  Q.picks[Q.i] = k; stopQTimer();
  if (ok) Q.ok++;
  record(it.key, ok); markDay();
  if (Q.mode === 'practice' || it.self) {
    const g = comboAnswer(ok); if (ok) { Q.xp += g; addXP(g); buzz(12); } else buzz([30, 40, 30]);
    Q.justAnswered = true; save(); render();
  } else {
    S.tot++; if (ok) S.ok++; save(); buzz(8);
    setTimeout(() => { if (Q && Q.picks[Q.i] === k) { Q.i++; render(); ui.main.scrollTop = 0; } }, 220);
  }
}
function quizEnd() {

    else if (Q.kind === 'boss') { const prev = S.boss[Q.ch]; S.boss[Q.ch] = Math.max(pct, prev || 0); if (pct >= 80 && !(prev >= 80)) { addXP(150); extra = '+150 XP за главу'; CONTENT[Q.ch].scientists.forEach(x => { if (!S.sci.includes(x.id)) S.sci.push(x.id); }); } }

      if (Q.mode === 'exam') { const bonus = Q.ok * 4 + ({ 5: 50, 4: 30, 3: 15, 2: 0 })[mark]; Q.xp += bonus; addXP(bonus); }
    }

    `<article class="card werr"><div class="qhead">${it.tid ? `<span class="qsrc">${esc(TOPIC_SHORT[it.tid])} · №${it.num}</span>` : '<span></span>'}${it.key ? `<button class="qstar${isFav(it.key) ? ' on' : ''}" data-act="qFav" data-k="${it.key}" aria-label="Избранное">${ic('star')}</button>` : ''}</div><p class="qt">${vx(it.q)}</p>${it.p ? `<img class="qpic" src="${it.p}" alt="Рисунок к вопросу" loading="lazy">` : ''}` +

function bridgeMorphNode(oldNode,newNode){
  if(oldNode.nodeType!==newNode.nodeType||oldNode.nodeName!==newNode.nodeName)return newNode.cloneNode(true);
  if(oldNode.nodeType===Node.TEXT_NODE){if(oldNode.nodeValue!==newNode.nodeValue)oldNode.nodeValue=newNode.nodeValue;return oldNode;}
  if(oldNode.nodeType!==Node.ELEMENT_NODE||oldNode.tagName==='CANVAS')return oldNode;
  for(const a of [...oldNode.attributes])if(!newNode.hasAttribute(a.name))oldNode.removeAttribute(a.name);
  for(const a of [...newNode.attributes])if(oldNode.getAttribute(a.name)!==a.value)oldNode.setAttribute(a.name,a.value);
  const oldChildren=[...oldNode.childNodes],newChildren=[...newNode.childNodes];
  for(let i=0;i<newChildren.length;i++){
    const o=oldChildren[i],n=newChildren[i];
    if(!o)oldNode.appendChild(n.cloneNode(true));
    else if(o.nodeType!==n.nodeType||o.nodeName!==n.nodeName)oldNode.replaceChild(n.cloneNode(true),o);
    else bridgeMorphNode(o,n);
  }
  for(let i=newChildren.length;i<oldChildren.length;i++)if(oldChildren[i].parentNode===oldNode)oldNode.removeChild(oldChildren[i]);
  return oldNode;
}

function bridgeStartAnimation(){
  const g=BRIDGE_GAME;if(!g||g.anim)return;

  bridgeRefresh();
  const start=performance.now(),duration=5700,target=g.load>bridgeCapacity(g)?.56:1;
  const tick=now=>{if(BRIDGE_GAME!==g)return;const raw=Math.min(1,(now-start)/duration),eased=raw<.5?4*raw*raw*raw:1-Math.pow(-2*raw+2,3)/2;g.animProgress=eased*target;bridgeDraw();if(raw<1){g.animFrame=requestAnimationFrame(tick);return;}
    if(g.load>bridgeCapacity(g)){g.anim='collapse';g.animProgress=0;g.message='Критическая перегрузка. Центральный узел теряет устойчивость.';const t0=performance.now();const fall=t=>{if(BRIDGE_GAME!==g)return;const p=Math.min(1,(t-t0)/2300);g.animProgress=p*p;bridgeDraw();if(p<1){g.animFrame=requestAnimationFrame(fall);return;}g.anim='';g.animFrame=0;g.result='fail';g.stage='result';g.message='Мост не выдержал нагрузку '+g.load+' т. Расчётный предел после выбранного ремонта — '+bridgeCapacity(g)+' т. Пролёт потерял устойчивость.';bridgeRefresh();toast('Испытание провалено — зафиксировано разрушение.');};g.animFrame=requestAnimationFrame(fall);
    }else{g.anim='';g.animFrame=0;g.result='pass';g.stage='result';g.message='Грузовик массой '+g.load+' т прошёл пролёт. Прогиб остался в допустимых пределах, узлы сохранили геометрию.';bridgeRefresh();toast('Испытание пройдено!');}
  };

document.addEventListener('click',e=>{

    if(!g.findings.includes(d.v)){g.findings.push(d.v);if(g.findings.length===3){g.stage='diagnose';g.message='Все контрольные точки обследованы. Сопоставь показания.';}}

 data-sb="properties">'+ic('settings')+'Свойства</button><button class="sb-run" data-sb="run">'+ic('play')+'Запуск</button></div></div><aside class="sb-palette"><div class="sb-palette-head"><b>КАТАЛОГ ОБЪЕКТОВ</b><span>1. Выбери раздел · 2. Выбери деталь · 3. Поставь на сцену</span></div><div id="sb-cats"></div><div id="sb-items"></div></aside><aside class="sb-inspector"><b>СВОЙСТВА ОБЪЕКТА</b><button class="sb-inspector-close" data-sb="properties" aria-label="Закрыть свойства">×</button><div id="sb-props">Коснись объекта на сцене</div><b class="sb-world-title">ПАРАМЕТРЫ СРЕДЫ</b><label>Гравитация <span id="sb-gv">9.8</span><input type="range" min="0" max="20" step=".1" value="9.8" data-sbr="g"></label><label>Трение <span id="sb-fv">0.20</span><input type="range" min="0" max="1" step=".01" value=".2" data-sbr="friction"></label><label>Упругость <span id="sb-bv">0.35</span><input type="range" min="0" max="1" step=".01" value=".35" data-sbr="bounce"></label><label>Температура <span id="sb-tv">20°</span><input type="range" min="-100" max="500" value="20" data-sbr="temperature"></label><label>Давление <span id="sb-pv">1 атм</span><input type="range" min=".1" max="10" step=".1" value="1" data-sbr="pressure"></label><label>Напряжение <span id="sb-vv">12 В</span><input type="range" min="0" max="240" value="12" data-sbr="voltage"></label></aside></div></div>';}

function sbInit(){const c=document.querySelector('#sb-canvas');if(!c)return;SB.canvas=c;SB.ctx=c.getContext('2d');const resize=()=>{const r=c.getBoundingClientRect();SB.w=r.width;SB.h=r.height;SB.unitScale=Math.min(r.width/920,r.height/360);SB.dpr=Math.min(2,devicePixelRatio||1);c.width=Math.max(1,r.width*SB.dpr);c.height=Math.max(1,r.height*SB.dpr);SB.ctx.setTransform(SB.dpr,0,0,SB.dpr,0,0);sbDraw();};SB.resize=resize;window.addEventListener('resize',resize,{passive:true});resize();sbPalette();sbSeed();sbProps();c.addEventListener('pointerdown',sbDown);c.addEventListener('pointermove',sbMove);c.addEventListener('pointerup',sbUp);c.addEventListener('pointercancel',sbUp);c.addEventListener('wheel',e=>{e.preventDefault();SB.zoom=Math.max(.45,Math.min(2.3,SB.zoom*(e.deltaY<0?1.08:.92)));sbDraw();},{passive:false});}

function sbProps(){const el=document.querySelector('#sb-props');if(!el)return;const o=SB.objects.find(x=>x.id===SB.selected);if(!o){el.textContent='Выбери объект';return;}const name=SB_CATS.flatMap(g=>g.items).find(x=>x[0]===o.type)?.[1]||o.type;el.innerHTML='<div class="sb-picked">'+name+'</div><label>Масса <span>'+o.mass.toFixed(1)+' кг</span><input data-sbr="mass" type="range" min=".1" max="50" step=".1" value="'+o.mass+'"></label><label>Угол <span>'+Math.round(o.angle*180/Math.PI)+'°</span><input data-sbr="angle" type="range" min="-180" max="180" value="'+o.angle*180/Math.PI+'"></label><label>Скорость X <span>'+o.vx.toFixed(1)+'</span><input data-sbr="vx" type="range" min="-20" max="20" step=".1" value="'+o.vx+'"></label><label>Скорость Y <span>'+o.vy.toFixed(1)+'</span><input data-sbr="vy" type="range" min="-20" max="20" step=".1" value="'+o.vy+'"></label><div class="sb-actions"><button data-sb="anchor">'+(o.anchored?'Открепить':'Закрепить')+'</button><button data-sb="duplicate">'+ic('copy')+'Копия</button><button data-sb="delete">Удалить</button></div>';}
function sbWorld(x,y){const k=SB.zoom*(SB.unitScale||1),sx=(x-SB.w/2-SB.panX)/k,sy=(y-(SB.h-18)-SB.panY)/k,a=-SB.cameraAngle;return{x:sx*Math.cos(a)-sy*Math.sin(a)+460,y:sx*Math.sin(a)+sy*Math.cos(a)+485};}
function sbHit(p){for(let i=SB.objects.length-1;i>=0;i--){const o=SB.objects[i],dx=p.x-o.x,dy=p.y-o.y,a=-o.angle,x=dx*Math.cos(a)-dy*Math.sin(a),y=dx*Math.sin(a)+dy*Math.cos(a);if(Math.abs(x)<o.w/2+6&&Math.abs(y)<o.h/2+6)return o;}return null;}
function sbDown(e){const r=SB.canvas.getBoundingClientRect(),p=sbWorld(e.clientX-r.left,e.clientY-r.top),o=sbHit(p);SB.canvas.setPointerCapture(e.pointerId);if(SB.pendingType){const type=SB.pendingType;SB.pendingType='';sbAdd(type,p.x,p.y);SB.mode='move';document.querySelectorAll('[data-sb="mode"]').forEach(b=>b.classList.toggle('on',b.dataset.v==='move'));sbPalette();const h=document.querySelector('#sb-hint');if(h)h.textContent='Объект установлен. Перетаскивай его или выбери следующую деталь';return;}if(SB.mode==='orbit'){SB.drag={orbit:1,x:e.clientX,y:e.clientY,angle:SB.cameraAngle};return;}if(o&&SB.mode==='erase'){SB.objects=SB.objects.filter(x=>x!==o);SB.selected=0;sbProps();sbDraw();return;}if(o&&SB.mode==='connect'){if(!SB.wire)SB.wire=o.id;else{const a=SB.objects.find(x=>x.id===SB.wire);if(a){a.link=o.id;o.link=a.id;a.linkLength=Math.hypot(o.x-a.x,o.y-a.y);o.linkLength=a.linkLength;}SB.wire=0;sbDraw();}return;}if(o){SB.selected=o.id;SB.drag={id:o.id,mode:SB.mode,x:p.x,y:p.y,ox:o.x,oy:o.y};sbProps();}else SB.drag={pan:1,x:e.clientX,y:e.clientY,px:SB.panX,py:SB.panY};}
function sbMove(e){const r=SB.canvas.getBoundingClientRect(),p=sbWorld(e.clientX-r.left,e.clientY-r.top);SB.pointer=p;if(!SB.drag){sbDraw();return;}if(SB.drag.orbit){SB.cameraAngle=SB.drag.angle+(e.clientX-SB.drag.x)*.009;}else if(SB.drag.pan){SB.panX=SB.drag.px+e.clientX-SB.drag.x;SB.panY=SB.drag.py+e.clientY-SB.drag.y;}else{const o=SB.objects.find(x=>x.id===SB.drag.id);if(o){if(SB.drag.mode==='rotate')o.angle=Math.atan2(p.y-o.y,p.x-o.x);else{o.x=SB.drag.ox+p.x-SB.drag.x;o.y=SB.drag.oy+p.y-SB.drag.y;}o.vx=o.vy=0;}}sbDraw();}
function sbUp(){if(SB.drag){SB.drag=null;sbProps();}}
function sbDraw(){if(!SB?.ctx)return;const c=SB.ctx,w=SB.w,h=SB.h;c.clearRect(0,0,w,h);const grad=c.createLinearGradient(0,0,w,h);grad.addColorStop(0,'#132437');grad.addColorStop(1,'#09121e');c.fillStyle=grad;c.fillRect(0,0,w,h);c.save();c.translate(w/2+SB.panX,h-18+SB.panY);c.rotate(SB.cameraAngle);c.scale(SB.zoom*(SB.unitScale||1),SB.zoom*(SB.unitScale||1));c.translate(-460,-485);if(SB.grid){c.strokeStyle='rgba(120,170,195,.11)';c.lineWidth=1;for(let x=0;x<=920;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,520);c.stroke();}for(let y=-520;y<=520;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(920,y);c.stroke();}}c.fillStyle='#294357';c.fillRect(0,485,920,35);c.fillStyle='#5e8797';c.fillRect(0,483,920,2);sbDrawEffects(c);SB.objects.forEach(o=>sbDrawObj(c,o));if(SB.pendingType&&SB.pointer){c.save();c.globalAlpha=.42;c.setLineDash([7,5]);const ghost={id:-1,type:SB.pendingType,x:SB.pointer.x,y:SB.pointer.y,w:64,h:44,angle:0};sbDrawObj(c,ghost);c.restore();}c.restore();document.querySelectorAll('.sb-run').forEach(run=>{const want=SB.run?'pause':'play';if(run.dataset.state!==want){run.dataset.state=want;run.innerHTML=ic(want)+(run.closest('.sb-mobile')?(SB.run?'Пауза':'Запуск'):(SB.run?'Пауза':'Старт'));}});}
function sbDrawEffects(c){const byId=id=>SB.objects.find(o=>o.id===id);c.save();for(const o of SB.objects){if(o.link&&o.id<o.link){const b=byId(o.link);if(b){c.strokeStyle='#75e4d0';c.lineWidth=3;c.shadowBlur=12;c.shadowColor='#75e4d0';c.beginPath();c.moveTo(o.x,o.y);c.lineTo(b.x,b.y);c.stroke();}}if(o.type==='laser'){c.strokeStyle='#ff527c';c.lineWidth=3;c.shadowBlur=16;c.shadowColor='#ff527c';c.beginPath();c.moveTo(o.x,o.y);c.lineTo(920,o.y);c.stroke();}if(o.type==='magnet'){c.strokeStyle='rgba(113,174,255,.48)';c.lineWidth=1.5;for(let k=1;k<=3;k++){c.beginPath();c.ellipse(o.x,o.y,o.w*.65+k*18,o.h*.9+k*13,0,0,Math.PI*2);c.stroke();}}if(o.type==='lamp'&&o.powered){c.fillStyle='rgba(255,226,132,.15)';c.shadowBlur=30;c.shadowColor='#ffe284';c.beginPath();c.arc(o.x,o.y,45,0,Math.PI*2);c.fill();}}c.restore();}
function sbDrawObj(c,o){c.save();c.translate(o.x,o.y);c.rotate(o.angle);const tint=SB_TINT[SB_CATS.find(g=>g.items.some(i=>i[0]===o.type))?.id]||'#70cce4';c.shadowBlur=o.id===SB.selected?18:6;c.shadowColor=tint;c.strokeStyle=o.id===SB.selected?'#fff':tint;c.fillStyle='rgba(30,61,83,.96)';c.lineWidth=o.id===SB.selected?3:2;const box=(w=o.w,h=o.h)=>{c.beginPath();c.roundRect(-w/2,-h/2,w,h,6);c.fill();c.stroke();};if(['ball','wheel','float','gas','lamp'].includes(o.type)){c.beginPath();c.arc(0,0,Math.min(o.w,o.h)/2,0,Math.PI*2);c.fill();c.stroke();if(o.type==='lamp'&&o.powered){c.fillStyle='#ffe284';c.shadowBlur=28;c.shadowColor='#ffe284';c.fill();}if(o.type==='wheel'){c.beginPath();c.moveTo(-o.w/2,0);c.lineTo(o.w/2,0);c.moveTo(0,-o.h/2);c.lineTo(0,o.h/2);c.stroke();}}else if(['ramp','support','prism'].includes(o.type)){c.beginPath();c.moveTo(-o.w/2,o.h/2);c.lineTo(o.w/2,o.h/2);c.lineTo(-o.w/2,-o.h/2);c.closePath();c.fill();c.stroke();}else if(['spring','wire','rope','wave'].includes(o.type)){c.beginPath();for(let i=0;i<=24;i++){const x=-o.w/2+o.w*i/24,y=Math.sin(i/24*Math.PI*8)*o.h*.4;i?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();}else if(o.type==='lens'){c.beginPath();c.ellipse(0,0,o.w/2,o.h/2,0,0,Math.PI*2);c.fill();c.stroke();}else{box();if(o.type==='heater'||o.type==='ice'||o.type==='battery'||o.type==='magnet'){c.fillStyle=tint;c.font='bold 19px sans-serif';c.textAlign='center';c.fillText(({heater:'t ↑',ice:'t ↓',battery:'+  −',magnet:'N  S'})[o.type],0,7);}}if(o.id===SB.selected){c.shadowBlur=0;c.setLineDash([5,4]);c.strokeStyle='#fff';c.strokeRect(-o.w/2-7,-o.h/2-7,o.w+14,o.h+14);c.setLineDash([]);}c.restore();}
function sbSeed(){
 // A compact starter setup: mechanics, balance and a simple electrical circuit.
 sbAdd('ramp',170,430);sbAdd('block',105,385);
 sbAdd('support',420,430);sbAdd('beam',445,365);sbAdd('weight',500,325);
 sbAdd('battery',700,430);sbAdd('wire',760,390);sbAdd('lamp',825,340);
 SB.objects.forEach(o=>{if(['ramp','support','battery'].includes(o.type))o.anchored=true;});
 SB.selected=0;SB.cat='mechanics';sbPalette();sbProps();sbDraw();
}
function sbInteract(dt){
 const list=SB.objects;
 // Magnetism: nearby ferromagnetic test pieces are pulled toward magnets.
 for(const m of list.filter(o=>o.type==='magnet'))for(const o of list.filter(o=>['block','weight','ball','wheel'].includes(o.type))){
  const dx=m.x-o.x,dy=m.y-o.y,d=Math.hypot(dx,dy)||1;
  if(d<190&&!o.anchored){const f=(1-d/190)*105*dt;o.vx+=dx/d*f;o.vy+=dy/d*f;}
 }
 // Buoyancy in a tank: floating objects settle around the waterline.
 for(const tank of list.filter(o=>o.type==='tank'))for(const o of list.filter(x=>x.type==='float')){
  if(Math.abs(o.x-tank.x)<tank.w*.48&&o.y>tank.y-tank.h*.35&&o.y<tank.y+tank.h*.48&&!o.anchored){o.vy-=SB.g*34*dt;o.vy*=.985;}
 }
 // A battery, wire and lamp form a visible simple circuit when close enough.
 const batteries=list.filter(o=>o.type==='battery'),wires=list.filter(o=>o.type==='wire'),lamps=list.filter(o=>o.type==='lamp');
 for(const l of lamps){l.powered=batteries.some(b=>wires.some(w=>Math.hypot(w.x-b.x,w.y-b.y)<150&&Math.hypot(w.x-l.x,w.y-l.y)<150)&&SB.voltage>0);}
 // Thermal exchange is represented continuously; ice melts above zero.
 for(const ice of list.filter(o=>o.type==='ice')){
  ice.heat+=(SB.temperature-ice.heat)*dt*.12;
  if(ice.heat>0){ice.melt=Math.min(1,(ice.melt||0)+dt*.025);ice.w=ice.baseW*(1-ice.melt*.35);ice.h=ice.baseH*(1-ice.melt*.55);}
 }
 // Wave and oscillation elements respond to the simulation clock.
 for(const wave of list.filter(o=>o.type==='wave'))wave.phase=(wave.phase||0)+dt*2.4;
}
function sbStep(dt){
 const g=SB.g*26;
 sbInteract(dt);
 // Gravity and continuous integration.
 for(const o of SB.objects){
  if(o.anchored)continue;
  if(['pendulum','oscillator','resonator'].includes(o.type)){
   o.phase+=dt*(1+SB.g*.15);o.angle=Math.sin(o.phase)*.45;continue;
  }
  o.vy+=g*dt;
  o.vx*=Math.pow(Math.max(.05,1-SB.friction*.08),dt*60);
  o.x+=o.vx*dt*26;o.y+=o.vy*dt*26;
  const floor=485-o.h/2;
  if(o.y>floor){o.y=floor;if(Math.abs(o.vy)>1)o.vy=-o.vy*SB.bounce;else o.vy=0;o.vx*=1-SB.friction*.08;}
  if(o.x<o.w/2){o.x=o.w/2;o.vx=Math.abs(o.vx)*SB.bounce;}
  if(o.x>920-o.w/2){o.x=920-o.w/2;o.vx=-Math.abs(o.vx)*SB.bounce;}
 }
 // Iterative rigid-body AABB contacts. Rotation is reflected in each body's world-space bounds.
 for(let pass=0;pass<8;pass++)for(let i=0;i<SB.objects.length;i++)for(let j=i+1;j<SB.objects.length;j++){
  const a=SB.objects[i],b=SB.objects[j];if(a.anchored&&b.anchored)continue;
  const ar=Math.abs(a.angle||0),br=Math.abs(b.angle||0);
  const ahx=(Math.abs(Math.cos(ar))*a.w+Math.abs(Math.sin(ar))*a.h)/2,ahy=(Math.abs(Math.sin(ar))*a.w+Math.abs(Math.cos(ar))*a.h)/2;
  const bhx=(Math.abs(Math.cos(br))*b.w+Math.abs(Math.sin(br))*b.h)/2,bhy=(Math.abs(Math.sin(br))*b.w+Math.abs(Math.cos(br))*b.h)/2;
  const dx=b.x-a.x,dy=b.y-a.y,ox=ahx+bhx-Math.abs(dx),oy=ahy+bhy-Math.abs(dy);
  if(ox<=.01||oy<=.01)continue;
  const invA=a.anchored?0:1/Math.max(.1,a.mass),invB=b.anchored?0:1/Math.max(.1,b.mass),sum=invA+invB;if(!sum)continue;
  const horizontal=ox<oy,sign=(horizontal?dx:dy)<0?-1:1,overlap=horizontal?ox:oy;
  const correction=Math.max(0,overlap-.01)*.82/sum;
  if(horizontal){if(invA)a.x-=sign*correction*invA;if(invB)b.x+=sign*correction*invB;}
  else{if(invA)a.y-=sign*correction*invA;if(invB)b.y+=sign*correction*invB;}
  const va=horizontal?a.vx:a.vy,vb=horizontal?b.vx:b.vy,relative=(vb-va)*sign;
  if(relative<0){
   const impulse=-(1+SB.bounce)*relative/sum;
   if(horizontal){if(invA)a.vx-=sign*impulse*invA;if(invB)b.vx+=sign*impulse*invB;const tangent=(b.vy-a.vy)*.035;if(invA)a.vy+=tangent*invA/sum;if(invB)b.vy-=tangent*invB/sum;}
   else{if(invA)a.vy-=sign*impulse*invA;if(invB)b.vy+=sign*impulse*invB;const tangent=(b.vx-a.vx)*.035;if(invA)a.vx+=tangent*invA/sum;if(invB)b.vx-=tangent*invB/sum;}
  }
 }
 // Links act as damped distance constraints, not decorative lines.
 for(let pass=0;pass<3;pass++)for(const o of SB.objects){
  if(!o.link||o.id>o.link)continue;const b=SB.objects.find(x=>x.id===o.link);if(!b)continue;
  const dx=b.x-o.x,dy=b.y-o.y,d=Math.hypot(dx,dy)||1;
  if(!o.linkLength)o.linkLength=d;
  const error=d-o.linkLength,ia=o.anchored?0:1/Math.max(.1,o.mass),ib=b.anchored?0:1/Math.max(.1,b.mass),sum=ia+ib;if(!sum)continue;
  const correction=error*.32/sum,nx=dx/d,ny=dy/d;
  if(ia){o.x+=nx*correction*ia;o.y+=ny*correction*ia;}
  if(ib){b.x-=nx*correction*ib;b.y-=ny*correction*ib;}
  const rv=((b.vx-o.vx)*nx+(b.vy-o.vy)*ny)*.08;
  if(ia){o.vx+=nx*rv*ia/ sum;o.vy+=ny*rv*ia/sum;}
  if(ib){b.vx-=nx*rv*ib/sum;b.vy-=ny*rv*ib/sum;}
 }
 SB.time+=dt;
}
