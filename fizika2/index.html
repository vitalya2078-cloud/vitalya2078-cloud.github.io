<title>Физика: курс по учебнику</title>
<script>
/* Android OTA bootstrap: use the last downloaded interface, but fall back if it fails to start. */
(function () {
  if (!/FizikaApp/.test(navigator.userAgent)) return;
  var embedded = 83;
  try {
    var n = localStorage.getItem('f2-app-build'), h = localStorage.getItem('f2-app-html');
    if (!n || +n <= embedded || !h || h.indexOf('const F2_BUILD = ' + n + ';') < 0 || localStorage.getItem('f2-app-bad') === n) return;
    if (localStorage.getItem('f2-app-try') === n && localStorage.getItem('f2-app-ok') !== n) {
      localStorage.setItem('f2-app-bad', n);
      return;
    }
    localStorage.setItem('f2-app-try', n);
    addEventListener('DOMContentLoaded', function () {
      var guard = '<script>setTimeout(function(){try{if(localStorage.getItem("f2-app-ok")!=="' + n + '"){localStorage.setItem("f2-app-bad","' + n + '");location.reload()}}catch(e){}},7000)<\/script>';
      document.open(); document.write(h.replace('<head>', '<head>' + guard)); document.close();
    }, { once: true });
  } catch (e) {}
})();
</script>

<style>
@font-face{font-family:"Golos UI"; font-weight:400; font-display:swap; src:url(fonts/golos-400.woff2) format("woff2")}
@font-face{font-family:"Golos UI"; font-weight:600; font-display:swap; src:url(fonts/golos-600.woff2) format("woff2")}
@font-face{font-family:"Golos UI"; font-weight:700; font-display:swap; src:url(fonts/golos-700.woff2) format("woff2")}
@font-face{font-family:"Golos UI"; font-weight:800 900; font-display:swap; src:url(fonts/golos-latin-800.woff2) format("woff2"); unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
@font-face{font-family:"Golos UI"; font-weight:800 900; font-display:swap; src:url(fonts/golos-cyrillic-800.woff2) format("woff2"); unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
/* Формулы: STIX Two (лицензия OFL) — курсив для величин, прямой для цифр и функций */
@font-face{font-family:"F2 Math"; font-style:italic; font-weight:400 700; font-display:swap; src:url(fonts/stix-latin-600i.woff2) format("woff2"); unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+2000-206F,U+2212,U+2215}
@font-face{font-family:"F2 Math"; font-style:italic; font-weight:400 700; font-display:swap; src:url(fonts/stix-greek-600i.woff2) format("woff2"); unicode-range:U+0370-03FF}
@font-face{font-family:"F2 Math"; font-style:italic; font-weight:400 700; font-display:swap; src:url(fonts/stix-cyrillic-600i.woff2) format("woff2"); unicode-range:U+0400-045F,U+0490-0491}
@font-face{font-family:"F2 Math"; font-style:normal; font-weight:400 700; font-display:swap; src:url(fonts/stix-latin-600.woff2) format("woff2"); unicode-range:U+0000-00FF,U+2000-206F,U+2212,U+2215}
@font-face{font-family:"F2 Math"; font-style:normal; font-weight:400 700; font-display:swap; src:url(fonts/stix-greek-600.woff2) format("woff2"); unicode-range:U+0370-03FF}
:root{
  --bg:#0B1020; --bg2:#0E1424; --card:#151D33; --card2:#1B2542; --line:#26324F; --text:#E8ECF6; --mute:#8D97B5;
  --blue:#6C8CFF; --coral:#FF7A59; --mint:#3DD6A0; --gold:#FFC24B; --violet:#B48CFF; --pink:#FF6B8B; --cyan:#3DD6C3;
  --ui:"Golos UI", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --math:"F2 Math", "Cambria Math", "STIX Two Math", "Times New Roman", serif;
  --numbers:"Golos UI", system-ui, sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%; margin:0; background:var(--bg); color:var(--text); font:16px/1.5 var(--ui); -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%}
body{overflow:hidden}
[hidden]{display:none!important}
a{color:inherit; text-decoration:none}
button{font:inherit; color:inherit; cursor:pointer}
svg.ic{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none}
svg.ic.big{width:34px; height:34px}
.fire{color:var(--coral)} .gold{color:var(--gold)} .blue{color:var(--blue)} .pink{color:var(--pink)} .mint{color:var(--mint)} .mute{color:var(--mute)} .small{font-size:13px}
.app{display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:720px; margin:0 auto}
.top{flex:none; display:flex; align-items:center; gap:8px; min-height:58px; padding:var(--sat) 12px 0; background:var(--bg)}
#back{width:40px; height:40px; border:0; border-radius:12px; background:var(--card); display:grid; place-items:center}
#ttl{flex:1; min-width:0; margin:0; font-size:21px; font-weight:700; line-height:1.2; display:grid; white-space:nowrap}
#ttl small{font-size:12.5px; font-weight:400; color:var(--mute); overflow:hidden; text-overflow:ellipsis}
body[data-view=lesson] #ttl, body[data-view=quiz] #ttl{font-size:17px}
#ttl{overflow:hidden; text-overflow:ellipsis}
#lv{display:flex; align-items:center; gap:6px}
.lvb{width:30px; height:30px; border-radius:10px; display:grid; place-items:center; background:linear-gradient(135deg,var(--blue),var(--violet)); font-weight:700; font-size:14px}
.lvbar{width:54px; height:6px; border-radius:6px; background:var(--line); overflow:hidden}
.lvbar i{display:block; height:100%; background:var(--gold); border-radius:6px; transition:width .5s}
main{flex:1; min-height:0; overflow-y:auto; overscroll-behavior-y:contain; padding:10px 16px 28px}
main.enter > *{animation:enter .22s ease-out both}
@keyframes enter{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
.tabs{flex:none; display:grid; grid-template-columns:repeat(5,1fr); background:var(--bg2); border-top:1px solid var(--line); padding:0 0 var(--sab)}
.tabs a{display:grid; justify-items:center; gap:3px; padding:9px 0 10px; font-size:11.5px; font-weight:600; color:var(--mute)}
.tabs a span{display:grid; place-items:center; width:56px; height:30px; border-radius:15px; transition:background .2s}
.tabs a.on{color:var(--text)} .tabs a.on span{background:var(--card2); color:var(--blue)}

.card{background:var(--card); border-radius:20px; padding:16px; margin-bottom:12px}
.card.center{text-align:center; display:grid; justify-items:center; gap:6px; padding:22px 18px}
.h{font-size:19px; display:block}
.row{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.row small{color:var(--mute)}
.bar,.pbar{height:8px; border-radius:8px; background:var(--line); overflow:hidden; margin-top:10px}
.bar i,.pbar i{display:block; height:100%; border-radius:8px; background:linear-gradient(90deg,var(--blue),var(--violet))}
.pbar{height:5px; margin-top:6px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:50px; padding:0 18px; border:0; border-radius:16px; background:var(--blue); color:#fff; font-weight:700}
.btn.line{background:var(--card2); color:var(--text)}
.btn.wide{flex:1; width:100%}
.btn.danger{color:var(--pink)}
.mt{margin-top:12px}
.sec{font-size:15px; margin:22px 2px 10px; color:var(--mute); font-weight:600; text-transform:uppercase; letter-spacing:.06em}

/* главная */
.hello{display:flex; align-items:center; gap:14px; margin:4px 0 14px}
.hello h1{margin:0; font-size:24px; line-height:1.2}
.hello p{margin:2px 0 0; color:var(--mute)}
.hava .ava{display:block}
.lvcard b{font-size:20px}
.cont{display:flex; width:100%; border:0; padding:0; text-align:left; background:var(--card); border-radius:22px; overflow:hidden; margin-bottom:12px}
.cart{flex:none; width:44%; min-height:140px; display:block}
.cart svg{display:block; width:100%; height:100%}
.ctx{flex:1; display:flex; flex-direction:column; gap:4px; padding:14px}
.ctx small{color:var(--mute); font-size:12.5px}
.ctx b{font-size:18px; line-height:1.25}
.cbtn{margin-top:auto; align-self:flex-start; display:inline-flex; align-items:center; gap:6px; background:var(--blue); color:#fff; font-weight:700; border-radius:12px; padding:8px 14px; font-size:14px}
.cbtn svg{width:16px; height:16px}
.duo{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.goal{display:flex; align-items:center; gap:12px; margin:0 0 12px}
.goal > div{display:grid} .goal small{color:var(--mute); font-size:12.5px}
.ring{width:46px; height:46px; flex:none}
.qk{padding:4px 14px}
.qrow{display:flex; align-items:center; gap:12px; width:100%; padding:12px 0; border:0; background:none; text-align:left}
.qrow + .qrow{border-top:1px solid var(--line)}
.qrow > span{flex:1; display:grid} .qrow small{color:var(--mute); font-size:13px}
.qrow > svg:first-child{color:var(--blue)} .qrow > svg:last-child{color:var(--mute)}

/* учебник */
.part{margin-bottom:22px}
.ph{display:grid; margin:6px 2px 10px; padding-left:12px; border-left:4px solid var(--pc)}
.pn{color:var(--pc); font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em}
.ph h2{margin:0; font-size:18px; line-height:1.25}
.chrow{display:flex; align-items:center; gap:12px; background:var(--card); border-radius:18px; padding:8px 12px 8px 8px; margin-bottom:8px}
.chrow.soon{opacity:.55}
.cthumb{flex:none; width:92px; height:56px; border-radius:12px; overflow:hidden; display:block}
.cthumb svg{display:block; width:100%; height:100%}
.cinfo{flex:1; min-width:0; display:grid}
.cinfo small{color:var(--mute); font-size:12px}
.cinfo b{font-size:15px; line-height:1.25}
.tag{justify-self:start; margin-top:4px; font-size:11.5px; color:var(--mute); background:var(--card2); border-radius:8px; padding:1px 8px}
.chrow > svg{color:var(--mute)}

/* глава */
.chead{background:var(--card); border-radius:22px; overflow:hidden; margin-bottom:16px}
.cart.big{width:100%; min-height:0; aspect-ratio:36/17}
.chx{padding:14px 16px 16px}
.chx small{color:var(--mute)}
.chx h1{margin:2px 0 0; font-size:22px; line-height:1.2}
.path{display:grid}
.node{display:flex; align-items:center; gap:14px; width:100%; border:0; padding:0; background:none; text-align:left}
.node .dot{flex:none; width:58px; height:58px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:20px; background:var(--card2); color:var(--mute); border:3px solid var(--line)}
.node.now .dot{background:var(--blue); color:#fff; border-color:transparent; box-shadow:0 0 0 6px rgba(108,140,255,.22)}
.node.done .dot{background:var(--mint); color:#0B1020; border-color:transparent}
.node.boss .dot{background:linear-gradient(135deg,var(--coral),var(--pink)); color:#fff; border-color:transparent}
.node.boss.done .dot{background:var(--gold); color:#0B1020}
.nl{flex:1; display:grid; background:var(--card); border-radius:16px; padding:10px 14px}
.nl small{color:var(--mute); font-size:12.5px} .nl b{font-size:15.5px; line-height:1.25}
.conn{display:block; width:4px; height:20px; margin-left:27px; background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 12px)}
.stars{display:inline-flex; gap:2px; margin-top:2px}
.stars svg{width:18px; height:18px; color:var(--line)} .stars svg.on{color:var(--gold); fill:var(--gold)}
.res .stars svg{width:38px; height:38px}
.sci{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.scard{background:var(--card); border-radius:16px; padding:12px; display:grid; gap:2px}
.scard small{color:var(--mute); font-size:12px} .scard p{margin:4px 0 0; font-size:13.5px; color:var(--mute)}
.scard.locked{opacity:.5}

/* урок */
.steps{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px}
.steps button{display:grid; justify-items:center; gap:3px; padding:8px 2px; border:0; border-radius:14px; background:var(--card); color:var(--mute); font-size:12px; font-weight:600}
.steps button.on{background:var(--blue); color:#fff}
.steps button.ok:not(.on){color:var(--mint)}
.vid{background:var(--card); border-radius:20px; overflow:hidden}
.vwrap{position:relative}
#vc{display:block; width:100%; height:auto; aspect-ratio:16/9; background:#0E1424}
.vplay{position:absolute; inset:0; margin:auto; width:76px; height:76px; border-radius:50%; border:0; background:rgba(108,140,255,.92); color:#fff; display:grid; place-items:center; box-shadow:0 10px 30px rgba(0,0,0,.4)}
.vplay svg{width:34px; height:34px; fill:currentColor}
.vctl{display:flex; align-items:center; gap:10px; padding:10px 12px}
.vb{width:40px; height:40px; border:0; border-radius:12px; background:var(--card2); display:grid; place-items:center}
.vseek{flex:1; height:28px; position:relative; cursor:pointer; touch-action:none}
.vseek::before{content:""; position:absolute; left:0; right:0; top:11px; height:6px; border-radius:6px; background:var(--line)}
.vseek i{position:absolute; left:0; top:11px; height:6px; border-radius:6px; background:var(--coral)}
#vtime{font-size:12.5px; color:var(--mute); font-variant-numeric:tabular-nums; min-width:76px; text-align:right}
.vsub{margin:0; padding:0 16px 16px; font-size:15.5px; line-height:1.45; color:var(--text)}
.cards{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; gap:0; scrollbar-width:none; border-radius:22px}
.cards::-webkit-scrollbar{display:none}
.kcard{flex:0 0 100%; scroll-snap-align:start; background:var(--card); border-radius:22px; padding:18px 18px 14px; display:flex; flex-direction:column; gap:8px; min-height:52vh}
.kind{align-self:flex-start; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--kc); background:color-mix(in srgb,var(--kc) 14%,transparent); border-radius:8px; padding:2px 10px}
.kcard h3{margin:0; font-size:21px; line-height:1.2}
.kcard p{margin:0; font-size:16px; line-height:1.55; color:#D3D9EA}
.kn{margin-top:auto; color:var(--mute); font-size:12px}
.vec{position:relative; display:inline-block; padding-top:.18em; line-height:1}
.vec::before{content:""; position:absolute; left:.04em; right:.18em; top:.02em; height:.085em; min-height:1.6px; background:currentColor; border-radius:1px}
.vec::after{content:""; position:absolute; right:0; top:-.1em; border-top:.15em solid transparent; border-bottom:.15em solid transparent; border-left:.28em solid currentColor}
.fig{width:100%; height:auto; display:block; border-radius:14px}
.formula{display:grid; gap:4px; padding:12px 14px; border-radius:14px; background:var(--card2); font:italic 600 20px/1.45 var(--math); color:var(--gold)}
.dots{display:flex; justify-content:center; gap:6px; margin:12px 0}
.dots i{width:7px; height:7px; border-radius:50%; background:var(--line)} .dots i.on{background:var(--blue); width:18px; border-radius:4px}
.cnav{display:flex; gap:8px}
.cnav .btn:first-child:not(.wide){flex:none; width:56px; padding:0}
.cnav.two .btn{flex:1; width:auto; padding:0 14px}
.sim .task{margin:8px 0 10px; color:#D3D9EA}
#sc{display:block; width:100%; height:auto; border-radius:14px}
.smsg{min-height:2.8em; margin:10px 0 0; font-size:14.5px; color:var(--mute)}
.smsg.ok{color:var(--mint)} .smsg.bad{color:var(--pink)}
.stp{background:var(--card2); border-radius:16px; padding:12px; margin-top:6px}
.stp-h{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px}
.stp-h span{color:var(--mute); font-size:14px} .stp-h b{font-size:21px; font-variant-numeric:tabular-nums}
.stp-b{display:grid; grid-template-columns:1fr 1.3fr 1.3fr 1fr; gap:8px}
.stp-b button{min-height:52px; border:0; border-radius:14px; background:var(--line); color:var(--text); font-weight:700; font-size:16px; touch-action:manipulation; user-select:none; -webkit-user-select:none}
.stp-b button.m{background:var(--blue); color:#fff; font-size:24px}
.stp-b button:active{transform:scale(.96)}
.qic{color:var(--mint)}
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.pairs > div{display:grid; gap:8px; align-content:start}
.pc{min-height:58px; padding:8px 10px; border-radius:14px; border:2px solid var(--line); background:var(--bg2); font-size:14.5px; line-height:1.3; text-align:center}
.pc.math{font:italic 600 16px/1.3 var(--math); color:var(--gold)}
.pc.sel{border-color:var(--blue); background:rgba(108,140,255,.16)}
.pc.done{border-color:var(--mint); background:rgba(61,214,160,.12); opacity:.55}
.pc.shake{animation:shake .35s; border-color:var(--pink)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.chrow.notes .tag{color:var(--mint); background:rgba(61,214,160,.12)}
.chrow.notes > svg{color:var(--mint)}
/* широкий экран: урок и ролик не шире удобного и помещаются в окно */
@media (min-width:900px){body[data-view=lesson] #main > *, body[data-view=quiz] #main > *{max-width:760px; margin-left:auto; margin-right:auto}
 #vc{max-height:calc(100vh - 330px); width:auto; max-width:100%; margin:0 auto}
 body[data-view=lesson] #main > .btn{display:flex}}

/* проверки */
.qtop{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.qprog{flex:1; height:8px; border-radius:8px; background:var(--line); overflow:hidden}
.qprog i{display:block; height:100%; background:var(--mint); border-radius:8px; transition:width .3s}
.combo{display:inline-flex; align-items:center; gap:4px; background:var(--card); border-radius:12px; padding:5px 10px; color:var(--mute); font-weight:700}
.combo svg{width:18px; height:18px}
.combo.hot{color:var(--coral); background:rgba(255,122,89,.14); animation:pulse 1.2s infinite}
.combo i{font-style:normal; color:var(--gold); font-size:13px}
@keyframes pulse{50%{transform:scale(1.06)}}
.qcard{background:var(--card); border-radius:22px; padding:18px}
.qt{margin:0 0 14px; font-size:18px; line-height:1.4}
.qpic{display:block; max-width:100%; max-height:46vh; margin:0 auto 12px; background:#fff; border-radius:12px; padding:8px; object-fit:contain}
.opts{display:grid; gap:8px}
.opt{display:flex; gap:12px; align-items:flex-start; width:100%; min-height:54px; padding:12px 14px; border-radius:16px; border:2px solid var(--line); background:var(--bg2); text-align:left}
.opt .ln{flex:none; width:28px; height:28px; display:grid; place-items:center; border-radius:9px; background:var(--card2); font-size:13px; font-weight:700; color:var(--mute)}
.opt.right{border-color:var(--mint); background:rgba(61,214,160,.12)} .opt.right .ln{background:var(--mint); color:#0B1020}
.opt.wrong{border-color:var(--pink); background:rgba(255,107,139,.12)} .opt.wrong .ln{background:var(--pink); color:#fff}
.opt.dim{opacity:.5}
.verdict{margin-top:14px; border-radius:16px; padding:12px 14px}
.verdict.ok{background:rgba(61,214,160,.12)} .verdict.ok b{color:var(--mint)}
.verdict.bad{background:rgba(255,107,139,.12)} .verdict.bad b{color:var(--pink)}
.verdict p{margin:4px 0 0; color:#D3D9EA; font-size:15px}
.grade{width:86px; height:86px; border-radius:50%; display:grid; place-items:center; font:italic 700 52px/1 var(--math); border:4px solid}
.grade.g5{color:var(--mint)} .grade.g4{color:var(--blue)} .grade.g3{color:var(--gold)} .grade.g2{color:var(--pink)}
.werr .qt{font-size:15.5px; margin-bottom:8px}
.okans{display:flex; gap:8px; align-items:flex-start; color:var(--mint); margin:0 0 6px; font-weight:600}
.okans svg{width:18px; height:18px; margin-top:3px}
.hero2{display:grid; gap:6px; justify-items:start; background:linear-gradient(135deg,#1F2A52,#2A1F48)}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.tile{display:grid; gap:4px; align-content:start; justify-items:start; text-align:left; min-height:132px; padding:16px; border:0; border-radius:20px; background:var(--card)}
.tile b{font-size:16px; margin-top:8px} .tile small{color:var(--mute); font-size:13px}

/* профиль */
.prof{display:flex; gap:16px; align-items:center}
.prof > div{flex:1; min-width:0}
.pava{position:relative; border:0; padding:0; background:none; border-radius:50%}
.pava span{position:absolute; right:-2px; bottom:-2px; width:28px; height:28px; border-radius:50%; background:var(--card2); display:grid; place-items:center; border:2px solid var(--card)}
.pava span svg{width:15px; height:15px}

.prof p{margin:6px 0 0; color:var(--mute)}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:6px}
.stats div{background:var(--card); border-radius:16px; padding:12px; display:grid}
.stats b{font-size:22px} .stats span{color:var(--mute); font-size:12px}
.badges{display:grid; grid-template-columns:1fr 1fr; gap:10px}

.bdg small{color:var(--mute); font-size:12px}
.avas{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px}
.avas button{border:3px solid transparent; background:none; border-radius:50%; padding:2px}

/* всплывашки */
#toasts{position:fixed; left:0; right:0; bottom:calc(84px + var(--sab)); display:grid; justify-items:center; gap:8px; pointer-events:none; z-index:40}
.toast{display:flex; align-items:center; gap:8px; background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:10px 16px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.35); animation:tin .3s ease-out}
.toast.fire{color:var(--coral)} .toast.gold{color:var(--gold)}
.toast.out{opacity:0; transform:translateY(-10px); transition:.4s}
@keyframes tin{from{opacity:0; transform:translateY(10px)}}
.fxp{position:fixed; left:50%; top:40%; transform:translateX(-50%); font-weight:700; font-size:22px; color:var(--gold); pointer-events:none; z-index:41; animation:fxp 1.2s ease-out forwards}
@keyframes fxp{to{opacity:0; transform:translate(-50%,-70px)}}
#sheet{position:fixed; inset:0; z-index:50; background:rgba(5,8,18,.6); display:flex; align-items:flex-end; justify-content:center}
.sbox{width:100%; max-width:560px; background:var(--card); border-radius:26px 26px 0 0; padding:22px 18px calc(22px + var(--sab)); animation:enter .2s ease-out}
.lvup{display:grid; justify-items:center; text-align:center; gap:8px}
.lvnum{width:96px; height:96px; border-radius:28px; display:grid; place-items:center; font-size:46px; font-weight:700; background:linear-gradient(135deg,var(--blue),var(--violet)); box-shadow:0 0 0 10px rgba(108,140,255,.18)}

/* Laboratory refinement */
:root{--display:"Golos UI",system-ui,sans-serif;--formula:var(--math)}
h1,h2,h3,.h,.lab-tile b{font-family:var(--display);letter-spacing:-.025em}
.lab-intro{margin:2px 0 10px;padding:0 2px}.lab-intro p{margin:4px 0 0;font-size:13px;line-height:1.4}
.lab-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.lab-tile{min-height:148px;padding:11px;border-radius:16px;gap:5px;transition:transform .18s,border-color .18s,background .18s}
.lab-tile:active{transform:scale(.985)}.lab-tile.done{border-color:rgba(61,214,160,.45)}
.lab-art{width:38px;height:38px;border-radius:12px;font-size:26px}.lab-tile b{font-size:14px}.lab-tile small{font-size:11px;line-height:1.32}.lab-tile i{font-size:11px}
.lab-stage,.lab-controls{padding:12px;margin-bottom:10px;border-radius:17px}
#lab-canvas{aspect-ratio:12/5;margin:8px 0;border-radius:12px}
.lab-actions{gap:6px}.lab-actions .btn{min-height:40px;border-radius:12px;font-size:12px}
.lab-actions .btn.active{background:linear-gradient(135deg,var(--blue),var(--violet));color:white;box-shadow:0 0 0 2px rgba(108,140,255,.24),0 5px 16px rgba(108,140,255,.18)}
.lab-hint{margin:6px 0 0;min-height:1.3em;font-size:11px}
.lab-section-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.lab-section-title b{font-size:16px}.lab-section-title small{font-size:11px;color:var(--mute)}
.lab-controls{gap:12px}.lab-controls label{font-size:12px;gap:5px}.lab-controls input{min-height:24px}
.lab-metrics{gap:8px;margin:0 0 10px}.lab-metrics .card{padding:11px;border-radius:15px}.lab-metrics b{font:700 19px/1.25 var(--numbers);color:var(--mint)}
.lab-analysis{padding:12px;background:var(--card);border-radius:17px;margin:0 0 10px}.lab-analysis canvas{display:block;width:100%;height:auto;aspect-ratio:18/5;margin:8px 0;border-radius:10px;background:#0E1424}
.lab-graph-legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:12px}.lab-graph-legend span:first-child{color:var(--blue)}.lab-graph-legend span:last-child{color:var(--gold)}
.lab-compare,.lab-complete{width:100%;min-height:39px;margin-top:8px;border-radius:12px;font-size:12px}.lab-complete{background:linear-gradient(110deg,var(--mint),#22B88A);color:#071A17}
.lab-meaning{margin:0 0 12px;padding:13px;border-radius:17px}.lab-meaning p{margin:7px 0 10px;font-size:13px;line-height:1.45}.lab-meaning .formula{padding:10px 12px;font:italic 600 18px/1.35 var(--formula);border-radius:12px}
.lab-controls strong,.lab-metrics b{font-variant-numeric:tabular-nums}
@media(max-width:390px){.lab-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lab-tile{min-height:142px;padding:10px}.lab-tile small{font-size:12px}.lab-actions .btn{font-size:12px}.lab-metrics b{font-size:17px}}

/* 175-experiment laboratory */
.lab-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.lab-switch .btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px}
.lab-switch small{padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.08);font-size:12px;color:var(--mute)}
.lab-total{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2px 10px;margin-top:12px;padding:11px 13px;border-radius:14px;background:var(--card)}
.lab-total>b{grid-row:span 2;font:700 24px/1 var(--numbers);color:var(--mint)}
.lab-total>span{font-size:11px;color:var(--mute)}
.lab-total>i,.lab-chapter-copy>i,.lab-topic-foot>i{display:block;height:5px;overflow:hidden;border-radius:8px;background:var(--line)}
.lab-total>i em,.lab-chapter-copy>i em,.lab-topic-foot>i em{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--mint))}
.lab-chapters,.lab-topic-list,.lab-experiment-list{display:grid;gap:9px}
.lab-chapter{display:grid;grid-template-columns:38px minmax(0,1fr) auto 16px;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--text);text-decoration:none}
.lab-chapter-num{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--card2);color:var(--blue);font:700 13px var(--numbers)}
.lab-chapter-copy{display:grid;min-width:0;gap:4px}

.lab-chapter-copy small{font-size:12px;line-height:1.35;color:var(--mute)}
.lab-chapter-copy>i{margin-top:3px}
.lab-chapter-count{font:600 11px var(--numbers);color:var(--mute)}
.lab-topic-list{grid-template-columns:repeat(2,minmax(0,1fr))}
.lab-topic-card{display:grid;gap:7px;min-width:0;padding:13px;background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--text);text-decoration:none}
.lab-topic-index{font-size:12px;letter-spacing:.09em;color:var(--blue);font-weight:700}
.lab-topic-card>b{font-size:13px;line-height:1.3}
.lab-topic-card>small{font-size:12px;line-height:1.4;color:var(--mute)}
.lab-topic-foot{display:flex;align-items:center;gap:8px;margin-top:3px}
.lab-topic-foot>i{flex:1}
.lab-topic-foot small{font-size:12px;color:var(--mute);white-space:nowrap}
.lab-experiment-list{grid-template-columns:repeat(2,minmax(0,1fr))}
.lab-experiment-card{display:grid;gap:7px;min-width:0;padding:12px;text-align:left;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:16px}
.lab-experiment-card.done{border-color:rgba(61,214,160,.42)}
.lab-experiment-top{display:flex;align-items:center;gap:7px;min-width:0}
.lab-experiment-icon{display:grid;place-items:center;width:31px;height:31px;border-radius:10px;background:var(--card2);color:var(--blue)}
.lab-experiment-icon .ic{width:17px;height:17px}
.lab-experiment-badge{padding:4px 8px;border-radius:20px;background:var(--card2);font-size:12px;color:var(--mute);white-space:nowrap}
.lab-experiment-status{margin-left:auto;color:var(--mint)}
.lab-experiment-card>b{font-size:12px;line-height:1.3}
.lab-experiment-card>small{font-size:12px;line-height:1.4;color:var(--mute)}
.lab-coming{display:grid;justify-items:center;gap:10px;padding:26px 18px;text-align:center}
.lab-coming-icon{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;background:var(--card2);color:var(--blue)}
.lab-coming p{max-width:420px;margin:0;font-size:13px;line-height:1.55}
.lab-stage-head span{font-variant-numeric:tabular-nums}
.lab-actions .btn:disabled{background:var(--card2);border-color:var(--line);color:var(--mute);box-shadow:none;opacity:.55}
.lab-experiment-card:active,.lab-chapter:active,.lab-topic-card:active{transform:scale(.99)}

function cvArrow(c, x1, y1, x2, y2, col, w = 4, head = 14) {
  const L = Math.hypot(x2 - x1, y2 - y1); if (L < 2) return;
  const a = Math.atan2(y2 - y1, x2 - x1), hx = x2 - Math.cos(a) * head * 0.7, hy = y2 - Math.sin(a) * head * 0.7;
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = w; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(hx, hy); c.stroke();

function cvText(c, s, x, y, size = 28, col = C.text, align = 'left', weight = 700) { c.font = `${weight} ${size}px "Golos UI", system-ui, sans-serif`; c.fillStyle = col; c.textAlign = align; c.textBaseline = 'middle'; c.fillText(s, x, y); c.textAlign = 'left'; }
// формулы на холсте: стрелку вектора (символ U+20D7 после буквы) рисуем сами — шрифты холста её не ставят над буквой

  const W = c.measureText(out).width, x0 = align === 'center' ? x - W / 2 : align === 'right' ? x - W : x;
  c.fillText(out, x0, y);
  marks.forEach(i => { const a = x0 + c.measureText(out.slice(0, i)).width, w = c.measureText(out[i]).width, yy = y - size * 0.62, x1 = a + w * 0.12, x2 = a + w * 0.95;
    c.lineWidth = Math.max(1.5, size / 16); c.beginPath(); c.moveTo(x1, yy); c.lineTo(x2, yy); c.stroke(); c.beginPath(); c.moveTo(x2, yy); c.lineTo(x2 - size * 0.16, yy - size * 0.1); c.lineTo(x2 - size * 0.16, yy + size * 0.1); c.closePath(); c.fill(); });

function cvPath(c, pts, col, w = 4, dash) { c.strokeStyle = col; c.lineWidth = w; c.lineJoin = 'round'; c.lineCap = 'round'; if (dash) c.setLineDash(dash); c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke(); c.setLineDash([]); }
// кривая траектории для сцен: плавная дуга
const curve = t => [140 + 680 * t, 420 - 250 * Math.sin(Math.PI * t * 0.95) - 40 * t];
const curvePts = (a, b, n = 80) => Array.from({ length: n + 1 }, (_, i) => curve(lerp(a, b, i / n)));
const tangentAt = t => { const a = curve(t - 0.002), b = curve(t + 0.002), L = Math.hypot(b[0] - a[0], b[1] - a[1]); return [(b[0] - a[0]) / L, (b[1] - a[1]) / L]; };

  c.strokeStyle = col; c.lineWidth = 4; c.beginPath(); c.arc(x, y, R, 0, 7); c.stroke();
  for (let k = 0; k < 6; k++) { const a = ang + k * Math.PI / 3; c.strokeStyle = C.line; c.lineWidth = 3; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * R, y + Math.sin(a) * R); c.stroke(); }

}
function car(c, x, y, col = C.coral) {

  c.beginPath(); c.roundRect(x - 26, y - 56, 54, 26, 9); c.fill();
  c.fillStyle = C.bg; c.fillRect(x - 18, y - 50, 18, 14); c.fillRect(x + 4, y - 50, 18, 14);
  cvDot(c, x - 28, y - 2, 11, '#0B0F1C'); cvDot(c, x + 28, y - 2, 11, '#0B0F1C'); cvDot(c, x - 28, y - 2, 4, C.mute); cvDot(c, x + 28, y - 2, 4, C.mute);
}

  decomp(c, W, H, p) {

const svgWrap = (body, h = 150) => `<svg class="fig" viewBox="0 0 320 ${h}" aria-hidden="true"><rect width="320" height="${h}" rx="14" fill="${C.bg}"/>${body}</svg>`;
const sArrow = (x1, y1, x2, y2, col, w = 3) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 10; return `<line x1="${x1}" y1="${y1}" x2="${x2 - Math.cos(a) * 6}" y2="${y2 - Math.sin(a) * 6}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/><path d="M${x2} ${y2} L${x2 - Math.cos(a - 0.45) * h} ${y2 - Math.sin(a - 0.45) * h} L${x2 - Math.cos(a + 0.45) * h} ${y2 - Math.sin(a + 0.45) * h}Z" fill="${col}"/>`; };
// подпись на рисунке; стрелку вектора рисуем линией над буквой
const sTxt = (s, x, y, col = C.text, size = 15, it = true) => {
  let out = '', arrows = ''; for (const ch of s) { if (ch === '\u20D7') { const i = out.length - 1, ax = x + i * size * 0.55 + size * 0.05, w = size * 0.5, ay = y - size * 0.85; arrows += `<path d="M${ax} ${ay}H${ax + w}M${ax + w - 4} ${ay - 3}L${ax + w} ${ay}L${ax + w - 4} ${ay + 3}" stroke="${col}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`; } else out += ch; }
  return `<text x="${x}" y="${y}" fill="${col}" font-size="${size}" ${it ? 'font-style="italic" font-family="Cambria Math, Times New Roman, serif"' : 'font-family="Golos UI, sans-serif"'} font-weight="600">${out}</text>${arrows}`;
};

/* ---------- симуляции «Покрути сам»: один параметр, кнопки −/+, цель по раундам ---------- */
const SIMS = {
  route: {
    title: 'Путь и перемещение', rounds: 3,
    param: { label: 'Пройденный угол по кругу', min: 10, max: 350, step: 5, big: 30, init: 60, fmt: v => v + '°' },
    newRound(G) { G.goal = [1.2, 1.5, 2][G.round - 1]; G.task = `Точка бежит по кругу радиусом 10 м. Останови её там, где путь в ${f1(G.goal)} раза больше модуля перемещения.`; },
    calc(v) { const th = v * Math.PI / 180, s = 10 * th, d = 20 * Math.sin(th / 2); return { s, d, r: s / d }; },
    check(G, v) { const { s, d, r } = this.calc(v), ok = Math.abs(r - G.goal) <= 0.06; return { ok, msg: `Путь ${f1(s)} м, перемещение ${f1(d)} м, отношение ${f1(r, 2)}.${ok ? '' : r < G.goal ? ' Пройди дальше.' : ' Слишком далеко.'}` }; },
    draw(c, W, H, G, v) {
      cvBg(c, W, H); const cx = 360, cy = 200, R = 150, th = v * Math.PI / 180;
      c.strokeStyle = C.line; c.lineWidth = 4; c.beginPath(); c.arc(cx, cy, R, 0, 7); c.stroke();
      c.strokeStyle = C.blue; c.lineWidth = 6; c.beginPath(); c.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + th); c.stroke();
      const ax = cx, ay = cy - R, bx = cx + Math.cos(-Math.PI / 2 + th) * R, by = cy + Math.sin(-Math.PI / 2 + th) * R;
      cvArrow(c, ax, ay, bx, by, C.coral, 5); cvDot(c, ax, ay, 8, C.mute); cvDot(c, bx, by, 10, C.mint);
      const { s, d } = this.calc(v); cvText(c, `путь ${f1(s)} м`, 560, 120, 24, C.blue); cvText(c, `перемещение ${f1(d)} м`, 560, 160, 24, C.coral);
    }
  },
  secant: {
    title: 'Средняя и мгновенная скорость', rounds: 3,
    param: { label: 'Промежуток Δt', min: 0.1, max: 2, step: 0.1, big: 0.5, init: 1.5, fmt: v => f1(v) + ' с' },
    newRound(G) { G.goal = [5.4, 5, 4.6][G.round - 1]; G.task = `Тело движется по закону x = 2t². В момент t = 1 с мгновенная скорость 4 м/с. Подбери Δt, чтобы средняя скорость на [1; 1+Δt] была ${f1(G.goal)} м/с.`; },
    check(G, v) { const avg = 4 + 2 * v, ok = Math.abs(avg - G.goal) <= 0.05; return { ok, msg: `Средняя скорость ${f1(avg, 2)} м/с.${ok ? '' : avg > G.goal ? ' Уменьши Δt.' : ' Увеличь Δt.'}` }; },
    draw(c, W, H, G, v) {
      cvBg(c, W, H); const ox = 80, oy = 360, sx = 200, sy = 26, X = t => ox + t * sx, Y = x => oy - x * sy;
      cvArrow(c, ox, oy, 680, oy, C.mute, 2); cvArrow(c, ox, oy, ox, 20, C.mute, 2); cvText(c, 't, с', 650, 390, 20, C.mute, 'left', 500); cvText(c, 'x, м', 30, 30, 20, C.mute, 'left', 500);
      cvPath(c, Array.from({ length: 60 }, (_, i) => { const t = i / 59 * 3; return [X(t), Y(2 * t * t)]; }), C.blue, 4);
      const t1 = 1, t2 = 1 + v, k = (2 * t2 * t2 - 2) / v;
      c.strokeStyle = C.coral; c.lineWidth = 3; c.beginPath(); c.moveTo(X(0.3), Y(2 + k * (0.3 - 1))); c.lineTo(X(3), Y(2 + k * 2)); c.stroke();
      c.strokeStyle = 'rgba(255,194,75,.7)'; c.setLineDash([8, 8]); c.beginPath(); c.moveTo(X(0.3), Y(2 + 4 * (0.3 - 1))); c.lineTo(X(3), Y(2 + 4 * 2)); c.stroke(); c.setLineDash([]);
      cvDot(c, X(t1), Y(2), 8, C.mint); cvDot(c, X(t2), Y(2 * t2 * t2), 8, C.coral);
      cvText(c, 'секущая — средняя', 430, 330, 20, C.coral, 'left', 600); cvText(c, 'касательная — мгновенная', 430, 300, 20, C.amber, 'left', 600);
    }

    title: 'Ускорение на повороте', rounds: 3,
    param: { label: 'Скорость машины', min: 2, max: 30, step: 1, big: 5, init: 6, fmt: v => v + ' м/с' },
    newRound(G) { const R = [[50, 2], [50, 8], [32, 4.5]][G.round - 1]; G.R = R[0]; G.goal = R[1]; G.task = `Поворот радиусом ${G.R} м. Подбери скорость, при которой нормальное ускорение равно ${f1(G.goal)} м/с².`; },
    check(G, v) { const a = v * v / G.R, ok = Math.abs(a - G.goal) <= 0.25; return { ok, msg: `aₙ = v²/r = ${v}²/${G.R} = ${f1(a, 2)} м/с².${ok ? '' : a > G.goal ? ' Сбавь скорость.' : ' Быстрее.'}` }; },
    draw(c, W, H, G, v) {
      cvBg(c, W, H); const cx = 300, cy = 220, R = 150; c.strokeStyle = C.line; c.lineWidth = 26; c.beginPath(); c.arc(cx, cy, R, 0, 7); c.stroke();
      c.strokeStyle = C.bg; c.lineWidth = 2; c.setLineDash([12, 12]); c.beginPath(); c.arc(cx, cy, R, 0, 7); c.stroke(); c.setLineDash([]);
      const a = -0.6, x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R, an = v * v / G.R;
      cvArrow(c, x, y, x - Math.sin(a) * (40 + v * 5), y + Math.cos(a) * (40 + v * 5), C.amber, 5);
      cvArrow(c, x, y, x - Math.cos(a) * (20 + an * 14), y - Math.sin(a) * (20 + an * 14), C.pink, 5); cvDot(c, x, y, 12, C.coral);
      cvText(c, `aₙ = ${f1(an, 2)} м/с²`, 500, 120, 28, C.pink); cvText(c, `цель ${f1(G.goal)} м/с²`, 500, 165, 22, C.mute, 'left', 500);
    }
  },
  wheel: {
    title: 'Колесо', rounds: 3,
    param: { label: 'Частота вращения', min: 0.5, max: 6, step: 0.5, big: 1, init: 1, fmt: v => f1(v) + ' об/с' },
    newRound(G) { G.n = [2, 3, 1.5][G.round - 1]; G.R = [0.5, 0.4, 1][G.round - 1]; G.goal = 2 * Math.PI * G.n * G.R; G.task = `Колесо радиусом ${f1(G.R)} м. Подбери частоту, чтобы точки обода двигались со скоростью ${f1(G.goal)} м/с.`; },
    check(G, v) { const sp = 2 * Math.PI * v * G.R, ok = Math.abs(sp - G.goal) <= 0.15; return { ok, msg: `v = 2πnR = 2π·${f1(v)}·${f1(G.R)} = ${f1(sp, 2)} м/с.${ok ? '' : sp > G.goal ? ' Медленнее.' : ' Быстрее.'}` }; },
    draw(c, W, H, G, v, ph) { cvBg(c, W, H); wheel(c, 260, 200, 150, -(ph || 0) * v * 4); cvText(c, `ω = 2πn = ${f1(2 * Math.PI * v, 2)} рад/с`, 460, 150, 26, C.text); cvText(c, `v = ωR = ${f1(2 * Math.PI * v * G.R, 2)} м/с`, 460, 200, 26, C.amber); }
  }
};

const TITLES = [[1, 'Наблюдатель'], [5, 'Экспериментатор'], [10, 'Исследователь'], [15, 'Инженер'], [20, 'Теоретик'], [25, 'Академик']];
const needFor = l => 100 + 40 * (l - 1); // опыта от уровня l до l+1
function levelOf(xp) { let l = 1, left = xp; while (left >= needFor(l)) { left -= needFor(l); l++; } return { l, cur: left, need: needFor(l), title: TITLES.filter(t => l >= t[0]).pop()[1] }; }
const DAY_GOAL = 50;
function markDay() { const k = dayKey(); if (S.days[S.days.length - 1] !== k) { S.days.push(k); S.days = S.days.slice(-200); } }
function streak() { const d = new Set(S.days), x = new Date(); let n = 0; if (!d.has(dayKey(x))) x.setDate(x.getDate() - 1); while (d.has(dayKey(x))) { n++; x.setDate(x.getDate() - 1); } return n; }
const xpToday = () => S.xpDay.d === dayKey() ? S.xpDay.xp : 0;
function addXP(n, why) {
  if (n <= 0) return;
  const before = levelOf(S.xp).l, goalBefore = xpToday() >= DAY_GOAL;
  S.xp += n; S.xpDay = { d: dayKey(), xp: xpToday() + n }; markDay();
  if (!goalBefore && xpToday() >= DAY_GOAL) { S.xp += 30; S.xpDay.xp += 30; setTimeout(() => toast(ic('target') + 'Цель дня выполнена · +30 XP', 'gold'), 900); }
  save(); floatXP(n, why); hdrUpd();

}

}

  if ((m = /^lab-exp-([a-z0-9-]+)$/.exec(h))) return { name: 'labExp', exp: m[1], tab: 'lab', parent: 'lab-ch-' + ((LABS[m[1]]||{}).ch||1) };
  if ((m = /^lab-(spring|pendulum|fall|projectile|incline|wave|ohm|refraction|buoyancy|gas)$/.exec(h))) return { name: 'labExp', exp: LAB_LEGACY_MAP[m[1]] ? LAB_LEGACY_MAP[m[1]] : m[1], tab: 'lab', parent: 'lab' };
  if (h === 'hist' || h === 'qsearch') return { name: h, tab: 'train', parent: 'train' };
  if (['book', 'train', 'profile'].includes(h)) return { name: h, tab: h };
  return { name: 'home', tab: 'home' };
}

    sections: [
      {h:'Модели механики',p:'Механика изучает механическое движение — изменение взаимного расположения тел со временем. Кинематика описывает движение, не рассматривая его причин. Если размеры тела в задаче не важны, его заменяют материальной точкой; если тело не деформируется — абсолютно твёрдым телом. Любое движение твёрдого тела — сочетание поступательного и вращательного.',note:'Одно и то же тело может быть материальной точкой в одной задаче и не быть ею в другой: Земля на орбите — точка, а при расчёте суточного вращения — нет.'},
      {h:'Система отсчёта',p:'Положение точки задают относительно тела отсчёта. Тело отсчёта, связанная с ним система координат и часы образуют систему отсчёта. Положение точки описывают координаты или радиус-вектор, проведённый из начала координат; закон движения — это их зависимость от времени.',formula:'x = x(t),  y = y(t),  z = z(t)\nr⃗ = r⃗(t)'},
      {h:'Траектория, путь и перемещение',p:'Траектория — линия, которую описывает движущаяся точка. Путь — длина участка траектории, скалярная величина. Перемещение — вектор из начального положения в конечное. Путь не меньше модуля перемещения; они равны только при прямолинейном движении в одну сторону.',formula:'Δr⃗ = r⃗₂ − r⃗₁,   Δs ≥ |Δr⃗|',note:'После круга по стадиону путь — 400 м, а перемещение — ноль.'},
      {h:'Скорость',p:'Средняя скорость — отношение перемещения ко времени. При уменьшении промежутка времени секущая становится касательной, и получается мгновенная скорость — производная радиус-вектора по времени. Она направлена по касательной к траектории, её модуль — производная пути по времени. Путь равен площади под графиком модуля скорости.',formula:'⟨v⃗⟩ = Δr⃗/Δt,   v⃗ = dr⃗/dt,   v = ds/dt'},
      {h:'Ускорение и его составляющие',p:'Ускорение — производная скорости по времени. На криволинейной траектории его раскладывают на тангенциальное (по касательной, меняет модуль скорости) и нормальное (к центру кривизны, меняет направление). Составляющие перпендикулярны, полное ускорение находят по теореме Пифагора.',formula:'aτ = dv/dt,   aₙ = v²/r,   a = √(aτ² + aₙ²)',note:'При равномерном движении по окружности ускорение не равно нулю: есть нормальное ускорение v²/r.'},
      {h:'Равнопеременное движение',p:'Если тело движется по прямой с постоянным ускорением, скорость меняется линейно, а координата — по квадратичному закону. При торможении ускорение берут со знаком минус.',formula:'v = v₀ + at,   s = v₀t + at²/2'},
      {h:'Вращение: угловые величины',p:'При вращении удобно описывать поворот: угол поворота в радианах, угловую скорость — производную угла по времени — и угловое ускорение. У всех точек тела одна угловая скорость, а линейная скорость растёт с расстоянием до оси.',formula:'ω = dφ/dt,   ε = dω/dt,   v = ωR\nT = 2π/ω,   n = 1/T,   aτ = εR,   aₙ = ω²R',note:'Частоту в об/мин переводи в об/с: 600 об/мин = 10 об/с, ω = 2π·10 ≈ 63 рад/с.'}
    ],
    summary:'Кинематика описывает движение через радиус-вектор, скорость и ускорение. Путь — скаляр, перемещение — вектор; скорость направлена по касательной; ускорение раскладывается на тангенциальное и нормальное; вращение описывают угол, угловая скорость и угловое ускорение.'

  2: {
    lead: 'Как силы изменяют движение тел и почему тело сохраняет скорость, пока равнодействующая сил равна нулю.',
    sections: [
      {h:'Первый закон Ньютона. Инерция',p:'Тело сохраняет состояние покоя или равномерного прямолинейного движения, если внешние воздействия не заставляют его изменить это состояние. Это свойство называется инертностью. Закон формулируется для инерциальных систем отсчёта.',formula:'ΣF = 0  ⇒  a = 0',note:'Нулевое ускорение означает постоянную скорость, а не обязательно покой.'},
      {h:'Инерциальные системы отсчёта',p:'Инерциальной называют систему, в которой свободное тело покоится или движется равномерно и прямолинейно. Система, связанная с Землёй, во многих инженерных задачах считается приближённо инерциальной: небольшими эффектами вращения Земли пренебрегают.'},
      {h:'Масса и сила',p:'Масса характеризует инертные свойства тела: чем больше масса, тем меньше изменение скорости при одном и том же воздействии. Сила — векторная мера механического воздействия. Она может изменять скорость тела или вызывать деформацию. Силу характеризуют модуль, направление и точка приложения.',formula:'[F] = Н = кг·м/с²'},
      {h:'Второй закон Ньютона',p:'Ускорение тела прямо пропорционально равнодействующей сил и обратно пропорционально массе. В уравнение входит именно векторная сумма всех сил, приложенных к телу. Закон применяют в инерциальной системе отсчёта.',formula:'ΣF⃗ = m a⃗',note:'Перед подстановкой выбери оси и разложи силы на проекции. Знаки проекций определяются выбранными положительными направлениями.'},
      {h:'Импульс тела',p:'Импульс — векторная величина, равная произведению массы на скорость. Его направление совпадает с направлением скорости. Общая формулировка второго закона Ньютона связывает силу со скоростью изменения импульса.',formula:'p⃗ = m v⃗     ·     F⃗ = dp⃗/dt',note:'При постоянной массе F⃗ = m a⃗. Единица импульса — кг·м/с.'},
      {h:'Принцип независимости действия сил',p:'Если на тело одновременно действуют несколько сил, результат определяется их равнодействующей — геометрической суммой. Каждая сила вносит свой вклад в ускорение.',formula:'F⃗рез = F⃗₁ + F⃗₂ + … + F⃗ₙ'},
      {h:'Третий закон Ньютона',p:'Тела взаимодействуют попарно: силы, с которыми два тела действуют друг на друга, равны по модулю, противоположны по направлению и лежат на одной прямой. Эти силы приложены к разным телам, поэтому не компенсируют друг друга в уравнении движения одного тела.',formula:'F⃗₁₂ = −F⃗₂₁',note:'Не путай пару действия и противодействия с двумя силами, приложенными к одному телу.'},
      {h:'Силы трения',p:'Трение препятствует относительному скольжению соприкасающихся поверхностей. Различают трение покоя, скольжения и качения; внутреннее трение возникает между слоями жидкости или газа. Для сухого трения скольжения в рассматриваемой модели сила пропорциональна нормальной реакции опоры.',formula:'Fтр = μN',note:'Коэффициент μ зависит от материалов и состояния поверхностей. Сила трения направлена против относительного движения или его возможного начала.'},
      {h:'Импульс системы и его сохранение',p:'Для системы тел различают внутренние силы взаимодействия между её частями и внешние силы со стороны окружающих тел. Внутренние силы попарно компенсируются в сумме для всей системы. Если равнодействующая внешних сил равна нулю, суммарный импульс системы остаётся постоянным.',formula:'P⃗ = Σ mᵢv⃗ᵢ = const  (ΣF⃗внеш = 0)',note:'Закон сохранения импульса применяют к замкнутой системе. Проекция импульса также сохраняется вдоль направления, в котором равнодействующая внешних сил равна нулю.'},
      {h:'Центр масс',p:'Центр масс — точка, положение которой отражает распределение массы системы. Для системы материальных точек его радиус-вектор равен взвешенному по массам среднему радиус-вектору.',formula:'r⃗с = (Σ mᵢr⃗ᵢ) / (Σ mᵢ)',note:'Для однородного симметричного тела центр масс совпадает с его геометрическим центром.'},
      {h:'Движение тела переменной массы',p:'Если масса тела меняется во время движения, как у ракеты при истечении газов, обычную запись второго закона Ньютона нужно дополнить реактивной силой. Направление ускорения зависит от направления выбрасываемого потока относительно ракеты.',formula:'m a⃗ = F⃗ + F⃗реакт\nпри F = 0:  v = u ln(m₀/m)',note:'Формула Циолковского относится к идеализированному нерелятивистскому движению при постоянной относительной скорости истечения газов.'}
    ],
    summary:'Динамика связывает движение с причинами его изменения. Для решения задач сначала выдели тело, изобрази все действующие на него силы, выбери оси, запиши второй закон Ньютона в проекциях. Для системы тел проверь, можно ли применить закон сохранения импульса.'

  3: {
    lead: 'Работа описывает передачу энергии силами. Кинетическая и потенциальная энергии позволяют находить движение, а законы сохранения — анализировать столкновения.',
    sections: [
      {h:'Энергия, работа и мощность',p:'Работа постоянной силы при прямолинейном перемещении определяется проекцией силы на направление перемещения. Для переменной силы работу находят суммированием элементарных работ вдоль траектории. Работа положительна, если сила имеет составляющую по направлению движения, отрицательна — если против движения, и равна нулю при перпендикулярной силе.',formula:'A = F s cos α\nA = ∫ Fₛ ds'},
      {h:'Мощность',p:'Мощность характеризует скорость совершения работы. Мгновенная мощность равна скалярному произведению силы на скорость точки приложения силы.',formula:'N = dA/dt = F⃗ · v⃗\n1 Вт = 1 Дж/с'},
      {h:'Кинетическая энергия',p:'Кинетическая энергия — энергия механического движения. Работа равнодействующей сил изменяет кинетическую энергию тела. Значение зависит от массы и скорости, а также от выбора инерциальной системы отсчёта.',formula:'T = mv²/2\nAрез = ΔT'},
      {h:'Потенциальная энергия',p:'Потенциальная энергия характеризует взаимодействие тел и зависит от их взаимного расположения. Она вводится для потенциальных полей, в которых работа силы не зависит от траектории, а определяется начальным и конечным положениями. Нулевой уровень выбирают условно.',formula:'dA = −dP\nF⃗ = −grad P'},
      {h:'Потенциальная энергия тяжести и пружины',p:'Вблизи поверхности Земли при выбранном нулевом уровне P = mgh. Для упруго деформированной пружины потенциальная энергия растёт с квадратом деформации.',formula:'Pтяж = mgh\nPупр = kx²/2'},
      {h:'Закон сохранения механической энергии',p:'В консервативной системе, где действуют только консервативные силы, кинетическая и потенциальная энергии могут переходить друг в друга, но их сумма постоянна. При действии неконсервативных сил, например трения, механическая энергия изменяется; соответствующая энергия переходит в другие формы.',formula:'E = T + P = const\nΔE = Aнеконс'},
      {h:'Потенциальные кривые и равновесие',p:'График P(x) помогает определить допустимые положения тела: кинетическая энергия не может быть отрицательной, поэтому движение возможно там, где P(x) не превышает полной энергии E. В минимуме потенциальной энергии равновесие устойчиво: при малом смещении возникает возвращающая сила. В максимуме — неустойчиво.',formula:'T = E − P(x) ≥ 0'},
      {h:'Абсолютно упругий удар',p:'Удар — кратковременное взаимодействие тел. Если удар идеально упругий, после столкновения тела не сохраняют остаточной деформации, а кинетическая энергия возвращается в механическое движение. Для замкнутой системы сохраняются и импульс, и кинетическая энергия.',formula:'m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′\nTдо = Tпосле'},
      {h:'Абсолютно неупругий удар',p:'При абсолютно неупругом ударе тела после столкновения движутся вместе. Сохраняется импульс системы, но часть кинетической энергии переходит во внутреннюю энергию и деформацию. Скорость общего движения находят из закона сохранения импульса.',formula:'v = (m₁v₁ + m₂v₂)/(m₁ + m₂)',note:'Векторные скорости учитывают со знаками или проекциями на выбранную ось.'},
      {h:'Коэффициент восстановления',p:'Степень упругости реального удара характеризуют отношением нормальных составляющих относительной скорости после и до удара. В идеализированных предельных случаях коэффициент равен нулю для абсолютно неупругого и единице для абсолютно упругого удара.',formula:'e = vₙ′ / vₙ\n0 ≤ e ≤ 1'}
    ],
    summary:'Для задач на работу и энергию определи, какие силы совершают работу и можно ли считать систему консервативной. Для столкновения сначала проверь сохранение импульса; кинетическую энергию дополнительно сохраняй только для абсолютно упругого удара.'
  }

const READER_EXTRA = {
4:['Механика твёрдого тела','Вращение задают угловые величины: угол, угловая скорость и угловое ускорение. Для точки на расстоянии r от оси линейная скорость и ускорение связаны с угловыми величинами.','Момент силы равен произведению силы на плечо и показывает её вращательное действие. Момент инерции зависит от массы и её распределения относительно оси.','Динамика вращения: сумма моментов внешних сил равна произведению момента инерции на угловое ускорение. При нулевом внешнем моменте сохраняется момент импульса.','v=ωr; aₜ=εr; aₙ=ω²r\nM=Fl; I=Σmᵢrᵢ²\nΣM=Iε; L=Iω'],
5:['Тяготение. Элементы теории поля','Любые два тела притягиваются с силой, пропорциональной произведению масс и обратно пропорциональной квадрату расстояния. Гравитационное поле описывают напряжённостью и потенциалом.','Для сферического тела вне его поля напряжённость направлена к центру. Потенциальная энергия отрицательна при нуле на бесконечности. Орбита возникает, когда гравитация обеспечивает центростремительное ускорение.','Законы Кеплера описывают орбиты планет; период обращения связан с большой полуосью. Космические скорости задают условия выхода на орбиту и ухода из поля.','F=Gm₁m₂/r²\ng=GM/r²; φ=−GM/r\nv₁=√(GM/r); T²/a³=const'],
6:['Элементы механики жидкостей','Давление в покоящейся жидкости растёт с глубиной. Закон Паскаля описывает передачу изменения давления, а закон Архимеда — выталкивающую силу, равную весу вытесненной среды.','Условия плавания определяются соотношением веса и силы Архимеда. При движении идеальной жидкости выполняется уравнение непрерывности: расход через сечения постоянен.','Уравнение Бернулли связывает давление, кинетическую энергию потока и высоту. Оно применимо для стационарного течения идеальной несжимаемой жидкости вдоль линии тока.','p=p₀+ρgh\nFₐ=ρжgVпогр\nS₁v₁=S₂v₂\np+ρv²/2+ρgh=const'],
7:['Специальная теория относительности','Постулаты Эйнштейна: законы физики одинаковы во всех инерциальных системах, а скорость света в вакууме постоянна. Пространственные и временные координаты преобразуются совместно.','Одновременность относительна. Движущиеся часы идут медленнее, а длина тела вдоль движения сокращается относительно наблюдателя.','Импульс и энергия растут с фактором Лоренца. При малых скоростях релятивистские формулы переходят в классические.','γ=1/√(1−v²/c²)\nΔt=γΔt₀; l=l₀/γ\np=γmv; E=γmc²'],
8:['Молекулярно-кинетическая теория идеальных газов','МКТ рассматривает вещество как множество частиц в непрерывном хаотическом движении. Давление возникает из-за ударов молекул о стенки. Температура связана со средней кинетической энергией поступательного движения.','Идеальный газ — модель, в которой собственным объёмом молекул и их взаимодействием между столкновениями пренебрегают. Состояние газа связывают давлением, объёмом и температурой.','Распределение Максвелла описывает разброс скоростей молекул. Средняя квадратичная скорость растёт с температурой и уменьшается с массой молекулы.','pV=νRT=NkT\np=(1/3)nm⟨v²⟩\n⟨Eₖ⟩=3kT/2'],
9:['Основы термодинамики','Внутренняя энергия включает микроскопические кинетические и потенциальные энергии частиц. Для идеального газа она зависит только от температуры. Теплота и работа — способы изменения внутренней энергии.','Первое начало термодинамики выражает сохранение энергии: подведённая теплота идёт на изменение внутренней энергии и работу системы. Для изохорного процесса работа равна нулю, для изотермического идеального газа не меняется внутренняя энергия.','Второе начало задаёт направление самопроизвольных процессов. Тепловая машина превращает часть полученной теплоты в работу; её КПД ограничен температурой нагревателя и холодильника.','Q=ΔU+A\nAизоб=pΔV; Qизох=νCᵥΔT\nη=1−Q₂/Q₁; ηКарно=1−T₂/T₁'],
10:['Реальные газы, жидкости и твёрдые тела','Реальные газы отличаются от идеальных конечным размером молекул и межмолекулярными силами. Поправки Ван-дер-Ваальса учитывают притяжение и собственный объём частиц.','Жидкости обладают поверхностным натяжением: поверхность стремится уменьшить площадь. Смачивание и капиллярность зависят от взаимодействия жидкости с поверхностью.','Фазовые переходы сопровождаются скрытой теплотой. Кристаллические тела имеют дальний порядок, аморфные — ближний; структура влияет на механические и тепловые свойства.','(p+aν²/V²)(V−νb)=νRT\nF=σl; h=2σcosθ/(ρgr)\nQ=λm'],
11:['Электростатика','Электрический заряд бывает двух знаков, сохраняется и квантуется. Закон Кулона задаёт силу взаимодействия точечных зарядов; электрическое поле описывают напряжённостью.','Для нескольких зарядов действует принцип суперпозиции. Потенциал — энергетическая характеристика поля, напряжение — разность потенциалов. Теорема Гаусса связывает поток поля с зарядом внутри замкнутой поверхности.','Проводник в электростатическом равновесии имеет нулевое поле внутри. Конденсатор накапливает заряд и энергию электрического поля; ёмкость зависит от геометрии и диэлектрика.','F=k|q₁q₂|/r²\nE=F/q; φ=W/q\nC=q/U; W=CU²/2'],
12:['Постоянный электрический ток','Сила тока — заряд, проходящий через сечение за единицу времени. Закон Ома связывает ток, напряжение и сопротивление; сопротивление проводника зависит от материала, длины и площади сечения.','Последовательное соединение сохраняет ток во всех элементах, параллельное — напряжение на ветвях. Для разветвлённых цепей применяют правила Кирхгофа.','Источник характеризуют ЭДС и внутренним сопротивлением. Электрическая энергия преобразуется в тепло и другие виды энергии; выделение теплоты описывает закон Джоуля—Ленца.','I=dq/dt; I=U/R\nR=ρl/S; I=ℰ/(R+r)\nP=UI; Q=I²Rt'],
13:['Электрические токи в металлах, вакууме и газах','В металлах ток создают свободные электроны; сопротивление связано с рассеянием носителей и зависит от температуры. В вакууме ток возможен при эмиссии электронов с катода.','В полупроводниках ток переносят электроны и дырки. Примеси создают донорную или акцепторную проводимость, а температура меняет концентрацию носителей.','В электролитах ток переносится ионами и сопровождается электролизом. В газах ток возникает после ионизации; различают самостоятельные и несамостоятельные разряды.','R=R₀[1+αΔT]\nm=kIt'],
14:['Магнитное поле','Магнитное поле создаётся токами и движущимися зарядами. Его основной характеристикой является магнитная индукция B. На проводник с током действует сила Ампера, на движущийся заряд — сила Лоренца.','Магнитная сила перпендикулярна скорости заряда и не совершает работы. Поэтому в однородном поле при поперечном влёте частица движется по окружности.','Магнитный поток зависит от поля, площади и ориентации поверхности. Поля токов находят с помощью закона Био—Савара и теоремы о циркуляции.','FА=BIl sinα\nFЛ=|q|vB sinα\nr=mv/(|q|B); Φ=BS cosα'],
15:['Электромагнитная индукция','Индукционный ток появляется при изменении магнитного потока через контур. Закон Фарадея связывает ЭДС с быстротой изменения потока; знак определяется правилом Ленца.','Движущийся проводник в магнитном поле может создавать ЭДС движения. Изменение собственного тока катушки вызывает самоиндукцию, препятствующую изменению тока.','Магнитное поле катушки обладает энергией. Индукция лежит в основе генераторов, трансформаторов и многих устройств преобразования энергии.','ℰᵢ=−dΦ/dt\nℰ=Blv; ℰс=−L·dI/dt\nWм=LI²/2'],
16:['Магнитные свойства вещества','Магнитные свойства связаны с магнитными моментами электронов и атомов. Диамагнетики слабо ослабляют поле, парамагнетики слабо усиливают его.','В ферромагнетиках существуют домены — области упорядоченной намагниченности. Внешнее поле меняет размеры и ориентацию доменов, вызывая сильный отклик.','Гистерезис означает зависимость намагниченности от предыстории поля. Остаточная намагниченность и коэрцитивная сила важны для постоянных магнитов; выше точки Кюри ферромагнетизм исчезает.','B=μ₀(H+M)'],
17:['Основы теории Максвелла','Изменяющееся магнитное поле порождает вихревое электрическое поле. Изменяющееся электрическое поле, в свою очередь, участвует в создании магнитного поля — это учитывает ток смещения.','Уравнения Максвелла объединяют электрические и магнитные явления: описывают источники полей, отсутствие магнитных монополей и связь переменных полей.','Электромагнитное поле переносит энергию и импульс. Поток энергии характеризуется вектором Пойнтинга.','S⃗=E⃗×H⃗\nw=ε₀E²/2+B²/(2μ₀)'],
18:['Механические и электромагнитные колебания','Гармонические колебания описываются синусоидой; амплитуда задаёт размах, период — длительность цикла, частота — число циклов за секунду. Пружинный и математический маятники имеют собственные периоды.','В реальных системах сопротивление вызывает затухание. Вынужденные колебания поддерживаются внешней периодической силой; при близости частот возникает резонанс.','В LC-контуре энергия переходит между электрическим полем конденсатора и магнитным полем катушки. Сходство уравнений позволяет использовать общие методы анализа.','x=A cos(ωt+φ)\nTпруж=2π√(m/k); Tмаят=2π√(l/g)\nωLC=1/√(LC)'],
19:['Упругие волны','Механическая волна переносит возмущение и энергию через упругую среду, тогда как частицы среды колеблются около равновесия. Волны бывают продольными и поперечными.','Длина волны — расстояние между точками одинаковой фазы. Скорость волны связана с длиной волны и частотой; бегущая волна имеет фазу, зависящую от координаты и времени.','Звук — упругая волна в среде. Высота тона связана с частотой, громкость — с интенсивностью, тембр — со спектром. Эффект Доплера меняет наблюдаемую частоту при относительном движении.','λ=vT=v/ν\nξ=A cos(ωt−kx+φ₀)\nk=2π/λ'],
20:['Электромагнитные волны','Переменные электрическое и магнитное поля поддерживают распространение электромагнитной волны. В плоской волне поля взаимно перпендикулярны и перпендикулярны направлению распространения.','В вакууме скорость равна скорости света. В веществе скорость и длина волны меняются, но частота при переходе границы остаётся прежней.','Электромагнитный спектр включает радиоволны, микроволны, инфракрасное, видимое, ультрафиолетовое, рентгеновское и гамма-излучение. Волны переносят энергию и импульс.','c=1/√(ε₀μ₀)\nv=c/n; E=cB'],
21:['Геометрическая и электронная оптика','Геометрическая оптика использует модель лучей. Законы отражения и преломления позволяют строить изображения и рассчитывать ход света в линзах и оптических приборах.','Тонкая линза формирует действительное или мнимое изображение. Полное внутреннее отражение возможно при переходе из среды с большим показателем преломления в среду с меньшим.','Электронная оптика управляет пучками электронов электрическими и магнитными полями: ускоряет, отклоняет и фокусирует их.','n₁sinα=n₂sinβ\n1/f=1/a+1/b\nsinαкр=n₂/n₁'],
22:['Интерференция света','Интерференция возникает при наложении когерентных волн и приводит к устойчивому чередованию максимумов и минимумов интенсивности. Разность фаз связана с разностью хода.','В опыте Юнга две щели создают когерентные волны. Шаг полос зависит от длины волны, расстояния до экрана и расстояния между щелями.','Интерференция в тонких плёнках зависит от оптической разности хода и фазовых скачков при отражении. Её применяют в измерениях и просветляющих покрытиях.','Δ=mλ — максимум\nΔ=(m+1/2)λ — минимум\nΔx=λL/d'],
23:['Дифракция света','Дифракция — отклонение от геометрического распространения волн при прохождении через отверстия и около препятствий. Она заметна, когда размеры сравнимы с длиной волны.','Дифракционная решётка создаёт узкие максимумы, положение которых зависит от периода решётки и длины волны. Поэтому решётки используют для спектрального анализа.','Дифракция ограничивает разрешение оптических приборов. Рентгеновская дифракция позволяет исследовать кристаллическую структуру.','d sinθ=mλ\na sinθ=mλ\nθmin≈1,22λ/D'],
24:['Взаимодействие света с веществом','Свет в веществе может поглощаться, рассеиваться, отражаться и преломляться. Поглощение ослабляет интенсивность пучка по мере прохождения слоя.','Дисперсия означает зависимость показателя преломления от частоты. Поэтому белый свет разлагается в спектр, а спектры излучения и поглощения позволяют исследовать состав вещества.','Люминесценция — излучение после возбуждения, не сводящееся к обычному тепловому свечению. Флуоресценция быстро прекращается после снятия возбуждения, фосфоресценция может продолжаться.','I=I₀e^(−αl)'],
25:['Поляризация света','Поляризация характеризует направление колебаний электрического вектора световой волны. Естественный свет неполяризован, линейно поляризованный имеет выделенное направление колебаний.','Поляризатор выделяет компоненту колебаний вдоль своей оси. Анализатор проверяет состояние поляризации; интенсивность зависит от угла между осями.','Поляризация возникает также при отражении и двойном лучепреломлении. Угол Брюстера соответствует полной линейной поляризации отражённого света.','I=I₀cos²φ\ntanθБ=n₂/n₁'],
26:['Квантовая природа излучения','Энергия электромагнитного излучения передаётся порциями — фотонами. Энергия фотона пропорциональна частоте, импульс обратно пропорционален длине волны.','Фотоэффект подтверждает квантовую передачу энергии: фотон расходуется на работу выхода и кинетическую энергию электрона. Эффект Комптона показывает изменение длины волны при рассеянии фотона на электроне.','Тепловое излучение описывают законы Планка, Вина и Стефана—Больцмана. Давление света связано с передачей импульса фотонов поверхности.','E=hν=hc/λ; p=h/λ\nhν=Aвых+mv²/2\nλmaxT=b; R=σT⁴'],
27:['Теория атома водорода по Бору','Модель Бора вводит стационарные состояния атома: электрон на разрешённой орбите не излучает энергию. Излучение и поглощение происходят при переходах между уровнями.','Момент импульса орбиты квантуется. Радиусы орбит растут как n², а энергии связанных состояний пропорциональны −1/n².','Разность энергий уровней определяет энергию фотона. Спектральные линии водорода группируются в серии с общим нижним уровнем переходов.','mvr=nℏ\nrₙ=a₀n²; Eₙ=−13,6 эВ/n²\n1/λ=R(1/m²−1/n²)'],
28:['Элементы квантовой механики','Волновые свойства микрочастиц выражаются длиной волны де Бройля. Соотношение неопределённостей ограничивает одновременную точность координаты и импульса.','Состояние описывается волновой функцией, квадрат модуля которой задаёт плотность вероятности. Уравнение Шрёдингера и граничные условия определяют разрешённые состояния и энергии.','Для связанных состояний энергия часто дискретна. Туннельный эффект позволяет частице проходить через потенциальный барьер с ненулевой вероятностью.','λ=h/p\nΔxΔpₓ≥ℏ/2\nρ=|ψ|²; iℏ∂ψ/∂t=Ĥψ'],
29:['Физика атомов и молекул','Состояния электронов в атоме задаются квантовыми числами. Принцип Паули запрещает двум электронам иметь одинаковый набор четырёх квантовых чисел.','Заполнение оболочек и подуровней определяет электронную конфигурацию и периодические свойства элементов. Переходы между уровнями создают характерные атомные спектры.','В молекулах существуют электронные, колебательные и вращательные уровни. Вынужденное излучение при инверсной населённости лежит в основе работы лазера.','n=1,2,…; l=0,…,n−1\nmₗ=−l,…,+l'],
30:['Элементы квантовой статистики','Одинаковые квантовые частицы неразличимы. По спину их делят на бозоны и фермионы: фермионы подчиняются принципу Паули, бозоны могут совместно занимать одно состояние.','Распределение Ферми—Дирака описывает фермионы, а Бозе—Эйнштейна — бозоны. При разреженном газе и высокой температуре оба переходят к классическому пределу.','Квантовая статистика объясняет свойства электронного газа в металлах, тепловое излучение и коллективные квантовые состояния вещества.','n̄F=1/[e^((ε−μ)/kT)+1]\nn̄B=1/[e^((ε−μ)/kT)−1]'],
31:['Элементы физики твёрдого тела','Кристаллическая решётка задаёт периодическое расположение частиц. Дефекты и примеси нарушают идеальную периодичность и влияют на прочность, диффузию и проводимость.','Энергетические зоны возникают из расщепления атомных уровней в кристалле. Ширина запрещённой зоны и её заполнение определяют, будет ли вещество металлом, диэлектриком или полупроводником.','В полупроводниках ток переносят электроны и дырки; легирование создаёт n- и p-типы. Сверхпроводимость характеризуется нулевым сопротивлением и эффектом Мейснера ниже критической температуры.','σ=ne²τ/m'],
32:['Физика атомного ядра','Ядро состоит из протонов и нейтронов. Зарядовое число Z задаёт число протонов, массовое число A — общее число нуклонов. Массовый дефект связан с энергией связи.','Радиоактивный распад происходит самопроизвольно по экспоненциальному закону. Различают альфа-, бета- и гамма-превращения; у каждого сохраняются соответствующие характеристики ядра.','В ядерных реакциях энергия выделяется или поглощается в соответствии с разностью масс. Деление тяжёлых ядер и синтез лёгких лежат в основе ядерной энергетики и звёздных процессов.','A=Z+N; Eсв=Δmc²\nN=N₀e^(−λt); T₁/₂=ln2/λ\nQ=Δmc²'],
33:['Физика элементарных частиц','Фундаментальные частицы включают кварки и лептоны; взаимодействия описываются полями и частицами-переносчиками. Протоны и нейтроны — составные адроны.','Античастицы имеют ту же массу, но противоположные некоторые квантовые числа. При аннигиляции частица и античастица превращаются в другие частицы и излучение.','В реакциях частиц проверяют сохранение энергии, импульса, электрического заряда и квантовых чисел. Ускорители создают столкновения, детекторы регистрируют продукты распада.','E=mc²; p=γmv']
};
for(const [k,v] of Object.entries(READER_EXTRA)){
 const [title,p1,p2,p3,formula]=v;

/* ---------- симуляции с кнопками − / + ---------- */
let G = null;
function simStart(sim, key, L) { G = { sim, key, L, round: 1, tries: 0, v: sim.param.init, res: null }; sim.newRound(G); simDraw(); }
function simDraw() {
  const { sim } = G, p = sim.param, f = d => (d > 0 ? '+' : '−') + String(Math.abs(d)).replace('.', ',');
  $('#simbox').innerHTML = `<section class="card sim"><div class="row"><b>${esc(sim.title)}</b><small>задание ${G.round} из ${sim.rounds}</small></div><p class="task">${esc(G.task)}</p><canvas id="sc" width="720" height="400"></canvas><p class="smsg ${G.res ? (G.res.ok ? 'ok' : 'bad') : ''}" id="smsg">${G.res ? esc(G.res.msg) : 'Меняй значение кнопками и жми «Проверить».'}</p>` +
    `<div class="stp"><div class="stp-h"><span>${esc(p.label)}</span><b id="sval">${p.fmt(G.v)}</b></div><div class="stp-b"><button data-step="${-p.big}">${f(-p.big)}</button><button class="m" data-step="${-p.step}">−</button><button class="m" data-step="${p.step}">+</button><button data-step="${p.big}">${f(p.big)}</button></div></div>` +
    `<button class="btn wide mt" data-act="simGo">Проверить</button></section>`;
  sim.draw($('#sc').getContext('2d'), 720, 400, G, G.v, 0);
  if (sim === SIMS.wheel) { const t0 = performance.now(); const spin = now => { if (!G || G.sim !== SIMS.wheel || !$('#sc')) return; sim.draw($('#sc').getContext('2d'), 720, 400, G, G.v, (now - t0) / 1000); G.raf = requestAnimationFrame(spin); }; G.raf = requestAnimationFrame(spin); }
}
const snap = (v, step, min, max) => { const d = (String(step).split('.')[1] || '').length; return +Math.max(min, Math.min(max, Math.round(v / step) * step)).toFixed(d); };
function simStep(d) { if (!G) return; const p = G.sim.param; G.v = snap(G.v + d, p.step, p.min, p.max); G.res = null; $('#sval').textContent = p.fmt(G.v); $('#smsg').className = 'smsg'; $('#smsg').textContent = 'Меняй значение кнопками и жми «Проверить».'; if (G.sim !== SIMS.wheel) G.sim.draw($('#sc').getContext('2d'), 720, 400, G, G.v, 0); }
function simGo() {
  G.tries++; const res = G.sim.check(G, G.v); G.res = res; const m = $('#smsg'); m.className = 'smsg ' + (res.ok ? 'ok' : 'bad'); m.textContent = res.msg;
  if (!res.ok) { buzz(25); return; }
  buzz([15, 40, 15]);
  if (G.round >= G.sim.rounds) { const key = G.key; setTimeout(() => { stepDone(key, 'sim', 20); $('#simbox').innerHTML = `<section class="card center">${ic('trophy', 'big gold')}<b class="h">Практика пройдена!</b><p class="mute">${G.sim.rounds} задания за ${plural(G.tries, 'попытку', 'попытки', 'попыток')}.</p></section>` + nextStepBtn('sim', G.L); }, 700); return; }
  setTimeout(() => { if (!G) return; G.round++; G.res = null; G.sim.newRound(G); simDraw(); }, 1200);
}
/* ---------- «Найди пару»: понятие ↔ формула или определение ---------- */
let PG = null;
function pairStart(L, key) {
  const pairs = shuffle(L.pairs).slice(0, 5);
  PG = { L, key, pairs, left: shuffle(pairs.map((_, i) => i)), right: shuffle(pairs.map((_, i) => i)), sel: null, done: new Set(), miss: 0 };
  pairDraw();
}
function pairDraw() {
  const b = (side, i) => `<button class="pc${side === 'r' && !/[а-яё]/i.test(PG.pairs[i][1]) ? ' math' : ''}${PG.done.has(i) ? ' done' : ''}${PG.sel && PG.sel.side === side && PG.sel.i === i ? ' sel' : ''}" data-act="pp" data-side="${side}" data-i="${i}"${PG.done.has(i) ? ' disabled' : ''}>${vx(PG.pairs[i][side === 'l' ? 0 : 1])}</button>`;
  $('#simbox').innerHTML = `<section class="card sim"><div class="row"><b>Найди пару</b><small>пар ${PG.done.size} из ${PG.pairs.length} · ошибок ${PG.miss}</small></div><p class="task">Нажми понятие слева, потом подходящее справа.</p><div class="pairs"><div>${PG.left.map(i => b('l', i)).join('')}</div><div>${PG.right.map(i => b('r', i)).join('')}</div></div></section>`;
}
function pairPick(side, i) {
  if (!PG || PG.done.has(i)) return;
  if (!PG.sel || PG.sel.side === side) { PG.sel = { side, i }; pairDraw(); return; }
  const ok = PG.sel.i === i; PG.sel = null;
  if (ok) { PG.done.add(i); buzz(12); } else { PG.miss++; buzz([30, 40, 30]); }
  pairDraw();
  if (!ok) { const el = document.querySelector(`.pc[data-side="${side}"][data-i="${i}"]`); if (el) el.classList.add('shake'); }
  if (PG.done.size === PG.pairs.length) {
    const { key, L, miss } = PG, st = miss === 0 ? 3 : miss <= 2 ? 2 : 1;
    setTimeout(() => { stepDone(key, 'sim', 20); $('#simbox').innerHTML = `<section class="card center">${ic('trophy', 'big gold')}<b class="h">Все пары найдены!</b>${stars(st)}<p class="mute">Ошибок: ${miss}.</p></section>` + nextStepBtn('sim', L); }, 500);
  }
}

let stepRep = null; const stepStop = () => { clearTimeout(stepRep); clearInterval(stepRep); stepRep = null; };
document.addEventListener('pointerdown', e => { const b = e.target.closest('[data-step]'); if (!b) return; e.preventDefault(); stepStop(); const go = () => simStep(+b.dataset.step); go(); stepRep = setTimeout(() => { stepRep = setInterval(go, 70); }, 380); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => document.addEventListener(t, stepStop));

document.addEventListener('click', async e => {
  if (e.target.id === 'sheet') return closeSheet();
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const d = b.dataset, r = route();
  // Игровые действия принадлежат только bridge-game.js: не допускаем двойную диспетчеризацию.
  if (d.act.startsWith('bridge') || d.act.startsWith('sandbox')) return;
  const asyncActions = ['topics', 'topicQuiz', 'warm', 'exam', 'errs', 'chQuiz'];
  if (asyncActions.includes(d.act)) {
    if (b.dataset.busy === '1') return;
    b.dataset.busy = '1';
    b.disabled = true;
  }
  try {
  switch (d.act) {
    case 'closeSheet': closeSheet(); break;
    case 'readerFont': readerFontSize=Math.max(15,Math.min(23,readerFontSize+Number(d.delta)));localStorage.setItem('f2-reader-font',String(readerFontSize));render();break;
    case 'readerPrev': location.hash='read-'+d.v;break;

    case 'step': curStep[lessonKey(r.ch, r.li)] = d.v; render(); ui.main.scrollTop = 0; break;
    case 'vToggle': vToggle(); break;

    case 'vCc': if (V) { V.cc = !V.cc; S.cc = V.cc ? 1 : 0; save(); $('#vsub').hidden = !V.cc; } break;
    case 'cNext': { const box = $('#cards'), i = Math.round(box.scrollLeft / box.clientWidth); if (i >= box.children.length - 1) { const L = CONTENT[r.ch].lessons[r.li - 1], S2 = lessonSteps(L), nx = S2[S2.findIndex(s => s[0] === 'cards') + 1]; if (nx) { curStep[lessonKey(r.ch, r.li)] = nx[0]; render(); ui.main.scrollTop = 0; } } else box.scrollTo({ left: (i + 1) * box.clientWidth, behavior: 'smooth' }); break; }
    case 'cPrev': { const box = $('#cards'), i = Math.round(box.scrollLeft / box.clientWidth); box.scrollTo({ left: Math.max(0, i - 1) * box.clientWidth, behavior: 'smooth' }); break; }
    case 'simGo': simGo(); break;
    case 'pp': pairPick(d.side, +d.i); break;
    case 'lessonQuiz': { const L = CONTENT[d.ch].lessons[d.li - 1]; startQuiz({ kind: 'lesson', key: lessonKey(+d.ch, +d.li), title: 'Проверка: ' + L.title, items: L.quiz, back: '#l' + d.ch + '-' + d.li }); break; }
    case 'boss': { const C1 = CONTENT[d.ch]; startQuiz({ kind: 'boss', ch: +d.ch, title: 'Финал главы ' + d.ch, items: shuffle(C1.boss), back: '#c' + d.ch }); break; }
    case 'lab': location.hash = 'lab'; break;
    case 'labGames': location.hash = 'lab-games'; break;
    case 'labOpen': labOpen(d.v); break;
    case 'labHome': labStop(); location.hash='lab'; break;
    case 'labStart': case 'labPause': case 'labReset': case 'labAdjust': case 'labSpeed': labAction(d.act, d); break;
    case 'trainBack': location.hash = 'train'; break;
    case 'ava': sheet(`<b class="h">Выбери аватар</b><div class="avas">${AVATARS.map((_, i) => `<button data-act="setAva" data-v="${i}" class="${i === S.ava ? 'on' : ''}">${avatarSvg(i, 60)}</button>`).join('')}</div>`); break;
    case 'setAva': S.ava = +d.v; save(); closeSheet(); render(); break;
    case 'reset': if (confirm('Сбросить весь прогресс, опыт и значки?')) { S = Object.assign({}, S0); save(); render(); } break;
  }
  } catch (err) {
    console.error('Fizika action failed:', d.act, err);
    toast('Не удалось выполнить действие. Попробуй ещё раз.', 'bad');
  } finally {
    if (b.dataset.busy === '1') { b.disabled = false; delete b.dataset.busy; }
  }

/* ---------- обновления Android ---------- */
async function checkAppUpdates() {
  if (!F2_IN_APP) return;
  const get = async path => {
    let last;
    for (const prefix of ['/mirror/gv2/', '/mirror/gh2/']) {
      try {
        const r = await fetch(prefix + path + (path.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
        if (r.ok) return r;
        last = new Error('HTTP ' + r.status);
      } catch (e) { last = e; }
    }
    throw last || new Error('Нет зеркала обновлений');
  };
  try {
    const v = await (await get('version.json')).json();
    if (Number.isInteger(v.data) && v.data > Number(localStorage.getItem('f2-data') || 0)) {
      const c = await (await get('content.json')).json();
      if (c && c.v === v.data && Array.isArray(c.topics)) {
        localStorage.setItem('f2-content', JSON.stringify(c));
        localStorage.setItem('f2-data', String(v.data));
        BANK = null;
      }
    }
    if (Number.isInteger(v.build) && v.build > F2_BUILD && localStorage.getItem('f2-app-bad') !== String(v.build)) {
      const h = await (await get('index.html')).text();
      if (h.includes('const F2_BUILD = ' + v.build + ';')) {
        localStorage.setItem('f2-app-html', h);
        localStorage.setItem('f2-app-build', String(v.build));
      }
    }
  } catch (e) {
    // Offline is expected: the APK already contains a complete working copy.
  }
}

/* ---------- запуск ---------- */
function boot() {
  if (F2_IN_APP) { try { localStorage.setItem('f2-app-ok', String(F2_BUILD)); } catch (e) {} }
  Object.assign(ui, { main: $('#main'), ttl: $('#ttl'), back: $('#back'), tabs: $('#tabs'), lv: $('#lv') });
  ui.back.addEventListener('click', () => { const r = route(); if (r.name === 'quiz') { if (Q && Q.i < Q.items.length && Q.i > 0 && !confirm('Выйти из проверки? Результат не сохранится.')) return; const back = Q && Q.back; Q = null; location.hash = back ? back.slice(1) : ''; } else location.hash = r.parent || ''; });
  window.addEventListener('hashchange', render);
  render();
  if (!F2_IN_APP && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (F2_IN_APP) setTimeout(checkAppUpdates, 1800);
}
