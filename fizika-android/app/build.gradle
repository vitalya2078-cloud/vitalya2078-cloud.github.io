plugins { id 'com.android.application' }

// Ключ подписи берётся из keystore.properties (в git не хранится). Без него сборка подписывается отладочным ключом.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'io.github.vitalya.fizika'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.vitalya.fizika'
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName '2.5'
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile']); storePassword ks['storePassword']
                keyAlias ks['keyAlias']; keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDirs += ["$buildDir/web"] } }
}

// Новый курс по учебнику. Сборка fizika2/src/build.py должна быть выполнена перед assembleRelease.
def copyWeb = tasks.register('copyWeb', Copy) {
    from(rootProject.file('../fizika2')) { include 'index.html', 'content.json', 'version.json', 'manifest.webmanifest', 'sw.js', 'icon-192.png', 'pics/**', 'audio/**' }
    into "$buildDir/web/web"
}
tasks.named('preBuild') { dependsOn copyWeb }

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
