name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'fizika/**'
      - 'fizika2/**'
      - 'fizika-android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check JavaScript syntax
        run: |
          node --check fizika2/src/lab-data.js
          node --check fizika2/src/app.js
          node --check fizika2/src/bridge-game.js

      - name: Build website data and textbook course
        run: |
          python fizika/src/build.py
          python fizika2/src/build.py

      - name: Publish generated website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fizika2/index.html fizika2/content.json fizika2/version.json fizika2/sw.js fizika2/manifest.webmanifest fizika2/icon-192.png fizika2/src/meta.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish generated Fizika 2 site"
            git push
          fi

      - name: Build APK
        working-directory: fizika-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp fizika-android/app/build/outputs/apk/release/app-release.apk Fizika-2.8-debug-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fizika-2.8-Android-APK
          path: Fizika-2.8-debug-signed.apk
          if-no-files-found: error
          retention-days: 14
