name: PHYSICS v2 — build check

on:
  push:
    branches:
      - physics-hybrid-redesign
    paths:
      - "physics-v2/**"
      - ".github/workflows/physics-v2-build.yml"
  pull_request:
    branches:
      - physics-hybrid-redesign
    paths:
      - "physics-v2/**"
      - ".github/workflows/physics-v2-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: physics-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate immutable official question bank
        run: node scripts/validate-official-bank.mjs

      - name: Type-check and build
        run: npm run build

      - name: Run domain tests
        run: npm run test

      - name: Smoke test offline PWA build
        run: npm run smoke:pwa

      - name: Smoke test PHYSICS public API
        env:
          API_URL: https://vqiljksvsdjmwbbngimg.supabase.co/functions/v1/physics-api
        run: |
          curl --fail --silent --show-error "$API_URL/health" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              if (result.ok !== true || result.database !== "connected") {
                console.error("PHYSICS API health check failed:", result);
                process.exit(1);
              }
              console.log("PHYSICS API health check passed.");
            });
          '
          curl --fail --silent --show-error "$API_URL/v1/catalog" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              if (!Array.isArray(result.data)) {
                console.error("PHYSICS catalog response is invalid:", result);
                process.exit(1);
              }
              console.log("PHYSICS catalog endpoint passed.");
            });
          '

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: physics-v2-web-build
          path: physics-v2/dist/
          if-no-files-found: error
          retention-days: 14


  android-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compile native Android APK
        run: gradle -p physics-v2/android assembleDebug

      - name: Run native Android unit tests
        run: gradle -p physics-v2/android testDebugUnitTest

      - name: Upload native Android APK
        uses: actions/upload-artifact@v4
        with:
          name: physics-android-debug-apk
          path: physics-v2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
