name: PHYSICS v2 — build check

on:
  push:
    branches:
      - physics-hybrid-redesign
    paths:
      - "physics-v2/**"
      - ".github/workflows/physics-v2-build.yml"
  pull_request:
    branches:
      - physics-hybrid-redesign
    paths:
      - "physics-v2/**"
      - ".github/workflows/physics-v2-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: physics-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check and build
        run: npm run build

      - name: Run domain tests
        run: npm run test

      - name: Smoke test PHYSICS public API
        env:
          API_URL: https://vqiljksvsdjmwbbngimg.supabase.co/functions/v1/physics-api
        run: |
          curl --fail --silent --show-error "$API_URL/health" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              if (result.ok !== true || result.database !== "connected") {
                console.error("PHYSICS API health check failed:", result);
                process.exit(1);
              }
              console.log("PHYSICS API health check passed.");
            });
          '
          curl --fail --silent --show-error "$API_URL/v1/catalog" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              if (!Array.isArray(result.data)) {
                console.error("PHYSICS catalog response is invalid:", result);
                process.exit(1);
              }
              console.log("PHYSICS catalog endpoint passed.");
            });
          '

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: physics-v2-web-build
          path: physics-v2/dist/
          if-no-files-found: error
          retention-days: 14
