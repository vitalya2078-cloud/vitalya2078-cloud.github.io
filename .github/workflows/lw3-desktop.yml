name: Физпрактикум — программы для Windows и Android

# Сначала проверка (модель, полное прохождение в браузере), затем сборка на Windows:
# установщик NSIS (без прав администратора) и переносной .exe. Тег lw3-v* — ещё и релиз на GitHub.
on:
  push:
    branches: ['**']        # без этого фильтр tags отключает запуск по пушу в ветки
    paths:
      - 'lw3-desktop/**'
      - 'fizika2/src/lw3-core.js'
      - 'fizika2/src/labwork.js'
      - 'fizika2/src/app.js'
      - 'fizika2/src/icons.js'
      - 'fizika2/src/shell.html'
      - 'fizika2/tests/lw3-*'
      - '.github/workflows/lw3-desktop.yml'
    tags: ['lw3-v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

concurrency:
  group: lw3-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build interface
        run: python lw3-desktop/build.py

      - name: Model and calculations
        run: node fizika2/tests/lw3-model.test.mjs

      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Full lab run in the app interface
        run: |
          python -m http.server 4180 --directory lw3-desktop/dist > /tmp/lw3.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4180/ >/dev/null && break; sleep 1; done
          mkdir -p shots
          SHOTS=shots node lw3-desktop/tests/e2e.mjs
          SHOTS=shots node lw3-desktop/tests/e2e-labs.mjs
          node lw3-desktop/tests/notes-tex.mjs
          node lw3-desktop/tests/e2e-ui.mjs
          node lw3-desktop/tests/e2e-license.mjs

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lw3-screenshots
          path: shots/*.png
          if-no-files-found: ignore

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lw3-desktop/src-tauri -> target

      - name: Build interface
        run: python lw3-desktop/build.py
        env:
          FZ_TEACHER_PASS: ${{ secrets.FZ_TEACHER_PASS }}
          FZ_REQUIRE_TEACHER_PASS: '1'

      # своя копия WebView2 (Fixed Version Runtime): программа не зависит от компонента Windows и интернета.
      # Microsoft держит на странице ссылки только на две последние версии — берём свежую x64 и проверяем подпись Microsoft.
      - name: WebView2 Fixed Version Runtime
        shell: pwsh
        run: |
          $page = (Invoke-WebRequest -UseBasicParsing 'https://developer.microsoft.com/en-us/microsoft-edge/webview2/').Content -replace '\\u002F', '/'
          $url = ([regex]::Matches($page, 'https://msedge\.sf\.dl\.delivery\.mp\.microsoft\.com/[^"]+?FixedVersionRuntime\.[\d.]+\.x64\.cab') | Select-Object -First 1).Value
          if (-not $url) { throw 'Не найдена ссылка на WebView2 Fixed Version Runtime' }
          Write-Host "WebView2: $url"
          Invoke-WebRequest -UseBasicParsing $url -OutFile wv2.cab
          $sig = Get-AuthenticodeSignature wv2.cab
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw "Подпись архива WebView2 неверна: $($sig.Status) $($sig.SignerCertificate.Subject)" }
          New-Item -ItemType Directory -Force wv2 | Out-Null
          expand.exe wv2.cab -F:* wv2 | Out-Null
          $exe = Get-ChildItem wv2 -Recurse -Filter msedgewebview2.exe | Select-Object -First 1
          if (-not $exe) { throw 'В архиве WebView2 нет msedgewebview2.exe' }
          Move-Item $exe.Directory.FullName lw3-desktop/src-tauri/WebView2Runtime
          Get-ChildItem lw3-desktop/src-tauri/WebView2Runtime/msedgewebview2.exe

      # открытый ключ лицензии (из генератора ключей кафедры) вшивается в программу; без него выпуск не собирается
      - name: License public key
        env:
          PK: ${{ vars.FZ_LICENSE_PUBKEY || secrets.FZ_LICENSE_PUBKEY }}
        run: |
          [ ${#PK} -eq 64 ] || { echo "::error::нет открытого ключа лицензии: задайте переменную или секрет FZ_LICENSE_PUBKEY (64 шестнадцатеричных знака из генератора ключей)"; exit 1; }
          echo "FZ_LICENSE_PUBKEY=$PK" >> "$GITHUB_ENV"

      - name: Build Windows app
        working-directory: lw3-desktop
        run: |
          npm ci --no-audit --no-fund
          npx tauri build

      - name: Collect files
        run: |
          mkdir -p out
          cp lw3-desktop/src-tauri/target/release/bundle/nsis/*.exe "out/Fizpraktikum-setup.exe"
          mkdir -p portable/Fizpraktikum
          exe=lw3-desktop/src-tauri/target/release/Fizpraktikum.exe; [ -f "$exe" ] || exe=lw3-desktop/src-tauri/target/release/lw3-adiabata.exe
          cp "$exe" portable/Fizpraktikum/Fizpraktikum.exe
          cp -r lw3-desktop/src-tauri/WebView2Runtime portable/Fizpraktikum/WebView2Runtime
          cp lw3-desktop/src-tauri/license.txt "portable/Fizpraktikum/Лицензионное соглашение.txt"
          (cd portable && 7z a -tzip -mx=7 ../out/Fizpraktikum-portable.zip Fizpraktikum > /dev/null)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Fizpraktikum-windows
          path: |
            out/*.exe
            out/*.zip

  release:
    needs: [windows]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/lw3-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Version
        id: ver
        run: echo "v=$(python3 -c "import json;print(json.load(open('lw3-desktop/src-tauri/tauri.conf.json',encoding='utf-8'))['version'])")" >> "$GITHUB_OUTPUT"
      # релиз с прямыми ссылками: после каждой сборки на main (тег lw3-v<версия> создаётся здесь же)
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lw3-v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Физпрактикум ${{ steps.ver.outputs.v }}
          make_latest: true
          files: |
            out/*.exe
            out/*.zip
          body: |
            **Физпрактикум** - виртуальный лабораторный практикум по физике (ЧВВМУ им. П.С. Нахимова, кафедра физики и общетехнических дисциплин): 8 лабораторных работ по методическим указаниям кафедры, конспекты и видеоуроки по 9 темам курса, справочник, тесты и экзамены по банку из 900 вопросов, кабинет преподавателя.

            **Windows**
            **Fizpraktikum-setup.exe** - установщик (без прав администратора, ярлык в «Пуске»). Среда WebView2 входит в программу, интернет при установке не нужен.
            **Fizpraktikum-portable.zip** - версия без установки: распакуйте папку и запустите Fizpraktikum.exe.
