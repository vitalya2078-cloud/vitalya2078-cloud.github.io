name: Физпрактикум — программы для Windows и Android

# Сначала проверка (модель, полное прохождение в браузере), затем сборка на Windows:
# установщик NSIS (без прав администратора) и переносной .exe. Тег lw3-v* — ещё и релиз на GitHub.
on:
  push:
    branches: ['**']        # без этого фильтр tags отключает запуск по пушу в ветки
    paths:
      - 'lw3-desktop/**'
      - 'fizika2/src/lw3-core.js'
      - 'fizika2/src/labwork.js'
      - 'fizika2/src/app.js'
      - 'fizika2/src/icons.js'
      - 'fizika2/src/shell.html'
      - 'fizika2/tests/lw3-*'
      - '.github/workflows/lw3-desktop.yml'
    tags: ['lw3-v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

concurrency:
  group: lw3-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build interface
        run: python lw3-desktop/build.py

      - name: Model and calculations
        run: node fizika2/tests/lw3-model.test.mjs

      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Full lab run in the app interface
        run: |
          python -m http.server 4180 --directory lw3-desktop/dist > /tmp/lw3.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4180/ >/dev/null && break; sleep 1; done
          mkdir -p shots
          SHOTS=shots node lw3-desktop/tests/e2e.mjs
          SHOTS=shots node lw3-desktop/tests/e2e-labs.mjs

      - name: Full lab run in the Android interface (phone emulation)
        run: |
          (cd lw3-mobile && npm ci --no-audit --no-fund)
          python lw3-mobile/build.py
          python -m http.server 4190 --directory lw3-mobile/www > /tmp/lw3m.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4190/ >/dev/null && break; sleep 1; done
          SHOTS=shots node lw3-mobile/tests/e2e.mjs
          node lw3-mobile/tests/native-start.mjs
          SHOTS=shots node lw3-mobile/tests/e2e-labs.mjs

      - name: iPhone web app (fizpraktikum/ on GitHub Pages)
        run: |
          python -m pip install --quiet pillow
          python lw3-mobile/build_ios.py
          git diff --exit-code -- fizpraktikum/index.html || { echo "::error::fizpraktikum/ устарела — запусти python3 lw3-mobile/build_ios.py и закоммить"; exit 1; }
          python -m http.server 4200 > /tmp/lw3i.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4200/fizpraktikum/ >/dev/null && break; sleep 1; done
          node lw3-mobile/tests/ios-pwa.mjs

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lw3-screenshots
          path: shots/*.png
          if-no-files-found: ignore

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lw3-desktop/src-tauri -> target

      - name: Build interface
        run: python lw3-desktop/build.py
        env:
          FZ_TEACHER_PASS: ${{ secrets.FZ_TEACHER_PASS }}
          FZ_REQUIRE_TEACHER_PASS: '1'

      - name: Build Windows app
        working-directory: lw3-desktop
        run: |
          npm ci --no-audit --no-fund
          npx tauri build

      - name: Collect files
        run: |
          mkdir -p out
          cp lw3-desktop/src-tauri/target/release/bundle/nsis/*.exe "out/Fizpraktikum-setup.exe"
          cp lw3-desktop/src-tauri/target/release/lw3-adiabata.exe "out/Fizpraktikum-portable.exe"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Fizpraktikum-windows
          path: out/*.exe

  android:
    needs: test
    runs-on: ubuntu-latest           # Android SDK уже установлен на раннере
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build interface and sync
        working-directory: lw3-mobile
        run: |
          npm ci --no-audit --no-fund
          python build.py
          npx cap sync android
      # постоянный ключ подписи (если задан в секретах) — чтобы новые версии ставились поверх старых
      - name: Signing key
        env:
          KS_B64: ${{ secrets.LW3_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/lw3.jks"; echo "LW3_KEYSTORE=$RUNNER_TEMP/lw3.jks" >> "$GITHUB_ENV"; else echo "Подпись: открытый ключ приложения (lw3-public.keystore)"; fi
      - name: Build APK
        working-directory: lw3-mobile/android
        env:
          LW3_KEYSTORE_PASS: ${{ secrets.LW3_KEYSTORE_PASS }}
          LW3_KEY_ALIAS: ${{ secrets.LW3_KEY_ALIAS }}
          LW3_KEY_PASS: ${{ secrets.LW3_KEY_PASS }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: |
          mkdir -p out
          cp lw3-mobile/android/app/build/outputs/apk/release/app-release.apk out/Fizpraktikum.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Fizpraktikum-android
          path: out/*

  release:
    needs: [windows, android]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/lw3-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Version
        id: ver
        run: echo "v=$(python3 -c "import json;print(json.load(open('lw3-desktop/src-tauri/tauri.conf.json',encoding='utf-8'))['version'])")" >> "$GITHUB_OUTPUT"
      # релиз с прямыми ссылками: после каждой сборки на main (тег lw3-v<версия> создаётся здесь же)
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lw3-v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Физпрактикум ${{ steps.ver.outputs.v }}
          make_latest: true
          files: |
            out/*.exe
            out/*.apk
          body: |
            **Физпрактикум** — виртуальный лабораторный практикум по физике (ЧВВМУ им. П.С. Нахимова, кафедра физики и общетехнических дисциплин): 8 лабораторных работ по методическим указаниям кафедры, тесты и экзамены по банку из 900 вопросов, учётные записи курсантов с паролем.

            **iPhone и iPad** — веб-приложение: открыть https://vitalya2078-cloud.github.io/fizpraktikum/ в Safari → «Поделиться» → «На экран „Домой“».

            **Windows**
            **Fizpraktikum-setup.exe** — установщик (без прав администратора, ярлык в «Пуске»).
            **Fizpraktikum-portable.exe** — переносная версия: запускается без установки (нужен WebView2, в Windows 10/11 он обычно уже есть).

            **Android**
            **Fizpraktikum.apk** — приложение для телефона (Android 7 и новее): своя раскладка под экран телефона, отправка работы преподавателю через мессенджер или почту, отчёт в PDF.
