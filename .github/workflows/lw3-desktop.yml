name: Физпрактикум для Windows 7 и новее

# Сначала проверка (модель, полное прохождение в браузере, в том числе в движке Chromium 109), затем сборка на Windows:
# программа на C++ (Win32 + WebView2 109, 32 бита: работает в 32- и 64-битной Windows 7, 8, 10, 11),
# проверка запуска настоящего .exe, установщик NSIS (без прав администратора) и переносной zip.
# Тег lw3-v* или ветка main — ещё и релиз на GitHub.
on:
  push:
    branches: ['**']        # без этого фильтр tags отключает запуск по пушу в ветки
    paths:
      - 'lw3-desktop/**'
      - 'fizika2/src/lw3-core.js'
      - 'fizika2/src/labwork.js'
      - 'fizika2/src/app.js'
      - 'fizika2/src/icons.js'
      - 'fizika2/src/shell.html'
      - 'fizika2/tests/lw3-*'
      - 'license-generator/**'
      - '.github/workflows/lw3-desktop.yml'
    tags: ['lw3-v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

concurrency:
  group: lw3-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build interface
        run: python lw3-desktop/build.py

      - name: Model and calculations
        run: node fizika2/tests/lw3-model.test.mjs

      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Full lab run in the app interface
        run: |
          python -m http.server 4180 --directory lw3-desktop/dist > /tmp/lw3.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4180/ >/dev/null && break; sleep 1; done
          mkdir -p shots
          SHOTS=shots node lw3-desktop/tests/e2e.mjs
          SHOTS=shots node lw3-desktop/tests/e2e-labs.mjs
          node lw3-desktop/tests/notes-tex.mjs
          node lw3-desktop/tests/e2e-ui.mjs
          node lw3-desktop/tests/e2e-license.mjs
          SHOTS=shots node lw3-desktop/tests/e2e-nuc.mjs

      # программа в Windows 7 работает на движке 109: те же проверки в Chromium 109
      - name: Interface in Chromium 109 (Windows 7 engine)
        run: |
          curl -fsSL -o c109.zip https://storage.googleapis.com/chromium-browser-snapshots/Linux_x64/1070019/chrome-linux.zip
          unzip -q c109.zip -d c109
          export FZ_CHROME=$PWD/c109/chrome-linux/chrome
          $FZ_CHROME --version
          node lw3-desktop/tests/e2e.mjs
          node lw3-desktop/tests/e2e-labs.mjs
          node lw3-desktop/tests/e2e-ui.mjs
          node lw3-desktop/tests/e2e-license.mjs
          node lw3-desktop/tests/e2e-nuc.mjs

      # лицензия на C++: ключи из генератора кафедры принимаются, чужие и испорченные — нет
      - name: License check in C++
        run: |
          clang -c -O1 lw3-desktop/win/tweetnacl.c -o /tmp/tn.o
          clang++ -std=c++17 -O1 -Wall lw3-desktop/win/license.cpp lw3-desktop/win/tests/license_test.cpp /tmp/tn.o -o /tmp/lictest
          export FZ_MACHINE_GUID=3f2504e0-4f89-11d3-9a0c-0305e82c3301
          /tmp/lictest $(node lw3-desktop/win/tests/keys.mjs FZ-XMX8-RQPD-QMDR-2H5C) | tee /tmp/lic.txt
          grep -q "machine_code=FZ-XMX8-RQPD-QMDR-2H5C" /tmp/lic.txt

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lw3-screenshots
          path: shots/*.png
          if-no-files-found: ignore

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      WV2_SDK: '1.0.1518.46'        # последний WebView2 SDK с поддержкой Windows 7
      WV2_SDK_SHA256: 63020b2d569d09a2098ae1ca20dd4cc281885f794aa00fc8812c6ab52dd49618
      # WebView2 Runtime 109.0.1518.140 (x86) — последняя версия для Windows 7, из каталога обновлений Microsoft
      WV2_RT_URL: https://catalog.s.download.windowsupdate.com/c/msdownload/update/software/updt/2023/09/microsoftedgestandaloneinstallerx86_179f59bc54d73843d9288a9fd5609de0e507b911.exe
      WV2_RT_SHA256: 60b22c71128f10abc5e92dd8fed90ff6ca55b8382ba01e48d87faf1664746a31
      WV2_RT_VER: '109.0.1518.140'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build interface
        run: python lw3-desktop/build.py
        env:
          FZ_TEACHER_PASS: ${{ secrets.FZ_TEACHER_PASS }}
          FZ_REQUIRE_TEACHER_PASS: '1'

      - name: Version
        run: echo "FZ_VERSION=$(python -c "import json;print(json.load(open('lw3-desktop/src-tauri/tauri.conf.json',encoding='utf-8'))['version'])")" >> "$GITHUB_ENV"

      # открытый ключ лицензии (из генератора ключей кафедры, файл lw3-desktop/license-pubkey.txt) вшивается в программу; без него выпуск не собирается
      - name: License public key
        env:
          PK: ${{ vars.FZ_LICENSE_PUBKEY || secrets.FZ_LICENSE_PUBKEY }}
        run: |
          # главный источник — файл в репозитории (открытый ключ не секретный); переменная GitHub — запасной
          F=$(tr -d ' \r\n' < lw3-desktop/license-pubkey.txt 2>/dev/null || true); [ -n "$F" ] && PK="$F"
          [ ${#PK} -eq 64 ] || { echo "::error::нет открытого ключа лицензии: задайте переменную или секрет FZ_LICENSE_PUBKEY (64 шестнадцатеричных знака из генератора ключей)"; exit 1; }
          [[ "$PK" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::FZ_LICENSE_PUBKEY должен состоять из 64 шестнадцатеричных знаков"; exit 1; }
          echo "FZ_LICENSE_PUBKEY=$PK" >> "$GITHUB_ENV"

      - name: WebView2 SDK and Runtime 109
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -UseBasicParsing "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$env:WV2_SDK/microsoft.web.webview2.$env:WV2_SDK.nupkg" -OutFile sdk.zip
          if ((Get-FileHash sdk.zip -Algorithm SHA256).Hash -ne $env:WV2_SDK_SHA256) { throw 'Контрольная сумма WebView2 SDK не совпадает' }
          Expand-Archive sdk.zip -DestinationPath wv2sdk
          Invoke-WebRequest -UseBasicParsing $env:WV2_RT_URL -OutFile wv2rt.exe
          if ((Get-FileHash wv2rt.exe -Algorithm SHA256).Hash -ne $env:WV2_RT_SHA256) { throw 'Контрольная сумма WebView2 Runtime не совпадает' }
          $sig = Get-AuthenticodeSignature wv2rt.exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw "Подпись WebView2 Runtime неверна: $($sig.Status) $($sig.SignerCertificate.Subject)" }
          7z e -y -owv2a wv2rt.exe "MicrosoftEdge_X86_$env:WV2_RT_VER.exe*" | Out-Null
          $inner = Get-ChildItem wv2a | Select-Object -First 1
          7z e -y -owv2b $inner.FullName MSEDGE.7z | Out-Null
          7z x -y -owv2c wv2b/MSEDGE.7z | Out-Null
          $rt = "wv2c/Chrome-bin/$env:WV2_RT_VER"
          foreach ($f in @("msedgewebview2.exe", "msedge.dll", "EBWebView/x86/EmbeddedBrowserWebView.dll")) {
            $s = Get-AuthenticodeSignature "$rt/$f"
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw "Подпись $f неверна: $($s.Status)" }
          }
          New-Item -ItemType Directory -Force out/app | Out-Null
          Move-Item $rt out/app/WebView2Runtime
          "{0:N0} МБ" -f ((Get-ChildItem out/app/WebView2Runtime -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Build Fizpraktikum.exe (C++, 32 bit)
        run: |
          python lw3-desktop/win/pack.py lw3-desktop/dist lw3-desktop/win/app.pak
          SDK="$PWD/wv2sdk/build/native"
          cmake -S lw3-desktop/win -B build -A Win32 -DWEBVIEW2_SDK="$SDK" -DFZ_VERSION=$FZ_VERSION -DFZ_LICENSE_PUBKEY=$FZ_LICENSE_PUBKEY
          cmake --build build --config Release
          cmake -S lw3-desktop/win -B build-test -A Win32 -DWEBVIEW2_SDK="$SDK" -DFZ_VERSION=$FZ_VERSION -DFZ_TEST=ON
          cmake --build build-test --config Release
          cp build/Release/Fizpraktikum.exe out/app/Fizpraktikum.exe
          mkdir -p test-app && cp build-test/Release/Fizpraktikum.exe test-app/ && cp -r out/app/WebView2Runtime test-app/
          ls -la out/app build-test/Release

      # настоящая программа: запуск, команды, файлы, PDF, видео, регистрация, конспект, работа
      - name: Run the real app
        run: |
          npm install --no-save --package-lock=false playwright
          mkdir -p shots
          FZ_EXE="$PWD/test-app/Fizpraktikum.exe" SHOTS=shots node lw3-desktop/win/tests/e2e-win.mjs

      - name: Key generator
        run: |
          # генератор кафедры должен знать тот же открытый ключ, что вшит в программу
          grep -aqF "$FZ_LICENSE_PUBKEY" "license-generator/Генератор ключей.exe" || { echo "::error::Генератор ключей.exe собран под другой открытый ключ: пересоберите license-generator/win/build.sh"; exit 1; }
          grep -qF "'$FZ_LICENSE_PUBKEY'" "license-generator/Генератор ключей.html" || { echo "::error::в «Генератор ключей.html» другой EXPECTED_PK"; exit 1; }
          pwsh -NoProfile -File license-generator/win/shot.ps1 -Exe "license-generator/Генератор ключей.exe" -Out shots || echo "::warning::снимки генератора не сделаны"

      - name: Installer and portable
        run: |
          # NSIS: на сервере сборки может не быть — ставим из Chocolatey
          for d in "/c/Program Files (x86)/NSIS" "/c/Program Files/NSIS"; do [ -x "$d/makensis.exe" ] && export PATH="$PATH:$d"; done
          command -v makensis || { choco install nsis -y --no-progress > /dev/null; for d in "/c/Program Files (x86)/NSIS" "/c/Program Files/NSIS"; do [ -x "$d/makensis.exe" ] && export PATH="$PATH:$d"; done; }
          makensis -VERSION
          makensis -V2 -INPUTCHARSET UTF8 -DVERSION=$FZ_VERSION -DSRC="$(cygpath -w "$PWD/out/app")" -DOUT="$(cygpath -w "$PWD/out/Fizpraktikum-setup.exe")" lw3-desktop/win/installer.nsi
          mkdir -p portable && cp -r out/app portable/Fizpraktikum
          cp lw3-desktop/src-tauri/license.txt "portable/Fizpraktikum/Лицензионное соглашение.txt"
          (cd portable && 7z a -tzip -mx=7 ../out/Fizpraktikum-portable.zip Fizpraktikum > /dev/null)
          ls -la out

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-screenshots
          path: shots/*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Fizpraktikum-windows
          path: |
            out/*.exe
            out/*.zip

  release:
    needs: [windows]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/lw3-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Version
        id: ver
        run: echo "v=$(python3 -c "import json;print(json.load(open('lw3-desktop/src-tauri/tauri.conf.json',encoding='utf-8'))['version'])")" >> "$GITHUB_OUTPUT"
      # релиз с прямыми ссылками: после каждой сборки на main (тег lw3-v<версия> создаётся здесь же)
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lw3-v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Физпрактикум ${{ steps.ver.outputs.v }}
          make_latest: true
          files: |
            out/*.exe
            out/*.zip
          body: |
            **Физпрактикум** - виртуальный лабораторный практикум по физике (ЧВВМУ им. П.С. Нахимова, кафедра физики и общетехнических дисциплин): 14 лабораторных работ (в том числе 6 работ раздела «Физика атомного ядра и элементарных частиц»), конспекты и видеоуроки по 9 темам курса, справочник, тесты и экзамены по банку из 960 вопросов, кабинет преподавателя.

            **Windows 7, 8, 10, 11 (32 и 64 бита)**
            **Fizpraktikum-setup.exe** - установщик (без прав администратора, ярлыки в «Пуске» и на рабочем столе). Встроенный движок WebView2 входит в программу, интернет не нужен.
            **Fizpraktikum-portable.zip** - версия без установки: распакуйте папку и запустите Fizpraktikum.exe.
