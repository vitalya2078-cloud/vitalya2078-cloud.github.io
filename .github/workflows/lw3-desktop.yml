name: ЛР 3 — программа для Windows

# Сначала проверка (модель, полное прохождение в браузере), затем сборка на Windows:
# установщик NSIS (без прав администратора) и переносной .exe. Тег lw3-v* — ещё и релиз на GitHub.
on:
  push:
    branches: ['**']        # без этого фильтр tags отключает запуск по пушу в ветки
    paths:
      - 'lw3-desktop/**'
      - 'fizika2/src/lw3-core.js'
      - 'fizika2/src/labwork.js'
      - 'fizika2/src/app.js'
      - 'fizika2/src/icons.js'
      - 'fizika2/src/shell.html'
      - 'fizika2/tests/lw3-*'
      - '.github/workflows/lw3-desktop.yml'
    tags: ['lw3-v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

concurrency:
  group: lw3-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build interface
        run: python lw3-desktop/build.py

      - name: Model and calculations
        run: node fizika2/tests/lw3-model.test.mjs

      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Full lab run in the app interface
        run: |
          python -m http.server 4180 --directory lw3-desktop/dist > /tmp/lw3.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4180/ >/dev/null && break; sleep 1; done
          mkdir -p shots
          SHOTS=shots node lw3-desktop/tests/e2e.mjs

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lw3-screenshots
          path: shots/*.png
          if-no-files-found: ignore

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lw3-desktop/src-tauri -> target

      - name: Build interface
        run: python lw3-desktop/build.py

      - name: Build Windows app
        working-directory: lw3-desktop
        run: |
          npm ci --no-audit --no-fund
          npx tauri build

      - name: Collect files
        run: |
          mkdir -p out
          cp lw3-desktop/src-tauri/target/release/bundle/nsis/*.exe "out/Pokazatel-adiabaty-setup.exe"
          cp lw3-desktop/src-tauri/target/release/lw3-adiabata.exe "out/Pokazatel-adiabaty-portable.exe"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Pokazatel-adiabaty-windows
          path: out/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/lw3-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Показатель адиабаты ${{ github.ref_name }}
          files: out/*.exe
          body: |
            **Pokazatel-adiabaty-setup.exe** — установщик (ставится без прав администратора, ярлык в «Пуске»).
            **Pokazatel-adiabaty-portable.exe** — переносная версия: запускается без установки (нужен WebView2, в Windows 10/11 он обычно уже есть).
