/* =====================================================================
   «Показатель адиабаты» для Android: своя раскладка под телефон.
   Одна колонка, крупные кнопки внизу экрана (под большой палец), нижние листы вместо окон.
   Светлая тема по умолчанию; тёмная — в меню.
   ===================================================================== */
:root, [data-theme="light"]{
  color-scheme:light;
  --bg:#EEF0F3; --card:#FFFFFF; --card2:#F6F7F9; --line:#E1E4E9; --line2:#C9CED6;
  --tx:#14171C; --tx2:#454C57; --mute:#6E7682;
  --acc:#E4571B; --acc-tx:#FFFFFF; --acc-soft:rgba(228,87,27,.10);
  --cold:#1E6FD6; --cold-soft:rgba(30,111,214,.10);
  --ok:#128A52; --ok-soft:rgba(18,138,82,.10); --bad:#D2283C; --bad-soft:rgba(210,40,60,.09); --warn:#A86A0C; --warn-soft:rgba(200,130,20,.12);
  --sh:0 1px 2px rgba(20,23,28,.06), 0 6px 18px rgba(20,23,28,.06); --overlay:rgba(20,23,28,.45); --paper-bg:#DADDE3;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1013; --card:#181B20; --card2:#1F232A; --line:#2A2F37; --line2:#38404B;
  --tx:#ECEEF1; --tx2:#AEB4BE; --mute:#7D8590;
  --acc:#FF7A45; --acc-tx:#1C0C04; --acc-soft:rgba(255,122,69,.13);
  --cold:#58A6FF; --cold-soft:rgba(88,166,255,.13);
  --ok:#3DD68C; --ok-soft:rgba(61,214,140,.12); --bad:#FF5D6C; --bad-soft:rgba(255,93,108,.12); --warn:#F5B83D; --warn-soft:rgba(245,184,61,.12);
  --sh:0 8px 24px rgba(0,0,0,.35); --overlay:rgba(6,7,9,.72); --paper-bg:#262A31;
}
/* отступы под системные панели Android (вырез камеры, жесты) */
:root{ --st:max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px)); --sb:max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px)); }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; min-height:100%}
body{background:var(--bg); color:var(--tx); font:16px/1.5 "Golos UI", system-ui, sans-serif; -webkit-font-smoothing:antialiased; user-select:none; overscroll-behavior:none}
input,textarea{user-select:text}
button,input,textarea{font:inherit; color:inherit}
.ic{width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-4px}
.m{font-family:"F2 Math", serif; font-style:italic}
.mute{color:var(--mute)} .small{font-size:13.5px} .center{text-align:center}
b{font-weight:700}

/* ---------- верхняя панель и шаги ---------- */
#bar{position:sticky; top:0; z-index:20; background:var(--bg); padding:calc(var(--st) + 6px) 12px 8px}
#bar:empty{display:none}
.bar{display:flex; align-items:center; gap:6px; min-height:44px}
.bar h1{flex:1; min-width:0; margin:0; font-size:17px; font-weight:800; line-height:1.2}
.bar h1 small{display:block; font-size:12.5px; font-weight:600; color:var(--mute)}
.ib{width:44px; height:44px; border-radius:14px; border:0; background:transparent; display:grid; place-items:center; color:var(--tx2)}
.ib:active{background:var(--card2)}
.steps{display:grid; grid-template-columns:repeat(6, 1fr); gap:4px; margin-top:4px}
.steps button{height:6px; border:0; padding:0; border-radius:3px; background:var(--line)}
.steps button.done{background:var(--ok)} .steps button.cur{background:var(--acc)}

/* ---------- содержимое ---------- */
#main{padding:8px 14px calc(var(--dock, 96px) + var(--sb) + 16px); max-width:620px; margin:0 auto}
.card{background:var(--card); border-radius:20px; padding:16px; box-shadow:var(--sh); margin-bottom:12px}
.card h2{display:flex; align-items:center; gap:8px; margin:0 0 10px; font-size:17px}
.card h2 .tag{margin-left:auto}
.tag{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:99px; font-size:12.5px; font-weight:700; background:var(--card2); color:var(--tx2)}
.tag.ok{background:var(--ok-soft); color:var(--ok)} .tag.bad{background:var(--bad-soft); color:var(--bad)} .tag.warn{background:var(--warn-soft); color:var(--warn)} .tag.acc{background:var(--acc-soft); color:var(--acc)}
.lead{font-size:15px; color:var(--tx2); margin:0}

/* ---------- кнопки ---------- */
.btn{display:flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:12px 18px; border-radius:16px; border:0;
  background:var(--acc); color:var(--acc-tx); font-weight:700; font-size:16px; width:100%; text-align:center}
.btn:active{transform:scale(.985)} .btn:disabled{opacity:.45}
.btn.line{background:var(--card); color:var(--tx); box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn.soft{background:var(--card2); color:var(--tx)}
.btn.ok{background:var(--ok); color:#fff} .btn.bad{background:var(--bad); color:#fff}
.row{display:flex; gap:10px} .row > *{flex:1}
.stack{display:grid; gap:10px}
.lnk{background:none; border:0; color:var(--acc); font-weight:700; padding:6px 0; display:inline-flex; gap:6px; align-items:center}

/* нижняя панель действий */
#dock{position:fixed; left:0; right:0; bottom:0; z-index:20; padding:10px 14px calc(var(--sb) + 12px); background:linear-gradient(to top, var(--bg) 70%, transparent)}
#dock:empty{display:none}
#dock > div{max-width:620px; margin:0 auto; display:grid; gap:8px}
.say{margin:0 2px 2px; font-size:14.5px; color:var(--tx2); line-height:1.4}
.lw-msg{margin:0 2px; font-size:14px; font-weight:700} .lw-msg:empty{display:none} .lw-msg.bad{color:var(--bad)} .lw-msg.good{color:var(--ok)}

/* ---------- вход ---------- */
.login{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:calc(var(--st) + 24px) 18px calc(var(--sb) + 24px); max-width:520px; margin:0 auto}
.brand{text-align:center; margin-bottom:22px}
.logo{display:inline-grid; place-items:center; width:72px; height:72px; border-radius:22px; background:var(--acc); color:var(--acc-tx); font:italic 800 40px/1 "F2 Math", serif; box-shadow:0 10px 30px var(--acc-soft)}
.brand h1{margin:14px 0 2px; font-size:26px; font-weight:800} .brand p{margin:0; color:var(--mute)}
.field{display:grid; gap:6px; font-size:13.5px; font-weight:700; color:var(--tx2); margin-bottom:12px}
.inp{width:100%; min-height:52px; padding:12px 14px; border-radius:14px; border:1.5px solid var(--line2); background:var(--card); font-size:17px; outline:none}
.inp:focus{border-color:var(--acc)}
.inp::placeholder{color:var(--mute); opacity:.55; font-weight:400}
.inp.ok{border-color:var(--ok); background:var(--ok-soft)} .inp.bad{border-color:var(--bad); background:var(--bad-soft)}
textarea.inp{min-height:220px; line-height:1.5; font-size:15px; resize:vertical}
.plist{display:grid; gap:8px; margin-top:6px}
.prof{display:flex; align-items:center; gap:12px; padding:12px; border-radius:16px; background:var(--card); box-shadow:var(--sh); border:0; width:100%; text-align:left}
.prof .nm{flex:1; min-width:0} .prof b{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis} .prof small{color:var(--mute)}
.ava{display:grid; place-items:center; width:42px; height:42px; border-radius:14px; color:#14171C; font-weight:800; font-size:15px; flex:none}
.foot{display:flex; justify-content:space-between; align-items:center; margin-top:18px; color:var(--mute); font-size:13px}

/* ---------- вопросы ---------- */
.qn{display:flex; align-items:center; gap:8px; color:var(--mute); font-size:13.5px; font-weight:700; margin-bottom:8px}
.qn .dots{display:flex; gap:4px; margin-left:auto} .qn .dots i{width:8px; height:8px; border-radius:4px; background:var(--line)}
.qn .dots i.a{background:var(--tx2)} .qn .dots i.cur{background:var(--acc); width:18px} .qn .dots i.ok{background:var(--ok)} .qn .dots i.bad{background:var(--bad)}
.q{font-size:19px; font-weight:700; line-height:1.35; margin:0 0 14px}
.opts{display:grid; gap:10px}
.opt{display:flex; align-items:center; gap:12px; text-align:left; padding:14px; min-height:56px; border-radius:16px; border:1.5px solid var(--line); background:var(--card); font-size:15.5px; line-height:1.35}
.opt .lt{display:grid; place-items:center; width:30px; height:30px; border-radius:10px; background:var(--card2); font-weight:800; font-size:14px; flex:none}
.opt.pick{border-color:var(--acc); background:var(--acc-soft)} .opt.pick .lt{background:var(--acc); color:var(--acc-tx)}
.opt.ok{border-color:var(--ok); background:var(--ok-soft)} .opt.ok .lt{background:var(--ok); color:#fff}
.opt.bad{border-color:var(--bad); background:var(--bad-soft)} .opt.bad .lt{background:var(--bad); color:#fff}
.res-list{display:grid; gap:6px; margin:10px 0 0; padding:0; list-style:none}
.res-list li{display:flex; gap:8px; align-items:flex-start; font-size:14px; padding:8px 10px; border-radius:12px; background:var(--card2)}
.res-list li.bad{background:var(--bad-soft)} .res-list li button{margin-left:auto; flex:none}

/* ---------- установка ---------- */
.scene{position:relative; border-radius:20px; overflow:hidden; background:#0F2237; box-shadow:var(--sh); margin-bottom:12px}
.scene canvas{display:block; width:100%}
.scene.zoom canvas{width:auto; max-width:none}
.scene .zbtn{position:absolute; right:8px; top:8px; min-height:36px; width:auto; padding:6px 12px; font-size:13.5px; border-radius:12px; background:rgba(14,16,19,.7); color:#fff}
.live{display:grid; grid-template-columns:1fr 1fr 1.4fr; gap:8px; margin-bottom:12px}
.live div{background:var(--card); border-radius:16px; padding:10px 12px; box-shadow:var(--sh)}
.live small{display:block; color:var(--mute); font-size:12px; font-weight:700}
.live b{font-size:20px; font-variant-numeric:tabular-nums} .live div:last-child b{font-size:14.5px; line-height:1.3; display:block}
.sw{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px; background:var(--card); box-shadow:var(--sh); border:0; width:100%; text-align:left; min-height:64px}
.sw .nm{flex:1} .sw .nm small{display:block; color:var(--mute); font-size:13px}
.tog{width:52px; height:30px; border-radius:15px; background:var(--line2); position:relative; flex:none; transition:background .15s}
.tog::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:12px; background:#fff; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on .tog{background:var(--ok)} .sw.on .tog::after{left:25px} .sw.need .tog{background:var(--bad)}
.runs{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px}
.runs div{background:var(--card2); border-radius:14px; padding:8px 10px; font-size:13px}
.runs div.now{box-shadow:inset 0 0 0 2px var(--acc)} .runs div.ok{background:var(--ok-soft)}
.runs b{display:block; font-size:15px}
.bar2{height:10px; border-radius:5px; background:var(--card2); overflow:hidden; position:relative}
.bar2 > i{display:block; height:100%; width:0; background:var(--cold); border-radius:5px}
.bar2.zone::before{content:""; position:absolute; left:87.5%; width:4.2%; top:0; bottom:0; background:var(--ok); opacity:.45}
.hold{min-height:84px; font-size:19px; border-radius:22px; touch-action:none; -webkit-user-select:none; user-select:none}
.hold.pressed{background:var(--ok); color:#fff; transform:scale(.97)}
.read{display:grid; grid-template-columns:1fr auto; gap:8px} .read .btn{width:auto}

/* ---------- обработка ---------- */
.pv{display:grid; gap:4px; padding:12px 0; border-top:1px solid var(--line)} .pv:first-of-type{border-top:0}
.pv label{display:flex; align-items:baseline; gap:8px; font-weight:700} .pv label small{font-weight:600; color:var(--mute); margin-left:auto; font-size:13px}
.pv .f{font-size:13.5px; color:var(--mute)} .pv .hint{font-size:13.5px; color:var(--bad); font-weight:600}
.resv{font-size:22px; font-weight:800; text-align:center; padding:6px; color:var(--ok)}

/* ---------- отчёт ---------- */
.hero{text-align:center; padding:22px 16px} .hero .ic{width:44px; height:44px; color:var(--ok)}
.hero h2{justify-content:center; font-size:22px; margin:8px 0 4px} .hero p{margin:0; color:var(--tx2)}
.paper-wrap{background:var(--paper-bg); border-radius:16px; padding:10px; overflow:hidden}
.paper-wrap .lwr{transform-origin:0 0}
.paper-wrap .lwp{margin:0 0 10px !important}

/* ---------- нижний лист ---------- */
#sheet{position:fixed; inset:0; z-index:50; background:var(--overlay); display:flex; align-items:flex-end; justify-content:center}
#sheet[hidden]{display:none}
.sbox{width:100%; max-width:680px; max-height:92vh; background:var(--bg); border-radius:24px 24px 0 0; display:flex; flex-direction:column; animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px); opacity:.4}}
.sbox header{display:flex; align-items:center; gap:8px; padding:8px 8px 6px 18px}
.sbox header h2{flex:1; margin:0; font-size:18px; display:flex; gap:8px; align-items:center}
.sbox .grab{width:40px; height:5px; border-radius:3px; background:var(--line2); margin:8px auto 0}
.sbody{overflow:auto; padding:4px 16px 16px; -webkit-overflow-scrolling:touch}
.sact{padding:8px 16px calc(var(--sb) + 14px); display:grid; gap:8px}
.sact:empty{display:none}
.tabs{display:flex; gap:6px; margin-bottom:12px; overflow-x:auto}
.tabs button{border:0; border-radius:12px; padding:9px 14px; background:var(--card2); font-weight:700; white-space:nowrap}
.tabs button.on{background:var(--acc); color:var(--acc-tx)}
.txt p{margin:0 0 10px; line-height:1.55}
.menu{display:grid; gap:8px}
.menu button{display:flex; align-items:center; gap:14px; padding:14px; border-radius:16px; border:0; background:var(--card); text-align:left; font-weight:700; min-height:56px}
.menu button small{display:block; font-weight:500; color:var(--mute); font-size:13px}
.hod{counter-reset:h; list-style:none; padding:0; margin:0; display:grid; gap:6px}
.hod li{display:flex; gap:10px; padding:10px 12px; border-radius:14px; background:var(--card); font-size:14.5px; line-height:1.45}
.hod li i{font-style:normal; font-weight:800; color:var(--mute); min-width:20px}
.hod li.cur{box-shadow:inset 0 0 0 2px var(--acc); background:var(--acc-soft)} .hod li.cur i{color:var(--acc)}
.slide{text-align:center; padding:8px 4px 4px} .slide .big{font-size:52px; line-height:1} .slide h3{font-size:21px; margin:10px 0 6px} .slide p{color:var(--tx2); margin:0}
.isteps{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; text-align:left}
.isteps div{background:var(--card); border-radius:14px; padding:10px; font-size:13.5px} .isteps b{display:block; font-size:15px}
.sdots{display:flex; gap:6px; justify-content:center; margin:14px 0 4px} .sdots i{width:8px; height:8px; border-radius:4px; background:var(--line2)} .sdots i.on{background:var(--acc); width:20px}

/* сводка «Что рассказать на защите» (общая с программой для Windows) */
.sum{display:grid; gap:10px; font-size:15px; line-height:1.55}
.sum section{background:var(--card); border-radius:16px; padding:12px 14px}
.sum h3{display:flex; gap:8px; align-items:center; margin:0 0 6px; font-size:15.5px} .sum p{margin:0}
.sum .pill{display:inline-flex; gap:6px; align-items:center; padding:6px 10px; border-radius:12px; background:var(--warn-soft); color:var(--warn); font-weight:700; font-size:13.5px}
.tt{border-collapse:collapse; width:100%; font-size:14px} .tt th{font-size:12px; color:var(--mute); text-align:left; font-weight:700; padding:6px 4px; border-bottom:1px solid var(--line)}
.tt td{padding:7px 4px; border-bottom:1px solid var(--line)} .tt td.n{text-align:right; font-variant-numeric:tabular-nums}
.sum-qa{list-style:none; padding:0; margin:0} .sum-qa li{padding:8px 0; border-bottom:1px solid var(--line)} .sum-qa li:last-child{border:0} .sum-qa span{display:block; color:var(--tx2)}

/* ---------- уведомления ---------- */
#toasts{position:fixed; left:12px; right:12px; bottom:calc(var(--dock, 0px) + var(--sb) + 8px); z-index:60; display:grid; gap:8px; pointer-events:none; justify-items:center}
.toast{max-width:560px; width:100%; padding:12px 16px; border-radius:16px; background:var(--tx); color:var(--bg); font-weight:600; font-size:14.5px; box-shadow:var(--sh); animation:up .2s ease-out}
.toast.bad{background:var(--bad); color:#fff}


/* ---------- Физпрактикум: выбор работы, экраны ЛР 1 и ЛР 2 ---------- */
:root{--text:var(--tx); --mint:var(--ok); --blue:var(--cold); --gold:var(--acc); --pink:var(--bad); --violet:#9B7BFF; --ui:"Golos UI", system-ui, sans-serif; --serif:"F2 Math", serif; --r:16px; --on-accent:var(--acc-tx); --bg2:var(--card2)}
.labs-m{padding:calc(var(--st) + 14px) 0 calc(var(--sb) + 20px)}
.labs-mh{display:flex; align-items:center; gap:12px; margin:0 2px 16px} .labs-mh h1{margin:0; font-size:22px} .labs-mh p{margin:0; color:var(--mute); font-size:14px} .labs-mh div{flex:1}
.logo.sm{width:48px; height:48px; border-radius:15px; font-size:28px}
.labm{display:flex; gap:14px; align-items:flex-start; width:100%; text-align:left; padding:16px; margin-bottom:10px; border-radius:20px; border:0; background:var(--card); box-shadow:var(--sh)}
.labm-ic{flex:none; width:48px; height:48px; border-radius:14px; display:grid; place-items:center; background:var(--acc-soft); color:var(--acc)} .labm-ic .ic{width:26px; height:26px}
.labm.done .labm-ic{background:var(--ok-soft); color:var(--ok)}
.labm div{flex:1; min-width:0; display:grid; gap:3px} .labm small{color:var(--acc); font-weight:800} .labm b{font-size:16.5px; line-height:1.3} .labm span{color:var(--mute); font-size:13.5px} .labm em{font-style:normal; font-weight:700; color:var(--ok); font-size:14px}
.labm-bar{display:block; height:6px; border-radius:3px; background:var(--card2); overflow:hidden; margin-top:6px} .labm-bar i{display:block; height:100%; background:var(--acc)} .labm.done .labm-bar i{background:var(--ok)}
.slab{display:grid; gap:12px; grid-template-columns:minmax(0,1fr)} .slab > *{min-width:0} .slab .card{margin:0} .slab .h{display:block; font-weight:800; font-size:16px; margin-bottom:6px}
.slab .lw-stage{background:var(--bg); padding-bottom:6px; margin:0 -14px; padding-left:14px; padding-right:14px}
.slab #lw-cv, .slab #l2-cv{width:100%}
.slab #le-cv{display:block; width:100%; aspect-ratio:580/452; height:auto; border-radius:16px; border:1px solid rgba(128,140,160,.3)}
.slab.live #le-cv{max-height:calc(100vh - 210px); object-fit:contain}
.lw-screw.le-knob{flex-wrap:wrap; gap:6px} .lw-screw.le-knob span{flex:1 1 100%} .lw-screw.le-knob b{min-width:76px; font-size:18px; text-align:center} .lw-screw.le-knob .lp-btn{flex:1 1 0; width:auto; min-width:40px; padding:0 4px; font-size:13px}
.lw-stage:has(#le-cv) .lw-ctl-row{flex-wrap:wrap} .lw-stage:has(#le-cv) .lw-ctl-row > .btn{flex:1 1 auto}
.lw-ctl-row.le-rec{flex-wrap:wrap} .lw-ctl-row.le-rec label{flex:1 1 96px} .lw-ctl-row.le-rec .btn{flex:1 1 120px}
.slab .lw-stage:has(#le-cv){position:static; margin:0; padding:0; background:none}
.le-knob{flex-wrap:wrap; gap:6px} .le-knob span{flex:1 1 100%} .le-knob b{min-width:76px; font-size:18px} .le-knob .lp-btn{flex:1 1 0; width:auto; min-width:44px; padding:0 4px; font-size:13px}
.seg.wrap{flex-wrap:wrap} .seg.wrap button{flex:1 1 auto} .seg button.ok{outline:2px solid var(--ok, #3DD6A0)} .seg button.bad{outline:2px solid var(--bad, #FF6B8B)}
.lw-row.three label{flex:1 1 90px}
.slab .btn{min-height:48px} .slab .btn.wide{width:100%} .slab .mt{margin-top:10px}
.slab .lw-msg{font-size:14px; font-weight:700; margin:6px 2px}
.slab .lwi{min-height:46px; font-size:16px}
.card .lw-ta.inp{width:100%; min-height:240px}
.field .inp.lwi{min-height:52px}
/* ---------- отчёт: печать ---------- */
#printroot{display:none}
.lwr-tools{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap}
.lwr{display:grid; gap:16px}
.lwp{background:#fff; color:#111; font:14px/1.45 "Times New Roman", "STIX Two Text", serif; padding:28px 30px; border-radius:6px; box-shadow:0 6px 24px rgba(0,0,0,.35); max-width:800px; margin:0 auto; width:100%; box-sizing:border-box}
.lwp .c{text-align:center}.lwp .b{font-weight:700}.lwp .mt2{margin-top:22px}.lwp hr{border:0; border-top:1px solid #000; margin:10px 0}
.lwp .row{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; margin:10px 0}
.lwp .ul{display:inline-block; border-bottom:1px solid #000; padding:0 4px; min-height:1.2em; flex:1 1 40%}
.lwp .ul.s{flex:0 0 3.2em; text-align:center}.lwp .ul.m{flex:0 0 9em; text-align:center}
.lwp table{width:100%; border-collapse:collapse; margin:8px 0; font-size:12.5px}
.lwp th,.lwp td{border:1px solid #000; padding:4px 5px; text-align:center}.lwp td.l{text-align:left}
.lwp .small{font-size:12.5px}.lwp .fm p{margin:4px 0; font-style:italic}.lwp .concl{min-height:120px; white-space:normal}
.lwp .sign{margin-top:28px}
.lwr-svg{display:block; width:100%; height:auto; margin:6px 0}
.lwp table.tight{font-size:11.5px; margin:5px 0}.lwp table.tight th,.lwp table.tight td{padding:2px 4px}
.lwp p.small{margin:4px 0}
.lwp .lwr-svg.scheme{width:62%; margin:2px auto}
.seg{display:flex; background:var(--bg2); border-radius:14px; padding:4px; gap:2px}
.seg button{flex:1; border:0; background:none; padding:9px 4px; border-radius:11px; font:600 13.5px var(--ui); color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--card2); color:var(--text)}
.lp-btn{width:52px;height:46px;flex:0 0 52px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:600 24px/1 var(--ui);touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .08s,background .15s}
.lp-btn:active{transform:scale(.94);background:#25315a}
.lw-pucks{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; margin:10px 0}
.lw-pucks button{display:grid; justify-items:center; gap:2px; padding:10px 2px; border-radius:14px; border:1.5px solid var(--line); background:var(--bg2); color:var(--text)}
.lw-pucks button b{font-size:18px}.lw-pucks button small{color:var(--mute); font-size:12px}.lw-pucks button i{font-style:normal; font-size:10.5px; font-weight:700}
.lw-pucks button.p1{border-color:#6C8CFF; background:rgba(108,140,255,.15)}.lw-pucks button.p1 i{color:#9DB2FF}
.lw-pucks button.p2{border-color:#FF7A59; background:rgba(255,122,89,.15)}.lw-pucks button.p2 i{color:#FFB199}
.lw-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:8px}.lw-row label{flex:1 1 130px; display:grid; gap:5px; font-size:13px; color:var(--mute)}
.lwi{width:100%; min-width:0; box-sizing:border-box; padding:9px 10px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg2); color:var(--text); font:600 15px var(--ui); font-variant-numeric:tabular-nums}
.lwi:focus{outline:none; border-color:var(--blue)} .lwi.ok{border-color:var(--mint); background:rgba(61,214,160,.08)} .lwi.bad{border-color:var(--pink); background:rgba(255,107,139,.08)}
.lw-ta{width:100%; box-sizing:border-box; padding:12px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg2); color:var(--text); font:500 14.5px/1.5 var(--ui); resize:vertical}
.lw-stage{position:sticky; top:0; z-index:5; background:var(--bg); padding-bottom:4px}
#lw-cv{display:block; width:min(100%, calc(52vh * 580 / 440)); margin:0 auto; aspect-ratio:580/452; height:auto; border-radius:16px; border:1px solid var(--line); touch-action:none; cursor:crosshair}
.lw-hint{margin:6px 2px 0; font-size:12.5px; color:var(--mute); display:flex; gap:6px; align-items:center}.lw-hint .ic{width:15px; height:15px; flex:none}
.lw-screw{display:flex; align-items:center; gap:10px; margin-top:10px}.lw-screw span{flex:1; font-size:14px; color:var(--mute)}.lw-screw b{font:800 22px var(--ui); min-width:24px; text-align:center}
.lw-screw .lp-btn{width:46px; height:42px; flex:0 0 46px}
.lw-scroll{overflow-x:auto}
.lw-tbl{width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums}
.lw-tbl th{font:600 12px var(--ui); color:var(--mute); text-align:left; padding:6px 6px; border-bottom:1px solid var(--line)}
.lw-tbl td{padding:6px; border-bottom:1px solid var(--line); vertical-align:top}
.lw-tbl tr.now td{background:rgba(108,140,255,.08)} .lw-tbl tr.sum td{font-size:12px; color:var(--mute)}
.lw-tbl tr.sum .lwi{margin-top:4px; font-size:14px}
.lw-tbl.wide{min-width:620px}
.lw-tbl td .lwi{padding:6px 7px; font-size:14px}
.lw-aim{display:flex; gap:6px; margin-top:8px; align-items:stretch}
.lw-aim button{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:0 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--text); font:600 14px var(--ui); touch-action:manipulation}
.lw-aim > button{flex:1 1 0; min-width:0; white-space:nowrap}
.lw-aim > button .ic{width:17px; height:17px; color:#E5484D}
.lw-aim button:active{background:var(--card2)}
.lw-arrows{display:grid; grid-template-columns:repeat(4,44px); gap:4px}
.lw-arrows button{padding:0}
.lw-arrows .ic{width:20px; height:20px}
.lw-row.three label{flex:1 1 90px}
.lw-pucks button.p3{border-color:#C46A45; background:rgba(196,106,69,.16)}.lw-pucks button.p3 i{color:#F0A27F}
.lw-who{display:block; font-size:11.5px; color:var(--gold); line-height:1.3}
.lw-ctl{margin-top:8px; display:grid; gap:6px}
.lw-ctl-row{display:flex; gap:6px; align-items:flex-end}
.lw-ctl-row label{flex:1 1 0; min-width:0; display:grid; gap:3px; font-size:12px; font-weight:600; color:var(--mute)}
.lw-ctl-row .lwi{min-height:44px; padding:6px 10px; font-size:16px}
.lw-ctl-row .btn{flex:0 0 auto; min-height:44px; padding:0 14px; font-size:14.5px}
.lw-ctl-row.four label{flex:1 1 0}
.lw-ctl .btn.wide{min-height:46px; margin:0}
.lw-ctl .lw-msg{margin:0; font-size:13px; min-height:0}
.lw-ctl .lw-msg:empty{display:none}
.lw-stage + .lw-hint{margin-top:0}
#l2-cv{display:block; width:min(100%, calc(52vh * 580 / 452)); margin:0 auto; aspect-ratio:580/452; height:auto; border-radius:16px; border:1px solid var(--line)}
.l2-cal{display:block; width:100%; aspect-ratio:580/200; height:auto; margin:10px 0 4px; border-radius:12px; border:1px solid var(--line)}
.lw-res{margin:10px 0 0; padding:10px 12px; border-radius:10px; background:rgba(90,211,160,.1); border:1px solid rgba(90,211,160,.4); font:700 16px var(--ui); color:var(--mint)}
@media print{
  @page{size:A4; margin:12mm}
  html,body{background:#fff !important; min-height:0}
  #bar,#main,#dock,#sheet,#toasts{display:none !important}
  #printroot{display:block}
  .lwr{display:block} .lwp{box-shadow:none; border-radius:0; padding:0; max-width:none; page-break-after:always; break-after:page}
  .lwp:last-child{page-break-after:auto; break-after:auto}
}
</style>
</head>

<footer id="dock"></footer>

<div id="printroot" class="lwr"></div>
<input type="file" id="file-in" hidden>

    { const [a, b] = P(F.w, -10); c.fillStyle = '#F2B544'; c.fillText('x, мм', a - 6, b + 4); c.fillStyle = lwTx(); }
    c.textAlign = 'right'; c.textBaseline = 'middle'; for (let y = 0; y < F.h; y += 50) { const [a, b] = P(-10, y); c.fillText(y, a - 4, b); }
    { const [a, b] = P(-10, F.h); c.fillStyle = '#F2B544'; c.fillText('y, мм', a - 3, b); } }

    const sp = LWV.anim && LWV.anim.t < .06 ? 1.25 : 1; for (let k = 0; k <= 12; k++) { const [a] = P(-41 + k * 1.8 * sp, 0); const [, t] = P(0, y0 + 5), [, bt] = P(0, y0 - 5); c.moveTo(a, t); c.lineTo(a + 1.3 * s, bt); } c.stroke(); }

    g.addColorStop(0, '#F3D17A'); g.addColorStop(1, '#8E6A1E'); c.fillStyle = g; if (!spL) { c.beginPath(); c.arc(a, b, r, 0, 7); c.fill(); }

    if (!fine) { c.fillStyle = lwTx(); c.font = `700 ${Math.max(9, 4.6 * s)}px "Golos UI", system-ui`; c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText('винт ' + S.screw, P(-58, 0)[0], P(0, y0 - 26)[1] + 3); } }

function lwAnimate(shot, done) {
  cancelAnimationFrame(LWV.raf); const t0 = performance.now(), slow = .55;
  LWV.anim = { t: 0 };

function lwAutoConcl(O) {
  const o = O[2], dP = Math.abs(o.px1 - o.px0) / o.px0 * 100;

  const okP = dP <= relMax * 1.5;
  return `Цель работы — проверить выполнение законов сохранения импульса и энергии при соударении двух тел примерно одинаковой массы (m₁ = ${f1(o.m1 * 1000, 1)} г, m₂ = ${f1(o.m2 * 1000, 1)} г). ` +
    `Проекция импульса на ось X до удара m₁√l₀ = ${lwF(o.px0, 3)} кг·мм^½, после удара — ${lwF(o.px1, 3)} кг·мм^½ (расхождение ${lwF(dP, 1)} %); проекция на ось Y после удара ${lwF(o.py1, 3)} кг·мм^½ при нуле до удара. ` +
    `С учётом погрешности измерений (≈ ${lwF(relMax, 1)} %) закон сохранения импульса ${okP ? 'выполняется' : 'выполняется хуже ожидаемого — вероятно, мешает трение во время удара и разброс силы удара'}. ` +
    `Коэффициент восстановления энергии k = ${lwF(o.k, 2)} < 1: удар не абсолютно упругий, часть кинетической энергии перешла во внутреннюю (деформация, нагрев). ` +
    `Наибольшая относительная погрешность измерения координат — ${lwF(relMax, 1)} %; точнее всего нужно измерять пути после удара (короткие отрезки), а точность начальных координат можно не повышать.`;
}

/* График на миллиметровке бланка: векторы перемещений шайб */
function lwGraphSvg(o) {
  const W = 520, x0 = 30, y0 = 150, mx = Math.max(o.l0, o.dx1, o.dx2, 1), my = Math.max(Math.abs(o.dy1), Math.abs(o.dy2), 1);

  const arr = (dx, dy, col, t, dash) => { const X = x0 + dx * sc, Y = y0 - dy * sc; return `<line x1="${x0}" y1="${y0}" x2="${X}" y2="${Y}" stroke="${col}" stroke-width="2.4" ${dash ? 'stroke-dasharray="7 4"' : ''}/><circle cx="${X}" cy="${Y}" r="3.5" fill="${col}"/><text x="${X + 6}" y="${Y + (dy >= 0 ? -6 : 14)}" font-size="13" font-weight="700" fill="${col}">${t}</text>`; };
  const legend = [['#000', 'l₀ — тело 1 без мишени', 1], ['#1f4fd8', 'l₁ — тело 1 после удара'], ['#c0392b', 'l₂ — тело 2 после удара']]
    .map(([c, t, d], i) => `<line x1="${40 + (i % 3) * 165}" y1="${308 + Math.floor(i / 3) * 16}" x2="${62 + (i % 3) * 165}" y2="${308 + Math.floor(i / 3) * 16}" stroke="${c}" stroke-width="2.4" ${d ? 'stroke-dasharray="6 3"' : ''}/><text x="${67 + (i % 3) * 165}" y="${312 + Math.floor(i / 3) * 16}" font-size="11">${t}</text>`).join('');
  return `<svg class="lwr-svg" viewBox="0 0 540 340">${grid}<line x1="${x0}" y1="${y0}" x2="530" y2="${y0}" stroke="#666" stroke-width=".8"/><line x1="${x0}" y1="10" x2="${x0}" y2="290" stroke="#000"/><text x="515" y="${y0 + 16}" font-size="12">x</text><text x="${x0 + 6}" y="22" font-size="12">y</text>
    ${arr(o.l0, 0, '#000', 'l₀', true)}${arr(o.dx1, o.dy1, '#1f4fd8', 'l₁')}${arr(o.dx2, o.dy2, '#c0392b', 'l₂')}${legend}</svg>`;
}

/* ---------- обработка ---------- */
function l2Calc() {
  const S = L2S, r = lwNum(S.rr), h = lwNum(S.rh), g = L2.g;
  const one = row => { const m = row.m, t = row.rt, e = 2 * h / (r * t * t), J = m * r * r * (g * t * t / (2 * h) - 1); return { m, t, e, J, M: J * e }; };
  const a = S.runs.map(one), b = S.ex2.map(one)[0], N = a.length, mean = f => a.reduce((s, x) => s + x[f], 0) / N;
  const o = { r, h, a, b, em: mean('e'), Jm: mean('J'), Mm: mean('M') };
  o.dJ = Math.sqrt(a.reduce((s, x) => s + (o.Jm - x.J) ** 2, 0) / (N * (N - 1))); o.dl = o.dJ / o.Jm * 100;
  a.forEach((x, i) => { o['e' + (i + 1)] = x.e; o['J' + (i + 1)] = x.J; o['M' + (i + 1)] = x.M; });
  if (b) { o.e4 = b.e; o.J4 = b.J; o.M4 = b.M; }
  return o;
}
const L2_TABLES = { 1: ['e1', 'J1', 'M1', 'e2', 'J2', 'M2', 'e3', 'J3', 'M3', 'em', 'Jm', 'Mm', 'dJ', 'dl'], 2: ['e4', 'J4', 'M4'] };

}

  const t1 = `<section class="card"><b class="h">Таблица 1. Вычисления (опыт 1)</b><p class="mute small">r = ${S.rr} м, h = ${S.rh} м, g = 9,81 м/с². ε = 2h/(rt²); J = mr²(gt²/(2h) − 1); M = Jε. Числа — не меньше трёх значащих цифр (например 0,0331).</p>

    ${o.a.map((x, i) => `<tr><td>${i + 1}</td><td>${l2Fix(x.m, 3)}</td><td>${l2Fix(x.t, 3)}</td><td>${I('e' + (i + 1))}</td><td>${I('J' + (i + 1))}</td><td>${I('M' + (i + 1))}</td></tr>`).join('')}
    <tr class="sum"><td colspan="3">Средние значения</td><td>⟨ε⟩ ${I('em')}</td><td>⟨J⟩ ${I('Jm')}</td><td>⟨M⟩ ${I('Mm')}</td></tr></table></div>
    <div class="lw-row"><label>Средняя квадратичная погрешность ⟨ΔJ⟩ = √(Σ(⟨J⟩ − Jᵢ)²/(N(N − 1))), кг·м² ${I('dJ')}</label><label>Относительная δ = ⟨ΔJ⟩/⟨J⟩·100, % ${I('dl')}</label></div>

document.addEventListener('input', e => {
  const el = e.target.closest && e.target.closest('.l2i'); if (!el || !L2S) return;
  const k = el.dataset.k2;
  if (k.startsWith('p_')) { L2S.proc[k.slice(2)] = el.value; delete L2S.procOk[k.slice(2)]; el.classList.remove('ok', 'bad'); }
  else if (k === 'cm') L2S.cur.rm = el.value; else if (k === 'ct') L2S.cur.rt = el.value;
  else L2S[k] = el.value;
  l2Save();
});
function l2Go(i) { L2S.step = Math.max(0, Math.min(i, L2S.max)); l2Save(); render(); ui.main.scrollTop = 0; }
function l2Advance() { L2S.max = Math.max(L2S.max, L2S.step + 1); L2S.step++; L2S.wound = false; l2Save(); render(); ui.main.scrollTop = 0; }
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-l2]'); if (!b) return; const S = l2Load(), d = b.dataset;
  switch (d.l2) {
    case 'go': l2Go(+d.v); break;
    case 'next': l2Advance(); break;
    case 'admit': S.admit[d.q] = d.v; S.admitChecked = false; l2Save(); render(); break;
    case 'admitCheck': { const n = L2_ADMIT.filter(([, a], i) => S.admit[i] === a).length; S.admitChecked = true; S.admitOk = n >= 6; l2Save(); render();
      toast(S.admitOk ? `Допуск сдан: ${n} из 8` : `Верно ${n} из 8 — нужно 6. Перечитай теорию и попробуй снова.`, S.admitOk ? '' : 'bad'); break; }
    case 'pul': S.pul = +d.v; S.prepOk = false; l2Save(); render(); break;
    case 'l1': S.l1 = Math.max(L2.lMin, Math.min(L2.lMax, S.l1 + +d.d)); S.prepOk = false; l2Save(); render(); break;
    case 'prepCheck': {
      const dTrue = S.d[S.pul - 1], bad = [];
      if (!(Math.abs(lwNum(S.rd) - dTrue) <= .051)) bad.push('диаметр d — прочитай по штангенциркулю: целые миллиметры до нуля нониуса, десятые — по совпавшему штриху');
      else if (!(Math.abs(lwNum(S.rr) - dTrue / 2000) <= .00006)) bad.push('радиус r — это половина диаметра, переведённая в метры');
      if (!(Math.abs(lwNum(S.rl1) - S.l1 / 100) <= .0006)) bad.push(`l — ${S.l1} см нужно записать в метрах`);
      if (!(Math.abs(lwNum(S.rh) - S.h) <= .0011)) { S.hTries = (S.hTries || 0) + 1; bad.push(S.hTries >= 3 ? `h — подсказка: около ${l2Fix(Math.round(S.h * 1000) / 1000, 3)} м` : 'h — посмотри в лупу, где жёлтая линия (низ груза) пересекает шкалу; 1 деление = 1 мм'); }
      if (bad.length) { l2Save(); lwMsg('Не совпадает: ' + bad.join('; ') + '.', 1); break; }
      S.prepOk = true; S.wound = false; S.plates = 0; l2Save(); render(); toast('Подготовка выполнена'); break;
    }
    case 'pl': if (!S.wound) { S.plates = Math.max(0, Math.min(L2.maxPlates, S.plates + +d.d)); l2Save(); render(); } break;
    case 'l2': if (!S.wound && !S.ex2.length) { S.l2 = Math.max(L2.lMin, Math.min(L2.lMax, S.l2 + +d.d)); l2Save(); render(); } break;
    case 'wind': {
      const st = l2St();
      if (st === 'exp1' && S.runs.length && S.plates <= S.runs[S.runs.length - 1].plates) { lwMsg('Увеличь массу груза: в каждом следующем пуске она должна быть больше.', 1); break; }
      if (st === 'exp2') {
        if (Math.abs(S.l2 - S.l1) < 3) { lwMsg(`Передвинь цилиндры хотя бы на 3 см от прежних ${S.l1} см — иначе момент инерции почти не изменится.`, 1); break; }
        if (!(Math.abs(lwNum(S.rl2) - S.l2 / 100) <= .0006)) { lwMsg(`Запиши новое l в метрах: ${S.l2} см = ? м.`, 1); break; }
      }
      S.wound = true; L2V.s = 0; L2V.tShow = null; l2Save(); render(); break;
    }
    case 'go1': {
      if (!S.wound || L2V.anim) break; const st = l2St(), run = l2Run(S, S.plates, st === 'exp2' ? S.l2 : S.l1);
      b.disabled = true; lwMsg('Груз опускается…');
      l2Animate(run, () => { S.wound = false; S.cur = { exp: st === 'exp2' ? 2 : 1, m: run.m, t: run.t, plates: S.plates, rm: '', rt: '' }; l2Save(); render(); });
      break;
    }
    case 'record': {
      const cur = S.cur; if (!cur) break; const bad = [];
      if (!(Math.abs(lwNum(cur.rm) - cur.m) <= .0005)) bad.push(`m — масса груза ${f1(cur.m * 1000, 0)} г в килограммах`);
      if (!(Math.abs(lwNum(cur.rt) - cur.t) <= .0015)) bad.push('t — перепиши показание секундомера (три знака после запятой)');
      if (bad.length) { lwMsg('Не совпадает: ' + bad.join('; ') + '.', 1); break; }
      (cur.exp === 2 ? S.ex2 : S.runs).push({ m: cur.m, rt: lwNum(cur.rt), plates: cur.plates });
      S.cur = null; if (cur.exp === 1 && S.plates < L2.maxPlates) S.plates++; l2Save(); render(); toast('Записано'); break;
    }
    case 'pcheck': { const o = l2Calc(), keys = L2_TABLES[d.v]; let bad = 0;
      keys.forEach(k => { const ok = l2Ok(k, lwNum(S.proc[k]), o); S.procOk[k] = ok; if (!ok) bad++; }); l2Save(); render();
      toast(bad ? `Таблица ${d.v}: ошибок — ${bad}. Красные ячейки пересчитай.` : `Таблица ${d.v} заполнена верно`, bad ? 'bad' : ''); break; }
    case 'reconcl': S.concl = l2AutoConcl(l2Calc()); l2Save(); render(); break;
    case 'cq': S.cq[d.q] = d.v; S.cqChecked = false; l2Save(); render(); break;
    case 'cqCheck': { const n = L2_CQ.filter(([, a], i) => S.cq[i] === a).length; S.cqChecked = true; S.cqOk = n >= 6; l2Save(); render();
      toast(S.cqOk ? `Защита: ${n} из ${L2_CQ.length}` : `Верно ${n} из ${L2_CQ.length} — нужно 6.`, S.cqOk ? '' : 'bad');
      if (S.cqOk && !S.done) { S.done = true; l2Save(); addXP(100, 'Лабораторная работа'); } break; }
    case 'print': window.print(); break;
    case 'restart': if (confirm('Начать лабораторную работу № 2 заново? Записи и таблицы будут очищены.')) { L2S = l2Fresh(); l2Save(); location.hash = 'lw-2'; render(); } break;
  }
});

/* =====================================================================
   ЛР № 3 — ядро работы, общее для сайта (labwork3.js) и программы для Windows
   (lw3-desktop/): модель установки, сцена, вопросы, расчёты и проверки, действия
   (data-l3 / data-k3), отчёт. Экраны каждая оболочка рисует сама.
   Ждёт от оболочки: $, esc, f1, ic, toast, render, ui.main, addXP, lwMsg, lwNum, lwGauss, lwShuf, LW_LIST.

   ЛР № 3. Определение показателя адиабаты (метод Клемана — Дезорма).
   Как на занятии: допуск → подготовка (питание секундомера, краны) → 3 опыта
   (накачка до 210–220 мм, 1 мин, h₁; выпуск через K₀ и закрытие, 1 мин, h₂)
   → обработка (γ = h₁/(h₁ − h₂), ⟨γ⟩ ± ⟨Δγ⟩, сравнение с γ_T) → выводы → отчёт (PDF).
   Модель газа в баллоне: масса m, относительная температура θ, давление p (мм вод. ст.);
   сжатие и выпуск — адиабатно, теплообмен со стенками — с постоянной времени τ.
   ===================================================================== */

const L3 = {
  steps: [['admit', 'Допуск'], ['prep', 'Подготовка'], ['exp', 'Опыты'], ['proc', 'Обработка'], ['concl', 'Выводы'], ['report', 'Отчёт']],
  N: 3, P0: 10330, g: 1.4, tauH: 9, tauO: .11, pump: 46, wait: 60, speed: 12
};
let L3_KEY = 'f2-lw3';   // десктоп подставляет ключ своего профиля
let L3S = null;
/* Параметры установки у каждого студента свои (случайные при начале работы, хранятся в его работе),
   чтобы h₁, h₂ и ⟨γ⟩ у соседей отличались и списать было нельзя:
   g — «истинный» показатель адиабаты воздуха в баллоне (влажность, примеси), kH — теплообмен со стенками, kO — скорость выпуска. */
const l3Par = () => ({ g: +(1.372 + Math.random() * .046).toFixed(3), kH: +(.8 + Math.random() * .5).toFixed(2), kO: +(.8 + Math.random() * .5).toFixed(2) });
function l3Fresh() {
  return { v: 1, par: l3Par(), step: 0, max: 0, admit: {}, admitOk: false, power: false, kOpen: false, k0Open: true, prepOk: false,
    zero: 200 + Math.round((Math.random() - .5) * 6), runs: [], proc: {}, procOk: {}, concl: '', cq: {}, cqOk: false,
    fio: '', group: '', date: new Date().toLocaleDateString('ru-RU'), done: false };
}
function l3Load() { if (L3S) return L3S; try { L3S = JSON.parse(localStorage.getItem(L3_KEY) || 'null'); } catch (e) { L3S = null; } if (!L3S || L3S.v !== 1) L3S = l3Fresh(); if (!L3S.par) L3S.par = l3Par(); return L3S; }
function l3Save() { try { localStorage.setItem(L3_KEY, JSON.stringify(L3S)); } catch (e) {} }
const l3St = () => L3.steps[l3Load().step][0];
const l3Fix = (v, d) => Number.isFinite(v) ? v.toFixed(d).replace('.', ',') : '—';
const l3Res = o => o.dg < .01 ? `${l3Fix(o.gm, 3)} ± ${l3Fix(o.dg, 3)}` : `${l3Fix(o.gm, 2)} ± ${l3Fix(o.dg, 2)}`;

/* ---------- модель (не сохраняется: незаконченный опыт начинается заново) ---------- */
let L3V = { tH: L3.tauH, tO: L3.tauO, m: 1, th: 0, p: 0, pump: false, raf: 0, last: 0, sw: 0, swOn: false, speed: 1, phase: 'ready', cur: {}, k0t: 0, hiss: 0 };
function l3Vary() { const P = (L3S && L3S.par) || {}; L3V.tH = L3.tauH * (P.kH || 1) * (1 + .14 * lwGauss()); L3V.tO = L3.tauO * (P.kO || 1) * (1 + .25 * Math.abs(lwGauss())); }
function l3Reset() { l3Vary(); Object.assign(L3V, { m: 1, th: 0, p: 0, pump: false, sw: 0, swOn: false, speed: 1, phase: 'ready', cur: {}, hiss: 0 }); }
function l3Step(dt) {
  const S = L3S, P0 = L3.P0, G = (S.par && S.par.g) || L3.g, k = (G - 1) / G, V = L3V;
  const pFrom = () => P0 * (V.m * (1 + V.th) - 1);
  if (V.pump && S.kOpen && !S.k0Open) { const p0 = V.p; V.m += L3.pump / P0 * dt * (1 - V.p / 900); V.p = pFrom(); V.th += k * (V.p - p0) / P0; }
  if (S.k0Open) {                       // выпуск в атмосферу: быстро до P0, остаток расширяется адиабатно
    const dp = -V.p * (1 - Math.exp(-dt / L3V.tO)); V.th += k * dp / P0; V.th -= V.th * (1 - Math.exp(-dt / L3V.tH));
    V.p += dp; V.m = (1 + V.p / P0) / (1 + V.th); V.hiss = Math.max(0, Math.abs(dp) / dt / 400);
  } else { V.th -= V.th * (1 - Math.exp(-dt / L3V.tH)); V.p = pFrom(); V.hiss = 0; }
  if (V.swOn) V.sw += dt;
}
function l3Loop(now) {
  const cv = $('#l3-cv'); if (!cv) { L3V.raf = 0; return; }
  const dt = Math.min(.05, (now - (L3V.last || now)) / 1000); L3V.last = now;
  const n = Math.max(1, Math.round(L3V.speed)); for (let i = 0; i < n; i++) l3Step(dt);
  if (L3V.speed > 1 && L3V.sw >= L3.wait) { L3V.speed = 1; L3V.swOn = false; L3V.sw = L3.wait; l3Phase(L3V.phase === 'wait1' ? 'read1' : 'read2'); }
  l3Draw(); L3V.raf = requestAnimationFrame(l3Loop);
}
function l3Run() { if (!L3V.raf) { L3V.last = 0; L3V.raf = requestAnimationFrame(l3Loop); } }
const l3Levels = () => { const z = L3S.zero, h = L3V.p; return [z - h / 2, z + h / 2]; };   // левое и правое колено, мм по шкале

/* ---------- сцена ---------- */
/* Оформление сцены: фон-картинка (программа для Windows подставляет Image; null — рисованный фон),
   анимация — молекулы воздуха в баллоне (скорость по температуре, число по массе газа), струя при выпуске,
   плавный поворот ручек кранов. На модель и отсчёты не влияет. */
let L3_BG = null;
const L3_SPR = {};   // картинки приборов (compressor, valve, cork, stopwatch): оболочка кладёт сюда Image; нет картинки — прибор рисуется кодом
const l3Spr = k => { const im = L3_SPR[k]; return im && im.complete && im.naturalWidth ? im : null; };
let L3_THEME = 'dark';   // программа переключает на 'light' (светлая тема); сайт — всегда тёмная
const L3PAL = {
  dark: { bg0: '#16263C', bg1: '#0E1A2B', grid: 'rgba(255,255,255,.025)', tb: ['#6A5A47', '#4A3D30', '#251E18'], tbEdge: 'rgba(255,230,200,.18)', vign: .35,
    lab: '#E7EDF6', lab2: '#C9D4E3', mol: 'rgba(215,232,250,.8)', glass: 'rgba(210,230,250,.8)', air: '220,235,255', ok: '#5AD3A0', bad: '#F2727E' },
  light: { bg0: '#F2F5F9', bg1: '#DCE3EC', grid: 'rgba(20,40,70,.05)', tb: ['#D2B48C', '#B08D63', '#86663F'], tbEdge: 'rgba(255,255,255,.6)', vign: .1,
    lab: '#1C2430', lab2: '#4A5566', mol: 'rgba(60,92,135,.85)', glass: 'rgba(50,85,130,.7)', air: '80,110,150', ok: '#138A55', bad: '#C9303F', veil: 'rgba(242,245,249,.45)' }
};
const L3D = { last: 0, mol: null, jet: [], ak: null, ak0: null };
const l3BalloonDrawn = c => { c.beginPath(); c.moveTo(214, 128); c.lineTo(258, 128); c.lineTo(258, 146); c.bezierCurveTo(330, 160, 336, 200, 332, 410); c.lineTo(140, 410); c.bezierCurveTo(136, 200, 142, 160, 214, 146); c.closePath(); };
const l3InsideDrawn = (x, y) => y > 152 && y < 404 && Math.abs(x - 236) < (y < 222 ? 18 + (y - 146) * .9 : 86);
/* бутылка-картинка (assets/parts/bottle): внутренний контур стекла в координатах сцены — горлышко 213…259, плечи до y 238, стенки 157…315, дно 396 */
const l3BottleIn = c => { c.beginPath(); c.moveTo(213, 151); c.lineTo(259, 151); c.lineTo(259, 190); c.bezierCurveTo(300, 193, 315, 210, 315, 238); c.lineTo(315, 396); c.lineTo(157, 396); c.lineTo(157, 238); c.bezierCurveTo(157, 210, 172, 193, 213, 190); c.closePath(); };
const l3BalloonPath = c => (l3Spr('bottle') ? l3BottleIn : l3BalloonDrawn)(c);
const l3Inside = (x, y) => l3Spr('bottle') ? y > 155 && y < 392 && Math.abs(x - 236) < (y < 192 ? 19 : y < 238 ? 22 + (y - 192) * 1.2 : 74) : l3InsideDrawn(x, y);
function l3Anim(S, V) {
  const now = (typeof performance !== 'undefined' ? performance.now() : Date.now()) / 1000, dt = Math.min(.05, Math.max(0, now - (L3D.last || now))); L3D.last = now;
  if (!L3D.mol) { L3D.mol = []; for (let i = 0; i < 72; i++) { let x, y; do { x = 150 + Math.random() * 172; y = 156 + Math.random() * 246; } while (!l3Inside(x, y)); L3D.mol.push({ x, y, a: Math.random() * 6.283, s: .6 + Math.random() * .8 }); } }
  const f = Math.max(.25, Math.min(2.2, 1 + (Number.isFinite(V.th) ? V.th : 0) / .006 * .9));

function l3Calc() {
  const S = L3S, a = S.runs.map(r => ({ h1: r.h1, h2: r.h2, g: r.h1 / (r.h1 - r.h2) })), N = a.length, gm = a.reduce((s, x) => s + x.g, 0) / N;
  const dg = a.reduce((s, x) => s + Math.abs(gm - x.g), 0) / Math.sqrt(N * (N - 1)), gT = 1.4;
  const o = { a, gm, dg, eg: dg / gm * 100, gT, e: Math.abs(gT - gm) / gT * 100 }; a.forEach((x, i) => { o['g' + (i + 1)] = x.g; }); return o;
}

function l3Ok(k, u, o) { const e = o[k]; if (!Number.isFinite(u)) return false;

/* =====================================================================

/* =====================================================================
   ЛР № 6. Определение горизонтальной составляющей и полной напряжённости магнитного поля Земли

   Подготовка: плоскость колец — в плоскость магнитного меридиана (стрелка на «0»), параметры установки.

   Обработка (12): Hг = IR²N / (2 tgφср (R² + (L/2)²)^(3/2)); ⟨Hг⟩ (14); ⟨ΔHг⟩ (15); ε (17); H, θ (13), Hв = 45 А/м.

leRegister(6, (() => {
  const R0 = .15, N0 = 320, L0 = .19, HV = 45, CUR = [.1, .2, .3];

    aim: 'Экспериментально определить горизонтальную составляющую и полную напряжённость магнитного поля Земли на данной широте.',
    hidden() { const r = Math.random; return { Hg: +(16.5 + r() * 3).toFixed(2) }; },

      cols: [{ k: 'I', label: 'I, А', ph: '0,00', tol: .0051, d: 2, err: 'I — перепиши показание амперметра блока питания' }, { k: 'fr', label: 'φпр, °', th: 'φ<sub>пр</sub>, °', ph: '0', tol: 1.01, d: 0, err: 'φпр — прочитай угол стрелки по шкале (до 1°) при прямом направлении тока' }, { k: 'fl', label: 'φлев, °', th: 'φ<sub>лев</sub>, °', ph: '0', tol: 1.01, d: 0, err: 'φлев — прочитай угол после смены полярности' }],
      ctl: S => `<div class="lw-ctl-row">${leB('power', S.rig.on ? `${ic('circle-check')} Источник включён` : 'Включить источник', '', S.rig.on ? '' : 'line')}${leB('pol', `Переключатель: ${S.rig.pol > 0 ? 'прямо' : 'обратно'} ⇄`, '', 'line', !S.rig.on)}</div>${leKnob('I', 'Ток в кольцах', leFix(S.rig.on ? S.rig.I : 0, 2) + ' А', [.01, .1], !S.rig.on)}`,
      hint: (S, k) => `Установи ток ${leFix(CUR[k], 1)} А и прочитай углы при обоих направлениях тока.`,
      ready: S => { const k = (S.rows.meas || []).length, R = S.rig; if (!R.on) return 'Включи источник питания.'; if (Math.abs(R.I - CUR[k]) > .004) return `Установи ток ${leFix(CUR[k], 2)} А (по таблице).`;
        if (!R.seen.r || !R.seen.l) return 'Посмотри угол при обоих направлениях тока: переключи полярность.'; return null; },

      c.fillStyle = R.on ? '#3FD27F' : '#4A2025'; c.beginPath(); c.arc(30, 344, 4, 0, 7); c.fill();
      c.fillStyle = '#2A3443'; leRR(c, 228, 360, 64, 40, 6); c.fill(); leText(c, R.pol > 0 ? '+ ⇄ −' : '− ⇄ +', 260, 380, { size: 13, color: leAcc(), weight: 800 }); leText(c, 'переключатель', 260, 410, { size: 9.5 });
      leWire(c, [[200, 352], [236, 372]], '#E5484D'); leWire(c, [[284, 372], [240, 250]], '#3E7BFA');
      // компас сверху (полукруг шкалы 0…90° в обе стороны) и лупа-полоса у кончика стрелки

      c.save(); c.beginPath(); c.arc(X, Y, Rr + 6, Math.PI, 0); c.lineTo(X + Rr + 6, Y + 14); c.lineTo(X - Rr - 6, Y + 14); c.closePath(); c.fillStyle = '#F4F1E6'; c.fill(); c.lineWidth = 5; c.strokeStyle = '#4C586B'; c.stroke(); c.clip();
      c.strokeStyle = '#2A2A2A'; c.fillStyle = '#2A2A2A'; c.textAlign = 'center'; c.textBaseline = 'middle';
      for (let t = -90; t <= 90; t++) { const ang = (t - 90) * deg, r1 = Rr, r2 = r1 - (t % 10 ? (t % 5 ? 7 : 12) : 18);
        c.lineWidth = t % 10 ? .8 : 1.8; c.beginPath(); c.moveTo(X + r1 * Math.cos(ang), Y + r1 * Math.sin(ang)); c.lineTo(X + r2 * Math.cos(ang), Y + r2 * Math.sin(ang)); c.stroke();
        if (t % 10 === 0) { c.font = '700 11px "Golos UI", system-ui'; const r3 = r1 - 29; c.fillText(Math.abs(t), X + r3 * Math.cos(ang), Y + r3 * Math.sin(ang)); } }
      c.strokeStyle = 'rgba(184,115,51,.55)'; c.lineWidth = 9; c.beginPath(); c.moveTo(X, Y - Rr); c.lineTo(X, Y + 10); c.stroke();      // плоскость витков

      c.fillStyle = '#222'; c.beginPath(); c.arc(X, Y, 5, 0, 7); c.fill(); c.restore();

      c.strokeStyle = '#D93A3A'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(LX + LW / 2, LY); c.lineTo(LX + LW / 2, LY + LH); c.stroke(); c.restore();

      leText(c, `ЛУПА у кончика стрелки: 1 деление = 1°${a > .5 ? ' (вправо)' : a < -.5 ? ' (влево)' : ''}`, LX + LW / 2, LY + LH + 12, { size: 10, color: leAcc(), weight: 700 });

    hodNow(S, st) { const k = (S.rows.meas || []).length; return ({ prep: S.prepOk ? 2 : 1, meas: k >= 3 ? 9 : S.rig.on ? (S.rig.seen.r ? 7 : 6) : 3, proc: 11, concl: 12 })[st] || 0; },
    calc(S) {

      const H = t.map((_, i) => o['H' + (i + 1)]), n = H.length; o.Hm = H.reduce((s, x) => s + x, 0) / (n || NaN);

/* =====================================================================
   ЛР № 7. Определение удельного заряда электрона методом магнетрона (методичка, ЛР № 7).
   Подготовка: параметры магнетрона (d = 37 мм, l = 36 мм, r = 3 мм, Uа = 15 В, N — по табличке миниблока).
   Опыт: сбросовая характеристика — ток соленоида I = 110…180 мА через 10 мА, анодный ток Iа (8 точек:
   это одна кривая, по ней находят критический ток, поэтому точек столько, сколько в таблице методички).
   Обработка: ΔIа, ΔI, ΔIа/ΔI; Iкр — по максимуму ΔIа/ΔI; e/m = 8U(l² + d²)/(μ₀rNIкр)² (13); δ.
   Число витков N в методичке не задано («2100…3000, зависит от установки») — у каждого студента своё.
   ===================================================================== */
leRegister(7, (() => {
  const d = .037, l = .036, r = .003, Ua = 15, MU0 = 4e-7 * Math.PI, EM = 1.76e11, PTS = [110, 120, 130, 140, 150, 160, 170, 180];
  const Ia = (S, I) => { const p = S.p; return p.ia0 * (1 - .0006 * I) / (1 + Math.exp((I - p.Ic) / p.w)) + p.ia1; };
  const D = {
    title: 'Определение удельного заряда электрона', short: 'Удельный заряд электрона', icon: 'atom',
    aim: 'Определить удельный заряд электрона с помощью магнетрона.',
    hidden() { const rr = Math.random, N = 2200 + Math.round(rr() * 70) * 10; const Ic = Math.sqrt(8 * Ua * (l * l + d * d) / EM) / (MU0 * r * N) * 1000 * (.985 + rr() * .03);
      return { N, Ic: +Ic.toFixed(2), ia0: +(1.25 + rr() * .3).toFixed(3), ia1: +(.012 + rr() * .01).toFixed(4), w: +(5.5 + rr() * 1.5).toFixed(2) }; },
    rig0: () => ({ on: false, I: 0 }),
    exps: [{ id: 'curve', tab: 'Измерения', need: PTS.length, title: 'Сбросовая характеристика (п. 3–4)', tableTitle: 'Таблица 1. Измерения',

      ctl: S => `<div class="lw-ctl-row">${leB('power', S.rig.on ? `${ic('circle-check')} «Сеть»: включено` : 'Включить «Сеть»', '', S.rig.on ? '' : 'line')}</div>${leKnob('I', 'Ток соленоида', leFix(S.rig.on ? S.rig.I : 0, 0) + ' мА', [1, 10], !S.rig.on)}`,

        <div class="lw-row three"><label>d, мм ${leIn('pd', S.inp.pd, '0')}</label><label>l, мм ${leIn('pl', S.inp.pl, '0')}</label><label>r, мм ${leIn('pr', S.inp.pr, '0')}</label></div>

/* =====================================================================
   ЛР № 8. Определение индуктивности соленоида (методичка, ЛР № 8).
   Подготовка: генератор сигналов, частота 2 кГц. Опыт 1 — катушка без сердечника, опыт 2 — с ферромагнитным
   сердечником: ток ≈ 1, 5, 10 мА («от 1 до 10 мА с шагом ≈ 5 мА» — по 3 опыта, как в таблицах 1, 2),
   записать I и U на катушке. Обработка: Z = U/I (4), L = Z/(2πν) (6); для катушки без сердечника — Lср, ΔL;
   график L = f(I) для катушки с сердечником.
   Модель: последовательно 470 Ом; Z катушки = √(R² + (ωL)²); с сердечником L растёт с током (μ(H)).
   ===================================================================== */
leRegister(8, (() => {
  const RL = 470, NU = 2, CUR = [1, 5, 10];
  const Lof = (S, core, I) => (core ? S.p.L0 * (S.p.mu0 + S.p.mu1 * I) : S.p.L0);
  function circ(S) {           // ток (мА) и напряжение на катушке (мВ) при текущих настройках
    const R = S.rig; if (!R.on) return { I: 0, U: 0 };
    const w = 2 * Math.PI * R.f * 1000; let I = 0;
    for (let k = 0; k < 6; k++) { const X = w * Lof(S, R.core, I), Z = Math.hypot(RL + S.p.Rc, X); I = R.E / Z * 1000; }
    const Zc = Math.hypot(S.p.Rc, w * Lof(S, R.core, I));
    return { I, U: I * Zc * S.p.kv };
  }
  const exp = (id, tab, title, core) => ({
    id, tab, need: 3, title, tableTitle: core ? 'Таблица 2. Катушка с ферромагнитным сердечником' : 'Таблица 1. Катушка без сердечника',
    desc: S => `${core ? 'Выключи блоки, вставь ферромагнитный сердечник в катушку, включи, нажми «Исходная установка» и снова установи частоту 2 кГц. ' : ''}Кнопками уровня выхода «0–15 В» устанавливай ток I ≈ 1, 5 и 10 мА (амперметр ~20 мА) и для каждого записывай напряжение U на катушке (вольтметр, мВ).`,
    cols: [{ k: 'I', label: 'I, мА', ph: '0,00', tol: .0051, d: 2, err: 'I — перепиши показание амперметра (мА, два знака)' }, { k: 'U', label: 'U, мВ', ph: '0', tol: 1.01, d: 0, err: 'U — перепиши показание вольтметра (мВ)' }],
    ctl: S => (core && !S.rig.core ? `<div class="lw-ctl-row">${leB('core', 'Выключить, вставить сердечник, включить', '', '')}</div>` : '') + leCtl8(S),
    hint: (S, k) => `Установи ток около ${CUR[k]} мА и запиши I и U.`,
    ready: S => { const R = S.rig, k = (S.rows[id] || []).length, c = circ(S); if (core && !R.core) return 'Вставь ферромагнитный сердечник в катушку.'; if (!R.on) return 'Включи «Сеть».';
      if (Math.abs(R.f - NU) > .001) return 'Установи частоту 2,0 кГц.'; const tol = CUR[k] === 1 ? .3 : .6; return Math.abs(c.I - CUR[k]) <= tol ? null : `Установи ток около ${CUR[k]} мА (сейчас ${leFix(c.I, 2)} мА).`; },
    truth: S => { const c = circ(S); return { I: +c.I.toFixed(2), U: Math.round(c.U) }; }
  });
  const leCtl8 = S => `<div class="lw-ctl-row">${leB('power', S.rig.on ? `${ic('circle-check')} «Сеть»: включено` : 'Включить «Сеть»', '', S.rig.on ? '' : 'line')}</div>${leKnob('f', 'Частота', leFix(S.rig.f, 1) + ' кГц', [.1, 1], !S.rig.on)}${leKnob('E', 'Уровень выхода', leFix(S.rig.E, 2) + ' В', [.01, .1, 1], !S.rig.on)}`;
  const D = {
    title: 'Определение индуктивности соленоида', short: 'Индуктивность соленоида', icon: 'activity',
    aim: 'Определить индуктивность соленоида; исследовать зависимость индуктивности соленоида без сердечника и с сердечником из ферромагнетика от величины тока.',
    hidden() { const r = Math.random; return { L0: +(.0095 + r() * .003).toFixed(5), Rc: +(14 + r() * 4).toFixed(1), mu0: +(3.8 + r() * .6).toFixed(3), mu1: +(.09 + r() * .05).toFixed(4), kv: 1 + .002 * lwGauss() }; },
    rig0: () => ({ on: false, f: 1.0, E: 0, core: false }),

      if (R.core) { c.fillStyle = '#5A6070'; leRR(c, 280, 250 + ch * .34, 150, 12, 4); c.fill(); leText(c, 'сердечник', 355, 250 + ch * .34 - 8, { size: 9.5, color: leAcc(), weight: 700 }); }
      leText(c, `4 — катушка${R.core ? ' с сердечником' : ' без сердечника'}`, 350, 250 + ch + 12);
      leWire(c, [[230, 34 + h * .7], a.a], '#E5484D'); leWire(c, [a.b, rb.a], '#E5484D'); leWire(c, [rb.b, [260, 300]], '#E5484D'); leWire(c, [[440, 300], [230, 34 + h * .85]], '#3E7BFA');

    },
    hodNow(S, st) { const k1 = (S.rows.nocore || []).length, k2 = (S.rows.core || []).length; return ({ prep: 1, nocore: k1 >= 3 ? 4 : 3, core: k2 >= 3 ? 6 : 5, proc: 7, concl: 9 })[st] || 0; },
    calc(S) {
      const a = S.rows.nocore || [], b = S.rows.core || [], o = { a, b, nu: NU * 1000 };
      a.forEach((r, i) => { o['Z' + (i + 1)] = r.U / r.I; o['L' + (i + 1)] = o['Z' + (i + 1)] / (2 * Math.PI * o.nu); });
      b.forEach((r, i) => { o['Z' + (i + 4)] = r.U / r.I; o['L' + (i + 4)] = o['Z' + (i + 4)] / (2 * Math.PI * o.nu); });
      const L = a.map((_, i) => o['L' + (i + 1)]), n = L.length; o.Lm = L.reduce((s, x) => s + x, 0) / (n || NaN);
      L.forEach((x, i) => { o['d' + (i + 1)] = Math.abs(o.Lm - x); }); o.dLm = L.reduce((s, x) => s + Math.abs(o.Lm - x), 0) / (n || NaN);

/* =====================================================================
   «Показатель адиабаты» для Android — оболочка под телефон.
   Сама работа (модель установки, вопросы, расчёты, проверки, действия data-l3/data-k3, отчёт) —
   fizika2/src/lw3-core.js, тот же файл, что на сайте и в программе для Windows/Linux.
   Файл работы (.lw3) и подпись — result.js, тоже общие: преподаватель проверяет работы с телефона
   в своей программе так же, как с компьютера.
   Нативное (Capacitor): отправка файла (Filesystem + Share), печать / PDF (свой плагин Printer),
   кнопка «Назад» (App). В обычном браузере то же работает через скачивание и window.print().
   ===================================================================== */
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
// iPhone / iPad: веб-приложение с экрана «Домой» (сборка build_ios.py, флаг PWA). Файлы — через меню «Поделиться» iOS.
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const STANDALONE = !!((window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone);
if (typeof PWA !== 'undefined' && PWA && !NATIVE && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === '127.0.0.1' || location.hostname === 'localhost'))
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
const PLUG = {};
// доступ к нативным плагинам — через capacitor.js (@capacitor/core, встроен в страницу при сборке).
// Любая ошибка здесь не должна мешать запуску: без плагина приложение работает, просто без этой функции.
function plug(n) {
  if (!NATIVE) return null;
  if (PLUG[n]) return PLUG[n];
  try {
    const X = window.capacitorExports || {};
    if (n === 'SystemBars' && X.SystemBars) return (PLUG[n] = X.SystemBars);
    const reg = X.registerPlugin || (window.Capacitor && window.Capacitor.registerPlugin);
    return reg ? (PLUG[n] = reg(n)) : null;
  } catch (e) { return null; }
}
const ui = { main: $('#main'), bar: $('#bar'), dock: $('#dock') };
let SCREEN = 'home';          // home | work
let PROFILE = null;
let AQ = 0, CQ = 0, CTAB = 'concl', ZOOM = true;   // вопрос допуска / защиты, вкладка выводов, лупа крупно
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

function toast(html, kind = '') {
  const box = $('#toasts'); while (box.children.length >= 2) box.firstChild.remove();
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.innerHTML = html; box.appendChild(t);
  setTimeout(() => t.remove(), kind === 'bad' ? 4200 : 3000);
}

function loadBg(cfg, key, to = BG) { if (!cfg) return; const im = new Image(); im.onload = () => { to[key] = Object.assign(im, { edge: cfg.edge, top: cfg.top }); sceneTheme(); }; im.src = cfg.src; }

async function shareText(name, text, title, type = 'application/octet-stream') {
  const FS = plug('Filesystem'), SH = plug('Share');
  if (FS && SH) {
    try {
      const r = await FS.writeFile({ path: name, data: text, directory: 'CACHE', encoding: 'utf8' });
      await SH.share({ title, text: title, files: [r.uri], dialogTitle: title }); return true;
    } catch (e) { if (/cancel/i.test(String(e && (e.message || e)))) return false; toast('Не удалось отправить файл: ' + esc(String(e && (e.message || e))), 'bad'); return false; }
  }
  // браузер / iPhone: меню «Поделиться» с файлом (почта, мессенджеры, «Файлы»), иначе — скачивание
  try { const file = new File([text], name, { type }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title }); return true; } }
  catch (e) { if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast(`${ic('circle-check')} Файл «${esc(name)}» сохранён в загрузки`); return true;
}

  if (ok && S.done) { S.dx.submitted = new Date().toISOString(); L.save(); if (L.steps[S.step][0] === 'report') render(); }
}
async function printReport() {
  const L = curLab(), S = L.load(); $('#printroot').innerHTML = L.report();
  const PR = plug('Printer');
  if (PR) { try { await PR.print({ name: `Отчёт_ЛР${LAB}_${safeName(S.fio) || 'студент'}` }); } catch (e) { toast('Печать недоступна: ' + esc(String(e && (e.message || e))), 'bad'); } return; }
  // на iPhone в приложении с экрана «Домой» печать из страницы может не открываться — отчёт отдаётся файлом:
  // его открывают в «Файлах» или Safari и оттуда печатают или сохраняют в PDF (меню «Поделиться» → «Напечатать»)
  if (IOS && (STANDALONE || typeof window.print !== 'function')) { await shareText(`Отчёт_ЛР${LAB}_${safeName(S.fio) || 'студент'}.html`, reportFileHtml(L.report(), `Отчёт по ЛР № ${LAB}`), `Отчёт по ЛР № ${LAB}`, 'text/html'); return; }

const reportFileHtml = (body, title) => `<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(title)}</title>
<style>body{margin:0; background:#fff; color:#000; font-family:"Times New Roman",serif} .lwr{display:block} ${typeof REPORT_CSS !== 'undefined' ? REPORT_CSS : ''}
@page{size:A4; margin:12mm} .lwp{box-shadow:none; max-width:190mm; margin:0 auto 12mm} @media print{.lwp{margin:0; page-break-after:always; break-after:page} .lwp:last-child{page-break-after:auto}}</style></head><body><div class="lwr">${body}</div></body></html>`;
const readFile = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result)); r.onerror = () => no(r.error); r.readAsText(f, 'utf-8'); });
$('#file-in').addEventListener('change', async e => { const f = (e.target.files || [])[0]; if (f) continueFrom(await readFile(f)); });
function continueFrom(text) {
  const r = unpackResult(text);
  if (r.err) return toast(r.err, 'bad');
  if (!r.ok) return toast('Файл изменён вручную — продолжить по нему нельзя.', 'bad');
  const S = r.d.state; if (S.v !== 1) return toast('Файл от другой версии работы.', 'bad');
  if (S.demo || (S.dx && S.dx.demo)) return toast('Это демо-прохождение преподавателя, а не работа студента.', 'bad');
  const fio = (S.fio || r.d.student.fio || 'Студент').trim(), group = (S.group || r.d.student.group || '').trim();
  let p = profiles().find(x => x.fio.toLowerCase() === fio.toLowerCase() && (x.group || '') === group);
  if (p) { const cur = store.get(workKey(p.id), null); if (cur && (cur.max || 0) > (S.max || 0) && !confirm(`У «${fio}» на этом телефоне работа продвинута дальше. Заменить её работой из файла?`)) return; }
  else p = addProfile(fio, group);
  store.set(LABS[r.d.lab || 3].key(p.id), S); toast(`Работа «${esc(fio)}» загружена из файла`); openProfile(p, false, r.d.lab || 3);
}

/* ---------- действия оболочки (data-m) ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-m]'); if (!b) return; const d = b.dataset;
  switch (d.m) {
    case 'new': {
      const fio = $('#np-fio').value.trim(), group = $('#np-group').value.trim();
      if (fio.length < 3) { toast('Впиши ФИО полностью, например: Иванов И. И.', 'bad'); $('#np-fio').focus(); break; }
      openProfile(addProfile(fio, group), true); break;
    }
    case 'open': { const p = profiles().find(x => x.id === d.v); if (p) openProfile(p); break; }
    case 'import': { const i = $('#file-in'); i.value = ''; i.click(); break; }
    case 'home': closeSheet(); PROFILE = null; L3S = null; SCREEN = 'home'; render(); scrollTo(0, 0); break;
    case 'aq': AQ = Math.max(0, Math.min(7, +d.v)); render(); scrollTo(0, 0); break;
    case 'cqq': CQ = Math.max(0, Math.min(7, +d.v)); render(); scrollTo(0, 0); break;
    case 'ctab': CTAB = d.v; render(); scrollTo(0, 0); break;
    case 'zoom': ZOOM = !ZOOM; render(); break;
    case 'theory': TTAB = TTAB || 'theory'; showTheory(); break;
    case 'ttab': TTAB = d.v; showTheory(); break;
    case 'hod': showHod(); break;
    case 'menu': showMenu(); break;
    case 'summary': openSummary(); break;
    case 'send': closeSheet(); sendWork(); break;
    case 'pdf': printReport(); break;
    case 'theme': closeSheet(); setTheme(isLight() ? 'dark' : 'light'); break;
    case 'intro': showIntro(0); break;
    case 'intro-next': if (INTRO_AT < INTRO.length - 1) showIntro(INTRO_AT + 1); else closeSheet(); break;
    case 'sclose': closeSheet(); if (SCREEN === 'work') { const L = curLab(), S = L.S(); if (S && L.steps[S.step][0] === 'report') $('#printroot').innerHTML = L.report(); } break;
  }
});
// ответ на вопрос — сам переходит к следующему без ответа
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-l3="admit"],[data-l3="cq"]'); if (!b) return;
  const adm = b.dataset.l3 === 'admit', list = adm ? L3_ADMIT : L3_CQ;
  setTimeout(() => { const S = L3S; if (!S) return; const ans = adm ? S.admit : S.cq, cur = adm ? AQ : CQ;
    let nx = list.findIndex((_, j) => j > cur && !ans[j]); if (nx < 0) nx = list.findIndex((_, j) => !ans[j]);

// учёт попыток (для преподавателя) — до обработчика ядра, как в программе для Windows
document.addEventListener('click', e => {

  if (['admitCheck', 'cqCheck', 'next', 'go', 'restart'].includes(b.dataset.l3)) setTimeout(() => { scrollTo(0, 0); }, 0);

// ошибки в ячейках обработки — счётчик для примера расчёта (пустая ячейка — не ошибка)
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-l3="pcheck"]'); if (!b) return;
  setTimeout(() => { const S = L3S; if (!S || !S.dx) return; S.dx.pk = S.dx.pk || {}; L3_KEYS.forEach(k => { if (S.procOk[k] === false && String(S.proc[k] ?? '').trim()) S.dx.pk[k] = (S.dx.pk[k] || 0) + 1; }); l3Save(); render(); }, 0);

// шапка отчёта меняется — обновить лист
document.addEventListener('input', e => {

document.addEventListener('keydown', e => {

document.addEventListener('contextmenu', e => { if (!(e.target.closest && e.target.closest('input,textarea'))) e.preventDefault(); });
addEventListener('blur', () => { L3V.pump = false; });

try {

/* =====================================================================
   «Физпрактикум» на телефоне: выбор работы и ЛР 1, ЛР 2 в раскладке телефона.
   Реестр работ — labs-core.js (общий с программой для компьютера). ЛР 3 — свои экраны (mobile.js).
   Подготовка, опыты и обработка ЛР 1 и ЛР 2 — экраны модулей сайта (они уже сделаны под палец);
   допуск и защита — по одному вопросу, отчёт и сводка — как у ЛР 3.
   ===================================================================== */
function mLabs() {
  const p = PROFILE; ui.bar.innerHTML = ''; dock('');
  ui.main.innerHTML = `<div class="labs-m">
    <div class="labs-mh"><span class="logo sm">γ</span><div><h1>Физпрактикум</h1><p>${esc(p.fio)}${p.group ? ' · ' + esc(p.group) : ''}</p></div><button class="ib" data-m="home" aria-label="Сменить студента">${ic('chevron-left')}</button></div>
    ${labNums().map(n => { const L = LABS[n], S = labState(n, p.id), at = S ? Math.min((S.max || 0) + (S.done ? 1 : 0), L.steps.length) : 0;
      let res = ''; if (S && S.done) { try { res = withLabState(n, S, () => L.result()); } catch (e) {} }
      return `<button class="labm ${S && S.done ? 'done' : ''}" data-m="lab" data-v="${n}"><span class="labm-ic">${ic(L.icon)}</span><div><small>ЛР ${n}</small><b>${esc(labTitle(n))}</b><span>${esc(labStatus(n, S))}</span>${res ? `<em>${esc(res)}</em>` : ''}
        <i class="labm-bar"><i style="width:${Math.round(at / L.steps.length * 100)}%"></i></i></div></button>`; }).join('')}
    <p class="mute small center" style="margin-top:14px">Каждая работа сохраняется отдельно.</p></div>`;
}
function mOpenLab(n) {
  LAB = n; const L = curLab(); L.setKey(L.key(PROFILE.id));
  const S = L.load(); ensureMeta(S); L.save(); if (n === 3) l3Reset();
  AQ = firstOpen(L.admit, S.admit); CQ = firstOpen(L.cq, S.cq); CTAB = S.cqOk ? 'cq' : 'concl';
  SCREEN = 'work'; render(); scrollTo(0, 0);
}
function mTop(S, L) {
  const i = S.step;
  ui.bar.innerHTML = `<div class="bar"><button class="ib" data-m="labs" aria-label="К списку работ">${ic('chevron-left')}</button>
      <h1>${L.steps[i][1]}<small>ЛР ${L.no} · шаг ${i + 1} из ${L.steps.length}</small></h1>
      <button class="ib" data-m="hod" aria-label="Ход работы">${ic('clipboard-list')}</button>
      <button class="ib" data-m="menu" aria-label="Меню">${ic('sliders-horizontal')}</button></div>
    <div class="steps" style="grid-template-columns:repeat(${L.steps.length},1fr)">${L.steps.map((_, j) => `<button data-${L.act}="go" data-v="${j}" class="${j === i ? 'cur' : j <= S.max ? 'done' : ''}" ${j <= S.max ? '' : 'disabled'} aria-label="${L.steps[j][1]}"></button>`).join('')}</div>`;
}
function mWorkLab() {
  const L = curLab(), S = L.load(); ensureMeta(S);
  const st = L.steps[S.step][0];
  S.dx.t = S.dx.t || {}; if (!S.dx.t[st]) { S.dx.t[st] = new Date().toISOString(); L.save(); }
  mTop(S, L);
  if (st === 'admit') mAdmitLab(S, L);
  else if (st === 'concl') mConclLab(S, L);
  else if (st === 'report') mReportLab(S, L);
  else { ui.main.innerHTML = `<div class="slab">${L.view[st]()}</div>`; dock(''); L.after(st); }
  $('#printroot').innerHTML = st === 'report' ? L.report() : '';
}
function mAdmitLab(S, L) {
  const all = L.admit.every((_, i) => S.admit[i]);
  if (S.admitChecked && S.admitOk) { ui.main.innerHTML = qResult(L.admit, S.admit, true, 'Допуск'); return dock(`<button class="btn" data-${L.act}="next">К подготовке ${ic('chevron-right')}</button>`); }
  ui.main.innerHTML = (S.admitChecked ? qResult(L.admit, S.admit, false, 'Допуск') : '') + qCard(L.admit, S.admit, S.admitChecked, AQ, 'admit', 40 + L.no * 20, L.admit.length, L.act)
    + `<button class="btn soft" data-m="theory">${ic('book-open')} Теория и схема установки</button>`;
  dock(`<div class="row"><button class="btn line" data-m="aq" data-v="${AQ - 1}" ${AQ ? '' : 'disabled'}>${ic('chevron-left')}</button>
    ${AQ < L.admit.length - 1 ? `<button class="btn ${S.admit[AQ] ? '' : 'line'}" data-m="aq" data-v="${AQ + 1}" style="flex:3">Дальше ${ic('chevron-right')}</button>`
      : `<button class="btn" data-${L.act}="admitCheck" ${all ? '' : 'disabled'} style="flex:3">${ic('circle-check')} Проверить допуск</button>`}</div>
    ${AQ < L.admit.length - 1 && all && !S.admitChecked ? `<button class="btn ok" data-${L.act}="admitCheck">${ic('circle-check')} Проверить допуск</button>` : ''}`);
}
function mConclLab(S, L) {
  if (!S.concl) { S.concl = L.autoConcl(); L.save(); }
  const N = L.cq.length, tabs = `<div class="tabs"><button class="${CTAB === 'concl' ? 'on' : ''}" data-m="ctab" data-v="concl">${ic('pencil')} Выводы</button><button class="${CTAB === 'cq' ? 'on' : ''}" data-m="ctab" data-v="cq">${ic('graduation-cap')} Защита ${S.cqOk ? '✓' : `${Object.keys(S.cq).length}/${N}`}</button></div>`;
  if (CTAB === 'concl') {
    ui.main.innerHTML = tabs + `<section class="card"><h2>${ic('pencil')} Выводы</h2><p class="lead" style="margin-bottom:10px">Черновик собран по твоим результатам. Проверь и допиши своими словами — он попадёт в отчёт.</p>
      ${L.ta(S.concl)}<button class="lnk" data-${L.act}="reconcl">${ic('rotate-ccw')} Собрать черновик заново</button></section>`;
    return dock(S.cqOk ? `<button class="btn" data-${L.act}="next">К отчёту ${ic('chevron-right')}</button>` : `<button class="btn" data-m="ctab" data-v="cq">К защите: ${N} вопросов ${ic('chevron-right')}</button>`);
  }
  const all = L.cq.every((_, i) => S.cq[i]);
  if (S.cqChecked && S.cqOk) { ui.main.innerHTML = tabs + qResult(L.cq, S.cq, true, 'Защита'); return dock(`<button class="btn" data-${L.act}="next">К отчёту ${ic('chevron-right')}</button>`); }
  CQ = Math.min(CQ, N - 1);
  ui.main.innerHTML = tabs + (S.cqChecked ? qResult(L.cq, S.cq, false, 'Защита') : '') + qCard(L.cq, S.cq, S.cqChecked, CQ, 'cq', 70 + L.no * 20, N, L.act);
  dock(`<div class="row"><button class="btn line" data-m="cqq" data-v="${CQ - 1}" ${CQ ? '' : 'disabled'}>${ic('chevron-left')}</button>
    ${CQ < N - 1 ? `<button class="btn ${S.cq[CQ] ? '' : 'line'}" data-m="cqq" data-v="${CQ + 1}" style="flex:3">Дальше ${ic('chevron-right')}</button>`
      : `<button class="btn" data-${L.act}="cqCheck" ${all ? '' : 'disabled'} style="flex:3">${ic('circle-check')} Проверить ответы</button>`}</div>
    ${CQ < N - 1 && all && !S.cqChecked ? `<button class="btn ok" data-${L.act}="cqCheck">${ic('circle-check')} Проверить ответы</button>` : ''}`);
}
function mReportLab(S, L) {
  let res = ''; try { res = L.result(); } catch (e) {}
  const sent = S.dx && S.dx.submitted;
  ui.main.innerHTML = `<section class="card hero">${ic('trophy')}<h2>Работа выполнена</h2><p>${esc(res)}</p></section>
    <button class="btn soft" data-m="summary" style="margin-bottom:12px">${ic('graduation-cap')} Что рассказать на защите</button>
    <section class="card"><h2>${ic('user')} Шапка отчёта</h2><label class="field">ФИО${L.inp('fio', S.fio, 'Иванов И. И.')}</label><label class="field">Класс / группа${L.inp('group', S.group, '11 А')}</label><label class="field">Дата${L.inp('date', S.date, 'дд.мм.гггг')}</label></section>
    <section class="card"><h2>${ic('file-text')} Отчёт <span class="tag">4 листа А4</span></h2><div class="paper-wrap" id="m-paper"><div class="lwr">${L.report()}</div></div></section>
    <div class="stack"><button class="btn line" data-m="pdf">${ic('printer')} PDF или печать</button><button class="btn line" data-${L.act}="restart">${ic('rotate-ccw')} Выполнить работу заново</button></div>`;
  dock(`${sent ? `<p class="say center">${ic('circle-check')} Файл отправлен ${new Date(sent).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })}</p>` : ''}
    <button class="btn ${sent ? 'line' : ''}" data-m="send">${ic('graduation-cap')} Отправить работу преподавателю</button>`);
  fitPaper();
  if (!(S.dx && S.dx.sumSeen)) setTimeout(() => { if (SCREEN === 'work' && LAB === L.no && $('#sheet').hidden) openSummary(); }, 0);
}

document.addEventListener('click', e => {

document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-lw],[data-l2],[data-le]'); if (!b || LAB === 3) return;
