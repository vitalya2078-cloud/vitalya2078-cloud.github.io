  --math:"Cambria Math", Cambria, "STIX Two Math", "STIX Two Text", "Noto Serif", "Times New Roman", serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E2747; --grid:rgba(150,195,255,.07); --grid-major:rgba(150,195,255,.14);
  --sheet:#14325C; --text:#EAF1FB; --muted:#A3B7D1; --line:#2B4C7C;
  --ink:#A6C8FF; --on-ink:#0E2747; --ink-soft:#1D4072;
  --ok:#7ADBA0; --ok-soft:#164234; --red:#FF8F86; --red-soft:#4A2336; --marker:#7D6E12;
  --shadow:none; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper); color:var(--text); font:16px/1.5 var(--ui); -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
  background-image:linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:40px 40px,40px 40px,8px 8px,8px 8px; padding-bottom:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
.wrap{max-width:780px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--ink)}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

/* шапка */
header{position:sticky; top:0; z-index:5; background:var(--paper); background:color-mix(in srgb,var(--paper) 88%,transparent); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px)}
header .wrap{padding-block:10px; display:grid; gap:8px}
.bar{display:flex; gap:10px; align-items:center; min-width:0; min-height:40px}
.back{flex:none; width:40px; height:40px; border:1px solid var(--line); background:var(--sheet); color:var(--ink); border-radius:12px; font-size:20px; cursor:pointer}
.ttl{flex:1; min-width:0; font-weight:700; font-size:19px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
body[data-view="home"] .ttl{font-size:26px; letter-spacing:-.02em}
.tglyph{font:italic 600 .9em var(--math); color:var(--ink); margin-right:8px}
.pos{font-weight:400; color:var(--muted); font-size:.85em; margin-left:6px}
.tgl{flex:none; border:1px solid var(--line); background:var(--sheet); color:var(--text); font-size:14px; border-radius:999px; padding:7px 13px; cursor:pointer}
.tgl[aria-pressed="true"]{background:var(--ink); color:var(--on-ink); border-color:var(--ink)}
.search{display:flex; gap:8px}
.search input{flex:1 1 0; width:0; font:inherit; font-size:16px; color:var(--text); background:var(--sheet); border:1px solid var(--line); border-radius:12px; padding:10px 12px}
.search input::placeholder{color:var(--muted)}
.search button{flex:none; width:44px; border:1px solid var(--line); background:var(--sheet); border-radius:12px; cursor:pointer; color:var(--muted)}
.hint{font-size:13px; color:var(--muted)}
main{padding-block:14px 96px}

/* главная */
.install{position:relative; display:flex; gap:12px; align-items:flex-start; background:var(--ink-soft); border-radius:14px; padding:12px 40px 12px 14px; margin-bottom:14px; font-size:14px}
.install p{margin:2px 0 0; color:var(--text)}
.install .ico{display:inline-block; font-weight:700; color:var(--ink)}
.instbtn{flex:none; align-self:center; border:0; background:var(--ink); color:var(--on-ink); font-weight:700; border-radius:10px; padding:9px 14px; cursor:pointer}
.install .x{position:absolute; top:6px; right:6px; width:32px; height:32px; border:0; background:none; color:var(--muted); font-size:20px; cursor:pointer; border-radius:8px}
.hero{display:grid; gap:8px; margin-bottom:6px}
.go{display:grid; gap:2px; text-decoration:none; background:var(--ink); color:var(--on-ink); border:0; border-radius:16px; padding:16px 18px; cursor:pointer; text-align:left}
.go b{font-size:20px; letter-spacing:-.01em}
.go span{font-size:14px; opacity:.85}
.go.sm{padding:10px 16px; border-radius:12px; flex:none}
.go.sm b{font-size:15px}
.pair{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:6px}
.chipbtn{display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:48px; padding:10px 14px; border-radius:12px; border:1px solid var(--line); background:var(--sheet); color:var(--text); font-weight:600; text-decoration:none; cursor:pointer; box-shadow:var(--shadow)}
.chipbtn b{font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums}
.chipbtn.red b{color:var(--red)}
.sec{font-size:15px; font-weight:700; margin:20px 2px 8px; color:var(--text)}
.sec a{color:inherit; text-decoration:none}
.sec span{font-weight:400; color:var(--muted)}
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); gap:10px}
.tile{position:relative; display:flex; flex-direction:column; gap:4px; min-height:150px; padding:14px; border-radius:16px; background:var(--sheet); border:1px solid var(--line); color:var(--text); text-decoration:none; box-shadow:var(--shadow); overflow:hidden}
.glyph{font:italic 500 25px/1.15 var(--math); color:var(--ink); white-space:nowrap; margin-bottom:auto; padding-bottom:10px}
.glyph sub{font-size:.6em}
.tn{position:absolute; top:12px; right:14px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.tt{font-weight:600; font-size:15px; line-height:1.3}
.tm{font-size:12.5px; color:var(--muted)}
/* прогресс в виде линейки с делениями */
.ruler{display:flex; height:8px; margin-top:6px; border-radius:2px; background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10%) var(--paper); border:1px solid var(--line); overflow:hidden}
.ruler i{display:block; height:100%}
.okp{background:var(--ok)} .badp{background:var(--red)}
.ruler.big{height:10px; margin:0 0 12px}
.note{font-size:13.5px; color:var(--muted); margin:2px 2px 10px}
.center{text-align:center; margin-top:22px}
.link{border:0; background:none; color:var(--ink); text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:6px}

/* тема: сетка номеров — клетки миллиметровки */
.tbar{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-bottom:12px}
.tbar .note{margin:0; flex:1 1 220px}
.nums{display:grid; grid-template-columns:repeat(10,1fr); border-left:1px solid var(--line); border-top:1px solid var(--line); margin-bottom:14px; background:var(--sheet); border-radius:2px}
.nums a{aspect-ratio:1; display:grid; place-items:center; font-size:13px; font-variant-numeric:tabular-nums; color:var(--text); text-decoration:none; border-right:1px solid var(--line); border-bottom:1px solid var(--line)}
.nums a.ok{background:var(--ok-soft); color:var(--ok); font-weight:600}
.nums a.bad{background:var(--red-soft); color:var(--red); font-weight:600}
.nums a.dim{color:color-mix(in srgb,var(--muted) 40%,transparent); background:none}
.pager{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px}
.pager a{display:grid; padding:10px 14px; border-radius:12px; background:var(--sheet); border:1px solid var(--line); text-decoration:none; font-size:14px; font-weight:600; color:var(--text)}
.pager a small{font-weight:400; color:var(--muted)}
.pager a:last-child{text-align:right}

/* карточка вопроса */
.list{display:grid; gap:10px}
.q{position:relative; background:var(--sheet); border:1px solid var(--line); border-radius:12px; padding:13px 14px; display:grid; gap:9px; box-shadow:var(--shadow)}
.q.flash{outline:2px solid var(--ink)}
.qt{margin:0; padding-right:34px}
.qn{font-weight:700; color:var(--ink); margin-right:8px; font-variant-numeric:tabular-nums}
.q img{max-width:min(100%,320px); max-height:200px; width:auto; height:auto; justify-self:start; background:#fff; border-radius:8px; padding:6px}
.ans{background:var(--ok-soft); color:var(--ok); font-weight:600; border-radius:10px; padding:9px 12px; text-align:left; border:0; width:100%}
.ans small{font-weight:400; opacity:.85}
.ans.hidden{background:var(--ink-soft); color:var(--ink); cursor:pointer; min-height:44px}
.others{font-size:13.5px; color:var(--muted)}
.star{position:absolute; top:6px; right:6px; width:40px; height:40px; border:0; background:none; color:var(--muted); font-size:21px; line-height:1; cursor:pointer; border-radius:10px}
.star.on{color:#E0A100}
.badge{display:inline-block; font-size:12px; font-weight:600; border-radius:6px; padding:0 7px; vertical-align:1px}
.badge.ok{color:var(--ok); background:var(--ok-soft)}
.badge.bad{color:var(--red); background:var(--red-soft)}
.rate{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.rate button{min-height:44px; border-radius:10px; border:1px solid var(--line); background:var(--sheet); font-weight:700; cursor:pointer}
.rate .ok{color:var(--ok); border-color:var(--ok)}
.rate .bad{color:var(--red); border-color:var(--red)}
.mine{font-size:14px; color:var(--red); text-decoration:line-through; text-decoration-color:color-mix(in srgb,var(--red) 50%,transparent)}
mark{background:var(--marker); color:inherit; border-radius:3px; padding:0 1px}
.empty{color:var(--muted); text-align:center; padding:32px 12px}
/* пояснение: поле тетради с синей линией, шаги решения */
.why{border-left:3px solid var(--ink); padding:2px 0 2px 14px; display:grid; gap:10px}
.why summary{cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:center; min-height:44px; border-radius:10px; background:var(--ink-soft); color:var(--ink); font-weight:700; margin-left:-14px}
.why[open] summary{margin-bottom:10px}
.why summary::-webkit-details-marker{display:none}
details.why{border-left:0; padding-left:0}
details.why[open]{border-left:3px solid var(--ink); padding-left:14px}
details.why[open] summary{margin-left:-14px}
.why-h{margin:0; color:var(--ink); font-size:16px}
.why summary .hd,.why[open] summary .sh{display:none}
.why[open] summary .hd{display:inline}
.why-step + .why-step,.why-step + .why-warn{margin-top:10px}
.why-step b{display:block; color:var(--ink); font-size:14px}
.why-step p,.why-warn p{margin:2px 0 0; font-size:15.5px; line-height:1.55}
.why-warn{background:var(--red-soft); border-radius:10px; padding:10px 12px}
.why-warn b{color:var(--red); font-size:14px}
.why-text{margin:0; font-size:15px}
.flag{color:var(--red)}
.why.open{animation:why .28s ease-out}
@keyframes why{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:none}}
.go.alt{background:var(--sheet); color:var(--text); border:1px solid var(--ink)}
.go.alt b{color:var(--ink)}
.go.alt span{opacity:1; color:var(--muted)}
.howto{margin:0; padding-left:22px; display:grid; gap:8px; font-size:15px}
.howto b{color:var(--ink)}

/* тест */
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px}
.chip{border:1px solid var(--line); background:var(--sheet); font-size:14px; border-radius:999px; padding:8px 13px; cursor:pointer; text-align:left}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--on-ink); border-color:var(--ink)}
.next{display:block; width:100%; margin:14px 0 8px; min-height:52px; border:0; border-radius:14px; background:var(--ink); color:var(--on-ink); font-size:17px; font-weight:700; cursor:pointer}
.next:disabled{opacity:.45; cursor:default}
.q.test{padding:16px}
.q.test .qt{padding-right:0; font-size:17px}
.opts{display:grid; gap:8px}
.opt{display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%; min-height:50px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--paper); cursor:pointer}
.opt .ok-n{flex:none; width:24px; height:24px; display:grid; place-items:center; border-radius:50%; border:1px solid var(--line); font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft); border-color:var(--ok); color:var(--ok); font-weight:600}
.opt.right .ok-n{border-color:var(--ok); background:var(--ok); color:var(--sheet)}
.opt.wrong{background:var(--red-soft); border-color:var(--red); color:var(--red)}
.opt.wrong span:last-child{text-decoration:line-through}
.opt.wrong .ok-n{border-color:var(--red); color:var(--red)}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--red)}
.tfoot{text-align:center}
/* итог — оценка красной ручкой, как в тетради */
.score{display:flex; align-items:center; gap:18px; background:var(--sheet); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:10px}
.grade{flex:none; width:84px; height:84px; display:grid; place-items:center; border:3px solid var(--red); border-radius:50% 46% 52% 48%; color:var(--red); font:italic 700 52px/1 var(--math); transform:rotate(-8deg)}
.score b{display:block; font-size:24px}
.score div span{color:var(--muted)}
@media (hover:hover){.opt:not(:disabled):hover,.chip:hover,.chipbtn:hover,.tile:hover,.pager a:hover{border-color:var(--ink)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; scroll-behavior:auto!important}}
.fab{position:fixed; right:calc(16px + env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); width:48px; height:48px; border-radius:50%; border:1px solid var(--line); background:var(--sheet); color:var(--ink); font-size:20px; font-weight:700; box-shadow:0 2px 10px rgba(0,0,0,.15); cursor:pointer}
</style>

<script id="data" type="application/json">[{"id":1,"title":"Механика","q":[{"t":"Из перечисленных единиц: 1) ньютон; 2) ватт; 3) джоуль; 4) килограмм – единицей измерения силы в Международной системе единиц является","a":"ньютон","x":[],"p":"","n":"","e":{"s":"Нужно найти, в каких единицах в СИ измеряют силу.","i":"У каждой физической величины своя единица. Силу назвали в честь Исаака Ньютона.","r":"Ньютон (Н) — единица силы: 1 Н = 1 кг·м/с², то есть такая сила разгоняет тело массой 1 кг с ускорением 1 м/с². Остальные варианты: ватт — мощность, джоуль — работа и энергия, килограмм — масса."}},{"t":"Из перечисленных ниже единиц: 1) ньютон; 2) ватт; 3) джоуль; 4) килограмм – единицей измерения массы в Международной системе единиц является","a":"килограмм","x":[],"p":"","n":"","e":{"s":"Нужно найти единицу массы в СИ.","i":"Килограмм — одна из семи основных единиц СИ, из которых выводятся все остальные.","r":"Масса измеряется в килограммах (кг). Ньютон — это сила, ватт — мощность, джоуль — работа и энергия."}},{"t":"На рисунке представлен график зависимости модуля равнодействующей всех сил, действующей на тело, движущееся прямолинейно, от времени. Скорость возрастала только в интервале","a":"0-4","x":["0-1","1-3","3-4"],"p":"f1_01.png","n":"","e":{"s":"По графику силы F(t) нужно понять, на каком интервале росла скорость тела.","i":"По второму закону Ньютона a = F/m. Пока на тело действует сила в направлении движения, скорость растёт. Когда сила становится нулём, скорость перестаёт меняться.","r":"На графике сила больше нуля с 0 до 4 с: сначала растёт (0–1 с), потом постоянна (1–3 с), потом убывает (3–4 с). Даже когда сила уменьшается, она всё ещё разгоняет тело, просто слабее. После 4 с сила равна нулю, и скорость больше не меняется. Значит, скорость росла весь интервал 0–4 с."}},{"t":"На рисунке представлены три варианта взаимного расположения векторов силы, действующей на тело, и скорости тела. Работа силы отрицательна в случае","a":"случай 2 (рисунок в архиве повреждён)","x":["1","3","1, 2, 3"],"p":"","n":"рисунок в архиве повреждён","e":{"s":"Есть три рисунка с векторами силы и скорости. Нужно найти тот, где работа силы отрицательна.","i":"Работа A = F·S·cosα, где α — угол между силой и направлением движения. Если α больше 90°, косинус отрицательный, и работа тоже. Такая сила тормозит тело.","r":"Если сила направлена по движению (α < 90°), работа положительна. Если перпендикулярно (α = 90°), работа равна нулю. Если против движения или под тупым углом (α > 90°), работа отрицательна. В ключе такой вариант — случай 2. Рисунок в архиве повреждён, поэтому запомни правило: тупой угол — отрицательная работа."}},{"t":"Линия, которую описывает точка в пространстве при своем движении, называется","a":"траекторией","x":["окружностью","перемещением","координатой"],"p":"","n":"","e":{"s":"Как называется линия, по которой движется точка?","i":"Это базовые понятия кинематики: траектория, путь, перемещение.","r":"Траектория — сама линия, которую «рисует» точка при движении (как след самолёта в небе). Путь — длина этой линии. Перемещение — стрелка (вектор) из начальной точки в конечную."}},{"t":"Шкив начинает вращение из состояния покоя под действием груза на нити. Через 2 с после начала вращения частота вращения равна 4 об/с. Если движение груза на протяжении 2 с было равноускоренным, то угловое ускорение вращения шкива равно","a":"4π с⁻²","x":["0,5π с⁻²","π с⁻²","2π с⁻²"],"p":"f1_03.png","n":"","e":{"s":"Шкив раскручивается грузом. Известно: через 2 с частота вращения 4 об/с. Нужно найти угловое ускорение.","i":"При равноускоренном вращении из покоя угловая скорость растёт равномерно: ω = ε·t. Частота ν (обороты в секунду) связана с угловой скоростью: ω = 2πν.","r":"1) Угловая скорость через 2 с: ω = 2π·4 = 8π рад/с.\n2) Начинали с нуля, поэтому ε = ω/t = 8π / 2 = 4π рад/с² (с⁻²)."}},{"t":"Линейный размер тела, движущегося относительно инерциальной системы отсчета в направлении движения","a":"уменьшается","x":["увеличивается","не изменяется","равен нулю"],"p":"","n":"","e":{"s":"Как меняется длина тела вдоль направления движения, если оно движется очень быстро?","i":"Это эффект специальной теории относительности — лоренцево сокращение длины. Оно заметно только при скоростях, близких к скорости света.","r":"l = l₀·√(1 − v²/c²). Корень всегда меньше единицы, поэтому для неподвижного наблюдателя размер движущегося тела вдоль движения уменьшается. Поперечные размеры не меняются."}},{"t":"Соотношение инертной (mи) и гравитационной (mг) масс одного и того же тела","a":"mи = mг","x":["mи < mг","mи > mг","mи >> mг"],"p":"","n":"","e":{"s":"Как соотносятся инертная масса (мера «нежелания» разгоняться) и гравитационная масса (мера притяжения)?","i":"Принцип эквивалентности: это одна и та же величина. Поэтому все тела падают с одинаковым ускорением.","r":"Если бы массы были разными, тяжёлый и лёгкий шар падали бы по-разному. Опыты (Галилей, Этвёш и современные) показывают равенство с огромной точностью. Ответ: mи = mг."}},{"t":"Брусок массой 0,2 кг равномерно тянут с помощью динамометра по горизонтальной поверхности стола. Показания динамометра 0,5 Н. Ускорение свободного падения примите равным 10 м/с2. Коэффициент трения скольжения равен","a":"0,25","x":["25","5,2","0,52"],"p":"","n":"","e":{"s":"Брусок равномерно тянут динамометром. Нужно найти коэффициент трения.","i":"«Равномерно» значит без ускорения, то есть силы уравновешены: сила тяги равна силе трения.","r":"1) Сила трения = показание динамометра = 0,5 Н.\n2) Сила трения F = μN, а на горизонтальном столе N = mg = 0,2·10 = 2 Н.\n3) μ = F/N = 0,5 / 2 = 0,25."}},{"t":"Уравнение зависимости проекции скорости движущегося тела от времени:","a":"Sx = 2t + 1,5t² (м)","x":["Sx = 1,5t² (м)","Sx = 2t + 3t² (м)","Sx = 3t + t² (м)"],"p":"f1_04.png","n":"","e":{"s":"Дана скорость vₓ = 2 + 3t. Нужно выбрать формулу перемещения.","i":"Сравни со стандартным видом: v = v₀ + at. Тогда перемещение S = v₀t + at²/2.","r":"1) Из vₓ = 2 + 3t: начальная скорость v₀ = 2 м/с, ускорение a = 3 м/с².\n2) S = v₀t + at²/2 = 2t + 3t²/2 = 2t + 1,5t².\nЧастая ошибка — забыть разделить ускорение на 2 и выбрать 2t + 3t²."}},{"t":"Момент инерции шара радиусом R, относительно оси, проходящей через центр масс шара, равен","a":"2/5·mR²","x":["mR²","1/3·mR²","1/2·mR²"],"p":"f1_05.png","n":"","e":{"s":"Чему равен момент инерции сплошного шара относительно оси через центр?","i":"Момент инерции показывает, насколько тело «упирается» вращению. Он зависит от того, как масса распределена относительно оси.","r":"Табличные формулы, которые стоит запомнить:\n• сплошной шар — 2/5·mR²;\n• тонкий обруч — mR²;\n• сплошной диск или цилиндр — 1/2·mR²;\n• стержень относительно центра — 1/12·ml².\nОтвет: 2/5·mR²."}},{"t":"Имеются два стержня одинаковой длины и сечения, изготовленные из одинакового материала. Сравните удлинения стержней, если приложенные к ним силы равны:","a":"Δl₂ = 2Δl₁","x":["Δl₁ = Δl₂","Δl₁ = 2Δl₂","среди ответов 1, 2, 3 нет правильного"],"p":"f1_06.png","n":"","e":{"s":"Два одинаковых стержня, к первому приложена сила F, ко второму 2F (на рисунке). Как соотносятся удлинения?","i":"Закон Гука: удлинение пропорционально силе, Δl = F·l/(E·S). Материал, длина и сечение одинаковые, значит, всё зависит только от силы.","r":"Сила на второй стержень вдвое больше, поэтому и удлинение вдвое больше: Δl₂ = 2Δl₁."}},{"t":"Два автомобиля с одинаковыми массами движутся со скоростями v и 3v относительно Земли в одном направлении. Кинетическая энергия второго автомобиля в системе отсчета, связанной с первым автомобилем, равна","a":"2mv²","x":["4mv²","mv²","3mv²"],"p":"f1_07.png","n":"","e":{"s":"Две машины одной массы едут в одну сторону со скоростями v и 3v. Какую кинетическую энергию у второй машины «видит» человек в первой?","i":"Скорость, а значит и кинетическая энергия, зависит от того, откуда смотреть. Смотрим из первой машины.","r":"1) Относительно первой машины вторая обгоняет её со скоростью 3v − v = 2v.\n2) E = mv²/2 со скоростью 2v: E = m·(2v)²/2 = m·4v²/2 = 2mv²."}},{"t":"Шар прикреплен на жестком и невесомом стержне длиной l на горизонтальной тонкой оси. Для совершения полного оборота вокруг горизонтальной оси шару надо сообщить скорость","a":"2√(gl)","x":["√(2gl)","√(gl)","√(3gl)"],"p":"f1_08.png","n":"","e":{"s":"Шар на жёстком невесомом стержне длиной l. Какую скорость дать внизу, чтобы он сделал полный оборот?","i":"Стержень жёсткий (не нить!): он может и толкать, и тянуть. Поэтому шару достаточно дойти до верхней точки хотя бы с нулевой скоростью. Работает закон сохранения энергии.","r":"1) Верхняя точка выше нижней на 2l (диаметр окружности).\n2) Вся кинетическая энергия уходит на подъём: mv²/2 = mg·2l.\n3) v² = 4gl ⇒ v = 2√(gl).\nНа нити ответ был бы другим: √(5gl), потому что нить должна оставаться натянутой."}},{"t":"Из перечисленных свойств пространства и времени: 1) однородность пространства; 2) изотропность пространства; 3) однородность времени – с законом сохранения энергии связаны","a":"однородность времени","x":[],"p":"","n":"","e":{"s":"Какое свойство пространства-времени связано с законом сохранения энергии?","i":"Теорема Нётер: каждой симметрии природы соответствует закон сохранения.","r":"Три пары, которые стоит запомнить:\n• однородность времени (законы не меняются со временем) → сохранение энергии;\n• однородность пространства (законы одинаковы в любом месте) → сохранение импульса;\n• изотропность пространства (все направления равноправны) → сохранение момента импульса.\nОтвет: однородность времени."}},{"t":"Характер течения жидкости зависит от безразмерной величины, называемой","a":"числом Рейнольдса","x":["модулем Юнга","коэффициентом трения","коэффициентом Пуассона"],"p":"","n":"","e":{"s":"Какая величина определяет, будет течение спокойным или вихревым?","i":"Число Рейнольдса Re = ρvd/η сравнивает силы инерции и силы вязкости.","r":"При малом Re (медленно, вязко, узко) течение ламинарное — слоями. При большом Re (быстро, широко) течение турбулентное — с вихрями. Ответ: число Рейнольдса."}},{"t":"Брусок массой 0,2 кг прижат к вертикальной стене с силой 5 Н. Коэффициент трения между бруском и стеной равен 0,2. Сила трения скольжения бруска о стену равна","a":"1 Н","x":["2 Н","5 Н","4 Н"],"p":"","n":"","e":{"s":"Брусок прижимают к стене силой 5 Н, коэффициент трения 0,2. Чему равна сила трения скольжения?","i":"Сила трения скольжения F = μN, где N — сила, прижимающая тело к поверхности. Здесь его прижимают к стене, а не к полу.","r":"1) Прижимающая сила N = 5 Н (масса бруска на неё не влияет, сила тяжести направлена вдоль стены).\n2) F = μN = 0,2·5 = 1 Н.\nМасса 0,2 кг — лишнее данное, чтобы запутать."}},{"t":"В системе отсчета, связанной с поверхностью Земли, вращающейся вокруг своей оси, законы сохранения импульса и энергии действуют следующим образом","a":"оба закона строго не выполняются","x":["закон сохранения энергий выполняется, закон сохранения импульса не выполняется","закон сохранения импульса выполняется, закон сохранения энергии не выполняется","выполняются оба закона"],"p":"","n":"","e":{"s":"Выполняются ли законы сохранения импульса и энергии в системе отсчёта, связанной с вращающейся Землёй?","i":"Законы сохранения в привычном виде верны только в инерциальных системах отсчёта. Вращающаяся система неинерциальна.","r":"Из-за вращения в такой системе появляются силы инерции: центробежная и Кориолиса. Их нельзя приписать взаимодействию тел, поэтому строго оба закона не выполняются. На практике эти эффекты малы, и их часто не учитывают."}},{"t":"Координата точки, движущейся прямолинейно, меняется по закону x = 5 + 2t – 0,5t2. Скорость точки через 1 секунду после начального момента времени равна","a":"1 м/с","x":["5 м/с","2 м/с","0,5 м/с"],"p":"","n":"","e":{"s":"Координата x = 5 + 2t − 0,5t². Нужно найти скорость при t = 1 с.","i":"Скорость — производная координаты по времени. Или сравни с формулой x = x₀ + v₀t + at²/2.","r":"1) Из формулы: v₀ = 2 м/с, a/2 = −0,5 ⇒ a = −1 м/с².\n2) v = v₀ + at = 2 − 1·t.\n3) При t = 1 с: v = 2 − 1 = 1 м/с."}},{"t":"Из приведенных ниже формулировок, выберите ту, которая соответствует понятию «момент импульса»:","a":"физическая величина, определяемая векторным произведением [rp]","x":["физическая величина, характеризующая распределение масс в теле, мера инертности тела при вращательном движении, равная сумме произведений масс n материальных точек системы на квадраты их расстояний до рассматриваемой оси","физическая величина, характеризующая вращательный эффект силы при действии ее на твердое тело, определяемая векторным произведением радиуса-вектора, проведенного из точки О в точку А приложения силы, на силу","векторная величина, мера механического движения, численно равная произведению массы материальной точки на ее скорость и имеющая направление скорости"],"p":"","n":"","e":{"s":"Какое определение соответствует моменту импульса?","i":"Момент импульса — «вращательный» аналог импульса.","r":"Для точки: L = [r × p], векторное произведение радиус-вектора на импульс (L = mvr для движения по окружности). Для тела: L = Jω. Ответ: величина, определяемая векторным произведением [rp]."}},{"t":"Единицей измерения работы в Международной системе единиц является","a":"Джоуль","x":["ватт","ньютон","килограмм"],"p":"","n":"","e":{"s":"Какая единица работы в СИ?","i":"Работа — это сила, умноженная на путь: A = F·S.","r":"Единица работы — джоуль: 1 Дж = 1 Н·1 м. В джоулях же измеряют энергию и количество теплоты."}},{"t":"Шар массой m, движущийся со скоростью v, сталкивается с неподвижным шаром той же массы. Если столкновение центральное, упругое и сохраняется механическая энергия, то кинетическая энергия второго шара равна","a":"mv²/2","x":["mv²/4","0","mv²"],"p":"f1_09.png","n":"","e":{"s":"Шар массы m со скоростью v упруго налетает на такой же неподвижный шар (центральный удар). Какая энергия у второго шара?","i":"При упругом ударе сохраняются и импульс, и энергия. У шаров равной массы при центральном ударе получается обмен скоростями.","r":"1) Первый шар останавливается, второй уезжает со скоростью v (как в бильярде, когда шар бьёт ровно в центр другого).\n2) Энергия второго шара: mv²/2 — вся энергия первого перешла ему."}},{"t":"Тележка массой 2 кг, движущаяся со скоростью 3 м/с, сталкивается с неподвижной тележкой массой 4 кг и сцепляется с ней. Скорость обеих тележек после взаимодействия равна","a":"1 м/с","x":["3 м/с","1,5 м/с","6 м/с"],"p":"","n":"","e":{"s":"Тележка 2 кг (3 м/с) врезается в неподвижную 4 кг и сцепляется с ней. Нужно найти общую скорость.","i":"Тележки сцепились — это неупругий удар. Энергия часть теряется, но импульс сохраняется всегда.","r":"1) Импульс до удара: 2·3 + 4·0 = 6 кг·м/с.\n2) После удара тележки едут вместе: (2 + 4)·v = 6.\n3) v = 6/6 = 1 м/с."}},{"t":"Энергия механического движения системы выражается формулой","a":"mv²/2","x":["mv","mv²/4","mv²"],"p":"f1_10.png","n":"","e":{"s":"Какой формулой выражается энергия механического движения?","i":"Энергия движения — кинетическая энергия.","r":"E = mv²/2. Остальные варианты: mv — импульс, mv²/4 — неверный коэффициент, mv² — без деления на 2."}},{"t":"Два электрона движутся навстречу друг другу. Скорости электронов в системе отсчета, связанной с Землей, равны по 250 000 км/с. Скорость v первого электрона в системе отсчета, связанной со вторым, равна","a":"250 000 < v < 300 000 км/с","x":["300 000 км/с","0 км/с","250 000 км/с"],"p":"","n":"","e":{"s":"Два электрона летят навстречу, каждый со скоростью 250 000 км/с относительно Земли. С какой скоростью первый движется относительно второго?","i":"При скоростях, близких к скорости света (c ≈ 300 000 км/с), скорости нельзя просто складывать. Нужна релятивистская формула, и результат никогда не превышает c.","r":"1) Если сложить по-школьному, получится 500 000 км/с — больше скорости света, так быть не может.\n2) По формуле СТО: v = (v₁ + v₂)/(1 + v₁v₂/c²) = 500 000/(1 + 0,694) ≈ 295 000 км/с.\n3) Это больше 250 000, но меньше 300 000 км/с."}},{"t":"Подъемный кран поднимает равномерно груз 5000 кг на высоту 10 м за 25 с. Полезная мощность равна","a":"20 кВт","x":["2 кВт","200 кВт","0,2 кВт"],"p":"","n":"","e":{"s":"Кран равномерно поднимает 5000 кг на 10 м за 25 с. Нужно найти полезную мощность.","i":"Мощность — работа за единицу времени: N = A/t. Полезная работа при подъёме — увеличение потенциальной энергии: A = mgh.","r":"1) A = mgh = 5000·10·10 = 500 000 Дж.\n2) N = A/t = 500 000 / 25 = 20 000 Вт = 20 кВт."}},{"t":"Жидкость течет через трубу с переменным поперечным сечением. Скорость течения жидкости и давление жидкости на стенки трубы имеют максимальные значения в сечении","a":"скорость максимальна в 2, давление – в 1","x":["скорость максимальна в 1, давление – в 2","2","1"],"p":"f1_11.png","n":"","e":{"s":"В трубе с разным сечением (широкое 1 и узкое 2) нужно понять, где скорость больше и где давление больше.","i":"1) Уравнение неразрывности: сколько жидкости втекает, столько и вытекает, поэтому в узком месте она течёт быстрее (S·v = const).\n2) Уравнение Бернулли: где скорость больше, там давление меньше.","r":"Сечение 2 узкое, поэтому скорость максимальна в 2. Значит, давление в 2 меньше, а максимально оно в широком сечении 1. Ответ: скорость максимальна в 2, давление — в 1."}},{"t":"В инерциальных системах отсчета, законы сохранения импульса и энергии, в замкнутых системах тел действуют следующим образом","a":"закон сохранения импульса выполняется, закон сохранения энергии может не выполняться","x":["выполняются всегда","выполняются иногда","закон сохранения энергии выполняется, закон сохранения импульса может не выполняться"],"p":"","n":"","e":{"s":"Как в инерциальной системе действуют законы сохранения импульса и энергии для замкнутой системы тел?","i":"Импульс замкнутой системы сохраняется при любых внутренних взаимодействиях. Механическая энергия сохраняется не всегда.","r":"Если внутри системы есть трение или неупругие удары, часть механической энергии переходит в тепло. Тогда механическая энергия не сохраняется, а импульс — да. Поэтому ответ: импульс сохраняется, энергия (механическая) может не сохраняться."}},{"t":"Из перечисленных сил: 1) сила тяжести; 2) сила упругости; 3) сила трения – в механике при переходе из одной инерциальной системы отсчета в другую сохраняют свое значение","a":"сила тяжести; сила упругости; сила трения","x":[],"p":"","n":"","e":{"s":"Какие силы не меняются при переходе из одной инерциальной системы отсчёта в другую?","i":"В классической механике сила зависит от расстояний между телами и их относительных скоростей. А они одинаковы во всех ИСО (преобразования Галилея).","r":"Сила тяжести зависит от расстояния, сила упругости — от деформации, сила трения — от относительной скорости. Ни одна из этих величин не меняется при смене ИСО. Поэтому все три силы сохраняют своё значение."}},{"t":"Вторая космическая скорость рассчитывается по формуле","a":"√(2GM/R)","x":["√(GM/R²)","√(GM/2R)","√(GM/R)"],"p":"f1_12.png","n":"","e":{"s":"По какой формуле считают вторую космическую скорость?","i":"Вторая космическая скорость — минимальная скорость, чтобы навсегда улететь от планеты. Кинетической энергии должно хватить, чтобы «выбраться из гравитационной ямы».","r":"1) mv²/2 = GMm/R (кинетическая энергия равна энергии притяжения у поверхности).\n2) v = √(2GM/R) ≈ 11,2 км/с для Земли.\nНе путай с первой космической: √(GM/R) ≈ 7,9 км/с — это полёт по орбите."}},{"t":"Из перечисленных физических моделей: 1) идеальный газ; 2) абсолютно твердое тело; 3) абсолютно черное тело; 4) материальная точка – в механике используются","a":"абсолютно твердое тело; материальная точка","x":[],"p":"","n":"","e":{"s":"Какие физические модели используются в механике?","i":"Модель — упрощение реального объекта. У каждого раздела физики свои модели.","r":"В механике: материальная точка (размеры не важны) и абсолютно твёрдое тело (не деформируется). Идеальный газ — модель молекулярной физики, абсолютно чёрное тело — модель теплового излучения."}},{"t":"Из перечисленных свойств пространства и времени: 1) однородность пространства; 2) изотропность пространства; 3) однородность времени – с законом сохранения импульса связаны","a":"однородность пространства","x":[],"p":"","n":"","e":{"s":"Какое свойство пространства связано с законом сохранения импульса?","i":"Теорема Нётер: симметрия ↔ закон сохранения.","r":"Однородность пространства: если перенести опыт в другое место, результат не изменится. Отсюда следует сохранение импульса. (Время → энергия, изотропность → момент импульса.)"}},{"t":"Если между направлением силы F и перемещения S угол a, то рассчитывать работу силы F следует по формуле","a":"FS·cosα","x":["(FS)sina","(F/S)cosa","FSsina"],"p":"","n":"","e":{"s":"Сила F направлена под углом α к перемещению S. По какой формуле считать работу?","i":"Работу совершает только та часть силы, которая направлена вдоль перемещения. Эта часть равна F·cosα.","r":"A = F·S·cosα. Проверка: при α = 0 вся сила работает (A = FS), при α = 90° работа ноль (сила тяжести не работает при горизонтальном движении)."}},{"t":"Покоящееся тело начинает движение с постоянным ускорением. В третью секунду оно проходит путь 5 м. За 3 с тело пройдет путь","a":"9 м","x":["3 м","5 м","10 м"],"p":"","n":"","e":{"s":"Тело разгоняется из покоя равноускоренно. За третью секунду оно прошло 5 м. Какой путь за 3 с?","i":"«За третью секунду» — это путь от t = 2 с до t = 3 с, а не за 3 секунды. Путь из покоя S = at²/2.","r":"1) Путь за 3 с: a·9/2. Путь за 2 с: a·4/2.\n2) За третью секунду: a·9/2 − a·4/2 = 2,5a = 5 м ⇒ a = 2 м/с².\n3) За все 3 с: S = 2·9/2 = 9 м."}},{"t":"Сравните модуль веса тела на полюсе Р1, на средней широте Р2 и на экваторе P3","a":"P1>P2>P3","x":["P1<P2<P3","P1<P2>P3","P1=P2=P3"],"p":"","n":"","e":{"s":"Где вес тела больше: на полюсе, на средней широте или на экваторе?","i":"Земля вращается. Чем дальше точка от оси вращения, тем больше нужно силы, чтобы держать тело на круговой траектории, и тем меньше тело давит на опору. К тому же Земля сплюснута, и на полюсе ближе к центру.","r":"На полюсе расстояние до оси равно нулю, вращение не мешает, и полюс ближе к центру Земли. Вес максимальный. На экваторе расстояние до оси наибольшее, и до центра дальше. Вес минимальный. Ответ: P1 > P2 > P3."}},{"t":"Пушка сообщает снаряду массой 10 кг кинетическую энергию 5 МДж. Кинетическая энергия снаряда относительно Земли при выстреле из самолета, летящего горизонтально со скоростью 1 км/с, в направлении его полета равна","a":"20 МДж","x":["15 МДж","5 МДж","10 МДж"],"p":"","n":"","e":{"s":"Пушка даёт снаряду 10 кг энергию 5 МДж. Какая будет энергия относительно Земли, если стрелять из самолёта, летящего вперёд со скоростью 1 км/с?","i":"Сначала найдём скорость снаряда относительно пушки, затем сложим со скоростью самолёта (стреляют вперёд).","r":"1) Из E = mv²/2: v = √(2E/m) = √(2·5 000 000/10) = 1000 м/с.\n2) Относительно Земли: 1000 + 1000 = 2000 м/с.\n3) E = 10·2000²/2 = 20 000 000 Дж = 20 МДж.\nЭнергия выросла вчетверо, а не вдвое: она зависит от квадрата скорости."}},{"t":"Импульс тела выражается формулой","a":"mv⃗","x":["mv²/2","F⃗t","ma⃗"],"p":"f1_13.png","n":"","e":{"s":"По какой формуле считают импульс тела?","i":"Импульс — «количество движения»: чем тяжелее и быстрее тело, тем труднее его остановить.","r":"p⃗ = m·v⃗ — вектор, направленный как скорость. Остальные варианты: mv²/2 — энергия, ma — сила, Ft — импульс силы (он равен изменению импульса, но импульс тела — именно mv)."}},{"t":"Равнодействующая всех сил, действующих на тело, равна нулю. Это тело: 1) находится в состоянии покоя; 2) движется равномерно и прямолинейно; 3) движется равноускоренно","a":"находится в состоянии покоя; движется равномерно и прямолинейно","x":[],"p":"","n":"","e":{"s":"Равнодействующая сил равна нулю. Что делает тело?","i":"Первый закон Ньютона: без нескомпенсированной силы скорость тела не меняется.","r":"Скорость не меняется: либо остаётся нулевой (тело покоится), либо постоянной (движется равномерно и прямолинейно). Равноускоренное движение невозможно: для ускорения нужна сила."}},{"t":"Из перечисленных величин: 1) путь; 2) перемещение; 3) скорость – векторными являются","a":"перемещение; скорость","x":[],"p":"","n":"","e":{"s":"Какие из величин — путь, перемещение, скорость — векторы?","i":"Вектор имеет и величину, и направление, а скаляр — только величину.","r":"Перемещение — стрелка из начала в конец, вектор. Скорость указывает, куда движется тело, тоже вектор. Путь — просто длина пройденной линии, без направления, скаляр."}},{"t":"Сила трения качения может быть вычислена по формуле","a":"Fтр = fк·N/R","x":["Fтр = fист(N + Sρ₀)","Fтр = fN","Fтр = fP·cosα"],"p":"f1_14.png","n":"","e":{"s":"Какой формулой считают силу трения качения?","i":"При качении колесо слегка вминается в опору, и возникает сопротивление. Оно тем меньше, чем больше радиус колеса.","r":"Fтр = fк·N/R, где fк — коэффициент трения качения (в метрах), N — сила давления, R — радиус. Поэтому большие колёса катятся легче. Формула μN — для трения скольжения, а не качения."}},{"t":"Период обращения спутника вокруг Земли по круговой орбите, радиус которой равен r, пропорционален","a":"T ~ r^(3/2)","x":["T ~ r","T ~ r^(1/2)","T ~ r²"],"p":"f1_15.png","n":"","e":{"s":"Как период спутника на круговой орбите зависит от радиуса r?","i":"Третий закон Кеплера: квадрат периода пропорционален кубу радиуса орбиты.","r":"1) Гравитация даёт центростремительное ускорение: GM/r² = 4π²r/T².\n2) Отсюда T² = 4π²r³/(GM), то есть T² ~ r³.\n3) T ~ r^(3/2)."}},{"t":"От формы пути зависит работа следующих из перечисленных сил: 1) силы тяготения; 2) силы упругости; 3) силы трения","a":"силы трения","x":[],"p":"","n":"","e":{"s":"Работа каких сил зависит от формы пути: тяготения, упругости или трения?","i":"Есть консервативные силы: их работа зависит только от начальной и конечной точки. У неконсервативных работа зависит от пути.","r":"Тяготение и упругость консервативны: при подъёме и спуске на ту же высоту работа в сумме нулевая. Трение всегда против движения: чем длиннее путь, тем больше работа. Ответ: сила трения."}},{"t":"Кинетическая энергия тела массой 3 кг, движущегося со скоростью 4 м/с равна","a":"24 Дж","x":["12 Дж","48 Дж","4,8 Дж"],"p":"","n":"","e":{"s":"Тело 3 кг движется со скоростью 4 м/с. Нужно найти кинетическую энергию.","i":"E = mv²/2.","r":"E = 3·4²/2 = 3·16/2 = 24 Дж."}},{"t":"Масса и радиус планеты в 2 раза больше, чем у Земли. Ускорение свободного падения на поверхности этой планеты равно","a":"4,9 м/с²","x":["9,8 м/с2","19,6 м/с2","2,45 м/с2"],"p":"","n":"","e":{"s":"У планеты масса и радиус в 2 раза больше, чем у Земли. Какое ускорение свободного падения?","i":"g = GM/R². Масса стоит в числителе, радиус в квадрате — в знаменателе.","r":"1) Масса ×2 — g тоже ×2.\n2) Радиус ×2 — R² ×4 — g в 4 раза меньше.\n3) В итоге g′ = g·2/4 = g/2 = 9,8/2 = 4,9 м/с²."}},{"t":"Если тело движется вдоль некоторой линии, то количество степеней свободы, которыми оно обладает равно","a":"1","x":["2","3","4"],"p":"","n":"","e":{"s":"Тело движется вдоль заданной линии. Сколько у него степеней свободы?","i":"Степени свободы — число независимых координат, которые задают положение тела.","r":"Если тело может двигаться только вдоль линии (как бусинка на нитке), его положение задаёт одно число — расстояние вдоль линии. Значит, степень свободы одна. На плоскости их было бы 2, в пространстве — 3."}},{"t":"Законы движения макроскопических тел со скоростями, сравнимыми со скоростью света, изучаются","a":"специальной теорией относительности","x":["классической механикой","кинематикой","квантовой механикой"],"p":"","n":"","e":{"s":"Какая теория описывает движение тел со скоростями, близкими к скорости света?","i":"Механика Ньютона хорошо работает при обычных скоростях. При скоростях, сравнимых с c, нужна теория Эйнштейна.","r":"Специальная теория относительности (СТО). Она описывает замедление времени, сокращение длины и релятивистское сложение скоростей. Классическая механика — её частный случай при v ≪ c."}},{"t":"Космические корабли нельзя рассматривать как материальные точки 1) при расчете маневра стыковки двух космических кораблей; 2) периода обращения космических кораблей вокруг Земли; 3) времени пребывания в плотных слоях атмосферы","a":"только в 1-м случае","x":["только в 3-м случае","только в 2-м случае","в 1, 2, 3-м случаях"],"p":"","n":"","e":{"s":"В каком случае космический корабль нельзя считать материальной точкой?","i":"Тело можно считать точкой, если его размеры не важны в данной задаче.","r":"Для периода обращения вокруг Земли и времени в атмосфере размеры корабля ничтожны по сравнению с орбитой — точка подходит. При стыковке важны форма, размеры и ориентация кораблей — точка не подходит. Ответ: только в 1-м случае."}},{"t":"Из утверждений: 1) все процессы природы протекают одинаково в любой ИСО; 2) скорость света в вакууме одинакова для всех ИСО; 3) все процессы природы относительны и протекают в различных ИСО не одинаково – постулатами теории относительности являются","a":"все процессы природы протекают одинаково в любой ИСО; скорость света в вакууме одинакова для всех ИСО","x":[],"p":"","n":"","e":{"s":"Какие утверждения — постулаты теории относительности?","i":"У СТО два исходных постулата.","r":"1) Принцип относительности: все процессы природы идут одинаково во всех инерциальных системах (опытом внутри вагона нельзя понять, едет ли он равномерно).\n2) Скорость света в вакууме одинакова во всех ИСО.\nТретье утверждение («процессы протекают неодинаково») противоречит первому постулату."}},{"t":"Физическая величина, характеризующая распределение масс в теле, мера инертности тела при вращательном движении называется","a":"моментом инерции","x":["моментом импульса","моментом силы","центром масс"],"p":"","n":"","e":{"s":"Как называется мера инертности тела при вращении?","i":"При поступательном движении инертность измеряет масса, при вращении — момент инерции.","r":"Момент инерции J = Σmr². Он зависит не только от массы, но и от того, как далеко она от оси. Поэтому фигурист, прижав руки, крутится быстрее."}},{"t":"Шар, наполненный водородом, удерживается на нити, прикрепленной к полу вагона. В момент начала движения вагона нить с шаром","a":"отклонится назад","x":["не отклонится","отклонится вперед","отклонится перпендикулярно направлению движения"],"p":"f1_16.png","n":"","e":{"s":"В разгоняющемся вагоне на нити, привязанной к полу, висит шар с водородом. Куда он отклонится при старте?","i":"В вагоне, который разгоняется вправо, всё ведёт себя так, будто появилась дополнительная «сила тяжести» назад (сила инерции). Тяжёлые тела отклоняются назад.","r":"Принятый ответ — «отклонится назад»: обычно рассуждают так, как с привычным маятником.","w":"По строгой физике шар легче воздуха ведёт себя наоборот. Воздух в вагоне при разгоне сжимается к задней стенке, и выталкивающая сила толкает лёгкий шар вперёд, по ускорению — как пузырёк в бутылке. В тесте выбирай ответ из ключа."}},{"t":"Наиболее общую формулировку II закона Ньютона выражает формула","a":"F⃗ = dp⃗/dt","x":["F = mω²R","F⃗ = ma⃗","F⃗ = m·dv⃗/dt"],"p":"f1_17.png","n":"","e":{"s":"Какая формула выражает второй закон Ньютона в самом общем виде?","i":"Изначально Ньютон сформулировал закон через импульс.","r":"F = dp/dt: сила равна скорости изменения импульса. Эта форма верна даже если масса меняется (ракета теряет топливо). F = ma — частный случай при постоянной массе."}},{"t":"Система двух брусков, связанных нитью, движется под действием горизонтальной силы F. Масса каждого бруска равна 2m. Трением пренебречь. Величина силы, действующей на брусок 1 со стороны нити, равна","a":"F/2","x":["F/4","F","0"],"p":"f1_18.png","n":"","e":{"s":"Два бруска по 2m, связанные нитью; второй тянут силой F. С какой силой нить тянет первый брусок?","i":"1) Сначала находим ускорение всей системы.\n2) Потом смотрим, какая сила нужна, чтобы разогнать только первый брусок.","r":"1) Общая масса 2m + 2m = 4m, ускорение a = F/(4m).\n2) Первый брусок разгоняет только нить: T = 2m·a = 2m·F/(4m) = F/2."}},{"t":"Часы, движущиеся относительно инерциальной системы отсчета по сравнению с покоящимися часами, идут","a":"медленнее","x":["быстрее","одинаково","стоят"],"p":"","n":"","e":{"s":"Как идут часы, которые движутся относительно наблюдателя?","i":"Эффект СТО — замедление времени.","r":"Δt = Δt₀/√(1 − v²/c²). Знаменатель меньше 1, поэтому для наблюдателя движущиеся часы идут медленнее. Это подтверждено опытами: часы на самолётах и спутниках GPS приходится корректировать."}},{"t":"Деформация тела, которая исчезает после прекращения действия внешних сил, называется","a":"упругой деформацией","x":["пределом прочности","пластической деформацией","текучестью материала"],"p":"","n":"","e":{"s":"Как называется деформация, которая исчезает после снятия нагрузки?","i":"Деформации бывают упругие и пластические.","r":"Упругая деформация полностью исчезает (пружина, резинка). Пластическая остаётся (пластилин, согнутая проволока)."}},{"t":"Чему равен момент инерции тонкого обруча относительно оси, проходящей через его край и перпендикулярной плоскости диска, если момент инерции обруча относительно оси, проходящей через его центр масс перпендикулярно плоскости диска, равен","a":"2mR²","x":["0,4mR²","3/2·mR²","mR²"],"p":"f1_19.png","n":"","e":{"s":"Момент инерции обруча относительно центра равен mR². Каков он относительно оси через край обруча?","i":"Теорема Штейнера: если сдвинуть ось на расстояние d, к моменту инерции добавляется md².","r":"1) Ось через край отстоит от центра на d = R.\n2) J = J₀ + md² = mR² + mR² = 2mR²."}},{"t":"Для того, чтобы стал возможным выход космического корабля за пределы Солнечной системы, его минимальная начальная скорость у поверхности Земли должна быть","a":"16,7 км/с","x":["8 км/с","11,2 км/с","12,4 км/с"],"p":"","n":"","e":{"s":"Какая минимальная скорость нужна, чтобы покинуть Солнечную систему?","i":"Есть три космические скорости: 1-я (≈ 7,9 км/с) — орбита Земли, 2-я (≈ 11,2 км/с) — улететь от Земли, 3-я (≈ 16,7 км/с) — улететь от Солнца.","r":"Чтобы покинуть Солнечную систему, нужна третья космическая скорость — около 16,7 км/с (с учётом того, что Земля уже движется вокруг Солнца)."}},{"t":"При растяжении пружины на 2 см возникает сила упругости 20 Н. Жесткость пружины равна","a":"1000 Н/м","x":["4000 Н/м","40 Н/м","10 Н/м"],"p":"","n":"","e":{"s":"Пружину растянули на 2 см, сила упругости 20 Н. Какая жёсткость?","i":"Закон Гука: F = kx. Сантиметры обязательно переведи в метры.","r":"1) x = 2 см = 0,02 м.\n2) k = F/x = 20 / 0,02 = 1000 Н/м."}},{"t":"Если при движении материальной точки тангенциальное ускорение равно нулю, а нормальное ускорение постоянно, то тело движется","a":"равномерно по окружности","x":["равномерно и прямолинейно","равнопеременно по окружности","равнопеременно и прямолинейно"],"p":"","n":"","e":{"s":"Тангенциальное ускорение равно нулю, нормальное постоянно. Как движется тело?","i":"Тангенциальное ускорение меняет величину скорости, нормальное — её направление.","r":"1) aτ = 0 — скорость по модулю не меняется (равномерное движение).\n2) aₙ = v²/R постоянно и не ноль — тело всё время поворачивает с одинаковым радиусом.\nВместе это равномерное движение по окружности."}},{"t":"Из перечисленных свойств пространства и времени: 1) однородность пространства; 2) изотропность пространства; 3) однородность времени – с законом сохранения момента импульса связаны","a":"изотропность пространства","x":[],"p":"","n":"","e":{"s":"Какое свойство пространства связано с сохранением момента импульса?","i":"Теорема Нётер.","r":"Изотропность пространства — все направления равноправны: если повернуть установку, результат опыта не изменится. Отсюда сохранение момента импульса."}},{"t":"Из приведенных ниже формулировок, выберите ту, которая соответствует понятию «момент силы»:","a":"физическая величина, характеризующая вращательный эффект силы при действии ее на твердое тело, определяемая векторным произведением радиуса-вектора, проведенного из точки О в точку А приложения силы, на силу","x":["физическая величина, характеризующая распределение масс в теле, мера инертности тела при вращательном движении, равная сумме произведений масс n материальных точек системы на квадраты их расстояний до рассматриваемой оси","физическая величина, определяемая векторным произведением [rp]","векторная величина, мера механического движения, численно равная произведению массы материальной точки на ее скорость и имеющая направление скорости"],"p":"","n":"","e":{"s":"Что такое момент силы?","i":"Момент силы показывает, насколько сила способна повернуть тело. Пример — дверь: толкать у ручки легче, чем у петель.","r":"M = [r × F] — векторное произведение радиус-вектора точки приложения на силу. По модулю M = F·d, где d — плечо (расстояние от оси до линии действия силы)."}},{"t":"Цилиндрический сосуд высотой 80 см заполнен доверху водой. В боковой стенке сосуда имеются отверстия на расстоянии 20 см (1-е), 40 см (2-е) и 60 см (3-е) от поверхности стола. С наибольшей скоростью из сосуда вытекает струя воды из отверстия","a":"2-го","x":["1-го","3-го","из всех отверстий с одинаковой скоростью"],"p":"","n":"","e":{"s":"В сосуде высотой 80 см отверстия на высоте 20, 40 и 60 см от стола. Из какого вода бьёт «сильнее всего»?","i":"Скорость вытекания зависит от глубины под поверхностью воды (формула Торричелли v = √(2gh)), а дальность струи — ещё и от высоты отверстия над столом.","r":"1) По скорости: глубже всего нижнее отверстие (60 см под поверхностью), там струя самая быстрая.\n2) По дальности полёта: x = 2√(h·H), где h — глубина, H — высота над столом. Для 20 см: 2√(0,6·0,2) ≈ 0,69 м; для 40 см: 2√(0,4·0,4) = 0,8 м; для 60 см: 2√(0,2·0,6) ≈ 0,69 м. Дальше всего бьёт среднее — 2-е отверстие.","w":"В ключе ответ «2-го» — так получается, если вопрос о дальности струи. Если строго о скорости, она максимальна у нижнего отверстия. В тесте выбирай ответ из ключа."}},{"t":"Центр масс замкнутой системы","a":"движется прямолинейно, равномерно или покоится","x":["покоится","движется ускоренно","движется прямолинейно"],"p":"","n":"","e":{"s":"Как движется центр масс замкнутой системы?","i":"Замкнутая система — на неё не действуют внешние силы. Внутренние силы попарно уравновешены (третий закон Ньютона).","r":"Без внешней силы ускорения у центра масс нет. Значит, он покоится или движется равномерно и прямолинейно. Например, при взрыве снаряда осколки разлетаются, а их общий центр масс продолжает лететь как ни в чём не бывало."}},{"t":"Сила Кориолиса действует на тело","a":"движущееся во вращающейся системе отсчета","x":["движущееся поступательно и ускоренно","движущееся равномерно","покоящееся во вращающейся системе отсчета"],"p":"","n":"","e":{"s":"На какие тела действует сила Кориолиса?","i":"Это сила инерции во вращающейся системе отсчёта: F = −2m[ω × v].","r":"Она зависит от скорости тела относительно вращающейся системы. Если тело покоится в этой системе, силы Кориолиса нет. Значит, она действует на тела, которые движутся во вращающейся системе (реки подмывают правый берег, циклоны закручиваются)."}},{"t":"Кинетическая энергия тела, вращающегося вокруг неподвижной оси Z равна","a":"Jz·ω²/2","x":["Lz·ω²/2","Mz·ω²/2","mv²/2"],"p":"f1_20.png","n":"","e":{"s":"Какая формула даёт кинетическую энергию вращения?","i":"Для вращения масса заменяется моментом инерции J, а скорость — угловой скоростью ω.","r":"E = Jz·ω²/2 — полный аналог mv²/2. Остальные варианты: момент силы M и момент импульса L сюда не подставляют, mv²/2 — для поступательного движения."}},{"t":"Из нижеперечисленных выражений определяет потенциальную энергию сжатой пружины","a":"kx²/2","x":["mv²/2","mv","mgh"],"p":"f1_21.png","n":"","e":{"s":"Какая формула выражает энергию сжатой пружины?","i":"Это потенциальная энергия упругой деформации.","r":"E = kx²/2, где k — жёсткость, x — сжатие или растяжение. Другие варианты: mv²/2 — кинетическая энергия, mv — импульс, mgh — энергия поднятого тела."}},{"t":"Шар массой m, движущийся со скоростью v, сталкивается с неподвижным шаром той же массы. Если после центрального неупругого столкновения тела движутся как единое целое, то кинетическая энергия первого шара после такого столкновения равна","a":"mv²/8","x":["mv²/4","0","mv²/2"],"p":"f1_22.png","n":"","e":{"s":"Шар налетает на такой же неподвижный, и они слипаются. Какая кинетическая энергия у первого шара после удара?","i":"Неупругий удар: импульс сохраняется, а энергия — нет.","r":"1) Импульс: mv = (m + m)·u ⇒ u = v/2.\n2) Энергия одного (первого) шара: m·(v/2)²/2 = mv²/8.\n(Энергия обоих вместе — mv²/4, половина ушла в тепло.)"}},{"t":"Автомобиль дважды проехал вокруг Москвы по кольцевой дороге, длина которой 109 км. Пройденный автомобилем путь l и модуль его перемещения S равны","a":"l = 218 км, S = 0 км","x":["l = S = 218 км","l = S = 0 км","l = 0 км, S = 218 км"],"p":"","n":"","e":{"s":"Автомобиль дважды проехал кольцевую дорогу длиной 109 км. Какой путь и перемещение?","i":"Путь — сколько проехал по дороге. Перемещение — расстояние по прямой от старта до финиша.","r":"Путь: 2·109 = 218 км. Машина вернулась туда, откуда выехала, поэтому перемещение S = 0."}},{"t":"Тело за 20 с совершило 80 оборотов. Частота его вращения равна","a":"4 с⁻¹","x":["2,5 с⁻¹","0,25 с⁻¹","40 с⁻¹"],"p":"f1_23.png","n":"","e":{"s":"Тело за 20 с сделало 80 оборотов. Какая частота вращения?","i":"Частота — число оборотов за секунду: ν = N/t.","r":"ν = 80/20 = 4 оборота в секунду = 4 с⁻¹."}},{"t":"Луна и Земля взаимодействуют гравитационными силами. Соотношение между модулями сил F1 действия Земли на Луну и F2 действия Луны на Землю","a":"F1 = F2","x":["F1 < F2","F1 > F2","F1 = 1/F2"],"p":"","n":"","e":{"s":"Как соотносятся сила, с которой Земля тянет Луну, и сила, с которой Луна тянет Землю?","i":"Третий закон Ньютона: тела действуют друг на друга с равными по модулю и противоположными силами.","r":"F1 = F2, хотя масса Земли в 81 раз больше. Разница — в ускорениях: Луна от той же силы ускоряется гораздо сильнее, чем Земля (a = F/m)."}},{"t":"Удлинение проволоки при подвешивании груза равно 2 см. При подвешивании того же груза к проволоке из того же материала, такой же площади сечения и в два раза меньшей длины удлинение будет","a":"1 см","x":["2 см","4 см","0.5 см"],"p":"","n":"","e":{"s":"Груз растягивает проволоку на 2 см. Насколько растянется проволока вдвое короче (тот же материал и сечение)?","i":"Удлинение Δl = F·l/(E·S) пропорционально длине: каждый кусочек проволоки растягивается одинаково.","r":"Длина вдвое меньше — удлинение вдвое меньше: 2/2 = 1 см."}},{"t":"Для того чтобы тело превратилось в искусственный спутник Земли, его необходимо запустить со скоростью","a":"первой космической","x":["второй космической","любой","третьей космической"],"p":"","n":"","e":{"s":"С какой скоростью надо запустить тело, чтобы оно стало спутником Земли?","i":"Спутник «падает» вокруг Земли и постоянно промахивается. Для этого нужна определённая скорость.","r":"Первая космическая скорость ≈ 7,9 км/с: при ней сила тяжести как раз даёт нужное центростремительное ускорение (v = √(gR)). Вторая (11,2 км/с) — уже улёт от Земли."}},{"t":"На рисунке представлена диаграмма растяжения материала. На диаграмме пределу прочности данного материала соответствует точка","a":"точка E","x":["D","C","A"],"p":"f1_24.png","n":"","e":{"s":"На диаграмме растяжения материала найти точку, которая соответствует пределу прочности.","i":"Диаграмма показывает, какое напряжение σ выдерживает образец при растяжении ε. Предел прочности — наибольшее напряжение, которое материал выдерживает перед разрушением.","r":"По порядку: участок OA — закон Гука (A — предел пропорциональности), B — предел упругости, C–D — площадка текучести, E — вершина кривой, максимум напряжения σp. После E образец рвётся. Ответ: точка E."}},{"t":"На рисунке представлен график зависимости модуля силы F, действующей на тело, от времени. Изменение скорости тела массой 2 кг за 4 с равно","a":"4 м/с","x":["1","2","3"],"p":"f1_25.png","n":"","e":{"s":"Сила растёт со временем (график). Насколько изменится скорость тела 2 кг за 4 с?","i":"Изменение импульса равно импульсу силы: mΔv = F·t. Если сила меняется, F·t — это площадь под графиком F(t).","r":"1) На графике сила растёт линейно примерно от 0 до 4 Н за 4 с, под графиком треугольник.\n2) Площадь: ½·4 с·4 Н = 8 Н·с.\n3) Δv = 8/2 = 4 м/с."}},{"t":"Движение тел, не рассматривая причины, которые это движение обусловливают, изучает","a":"кинематика","x":["статика","специальная теория относительности","динамика"],"p":"","n":"","e":{"s":"Какой раздел механики изучает движение, не вникая в его причины?","i":"Механика делится на кинематику, динамику и статику.","r":"Кинематика отвечает на вопрос «как движется»: траектория, скорость, ускорение. Динамика — «почему движется»: силы, законы Ньютона. Статика — условия равновесия. Ответ: кинематика."}},{"t":"Спортсмен-фигурист сообщает себе медленное вращение вокруг вертикальной оси. Резко собравшись, он уменьшает момент инерции своего тела в 3 раза, при этом его угловая скорость и кинетическая энергия","a":"увеличились в 3 раза","x":["не изменились","угловая скорость не изменилась, кинетическая энергия увеличилась в 3 раза","уменьшились в 3 раза"],"p":"","n":"","e":{"s":"Фигурист прижал руки и уменьшил момент инерции в 3 раза. Как изменятся угловая скорость и энергия?","i":"Внешних моментов нет, поэтому сохраняется момент импульса: L = Jω = const.","r":"1) J уменьшился в 3 раза, значит, ω выросла в 3 раза.\n2) Энергия E = Jω²/2 = L²/(2J): при той же L и J/3 энергия выросла в 3 раза. Работу на это совершили мышцы фигуриста, когда он прижимал руки."}},{"t":"Под F во II законе Ньютона понимают силу","a":"результирующую","x":["упругости","любую","тяжести"],"p":"","n":"","e":{"s":"Какая сила стоит во втором законе Ньютона F = ma?","i":"На тело обычно действуют несколько сил сразу.","r":"F — равнодействующая, то есть векторная сумма всех сил, действующих на тело. Именно она определяет ускорение."}},{"t":"С помощью манометра измеряется давление внутри жидкости на горизонтальную поверхность снизу вверх, сверху вниз и на вертикальную поверхность. На одной и той же глубине давление обнаруживается","a":"по всем направлениям одинаковое","x":["наименьшее сверху вниз","наименьшее снизу вверх","на вертикальную поверхность"],"p":"","n":"","e":{"s":"Манометром измеряют давление в жидкости снизу, сверху и сбоку на одной глубине. Каким оно окажется?","i":"Закон Паскаля: жидкость передаёт давление во все стороны одинаково.","r":"На одной глубине давление p = ρgh одинаково по всем направлениям — и вверх, и вниз, и вбок."}},{"t":"При уменьшении деформации упруго деформированного тела в 3 раза, запас его потенциальной энергии","a":"уменьшится в 9 раз","x":["увеличится в 9 раз","увеличится в 3 раза","уменьшится в 3 раза"],"p":"","n":"","e":{"s":"Деформацию упругого тела уменьшили в 3 раза. Как изменится его энергия?","i":"Энергия упругой деформации E = kx²/2 зависит от квадрата деформации.","r":"x уменьшилось в 3 раза, x² — в 9 раз. Значит, энергия уменьшится в 9 раз."}},{"t":"На полу лифта, движущегося в течение времени t вертикально вверх с постоянной скоростью v, лежит груз массой m. Модуль веса этого груза равен","a":"mg","x":["0","m(g-v/t)","m(g+v/t)"],"p":"","n":"","e":{"s":"Лифт едет вверх с постоянной скоростью. Каков вес груза на полу?","i":"Вес — сила, с которой тело давит на опору. Он отличается от mg, только если есть ускорение.","r":"Скорость постоянная, ускорения нет, лифт ничем не отличается от неподвижного. Вес P = mg."}},{"t":"Тело движется по окружности радиусом 5 м. Какова частота обращения тела, если скорость тела равна","a":"2 с⁻¹","x":["2π с⁻¹","2π² с⁻¹","0,5 с⁻¹"],"p":"f1_26.png","n":"","e":{"s":"Тело движется по окружности радиусом 5 м со скоростью 20π м/с. Какая частота обращения?","i":"За один оборот тело проходит длину окружности 2πR. Частота — сколько оборотов в секунду: ν = v/(2πR).","r":"1) Длина окружности 2π·5 = 10π м.\n2) ν = 20π / 10π = 2 оборота в секунду = 2 с⁻¹."}},{"t":"На рисунке представлены три графика зависимости пройденного пути от времени. С большей скоростью","a":"двигалось тело 1","x":["двигалось тело 2","двигалось тело 3","все три тела двигались с одинаковыми скоростями"],"p":"f1_27.png","n":"","e":{"s":"Три графика пути от времени. Какое тело двигалось быстрее?","i":"На графике s(t) скорость — это наклон (крутизна) прямой: v = s/t.","r":"За одно и то же время тело 1 проходит больший путь, его прямая круче всех. Значит, оно самое быстрое."}},{"t":"Диск радиуса R катится по горизонтальной поверхности без проскальзывания с постоянной скоростью Vo относительно Земли. В системе отсчета, связанной с центром шара, скорость и ускорение точки А равны","a":"V₀; V₀²/R","x":["V₀; V₀²/2R","2V₀; V₀²/2R","2V₀; V₀²/R"],"p":"f1_28.png","n":"","e":{"s":"Колесо катится без проскальзывания со скоростью V₀. Какие скорость и ускорение у верхней точки A в системе, связанной с центром колеса?","i":"Если смотреть из центра колеса, колесо просто вращается на месте. Без проскальзывания скорость обода относительно центра равна скорости центра V₀.","r":"1) Скорость точки A относительно центра: V₀ (по касательной).\n2) Точка движется по окружности радиуса R равномерно, поэтому ускорение центростремительное: a = V₀²/R.\n(Относительно Земли верхняя точка движется со скоростью 2V₀ — это ловушка в вариантах.)"}},{"t":"Катер движется по воде с постоянной скоростью v. Определите зависимость мощности катера от скорости, если известно, что сила сопротивления пропорциональна скорости катера","a":"N ~ v²","x":["N ~ v","N ~ v³","N не зависит от v"],"p":"f1_29.png","n":"","e":{"s":"Катер идёт с постоянной скоростью, сопротивление пропорционально скорости. Как мощность зависит от скорости?","i":"При постоянной скорости сила тяги равна силе сопротивления. Мощность N = F·v.","r":"1) F = k·v.\n2) N = F·v = k·v·v = kv². Значит, N ~ v²: чтобы плыть вдвое быстрее, нужна вчетверо большая мощность."}},{"t":"Пуля массой m, летящая со скоростью v относительно Земли, догоняет платформу с песком, движущуюся со скоростью u. Количество тепла, выделяющееся при неупругом столкновении пули с платформой примерно равно","a":"m(v − u)²/2","x":["m(v² − u²)/2","mu²/2","mv²/2"],"p":"f1_30.png","n":"","e":{"s":"Пуля m со скоростью v догоняет тяжёлую платформу с песком (скорость u) и застревает. Сколько тепла выделится?","i":"Тепло — это потерянная при неупругом ударе кинетическая энергия. Удобно смотреть из системы платформы: она почти не меняет скорость, потому что намного тяжелее пули.","r":"1) Относительно платформы пуля летит со скоростью v − u.\n2) При застревании вся эта энергия переходит в тепло: Q ≈ m(v − u)²/2."}},{"t":"На глубине 10 м вода оказывает давление","a":"98 000 Па","x":["49 000 Па","196 000 Па","147 000 Па"],"p":"","n":"","e":{"s":"Какое давление создаёт вода на глубине 10 м?","i":"Гидростатическое давление p = ρgh.","r":"p = 1000 кг/м³ · 9,8 м/с² · 10 м = 98 000 Па (≈ 1 атмосфера). Это давление самой воды, без учёта атмосферного над ней."}},{"t":"Тело весом 15 Н полностью погружено в жидкость. Вес тела в жидкости 10 Н. Сила Архимеда, действующая на тело, равна","a":"5 Н","x":["25 Н","1,5 Н","150 Н"],"p":"","n":"","e":{"s":"Тело весит 15 Н, в жидкости — 10 Н. Чему равна сила Архимеда?","i":"Жидкость выталкивает тело вверх, поэтому в ней оно «весит» меньше. Разница и есть выталкивающая сила.","r":"Fₐ = 15 − 10 = 5 Н."}},{"t":"Две силы F1 = 30 Н и F2 = 40 Н приложены к одной точке тела. Угол между векторами этих сил равен 90°. Модуль равнодействующей этих сил равен","a":"50 Н","x":["10 Н","70 Н","26 Н"],"p":"","n":"","e":{"s":"Две силы 30 Н и 40 Н действуют под прямым углом. Какая равнодействующая?","i":"Силы — векторы. Перпендикулярные векторы складываются по теореме Пифагора.","r":"F = √(30² + 40²) = √(900 + 1600) = √2500 = 50 Н (египетский треугольник 3–4–5)."}},{"t":"Закон Гука выражается формулой","a":"Fx = −kx","x":["F = μN","F = GmM/R²","F⃗ = ma⃗"],"p":"f1_31.png","n":"","e":{"s":"Какой формулой записывается закон Гука?","i":"Сила упругости пропорциональна деформации и направлена так, чтобы вернуть тело обратно.","r":"Fₓ = −kx. Минус показывает: растянули вправо — сила тянет влево. Остальные варианты: μN — трение, ma — второй закон Ньютона, GmM/R² — тяготение."}},{"t":"На рисунке представлено поперечное сечение крыла самолета в воздушном потоке. Равнодействующая сил, действующих на крыло со стороны воздушного потока, имеет направление","a":"направление 2","x":["1","3","4"],"p":"f1_32.png","n":"","e":{"s":"Воздух обтекает крыло слева направо. Куда направлена равнодействующая сил на крыло?","i":"Над выпуклой верхней частью крыла поток быстрее, и по закону Бернулли давление там меньше. Отсюда подъёмная сила вверх. Плюс встречный поток тормозит крыло — сила сопротивления назад по потоку.","r":"Подъёмная сила (вверх) плюс сопротивление (вправо, по потоку) дают равнодействующую вверх и немного вправо — направление 2 на рисунке."}},{"t":"Из двух утверждений: 1) «Времени самого по себе, вне движения, не существует» (Лукреций Кар); 2) «Время абсолютно, не связанно с телами и их движением» (Исаак Ньютон) – соответствует современному пониманию природы времени","a":"«Времени самого по себе, вне движения, не существует» (Лукреций Кар)","x":[],"p":"","n":"","e":{"s":"Какое утверждение о времени ближе к современной науке: Лукреция («времени вне движения нет») или Ньютона («время абсолютно»)?","i":"Теория относительности показала, что ход времени зависит от движения и гравитации.","r":"Время относительно и связано с материей и движением — ближе к мысли Лукреция. Абсолютное время Ньютона оказалось лишь приближением для малых скоростей."}},{"t":"Из перечисленного: 1) расстояние; 2) промежуток времени между двумя событиями; 3) интервал между двумя событиями – в специальной теории относительности, при переходе от одной инерциальной системы отсчета к другой, изменяются","a":"расстояние; промежуток времени между двумя событиями","x":[],"p":"","n":"","e":{"s":"Что меняется в СТО при переходе в другую ИСО: расстояние, промежуток времени, интервал?","i":"В СТО и длина, и время относительны, но есть величина, одинаковая для всех, — пространственно-временной интервал.","r":"Расстояние меняется (сокращение длины), промежуток времени — тоже (замедление времени). А интервал s² = c²t² − x² одинаков во всех ИСО. Ответ: расстояние и промежуток времени."}},{"t":"Потенциальная энергия тела массой 2 кг на высоте 4 м от поверхности Земли примерно равна","a":"80 Дж","x":["16 Дж","8 Дж","40 Дж"],"p":"","n":"","e":{"s":"Тело 2 кг на высоте 4 м. Какая потенциальная энергия?","i":"E = mgh.","r":"E = 2·10·4 = 80 Дж (при g ≈ 10 м/с²)."}},{"t":"Если вдоль потока каждый выделенный тонкий слой скользит относительно соседних не перемешиваясь с ними, то течение называется","a":"ламинарным","x":["турбулентным","вихревым","вязким"],"p":"","n":"","e":{"s":"Как называется течение, при котором слои жидкости скользят друг по другу, не перемешиваясь?","i":"Течения бывают ламинарные и турбулентные.","r":"Ламинарное — спокойное, слоями (от латинского lamina — пластинка). Турбулентное — с вихрями и перемешиванием."}},{"t":"Частица массой m движется по окружности радиуса r. Определите зависимость момента импульса частицы относительно центра окружности от времени, если зависимость центростремительного ускорения от времени задана уравнением","a":"L ~ √t","x":["L ~ t²","L ~ t","L не зависит от времени"],"p":"f1_33.png","n":"","e":{"s":"Частица движется по окружности, центростремительное ускорение растёт: a = αt. Как момент импульса зависит от времени?","i":"Момент импульса L = mvr. Радиус постоянный, значит, надо понять, как меняется скорость.","r":"1) a = v²/r = αt ⇒ v² = αrt ⇒ v ~ √t.\n2) L = mvr ~ v ~ √t."}},{"t":"В системах отсчета, связанных с Землей, в большинстве практических случаев не заметны явления, связанные с неинерциальностью систем отсчета потому, что","a":"центростремительные ускорения точек на поверхности Земли много меньше ускорения свободного падения","x":["Земля вращается равномерно с постоянным периодом обращения","центростремительные ускорения точек на поверхности Земли малы","период обращения Земли вокруг своей оси велик"],"p":"","n":"","e":{"s":"Почему на Земле обычно не заметны эффекты её вращения (неинерциальности)?","i":"Сравним ускорение, вызванное вращением, с ускорением свободного падения.","r":"Центростремительное ускорение на экваторе ω²R ≈ 0,034 м/с² — это меньше 0,4% от g = 9,8 м/с². Поэтому в обычных задачах Землю считают инерциальной системой."}},{"t":"Закон всемирного тяготения в нижеуказанной форме применим","a":"только для тел, которые можно считать материальными точками","x":["для любых тел независимо от их формы, размеров и распределения масс","только для тел, имеющих шарообразную форму","для материальных точек и сферически симметричных тел"],"p":"f1_34.png","n":"","e":{"s":"Когда применима формула F = Gm₁m₂/R²?","i":"Расстояние R в формуле — между точками. У больших тел разные части находятся на разных расстояниях.","r":"Формула точна для материальных точек (тел, размеры которых много меньше R), а также для однородных шаров (R — между центрами). Для тел сложной формы приходится складывать притяжение всех кусочков."}},{"t":"Из перечисленных единиц: 1) ньютон; 2) ватт; 3) джоуль; 4) килограмм – единицей измерения мощности в Международной системе единиц является","a":"ватт","x":[],"p":"","n":"","e":{"s":"Какая единица мощности в СИ?","i":"Мощность — работа в единицу времени.","r":"Ватт: 1 Вт = 1 Дж/с. Ньютон — сила, джоуль — работа, килограмм — масса."}},{"t":"Впервые числовое определение гравитационной постоянной произведено","a":"Кавендишем","x":["Кеплером","Галилеем","Ньютоном"],"p":"","n":"","e":{"s":"Кто первым измерил гравитационную постоянную G?","i":"G очень мала (6,67·10⁻¹¹ Н·м²/кг²), измерить её трудно.","r":"Генри Кавендиш в 1798 году на крутильных весах измерил притяжение свинцовых шаров. Заодно он «взвесил Землю» — вычислил её массу."}},{"t":"На рисунке А представлены направления векторов скорости и ускорения мяча. Вектор равнодействующей всех сил, приложенных к мячу, на рисунке Б имеет направление","a":"направление 3 (рисунок в архиве повреждён)","x":["1","2","F = 0"],"p":"","n":"рисунок в архиве повреждён","e":{"s":"Даны направления скорости и ускорения мяча. Куда направлена равнодействующая всех сил?","i":"Второй закон Ньютона: F⃗ = m·a⃗ — сила всегда направлена туда же, куда ускорение. Со скоростью её направление может не совпадать.","r":"Смотрим на вектор ускорения на рисунке А: равнодействующая направлена так же. В ключе это направление 3. Рисунок в архиве повреждён — главное запомнить правило «сила ↑↑ ускорению»."}},{"t":"На полу лифта, начинающего движение вертикально вверх с ускорением а, лежит груз массой m. Модуль веса этого груза равен","a":"m(g + a)","x":["m(a - g)","m(g - a)","ma"],"p":"","n":"","e":{"s":"Лифт начинает подниматься с ускорением a. Каков вес груза?","i":"При ускорении вверх пол должен не только держать груз, но и разгонять его.","r":"1) Второй закон Ньютона для груза: N − mg = ma.\n2) N = m(g + a). Вес равен силе давления на пол: P = m(g + a). Поэтому при старте лифта вверх нас «вдавливает» в пол."}}]}]</script>
