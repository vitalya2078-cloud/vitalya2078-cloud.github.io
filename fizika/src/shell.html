<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="900 вопросов по физике с ответами, пояснениями и тестами. Работает без интернета.">
<meta name="theme-color" content="#F7F8F5">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Физика">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Физика: ответы и тесты</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* «Тетрадь, но строже»: бумага, синие чернила, красная ручка для ошибок. Раскладка как у нативного приложения. */
@font-face{font-family:"Golos UI"; font-weight:400; font-display:swap; src:url(data:font/woff2;base64,{{F400}}) format("woff2")}
@font-face{font-family:"Golos UI"; font-weight:600; font-display:swap; src:url(data:font/woff2;base64,{{F600}}) format("woff2")}
@font-face{font-family:"Golos UI"; font-weight:700; font-display:swap; src:url(data:font/woff2;base64,{{F700}}) format("woff2")}
:root{
  --bg:#F7F8F5; --bar:#FFFFFF; --sheet:#FFFFFF; --text:#1B2026; --muted:#5F6A74; --line:#DFE5DD;
  --ink:#1E3FA0; --on-ink:#FFFFFF; --ink-soft:#E8EDFB; --ok:#1D7A49; --ok-soft:#E3F2E8;
  --red:#C23026; --red-soft:#FBE8E5; --gold:#C99300; --marker:#FFE45C;
  --ui:"Golos UI", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --math:"Cambria Math", Cambria, "STIX Two Math", "STIX Two Text", "Noto Serif", "Times New Roman", serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10233F; --bar:#132B4C; --sheet:#17304F; --text:#EAF1FB; --muted:#A2B5CD; --line:#2A4670;
  --ink:#A6C8FF; --on-ink:#0F213C; --ink-soft:#1E3C66; --ok:#7ADBA0; --ok-soft:#163F33;
  --red:#FF8F86; --red-soft:#47243A; --gold:#F2C94C; --marker:#7D6E12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10233F; --bar:#132B4C; --sheet:#17304F; --text:#EAF1FB; --muted:#A2B5CD; --line:#2A4670;
  --ink:#A6C8FF; --on-ink:#0F213C; --ink-soft:#1E3C66; --ok:#7ADBA0; --ok-soft:#163F33;
  --red:#FF8F86; --red-soft:#47243A; --gold:#F2C94C; --marker:#7D6E12; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%; margin:0; background:var(--bg); color:var(--text); font:16px/1.5 var(--ui); -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent}
body{overflow:hidden}
[hidden]{display:none!important}
a{color:var(--ink)}
button,input,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
svg.i{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none}

/* каркас: шапка — прокручиваемая середина — панель действий — вкладки */
.app{display:flex; flex-direction:column; height:100vh; height:100dvh}
.top{flex:none; display:flex; align-items:center; gap:2px; min-height:56px; padding:var(--sat) max(6px,var(--sar)) 0 max(6px,var(--sal)); background:var(--bar); border-bottom:1px solid var(--line)}
#ttl{flex:1; min-width:0; margin:0 10px; font-size:19px; font-weight:700; letter-spacing:-.01em; line-height:1.2; display:flex; flex-direction:column; white-space:nowrap}
#ttl, #ttl small, #ttl .tq{overflow:hidden; text-overflow:ellipsis}
#ttl small{font-size:13px; font-weight:400; color:var(--muted)}
.tglyph{font:italic 600 .95em var(--math); color:var(--ink); margin-right:8px}
body[data-view="home"] #ttl{font-size:25px; letter-spacing:-.02em}
#back{margin-left:-2px}
.acts{display:flex; align-items:center; gap:2px}
.ib{width:44px; height:44px; display:grid; place-items:center; border:0; border-radius:50%; background:none; color:var(--text); cursor:pointer}
.ib[aria-pressed="true"]{color:var(--ink); background:var(--ink-soft)}
#sub{flex:none; padding:8px max(16px,var(--sar)) 10px max(16px,var(--sal)); background:var(--bar); border-bottom:1px solid var(--line)}
main{flex:1; min-height:0; overflow-y:auto; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; padding:16px max(16px, calc((100% - 720px) / 2)) 28px}
.abar{flex:none; display:flex; gap:8px; align-items:center; padding:10px max(16px, calc((100% - 720px) / 2)); background:var(--bar); border-top:1px solid var(--line)}
.app.notabs .abar{padding-bottom:calc(10px + var(--sab))}
.abar-note{margin:0; flex:1; text-align:center; color:var(--muted); font-size:14px}
.tabs{flex:none; display:grid; grid-template-columns:repeat(4,1fr); background:var(--bar); border-top:1px solid var(--line); padding:0 var(--sar) var(--sab) var(--sal)}
.tabs a{display:grid; justify-items:center; gap:2px; padding:8px 0 9px; font-size:12px; font-weight:600; color:var(--muted); text-decoration:none}
.tabs .pill{display:grid; place-items:center; width:58px; height:30px; border-radius:15px; transition:background .2s}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"] .pill{background:var(--ink-soft)}
main.enter > *{animation:enter .18s ease-out both}
@keyframes enter{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

/* общие элементы */
.btn{display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:0 18px; border:1px solid var(--ink); border-radius:12px; background:var(--ink); color:var(--on-ink); font-weight:700; text-decoration:none; cursor:pointer; text-align:center}
.btn.line{background:none; color:var(--ink)}
.btn.light{background:#fff; border-color:#fff; color:#1E3FA0}
.btn.danger{background:none; border-color:var(--red); color:var(--red)}
.btn.sm{min-height:36px; padding:0 12px; font-size:14px}
.btn.wide{flex:1}
.btn:disabled{opacity:.45; cursor:default}
.abar .btn{flex:1; padding:0 10px; white-space:nowrap; font-size:15px}
.btnrow{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px}
.btnrow .btn{flex:1 1 140px}
.note{font-size:14px; color:var(--muted); margin:6px 0 0}
.topbar-info p{margin:0 0 12px; font-size:14px; color:var(--muted)}
.empty{color:var(--muted); text-align:center; padding:40px 16px}
.sec{display:flex; justify-content:space-between; gap:8px; font-size:15px; font-weight:700; margin:22px 2px 8px}
.sec a{color:inherit; text-decoration:none}
.sec span{font-weight:400; color:var(--muted)}
.group{background:var(--sheet); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:14px}
.row{display:flex; align-items:center; gap:12px; min-height:54px; padding:8px 12px 8px 16px; color:var(--text); text-decoration:none}
.row + .row{border-top:1px solid var(--line)}
.row > span:first-child{flex:1}
.row small{color:var(--muted); font-variant-numeric:tabular-nums}
.row .i{color:var(--muted); width:20px}
.row.static span:last-child{display:grid}
.row.static small{font-size:13px}
.panel{background:var(--sheet); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:14px}
.panel h2,.form h2{font-size:16px; margin:0 0 10px}
.ruler{display:flex; height:6px; margin-top:8px; border-radius:3px; background:var(--line); overflow:hidden}
.ruler i{display:block; height:100%}
.okp{background:var(--ok)} .badp{background:var(--red)}
.hint{display:flex; align-items:flex-start; gap:8px; background:var(--ink-soft); border-radius:14px; padding:10px 6px 10px 14px; margin-bottom:14px; font-size:14px}
.hint p{flex:1; margin:4px 0}
.hint .btn{align-self:center}
.hint .ib{width:36px; height:36px}
mark{background:var(--marker); color:inherit; border-radius:3px; padding:0 1px}

/* главная */
.exam{position:relative; overflow:hidden; color:#fff; background:#1E3FA0; border-radius:18px; padding:20px 18px 18px; margin-bottom:14px;
  background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:40px 40px,40px 40px,8px 8px,8px 8px}
.exam h2{margin:0; font-size:26px; letter-spacing:-.02em}
.exam p{margin:6px 0 16px; opacity:.9; max-width:34em}
.exam-b{display:flex; flex-wrap:wrap; gap:8px}
.exam-b .btn{flex:1 1 130px; padding:0 12px; white-space:nowrap}
.exam .btn.line{color:#fff; border-color:rgba(255,255,255,.7)}
.tile-row{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--sheet); border:1px solid var(--line); border-radius:14px; padding:12px 12px 12px 16px; margin-bottom:10px; color:var(--text); text-decoration:none; cursor:pointer}
.tile-row span{flex:1; display:grid}
.tile-row small{color:var(--muted); font-size:13.5px}
.tile-row .i{color:var(--muted)}
.tile-row.warn{border-left:4px solid var(--red)}
.stats{display:grid; grid-template-columns:repeat(3,1fr); background:var(--sheet); border:1px solid var(--line); border-radius:14px; margin-bottom:14px}
.stats div{padding:12px 12px 14px; display:grid}
.stats div + div{border-left:1px solid var(--line)}
.stats b{font-size:24px; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.stats b.red{color:var(--red)}
.stats span{font-size:12.5px; color:var(--muted); line-height:1.3}

/* темы */
.trow{display:flex; align-items:center; gap:12px; padding:12px 12px 12px 16px; color:var(--text); text-decoration:none}
.trow + .trow{border-top:1px solid var(--line)}
.trow .tb{flex:1; min-width:0; display:grid}
.trow b{font-weight:600}
.trow small{color:var(--muted); font-size:13px}
.trow .i{color:var(--muted); width:20px}
.glyph{font:italic 500 15px/1.2 var(--math); color:var(--ink); white-space:nowrap; flex:none; width:96px; overflow:hidden; text-overflow:ellipsis}
.glyph sub{font-size:.65em}
.nums{display:grid; grid-template-columns:repeat(10,1fr); border-left:1px solid var(--line); border-top:1px solid var(--line); background:var(--sheet); margin-bottom:14px}
.nums a{aspect-ratio:1; display:grid; place-items:center; font-size:13px; font-variant-numeric:tabular-nums; color:var(--text); text-decoration:none; border-right:1px solid var(--line); border-bottom:1px solid var(--line)}
.nums a.ok{background:var(--ok-soft); color:var(--ok); font-weight:600}
.nums a.bad{background:var(--red-soft); color:var(--red); font-weight:600}
.nums a.dim{opacity:.35}
.search{display:flex; gap:6px; align-items:center}
.search input{flex:1; min-width:0; font-size:16px; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px 12px}

/* карточка вопроса */
.list{display:grid; gap:12px}
.q{background:var(--sheet); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:grid; gap:10px}
.q.flash{outline:2px solid var(--ink)}
.qh{display:flex; gap:4px; align-items:flex-start}
.qt{flex:1; margin:0}
.qn{font-weight:700; color:var(--ink); margin-right:8px; font-variant-numeric:tabular-nums}
.star{flex:none; width:40px; height:40px; margin:-8px -10px 0 0; display:grid; place-items:center; border:0; background:none; color:var(--muted); cursor:pointer; border-radius:50%}
.star.on{color:var(--gold)}
.star.on svg{fill:currentColor}
.q img{max-width:min(100%,340px); max-height:220px; width:auto; height:auto; justify-self:start; background:#fff; border-radius:8px; padding:6px; border:1px solid var(--line)}
.ans{background:var(--ok-soft); color:var(--ok); font-weight:600; border-radius:10px; padding:10px 12px; border:0; text-align:left; width:100%}
.ans small{font-weight:400; opacity:.85}
.ans.hidden{background:var(--ink-soft); color:var(--ink); cursor:pointer; min-height:46px; text-align:center}
.others{font-size:13.5px; color:var(--muted); margin:0}
.badge{display:inline-block; font-size:12px; font-weight:600; border-radius:6px; padding:0 7px; margin-left:4px; vertical-align:1px}
.badge.ok{color:var(--ok); background:var(--ok-soft)}
.badge.bad{color:var(--red); background:var(--red-soft)}
.rate{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.rate button{min-height:46px; border-radius:12px; border:1px solid; background:none; font-weight:700; cursor:pointer}
.rate .ok{color:var(--ok)} .rate .bad{color:var(--red)}
.mine{margin:0; font-size:14px; color:var(--red)}
.mine.strike{text-decoration:line-through; text-decoration-color:color-mix(in srgb,var(--red) 55%,transparent)}
.why{display:grid; gap:10px; border-left:3px solid var(--ink); padding:2px 0 2px 14px}
details.why{border-left:0; padding-left:0}
details.why[open]{border-left:3px solid var(--ink); padding-left:14px}
.why summary{cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:center; min-height:44px; border-radius:12px; background:var(--ink-soft); color:var(--ink); font-weight:700}
details.why[open] summary{margin-left:-14px}
.why summary::-webkit-details-marker{display:none}
.why summary .hd,.why[open] summary .sh{display:none}
.why[open] summary .hd{display:inline}
.why-h{margin:0; color:var(--ink); font-size:16px}
.why-step + .why-step,.why-step + .why-warn,details.why .why-text + .why-more{margin-top:10px}
.why-step b{display:block; color:var(--ink); font-size:14px}
.why-step p,.why-warn p{margin:2px 0 0; font-size:15.5px; line-height:1.55}
.why-warn{background:var(--red-soft); border-radius:10px; padding:10px 12px}
.why-warn b{color:var(--red); font-size:14px}
.why-text{margin:0; font-size:15.5px}
.why-more{margin:0; font-size:13px; color:var(--muted)}
.flag{color:var(--red)}
section.why.open{animation:enter .25s ease-out}

/* тест */
.form{margin-bottom:20px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px}
.chip{border:1px solid var(--line); background:var(--sheet); font-size:14px; border-radius:999px; padding:8px 14px; cursor:pointer; text-align:left}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--on-ink); border-color:var(--ink)}
.range{display:grid; gap:6px; background:var(--sheet); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:6px; font-size:14.5px}
.range input{width:100%; accent-color:var(--ink); height:28px}
.rl{display:flex; justify-content:space-between; color:var(--muted)}
.scale p:first-of-type{display:flex; flex-wrap:wrap; gap:4px 16px; margin:0}
.tq{font-size:16px}
.timer{font-size:18px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; padding:0 8px}
.timer.warn{color:var(--red)}
.tprog .ruler{margin-top:0}
.tbar{display:block; height:3px; margin-top:6px; border-radius:2px; background:var(--line); overflow:hidden}
.tbar i{display:block; height:100%; width:100%; background:var(--ink); transition:width .25s linear}
.q.test{padding:16px}
.q.test .qt{font-size:17px}
.opts{display:grid; gap:8px}
.opt{display:flex; gap:12px; align-items:flex-start; width:100%; min-height:52px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); text-align:left; cursor:pointer}
.opt .ln{flex:none; width:26px; height:26px; display:grid; place-items:center; border-radius:50%; border:1px solid var(--line); font-size:13px; font-weight:600; color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft); border-color:var(--ok); color:var(--ok); font-weight:600}
.opt.right .ln{border-color:var(--ok); background:var(--ok); color:var(--sheet)}
.opt.wrong{background:var(--red-soft); border-color:var(--red); color:var(--red)}
.opt.wrong span:last-child{text-decoration:line-through}
.opt.wrong .ln{border-color:var(--red); color:var(--red)}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.verdict{margin:0; font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--red)}
.score{display:flex; align-items:center; gap:18px; background:var(--sheet); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:6px}
.grade{flex:none; width:80px; height:80px; display:grid; place-items:center; border:3px solid var(--red); border-radius:50% 46% 52% 48%; color:var(--red); font:italic 700 50px/1 var(--math); transform:rotate(-8deg)}
.score b{display:block; font-size:22px}
.score div span{color:var(--muted)}

/* обучение */
.path{list-style:none; margin:0 0 6px; padding:0; display:grid; gap:0; background:var(--sheet); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.path li{display:flex; gap:12px; align-items:center; padding:10px 14px}
.path li + li{border-top:1px solid var(--line)}
.path li span:last-child{display:grid}
.path small{color:var(--muted); font-size:13px}
.sn,.nn{flex:none; width:30px; height:30px; display:grid; place-items:center; border-radius:50%; border:1.5px solid var(--ink); color:var(--ink); font-weight:700; font-size:14px}
.path li.done .sn,.nn.done{background:var(--ok); border-color:var(--ok); color:var(--sheet)}
.note-row > span.nn{flex:0 0 30px}
.note-row > span:nth-child(2){flex:1; display:grid}
.note-row small{font-size:13px; line-height:1.35; margin-top:2px}
.games{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; margin-bottom:6px}
.game-card{display:grid; gap:4px; align-content:start; min-height:130px; padding:14px; border-radius:16px; background:var(--sheet); border:1px solid var(--line); color:var(--text); text-decoration:none}
.game-card b{font-size:16px; color:var(--ink)}
.game-card small{color:var(--muted); font-size:13px; line-height:1.35}
.game-card .new{font-size:12.5px; color:var(--muted); margin-top:auto}
.stars{display:inline-flex; gap:2px; margin-top:auto; font-size:18px; color:var(--line); font-style:normal}
.stars i{font-style:normal} .stars i.on{color:var(--gold)}
.big-stars .stars{font-size:40px}
.check p{margin:0 0 10px}
.okc{color:var(--ok)} .badc{color:var(--red)}
.hint.pass{background:var(--ok-soft)} .hint.fail{background:var(--red-soft)}
.conspect{background:var(--sheet); border:1px solid var(--line); border-radius:14px; padding:16px; font-size:16px; line-height:1.6}
.conspect p{margin:0 0 12px}
.conspect .lead{font-size:17px; color:var(--ink); font-weight:600}
.conspect h3{font-size:17px; margin:18px 0 8px}
.conspect .def b{color:var(--ink)}
.formula{display:grid; gap:4px; margin:4px 0 14px; padding:12px 14px; border-radius:12px; background:var(--ink-soft); font:italic 500 17px/1.45 var(--math); color:var(--text); overflow-x:auto}
.formula span{white-space:pre-wrap}
.formula.small{font-size:16px; margin-top:10px}
.example{border-left:3px solid var(--ok); background:var(--ok-soft); border-radius:0 12px 12px 0; padding:10px 14px; margin:6px 0 14px}
.example b{color:var(--ok); font-size:14px}
.example p{margin:4px 0 0}
.next-step{margin-top:14px}
.next-step p{margin:0}
.trap{border-left:3px solid var(--red); background:var(--red-soft); border-radius:0 12px 12px 0; padding:10px 14px; margin:6px 0 4px}
.trap b{color:var(--red); font-size:14px}
.trap p{margin:4px 0 0}
.gtop{margin:0 0 10px}
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pairs > div{display:grid; gap:8px; align-content:start}
.pc{min-height:56px; padding:8px 10px; border-radius:12px; border:1px solid var(--line); background:var(--sheet); font-size:14.5px; cursor:pointer; text-align:center; line-height:1.3}
.pc.r.math{font-family:var(--math); font-style:italic; font-size:16px}
.pc.sel{border-color:var(--ink); background:var(--ink-soft); color:var(--ink); font-weight:600}
.pc.done{background:var(--ok-soft); border-color:var(--ok); color:var(--ok); opacity:.7; cursor:default}
.pc.shake{animation:shake .35s; border-color:var(--red); color:var(--red)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tf-card .qt{font-size:18px}
.tf-why{margin:0}
.abar .tf-yes{background:var(--ok); border-color:var(--ok); color:var(--sheet)}
.abar .tf-no{background:var(--red); border-color:var(--red); color:var(--sheet)}
.throw-cv{display:block; width:100%; height:auto; border:1px solid var(--line); border-radius:12px; touch-action:manipulation}
.tmsg{min-height:2.6em}
.game-end{margin-top:6px}
/* прогресс */
.chart{width:100%; height:auto; display:block}
.chart .gl{stroke:var(--line); stroke-dasharray:3 3}
.chart .gt{fill:var(--muted); font-size:10px; font-family:var(--ui)}
.chart .b.m5{fill:var(--ok)} .chart .b.m4{fill:var(--ink)} .chart .b.m3{fill:var(--gold)} .chart .b.m2{fill:var(--red)}
.tline{display:grid; grid-template-columns:1fr auto; gap:0 8px; padding:10px 0; color:var(--text); text-decoration:none}
.tline + .tline{border-top:1px solid var(--line)}
.tline small{color:var(--muted); font-variant-numeric:tabular-nums}
.tline .ruler{grid-column:1/-1; margin-top:6px}
.hm{flex:none!important; width:34px; height:34px; display:grid; place-items:center; border-radius:50%; border:2px solid; font:italic 700 20px/1 var(--math)}
.hm.m5{color:var(--ok)} .hm.m4{color:var(--ink)} .hm.m3{color:var(--gold)} .hm.m2{color:var(--red)}
textarea{width:100%; margin:4px 0 10px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--bg); font-size:14px; resize:vertical}
.file{position:relative; overflow:hidden}
.file input{position:absolute; inset:0; opacity:0; cursor:pointer}
@media (hover:hover){.opt:not(:disabled):hover,.chip:hover,.row:hover,.trow:hover,.tile-row:hover{border-color:var(--ink)} .row:hover,.trow:hover{background:var(--ink-soft)} .ib:hover{background:var(--ink-soft)}}
@media (min-width:720px){.group{border-radius:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body data-view="home">
<div class="app" id="app">
  <header class="top">
    <button class="ib" id="back" type="button" aria-label="Назад" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="ttl">Физика</h1>
    <div class="acts" id="acts"></div>
  </header>
  <div id="sub" hidden></div>
  <main id="main" tabindex="-1"><div class="empty">Загружаю вопросы…</div></main>
  <div class="abar" id="abar" hidden></div>
  <nav class="tabs" id="tabs" aria-label="Разделы">
    <a href="#" data-tab="home"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"/></svg></span>Главная</a>
    <a href="#topics" data-tab="topics"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h11.5a2 2 0 0 1 2 2v13H7a2 2 0 0 1-2-2zM5 17.5a2 2 0 0 1 2-2h11.5M9 8.5h6"/></svg></span>Темы</a>
    <a href="#test" data-tab="test"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 3.5h6v3H9zM8.5 12l2 2 4.5-4.5M8.5 17h7"/></svg></span>Тест</a>

  </nav>
