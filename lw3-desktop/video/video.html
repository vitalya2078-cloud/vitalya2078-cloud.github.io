<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Показатель адиабаты — ролик</title>
<style>
@font-face{font-family:"Golos UI"; font-weight:400; src:url(fonts/golos-400.woff2) format("woff2")}
@font-face{font-family:"Golos UI"; font-weight:600; src:url(fonts/golos-600.woff2) format("woff2")}
@font-face{font-family:"Golos UI"; font-weight:700; src:url(fonts/golos-700.woff2) format("woff2")}
@font-face{font-family:"Golos UI"; font-weight:800 900; src:url(fonts/golos-latin-800.woff2) format("woff2"); unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Golos UI"; font-weight:800 900; src:url(fonts/golos-cyrillic-800.woff2) format("woff2"); unicode-range:U+0400-045F,U+2116}
@font-face{font-family:"F2 Math"; font-style:italic; font-weight:400 700; src:url(fonts/stix-greek-600i.woff2) format("woff2"); unicode-range:U+0370-03FF}
@font-face{font-family:"F2 Math"; font-style:italic; font-weight:400 700; src:url(fonts/stix-latin-600i.woff2) format("woff2"); unicode-range:U+0000-00FF}
html,body{margin:0; width:1920px; height:1080px; overflow:hidden; background:#0E1013; font-family:"Golos UI", system-ui, sans-serif; color:#ECEEF1}
body{background:radial-gradient(1200px 700px at 80% -10%, #1b2a48 0%, transparent 60%), radial-gradient(900px 600px at 0% 110%, #35190f 0%, transparent 55%), #0B0D10}
#app{position:absolute; left:120px; top:16px; width:1680px; height:945px; border:0; border-radius:16px; box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08); background:#0E1013}
/* подпись снизу */
#cap{pointer-events:none; position:absolute; left:50%; bottom:14px; transform:translate(-50%, 20px); opacity:0; transition:opacity .45s, transform .45s; z-index:20;
  display:flex; align-items:center; gap:18px; padding:14px 28px 14px 18px; border-radius:20px; background:rgba(22,25,30,.92); backdrop-filter:blur(10px);
  box-shadow:0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); white-space:nowrap}
#cap.on{opacity:1; transform:translate(-50%, 0)}
#cap i{font-style:normal; width:46px; height:46px; border-radius:14px; display:grid; place-items:center; background:linear-gradient(135deg,#58A6FF,#FF7A45); font:italic 700 30px/1 "F2 Math", serif; color:#fff; flex:none}
#cap b{display:block; font:800 30px/1.15 "Golos UI"} #cap span{display:block; font:500 21px/1.3 "Golos UI"; color:#AEB4BE; margin-top:3px}
/* титры */
#card{position:absolute; inset:0; z-index:30; display:grid; place-items:center; background:radial-gradient(1100px 700px at 75% 15%, #1d2d4f 0%, transparent 60%), radial-gradient(900px 600px at 10% 110%, #3a1d12 0%, transparent 55%), #0E1013;
  opacity:0; transition:opacity .6s; pointer-events:none}
#card.on{opacity:1}
.ct{text-align:center; transform:translateY(16px); transition:transform 1.2s cubic-bezier(.2,.7,.2,1)} #card.on .ct{transform:none}
.logo{width:150px; height:150px; border-radius:42px; margin:0 auto 36px; display:grid; place-items:center; background:linear-gradient(135deg,#58A6FF,#FF7A45); font:italic 700 100px/1 "F2 Math", serif; color:#fff; box-shadow:0 30px 90px rgba(255,122,69,.35)}
.k{font:700 26px/1 "Golos UI"; letter-spacing:4px; text-transform:uppercase; color:#FF9C70; margin-bottom:22px}
.h{font:800 104px/1.02 "Golos UI"; letter-spacing:-2px}
.s{font:500 34px/1.4 "Golos UI"; color:#AEB4BE; margin-top:24px}
.chips{display:flex; gap:16px; justify-content:center; margin-top:46px}
.chips span{padding:14px 24px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); font:600 26px "Golos UI"; color:#ECEEF1}
.ch{font:800 30px/1 "Golos UI"; color:#FF9C70; letter-spacing:3px; text-transform:uppercase; margin-bottom:18px}
.ch-h{font:800 84px/1.05 "Golos UI"}
/* курсор */
#cur{position:absolute; left:960px; top:600px; width:30px; height:30px; z-index:25; pointer-events:none; transition:left .55s cubic-bezier(.3,.7,.2,1), top .55s cubic-bezier(.3,.7,.2,1); opacity:0}
#cur.on{opacity:1}
#cur svg{filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.rip{position:absolute; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%; border:3px solid #FF7A45; z-index:24; pointer-events:none; animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(3.4); opacity:0}}
</style>
</head>
<body>
<iframe id="app" name="app" src="index.html"></iframe>
<div id="cap"><i>γ</i><div><b></b><span></span></div></div>
<div id="card"><div class="ct"></div></div>
<div id="cur"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M4 2l15 9-6.5 1.5L10 19z" fill="#fff" stroke="#14171C" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
<script>
const $ = s => document.querySelector(s);
window.cap = (t, s = '') => { const c = $('#cap'); if (!t) { c.classList.remove('on'); return; } c.querySelector('b').textContent = t; c.querySelector('span').textContent = s; c.querySelector('span').style.display = s ? '' : 'none'; c.classList.add('on'); };
window.card = html => { const c = $('#card'); if (!html) { c.classList.remove('on'); return; } c.querySelector('.ct').innerHTML = html; c.classList.remove('on'); void c.offsetWidth; c.classList.add('on'); };
window.cursor = (x, y, show = true) => { const c = $('#cur'); c.classList.toggle('on', show); c.style.left = x + 'px'; c.style.top = y + 'px'; };
window.ripple = (x, y) => { const r = document.createElement('div'); r.className = 'rip'; r.style.left = x + 'px'; r.style.top = y + 'px'; document.body.appendChild(r); setTimeout(() => r.remove(), 700); };
</script>
</body>
</html>
