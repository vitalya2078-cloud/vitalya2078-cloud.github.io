<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЛР № 3 · Показатель адиабаты</title>
<style>
@font-face{font-family:"Golos UI"; font-weight:400; font-display:block; src:url(fonts/golos-400.woff2) format("woff2")}
@font-face{font-family:"Golos UI"; font-weight:600; font-display:block; src:url(fonts/golos-600.woff2) format("woff2")}
@font-face{font-family:"Golos UI"; font-weight:700; font-display:block; src:url(fonts/golos-700.woff2) format("woff2")}
@font-face{font-family:"Golos UI"; font-weight:800 900; font-display:block; src:url(fonts/golos-latin-800.woff2) format("woff2"); unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:"Golos UI"; font-weight:800 900; font-display:block; src:url(fonts/golos-cyrillic-800.woff2) format("woff2"); unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"F2 Math"; font-style:italic; font-weight:400 700; src:url(fonts/stix-latin-600i.woff2) format("woff2"); unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:"F2 Math"; font-style:italic; font-weight:400 700; src:url(fonts/stix-greek-600i.woff2) format("woff2"); unicode-range:U+0370-03FF}
@font-face{font-family:"F2 Math"; font-style:normal; font-weight:400 700; src:url(fonts/stix-latin-600.woff2) format("woff2"); unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:"F2 Math"; font-style:normal; font-weight:400 700; src:url(fonts/stix-greek-600.woff2) format("woff2"); unicode-range:U+0370-03FF}
@font-face{font-family:"F2 Math"; font-style:normal; font-weight:400 700; src:url(fonts/stix-cyrillic-600.woff2) format("woff2"); unicode-range:U+0400-045F}

:root{
  --bg:#080D1A; --bg2:#0C1324; --panel:#111A2E; --panel2:#16213A; --line:#22304D; --line2:#2E3F63;
  --tx:#E8EEF8; --tx2:#AFBCD2; --mute:#7C8BA6;
  --amber:#F2B544; --amber2:#FFD27A; --green:#5AD3A0; --red:#F2727E; --blue:#6FB3FF; --cyan:#5ED0E6; --violet:#A78BFA;
  --r:14px; --sh:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{background:radial-gradient(1200px 700px at 85% -10%, #142247 0%, transparent 60%), radial-gradient(900px 600px at -10% 110%, #0F2A2E 0%, transparent 55%), var(--bg);
  color:var(--tx); font:15px/1.5 "Golos UI", "Segoe UI", system-ui, sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; user-select:none}
input,textarea,.sel{user-select:text}
button,input,textarea{font:inherit; color:inherit}
.ic{width:18px; height:18px; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px}
.m{font-family:"F2 Math", "Cambria Math", serif; font-style:italic}
kbd{display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:20px; padding:0 6px; border-radius:5px; border:1px solid rgba(255,255,255,.22); border-bottom-width:2px;
  background:rgba(255,255,255,.06); font:700 11px/1 "Golos UI", system-ui; color:inherit; opacity:.85; margin-left:auto}
::-webkit-scrollbar{width:12px; height:12px}::-webkit-scrollbar-thumb{background:#253455; border-radius:8px; border:3px solid transparent; background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}

/* ---------- каркас ---------- */
#app{display:grid; grid-template-columns:288px 1fr; height:100vh}
body.noside #app{grid-template-columns:1fr}
body.noside #side{display:none}
#side{background:linear-gradient(180deg, rgba(17,26,46,.92), rgba(10,16,30,.96)); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:20px 16px 16px; gap:16px; min-height:0}
#main{overflow:auto; padding:26px 32px 40px; min-width:0; scroll-behavior:smooth}
.brand{display:flex; gap:12px; align-items:center; padding:2px 6px 6px}
.brand .logo{width:46px; height:46px; flex:none}
.brand b{display:block; font:800 18px/1.15 "Golos UI"; letter-spacing:.2px}
.brand span{display:block; color:var(--tx2); font-size:13px; line-height:1.25}

.steps{display:flex; flex-direction:column; gap:4px; position:relative}
.steps button{all:unset; box-sizing:border-box; display:flex; gap:12px; align-items:center; padding:10px 10px; border-radius:12px; cursor:pointer; position:relative; transition:background .15s}
.steps button:hover:not([disabled]){background:rgba(255,255,255,.04)}
.steps button[disabled]{cursor:default; opacity:.45}
.steps button i{font-style:normal; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; flex:none; font:800 13px "Golos UI"; border:1.5px solid var(--line2); color:var(--tx2); background:var(--bg2); z-index:1}
.steps button.ok i{background:rgba(90,211,160,.14); border-color:var(--green); color:var(--green)}
.steps button.on{background:linear-gradient(90deg, rgba(242,181,68,.16), rgba(242,181,68,.02))}
.steps button.on i{background:var(--amber); border-color:var(--amber); color:#1A1405; box-shadow:0 0 0 5px rgba(242,181,68,.15)}
.steps button span{display:flex; flex-direction:column; line-height:1.2; font-weight:700}
.steps button small{font-weight:400; color:var(--mute); font-size:12px; margin-top:2px}
.steps button:not(:last-child)::after{content:""; position:absolute; left:24.5px; top:40px; height:calc(100% - 22px); width:1.5px; background:var(--line2)}
.steps button.ok:not(:last-child)::after{background:rgba(90,211,160,.5)}
.prog{height:6px; border-radius:6px; background:var(--line); overflow:hidden; margin:2px 6px}
.prog>div{height:100%; background:linear-gradient(90deg, var(--green), var(--cyan)); border-radius:6px; transition:width .4s}
.prog-l{display:flex; justify-content:space-between; color:var(--mute); font-size:12px; margin:0 6px}
.side-sp{flex:1}
.who{display:flex; gap:10px; align-items:center; padding:12px; border-radius:12px; background:rgba(255,255,255,.03); border:1px solid var(--line)}
.ava{width:38px; height:38px; border-radius:11px; display:grid; place-items:center; font:800 14px "Golos UI"; color:#0B1020; flex:none}
.who b{display:block; font-size:14px; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px}
.who small{color:var(--mute); font-size:12px}
.side-act{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.side-act button{all:unset; box-sizing:border-box; display:flex; gap:8px; align-items:center; padding:8px 10px; border-radius:10px; color:var(--tx2); font-size:13px; cursor:pointer; border:1px solid transparent}
.side-act button:hover{background:rgba(255,255,255,.05); color:var(--tx); border-color:var(--line)}
.side-act button.wide{grid-column:1/-1}

/* ---------- элементы ---------- */
.head{display:flex; align-items:flex-end; gap:16px; margin-bottom:20px}
.head h1{margin:0; font:800 28px/1.15 "Golos UI"; letter-spacing:-.2px}
.head .kick{color:var(--amber); font:700 12px/1 "Golos UI"; letter-spacing:1.6px; text-transform:uppercase; margin-bottom:8px}
.head .sp{flex:1}
.card{background:linear-gradient(180deg, rgba(22,33,58,.85), rgba(17,26,46,.85)); border:1px solid var(--line); border-radius:var(--r); padding:20px 22px; box-shadow:var(--sh)}
.card + .card{margin-top:16px}
.grid2>.card, .stage>.card, .rep>.card{margin-top:0}
.card h2{margin:0 0 10px; font:800 18px/1.25 "Golos UI"; display:flex; align-items:center; gap:10px}
.card h2 .pill{margin-left:auto}
.kicker{display:block; color:var(--amber); font:700 11.5px/1 "Golos UI"; letter-spacing:1.4px; text-transform:uppercase; margin-bottom:10px}
.mute{color:var(--tx2)} .small{font-size:13.5px} .center{text-align:center}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid var(--line2); font:700 12.5px "Golos UI"; color:var(--tx2); white-space:nowrap}
.pill.ok{color:var(--green); border-color:rgba(90,211,160,.45); background:rgba(90,211,160,.08)}
.pill.warn{color:var(--amber); border-color:rgba(242,181,68,.45); background:rgba(242,181,68,.08)}
.pill.bad{color:var(--red); border-color:rgba(242,114,126,.45); background:rgba(242,114,126,.08)}
.btn{all:unset; box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:12px 18px; border-radius:12px; cursor:pointer; font:700 15px "Golos UI";
  background:linear-gradient(180deg, #FFC75A, #EAA52C); color:#1C1404; box-shadow:0 6px 18px rgba(242,181,68,.25), inset 0 1px 0 rgba(255,255,255,.35); transition:transform .08s, filter .15s; text-align:center}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4; pointer-events:none}
.btn.line{background:rgba(255,255,255,.04); color:var(--tx); border:1px solid var(--line2); box-shadow:none}
.btn.line:hover{background:rgba(255,255,255,.08); border-color:#3B5182}
.btn.green{background:linear-gradient(180deg, #6BE3B0, #3FBF8A); color:#04170F; box-shadow:0 6px 18px rgba(90,211,160,.25)}
.btn.on{background:rgba(90,211,160,.12); color:var(--green); border:1px solid rgba(90,211,160,.5); box-shadow:none}
.btn.off{background:rgba(242,114,126,.08); color:var(--red); border:1px solid rgba(242,114,126,.45); box-shadow:none}
.btn.wide{width:100%} .btn.big{padding:16px 20px; font-size:16px}
.btn kbd{margin-left:6px}
.btn.next{margin-top:16px}
.row{display:flex; gap:10px; flex-wrap:wrap} .row>.btn{flex:1 1 0}
.mt{margin-top:14px}
.grid2{display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.1fr); gap:20px; align-items:start}
.grid2.even{grid-template-columns:1fr 1fr}
.field{display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--tx2); font-weight:600}
.field input, input.inp, textarea.inp{background:#0A1222; border:1.5px solid var(--line2); border-radius:10px; padding:11px 13px; outline:none; transition:border-color .15s, box-shadow .15s; font-size:15px; color:var(--tx); font-weight:500}
.field input:focus, input.inp:focus, textarea.inp:focus{border-color:var(--amber); box-shadow:0 0 0 4px rgba(242,181,68,.15)}
input.ok{border-color:var(--green) !important; background:rgba(90,211,160,.07)}
input.bad{border-color:var(--red) !important; background:rgba(242,114,126,.07)}
textarea.inp{width:100%; resize:vertical; line-height:1.55; min-height:220px}
.lw-msg{min-height:22px; margin:12px 0 0; font-weight:600; font-size:14px}
.lw-msg.bad{color:var(--red)} .lw-msg.good{color:var(--green)}

/* ---------- допуск ---------- */
.aim{font-size:17px; line-height:1.55; margin:0}
.tabs{display:flex; gap:4px; padding:4px; background:#0A1222; border:1px solid var(--line); border-radius:12px; margin-bottom:14px}
.tabs button{all:unset; flex:1; text-align:center; padding:9px 10px; border-radius:9px; cursor:pointer; color:var(--tx2); font-weight:700; font-size:14px}
.tabs button.on{background:var(--panel2); color:var(--tx); box-shadow:0 2px 8px rgba(0,0,0,.3)}
.read p{margin:0 0 10px; color:#D3DCEB; line-height:1.6}
.read b{color:var(--tx)}
.paper-mini{background:#F7F4EC; border-radius:10px; padding:10px; margin:6px 0 12px}
.paper-mini .lwr-svg{margin:0}
.q{padding:14px 0; border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q>b{display:block; margin-bottom:10px; font-weight:700; line-height:1.4}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.opts button{all:unset; box-sizing:border-box; display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line2); background:rgba(255,255,255,.02); cursor:pointer; font-size:14px; line-height:1.35; transition:border-color .12s, background .12s}
.opts button:hover{border-color:#3E5687; background:rgba(255,255,255,.04)}
.opts button .lt{flex:none; width:22px; height:22px; border-radius:6px; display:grid; place-items:center; background:var(--line); font:800 12px "Golos UI"; color:var(--tx2)}
.opts button.pick{border-color:var(--amber); background:rgba(242,181,68,.08)} .opts button.pick .lt{background:var(--amber); color:#1A1405}
.opts button.ok{border-color:var(--green); background:rgba(90,211,160,.1)} .opts button.ok .lt{background:var(--green); color:#04170F}
.opts button.bad{border-color:var(--red); background:rgba(242,114,126,.1)} .opts button.bad .lt{background:var(--red); color:#25070B}
.sticky{position:sticky; top:0}

/* ---------- установка ---------- */
.stage{display:grid; grid-template-columns:minmax(0, 1fr) 400px; gap:20px; align-items:start}
.rig{padding:16px}
.rig-top{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px}
.rig-top h2{margin:0 auto 0 4px; font-size:16px}
.meter{display:flex; flex-direction:column; padding:6px 12px; border-radius:10px; background:#0A1222; border:1px solid var(--line); min-width:96px}
.meter small{color:var(--mute); font-size:11.5px; font-weight:700; letter-spacing:.2px}
.meter b{font:800 20px/1.2 "Golos UI"; font-variant-numeric:tabular-nums}
.meter.proc{flex:1; min-width:200px} .meter.proc b{font-size:15px; line-height:1.6; color:var(--amber2)}
#l3-cv{display:block; width:min(100%, calc((100vh - 430px) * 1.283)); margin:0 auto; border-radius:12px; border:1px solid var(--line)}
.chart{margin-top:12px; background:#0A1222; border:1px solid var(--line); border-radius:12px; padding:10px 12px 6px}
.chart-h{display:flex; align-items:center; gap:14px; font-size:12px; color:var(--mute); font-weight:700}
.chart-h b{color:var(--tx2); font-size:13px; margin-right:auto}
.chart-h i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px}
#d-chart{display:block; width:100%; height:150px}
.panel .card{padding:18px}
.now{border-color:rgba(242,181,68,.45); background:linear-gradient(180deg, rgba(242,181,68,.09), rgba(17,26,46,.9) 60%)}
.now .say{font-size:15.5px; line-height:1.55; margin:0 0 14px}
.now .say b{color:var(--amber2)}
.ctl{display:flex; flex-direction:column; gap:8px}
.ctl .btn{justify-content:flex-start}
.ctl .btn kbd{margin-left:auto}
.hold{position:relative; overflow:hidden}
.hold.pressed{filter:brightness(1.12); box-shadow:0 0 0 5px rgba(242,181,68,.28), inset 0 3px 10px rgba(0,0,0,.25); transform:translateY(1px)}
.bar{height:8px; border-radius:8px; background:var(--line); overflow:hidden; margin:2px 0 10px}
.bar>div{height:100%; background:linear-gradient(90deg, var(--amber), var(--amber2)); border-radius:8px}
.bar.zone{position:relative}
.bar.zone::after{content:""; position:absolute; left:calc(210/240*100%); width:calc(10/240*100%); top:0; bottom:0; background:rgba(90,211,160,.55)}
.read-in{display:flex; gap:8px; align-items:stretch}
.read-in input{flex:1; min-width:0; width:0; font-size:20px !important; font-weight:800 !important; text-align:center}
.read-in .btn{flex:none}
.plan{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:2px; counter-reset:p}
.plan li{display:flex; gap:10px; align-items:flex-start; padding:7px 8px; border-radius:9px; color:var(--mute); font-size:14px; line-height:1.35}
.plan li::before{counter-increment:p; content:counter(p); flex:none; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font:800 11.5px "Golos UI"; border:1.5px solid var(--line2)}
.plan li.done{color:var(--tx2)} .plan li.done::before{content:"✓"; background:rgba(90,211,160,.15); border-color:var(--green); color:var(--green)}
.plan li.cur{color:var(--tx); background:rgba(242,181,68,.08); font-weight:700} .plan li.cur::before{background:var(--amber); border-color:var(--amber); color:#1A1405}
table.t{width:100%; border-collapse:separate; border-spacing:0; font-variant-numeric:tabular-nums}
table.t th{color:var(--mute); font-size:12px; font-weight:700; text-align:center; padding:8px; border-bottom:1px solid var(--line2); letter-spacing:.3px}
table.t td{text-align:center; padding:9px 8px; border-bottom:1px solid var(--line); font-weight:600}
table.t tr.now td{background:rgba(242,181,68,.07)}
table.t tr.sum td{color:var(--tx2); font-weight:700}
table.t td input{width:100%; max-width:130px; text-align:center; padding:8px 10px}
.res{margin-top:14px; padding:14px 16px; border-radius:12px; background:rgba(90,211,160,.08); border:1px solid rgba(90,211,160,.35); font:800 22px "Golos UI"; color:var(--green); text-align:center}
.fcard{padding:12px 14px; border-radius:12px; background:#0A1222; border:1px solid var(--line); margin-bottom:10px}
.fcard small{display:block; color:var(--mute); font-size:12px; margin-bottom:6px; font-weight:700}
.fcard .m{font-size:20px; color:#F3F6FB}
.flab{display:grid; grid-template-columns:1fr 140px; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line)}
.flab:first-of-type{border-top:0}
.flab span{font-size:14px; color:var(--tx2)} .flab span .m{color:var(--tx); font-size:17px}

/* ---------- отчёт ---------- */
.rep{display:grid; grid-template-columns:360px minmax(0, 1fr); gap:24px; align-items:start}
.paper{background:#2A3550; border-radius:14px; padding:22px; max-height:calc(100vh - 140px); overflow:auto}
.paper .lwr{gap:22px}
.done-badge{display:flex; gap:12px; align-items:center; padding:14px; border-radius:12px; background:rgba(90,211,160,.08); border:1px solid rgba(90,211,160,.35); margin-bottom:14px}
.done-badge .ic{width:30px; height:30px; color:var(--green)}
.done-badge b{display:block; font-size:16px}

/* ---------- старт ---------- */
.home{display:grid; grid-template-columns:1.1fr 1fr; gap:40px; align-items:center; max-width:1240px; margin:0 auto; min-height:calc(100vh - 66px)}
.hero h1{font:800 46px/1.05 "Golos UI"; margin:14px 0 14px; letter-spacing:-.6px}
.hero h1 em{font-style:normal; background:linear-gradient(90deg, var(--amber2), var(--amber) 40%, #FF8A5B); -webkit-background-clip:text; background-clip:text; color:transparent}
.hero p{font-size:17px; color:var(--tx2); max-width:540px; line-height:1.6}
.hero .art{width:100%; max-width:520px; margin-top:12px}
.hero .facts{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}
.plist{display:flex; flex-direction:column; gap:8px; max-height:300px; overflow:auto; margin:6px -4px 14px; padding:0 4px}
.prof{display:flex; gap:12px; align-items:center; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.02); cursor:pointer; transition:border-color .12s, background .12s}
.prof:hover{border-color:#3E5687; background:rgba(255,255,255,.05)}
.prof .nm{flex:1; min-width:0} .prof .nm b{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap} .prof .nm small{color:var(--mute)}
.prof .x{all:unset; padding:6px; border-radius:8px; color:var(--mute); cursor:pointer} .prof .x:hover{color:var(--red); background:rgba(242,114,126,.1)}
.newp{display:grid; grid-template-columns:1.5fr 1fr; gap:10px}
.or{display:flex; align-items:center; gap:12px; color:var(--mute); font-size:13px; margin:18px 0 12px}
.or::before,.or::after{content:""; flex:1; height:1px; background:var(--line)}
.ver{color:var(--mute); font-size:12px; margin-top:14px; text-align:center}

/* ---------- преподаватель ---------- */
.drop{border:2px dashed var(--line2); border-radius:14px; padding:22px; text-align:center; color:var(--tx2); transition:border-color .15s, background .15s; cursor:pointer}
.drop.over{border-color:var(--amber); background:rgba(242,181,68,.06)}
.stats{display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin:16px 0}
.stat{padding:14px 16px; border-radius:12px; background:#0A1222; border:1px solid var(--line)}
.stat small{display:block; color:var(--mute); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px}
.stat b{font:800 26px/1.3 "Golos UI"; font-variant-numeric:tabular-nums}
table.tt{width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums}
table.tt th{position:sticky; top:0; background:#121C31; color:var(--mute); font-size:12px; text-align:left; padding:10px; border-bottom:1px solid var(--line2)}
table.tt td{padding:10px; border-bottom:1px solid var(--line)}
table.tt tr.r{cursor:pointer} table.tt tr.r:hover td{background:rgba(255,255,255,.03)}
table.tt td.n{text-align:right}

/* ---------- окна и уведомления ---------- */
#toasts{position:fixed; right:24px; bottom:24px; display:flex; flex-direction:column; gap:8px; z-index:50; pointer-events:none}
.toast{padding:12px 16px; border-radius:12px; background:#1C2945; border:1px solid var(--line2); box-shadow:var(--sh); font-weight:600; max-width:460px; animation:tin .2s ease-out}
.toast.bad{border-color:rgba(242,114,126,.6); background:#2A1622}
.toast.out{opacity:0; transform:translateY(6px); transition:.4s}
@keyframes tin{from{opacity:0; transform:translateY(8px)}}
#modal{position:fixed; inset:0; background:rgba(4,8,16,.72); backdrop-filter:blur(4px); z-index:40; display:grid; place-items:center; padding:30px}
#modal[hidden]{display:none}
.mbox{background:var(--panel); border:1px solid var(--line2); border-radius:18px; box-shadow:0 30px 80px rgba(0,0,0,.6); max-width:min(980px, 100%); width:100%; max-height:calc(100vh - 60px); display:flex; flex-direction:column}
.mbox header{display:flex; gap:12px; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line)}
.mbox header h2{margin:0 auto 0 0; font:800 18px "Golos UI"}
.mbox .mb{overflow:auto; padding:20px}
.keys{display:grid; grid-template-columns:auto 1fr; gap:10px 18px; align-items:center}
.keys kbd{margin:0; justify-self:start; min-width:34px; height:26px; font-size:12px}
#printroot{display:none}

/*{{REPORT_CSS}}*/
.paper .lwp{max-width:820px}

@media (max-width:1250px){ .stage{grid-template-columns:minmax(0, 1fr) 340px} #app{grid-template-columns:250px 1fr} .rep{grid-template-columns:300px minmax(0, 1fr)} }
@media print{
  @page{size:A4; margin:12mm}
  html,body{height:auto; overflow:visible; background:#fff !important}
  #app,#toasts,#modal{display:none !important}
  #printroot{display:block}
  .lwr{display:block}.lwp{box-shadow:none; border-radius:0; padding:0; max-width:none; page-break-after:always; break-after:page}
  .lwp:last-child{page-break-after:auto; break-after:auto}
}
</style>
</head>
<body>
<div id="app"><aside id="side"></aside><main id="main"></main></div>
<div id="toasts"></div>
<div id="modal" hidden></div>
<div id="printroot"></div>
<input type="file" id="file-in" accept=".lw3,application/json" multiple hidden>
<script>
{{JS}}
</script>
</body>
</html>
