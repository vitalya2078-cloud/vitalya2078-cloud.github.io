<style>
@font-face{font-family:"Golos UI"; font-weight:400; font-display:block; src:url(fonts/golos-400.woff2) format("woff2")}
@font-face{font-family:"Golos UI"; font-weight:600; font-display:block; src:url(fonts/golos-600.woff2) format("woff2")}
@font-face{font-family:"Golos UI"; font-weight:700; font-display:block; src:url(fonts/golos-700.woff2) format("woff2")}
@font-face{font-family:"Golos UI"; font-weight:800 900; font-display:block; src:url(fonts/golos-latin-800.woff2) format("woff2"); unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:"Golos UI"; font-weight:800 900; font-display:block; src:url(fonts/golos-cyrillic-800.woff2) format("woff2"); unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}

@font-face{font-family:"F2 Math"; font-style:italic; font-weight:400 700; src:url(fonts/stix-greek-600i.woff2) format("woff2"); unicode-range:U+0370-03FF}
@font-face{font-family:"F2 Math"; font-style:normal; font-weight:400 700; src:url(fonts/stix-latin-600.woff2) format("woff2"); unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:"F2 Math"; font-style:normal; font-weight:400 700; src:url(fonts/stix-greek-600.woff2) format("woff2"); unicode-range:U+0370-03FF}
@font-face{font-family:"F2 Math"; font-style:normal; font-weight:400 700; src:url(fonts/stix-cyrillic-600.woff2) format("woff2"); unicode-range:U+0400-045F}

/* =====================================================================
   Стиль программы «Показатель адиабаты»: графит + «тепло / холод».
   Все цвета — токены; тёмная тема по умолчанию, светлая — для проектора.
   ===================================================================== */
:root, [data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1013; --bg2:#121418; --panel:#181B20; --panel2:#1F232A; --hover:#242931; --line:#2A2F37; --line2:#38404B;
  --tx:#ECEEF1; --tx2:#AEB4BE; --mute:#7D8590;
  --acc:#FF7A45; --acc2:#FF9C70; --acc-tx:#1C0C04; --acc-soft:rgba(255,122,69,.13);
  --cold:#58A6FF; --cold-soft:rgba(88,166,255,.13);
  --ok:#3DD68C; --ok-soft:rgba(61,214,140,.12); --bad:#FF5D6C; --bad-soft:rgba(255,93,108,.12); --warn:#F5B83D; --warn-soft:rgba(245,184,61,.12);
  --sh:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35); --sh-pop:0 24px 70px rgba(0,0,0,.6);
  --paper-bg:#262A31; --scroll:#343A44; --overlay:rgba(6,7,9,.72);
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#EEF0F3; --bg2:#FFFFFF; --panel:#FFFFFF; --panel2:#F6F7F9; --hover:#EEF0F4; --line:#E1E4E9; --line2:#C9CED6;
  --tx:#14171C; --tx2:#454C57; --mute:#6E7682;
  --acc:#E4571B; --acc2:#F07436; --acc-tx:#FFFFFF; --acc-soft:rgba(228,87,27,.10);
  --cold:#1E6FD6; --cold-soft:rgba(30,111,214,.10);
  --ok:#128A52; --ok-soft:rgba(18,138,82,.10); --bad:#D2283C; --bad-soft:rgba(210,40,60,.09); --warn:#A86A0C; --warn-soft:rgba(200,130,20,.12);
  --sh:0 1px 2px rgba(20,23,28,.06), 0 6px 18px rgba(20,23,28,.06); --sh-pop:0 24px 70px rgba(20,23,28,.25);
  --paper-bg:#DADDE3; --scroll:#C3C8D0; --overlay:rgba(20,23,28,.45);
}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{background:var(--bg) url(img/bg/dark.webp) center/cover no-repeat fixed; color:var(--tx); font:15px/1.5 "Golos UI", "Segoe UI", system-ui, sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; user-select:none}
input,textarea{user-select:text}
button,input,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px}
.ic{width:18px; height:18px; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px}
.m{font-family:"F2 Math", "Cambria Math", serif; font-style:italic}
kbd{display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:20px; padding:0 6px; border-radius:6px; border:1px solid var(--line2); border-bottom-width:2px;
  background:var(--panel2); font:700 11px/1 "Golos UI", system-ui; color:var(--tx2); margin-left:auto; white-space:nowrap}
.btn kbd{background:rgba(0,0,0,.12); border-color:rgba(0,0,0,.18); color:inherit; opacity:.8}
.btn.line kbd{background:var(--panel2); border-color:var(--line2); color:var(--tx2); opacity:1}
::-webkit-scrollbar{width:12px; height:12px}::-webkit-scrollbar-thumb{background:var(--scroll); border-radius:8px; border:3px solid transparent; background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}

/* ---------- каркас ---------- */
#app{display:grid; grid-template-columns:268px 1fr; height:100vh}
[data-theme="light"] body{background-image:url(img/bg/light.webp)}
body.noside #app{grid-template-columns:1fr}
body.fzapp #main{padding:0}
body.noside #side{display:none}
#side{background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:20px 14px 14px; gap:18px; min-height:0}
#main{overflow:auto; padding:24px 32px 40px; min-width:0; scroll-behavior:smooth}
.brand{display:flex; gap:12px; align-items:center; padding:0 6px}
.logo{width:40px; height:40px; flex:none; border-radius:12px; display:grid; place-items:center; background:linear-gradient(135deg, var(--cold), var(--acc)); color:#fff; font:italic 700 26px/1 "F2 Math", serif}
.brand b{display:block; font:800 16px/1.2 "Golos UI"}
.brand span{display:block; color:var(--mute); font-size:12.5px; line-height:1.3}

.steps{display:flex; flex-direction:column; gap:2px}
.steps button{all:unset; box-sizing:border-box; display:flex; gap:12px; align-items:center; padding:9px 10px; border-radius:10px; cursor:pointer; position:relative; font-weight:600; color:var(--tx2); transition:background .12s}
.steps button:hover:not([disabled]){background:var(--hover); color:var(--tx)}
.steps button[disabled]{cursor:default; color:var(--mute); opacity:.6}
.steps button i{font-style:normal; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; flex:none; font:700 12px "Golos UI"; border:1.5px solid var(--line2); background:var(--panel); z-index:1}
.steps button.ok i{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}
.steps button.on{background:var(--acc-soft); color:var(--tx)}
.steps button.on i{background:var(--acc); border-color:var(--acc); color:var(--acc-tx)}
.steps button:not(:last-child)::after{content:""; position:absolute; left:22px; top:35px; height:calc(100% - 19px); width:1.5px; background:var(--line)}
.steps button.ok:not(:last-child)::after{background:var(--ok); opacity:.45}
.prog{height:4px; border-radius:4px; background:var(--line); overflow:hidden; margin:0 8px}
.prog>div{height:100%; background:var(--ok); border-radius:4px; transition:width .4s}
.side-sp{flex:1}
.who{display:flex; gap:10px; align-items:center; padding:10px; border-radius:12px; background:var(--panel2); border:1px solid var(--line)}
.ava{width:36px; height:36px; border-radius:10px; display:grid; place-items:center; font:800 13px "Golos UI"; color:#14171C; flex:none}
.who b{display:block; font-size:14px; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px}
.who small{color:var(--mute); font-size:12px}
.side-act{display:grid; grid-template-columns:1fr 1fr; gap:4px}
.side-act button{all:unset; box-sizing:border-box; display:flex; gap:8px; align-items:center; padding:8px 10px; border-radius:9px; color:var(--tx2); font-size:13px; cursor:pointer}
.side-act button:hover{background:var(--hover); color:var(--tx)}
.side-act button.wide{grid-column:1/-1}

/* ---------- элементы ---------- */
.head{display:flex; align-items:center; gap:14px; margin-bottom:18px; min-height:40px}
.head h1{margin:0; font:800 26px/1.15 "Golos UI"; letter-spacing:-.2px}
.head .sp{flex:1}
.card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px 22px; box-shadow:var(--sh)}
.card + .card{margin-top:16px}
.grid2>.card, .stage>.card, .rep>.card{margin-top:0}
.card h2{margin:0 0 10px; font:700 17px/1.3 "Golos UI"; display:flex; align-items:center; gap:10px}
.card h2 .ic{color:var(--mute)}
.card h2 .pill{margin-left:auto}
.kicker{display:block; color:var(--acc); font:700 12px/1 "Golos UI"; letter-spacing:.6px; text-transform:uppercase; margin-bottom:10px}
.mute{color:var(--tx2)} .small{font-size:13.5px} .center{text-align:center}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); font:600 12.5px "Golos UI"; color:var(--tx2); white-space:nowrap}
.pill.ok{color:var(--ok); border-color:transparent; background:var(--ok-soft)}
.pill.warn{color:var(--acc); border-color:transparent; background:var(--acc-soft)}
.pill.bad{color:var(--bad); border-color:transparent; background:var(--bad-soft)}
.btn{all:unset; box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:11px 18px; border-radius:11px; cursor:pointer; font:700 15px "Golos UI";
  background:var(--acc); color:var(--acc-tx); transition:background .12s, transform .06s; text-align:center}
.btn:hover{background:var(--acc2)} .btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4; pointer-events:none}
.btn.line{background:var(--panel2); color:var(--tx); border:1px solid var(--line2)}
.btn.line:hover{background:var(--hover)}
.btn.on{background:var(--ok-soft); color:var(--ok); border:1px solid transparent}
.btn.off{background:var(--bad-soft); color:var(--bad); border:1px solid transparent}
.btn.ghost{background:transparent; color:var(--tx2); padding:8px 10px} .btn.ghost:hover{background:var(--hover); color:var(--tx)}
.btn.wide{width:100%} .btn.big{padding:15px 20px; font-size:16px}
.btn.next{margin-top:16px}
.row{display:flex; gap:10px; flex-wrap:wrap} .row>.btn{flex:1 1 0}
.mt{margin-top:14px}
.grid2{display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.1fr); gap:20px; align-items:start}
.grid2.even{grid-template-columns:1fr 1fr}
.field{display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--tx2); font-weight:600}
.field input, input.inp, textarea.inp{background:var(--bg2); border:1.5px solid var(--line2); border-radius:10px; padding:11px 13px; outline:none; transition:border-color .12s, box-shadow .12s; font-size:15px; color:var(--tx); font-weight:500}
.field input:focus, input.inp:focus, textarea.inp:focus{border-color:var(--acc); box-shadow:0 0 0 4px var(--acc-soft)}
input.ok{border-color:var(--ok) !important; background:var(--ok-soft) !important}
input.bad{border-color:var(--bad) !important; background:var(--bad-soft) !important}
textarea.inp{width:100%; resize:vertical; line-height:1.55; min-height:220px}
.lw-msg{min-height:20px; margin:12px 0 0; font-weight:600; font-size:14px}
.lw-msg:empty{display:none}
.lw-msg.bad{color:var(--bad)} .lw-msg.good{color:var(--ok)}

/* ---------- допуск, вопросы ---------- */
.aim{font-size:16.5px; line-height:1.55; margin:0}
.tabs{display:flex; gap:4px; padding:4px; background:var(--bg2); border:1px solid var(--line); border-radius:12px; margin-bottom:14px}
.tabs button{all:unset; flex:1; text-align:center; padding:8px 10px; border-radius:9px; cursor:pointer; color:var(--tx2); font-weight:600; font-size:14px}
.tabs button.on{background:var(--panel2); color:var(--tx); box-shadow:0 1px 3px rgba(0,0,0,.2)}
.read p{margin:0 0 10px; color:var(--tx2); line-height:1.6}
.read b{color:var(--tx)}
.paper-mini{background:#FBFAF6; border-radius:10px; padding:10px; margin:2px 0 12px; border:1px solid var(--line)}
.paper-mini .lwr-svg{margin:0}
.q{padding:14px 0; border-top:1px solid var(--line)}
.q:first-of-type{border-top:0; padding-top:4px}
.q>b{display:block; margin-bottom:10px; font-weight:600; line-height:1.4}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.opts button{all:unset; box-sizing:border-box; display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg2); cursor:pointer; font-size:14px; line-height:1.35; transition:border-color .1s, background .1s}
.opts button:hover{border-color:var(--line2); background:var(--hover)}
.opts button .lt{flex:none; width:22px; height:22px; border-radius:6px; display:grid; place-items:center; background:var(--panel2); border:1px solid var(--line2); font:700 12px "Golos UI"; color:var(--tx2)}
.opts button.pick{border-color:var(--acc); background:var(--acc-soft)} .opts button.pick .lt{background:var(--acc); border-color:var(--acc); color:var(--acc-tx)}
.opts button.ok{border-color:var(--ok); background:var(--ok-soft)} .opts button.ok .lt{background:var(--ok); border-color:var(--ok); color:#fff}
.opts button.bad{border-color:var(--bad); background:var(--bad-soft)} .opts button.bad .lt{background:var(--bad); border-color:var(--bad); color:#fff}
.sticky{position:sticky; top:0}

/* ---------- установка ---------- */
.stage{display:grid; grid-template-columns:minmax(0, 1fr) 380px; gap:20px; align-items:start}
.rig{padding:14px}
.rig-top{display:flex; gap:8px; align-items:stretch; flex-wrap:wrap; margin-bottom:12px}
.meter{display:flex; flex-direction:column; padding:6px 12px; border-radius:10px; background:var(--bg2); border:1px solid var(--line); min-width:96px}
.meter small{color:var(--mute); font-size:11.5px; font-weight:600}
.meter b{font:800 20px/1.2 "Golos UI"; font-variant-numeric:tabular-nums}
.meter.proc{flex:1; min-width:200px} .meter.proc b{font-size:15px; line-height:1.6; color:var(--acc)}
#l3-cv{display:block; width:min(100%, calc((100vh - 400px) * 1.283)); margin:0 auto; border-radius:12px}
.chart{margin-top:12px; background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:10px 12px 6px}
.chart-h{display:flex; align-items:center; gap:14px; font-size:12px; color:var(--mute); font-weight:600}
.chart-h b{color:var(--tx2); font-size:13px; margin-right:auto}
.chart-h i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px}
#d-chart{display:block; width:100%; height:140px}
.panel .card{padding:18px}
.now{border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-soft), var(--sh)}
.now .say{font-size:15.5px; line-height:1.55; margin:0 0 14px}
.now .say b{color:var(--acc)}
.ctl{display:flex; flex-direction:column; gap:8px}
.ctl .btn{justify-content:flex-start}
.hold.pressed{background:var(--acc2); box-shadow:0 0 0 5px var(--acc-soft); transform:translateY(1px)}
.bar{height:8px; border-radius:8px; background:var(--line); overflow:hidden; margin:2px 0 12px; position:relative}
.bar>div{height:100%; background:var(--acc); border-radius:8px}
.bar.zone::after{content:""; position:absolute; left:calc(210/240*100%); width:calc(10/240*100%); top:0; bottom:0; background:var(--ok); opacity:.7}
.read-in{display:flex; gap:8px; align-items:stretch}
.read-in input{flex:1; min-width:0; width:0; font-size:20px !important; font-weight:800 !important; text-align:center}
.read-in .btn{flex:none}
.segs{display:flex; gap:4px; margin:0 0 6px}
.segs i{flex:1; height:6px; border-radius:6px; background:var(--line)}
.segs i.done{background:var(--ok)} .segs i.cur{background:var(--acc)}
.segs-l{display:flex; justify-content:space-between; font-size:12.5px; color:var(--mute); margin-bottom:12px}
.segs-l b{color:var(--tx2); font-weight:600}
table.t{width:100%; border-collapse:separate; border-spacing:0; font-variant-numeric:tabular-nums}
table.t th{color:var(--mute); font-size:12px; font-weight:600; text-align:center; padding:7px; border-bottom:1px solid var(--line2)}
table.t td{text-align:center; padding:8px; border-bottom:1px solid var(--line); font-weight:600}
table.t tr:last-child td{border-bottom:0}
table.t tr.now td{background:var(--acc-soft)}
table.t tr.sum td{color:var(--tx2)}
table.t td input{width:100%; max-width:130px; text-align:center; padding:8px 10px}
.res{margin-top:14px; padding:14px 16px; border-radius:12px; background:var(--ok-soft); font:800 22px "Golos UI"; color:var(--ok); text-align:center}
.fcard{padding:12px 14px; border-radius:12px; background:var(--bg2); border:1px solid var(--line); margin-bottom:10px}
.fcard small{display:block; color:var(--mute); font-size:12px; margin-bottom:6px; font-weight:600}
.fcard .m{font-size:20px; color:var(--tx)}
.flab{display:grid; grid-template-columns:1fr 140px; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line)}
.flab:first-of-type{border-top:0}
.flab span{font-size:14px; color:var(--tx2)} .flab span .m{color:var(--tx); font-size:17px}

/* ---------- отчёт ---------- */
.rep{display:grid; grid-template-columns:340px minmax(0, 1fr); gap:24px; align-items:start}
.paper{background:var(--paper-bg); border-radius:14px; padding:22px; max-height:calc(100vh - 60px - 48px); overflow:auto}
.paper .lwr{gap:22px}
.done-badge{display:flex; gap:12px; align-items:center; padding:14px; border-radius:12px; background:var(--ok-soft); margin-bottom:14px}
.done-badge .ic{width:28px; height:28px; color:var(--ok)}
.done-badge b{display:block; font-size:16px}

/* ---------- вход ---------- */
.login{min-height:calc(100vh - 64px); display:grid; place-items:center; position:relative}
.login-box{width:min(460px, 100%)}
.login-brand{display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:22px}
.login-brand .logo{width:64px; height:64px; border-radius:18px; font-size:42px; margin-bottom:16px}
.login-brand h1{margin:0; font:800 30px/1.15 "Golos UI"; letter-spacing:-.3px}
.login-brand p{margin:6px 0 0; color:var(--mute)}
.login .card{padding:24px}
.login .field + .field{margin-top:12px}
.plist{display:flex; flex-direction:column; gap:6px; max-height:240px; overflow:auto; margin:4px -4px 0; padding:0 4px}
.plist-h{display:flex; align-items:center; justify-content:space-between; color:var(--mute); font-size:13px; font-weight:600; margin:22px 4px 8px}
.prof{display:flex; gap:12px; align-items:center; padding:9px 10px; border-radius:12px; border:1px solid var(--line); background:var(--panel); cursor:pointer; transition:border-color .1s, background .1s}
.prof:hover{border-color:var(--line2); background:var(--hover)}
.prof .nm{flex:1; min-width:0} .prof .nm b{display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap} .prof .nm small{color:var(--mute)}
.prof .x{all:unset; padding:6px; border-radius:8px; color:var(--mute); cursor:pointer} .prof .x:hover{color:var(--bad); background:var(--bad-soft)}
.corner{position:fixed; display:flex; gap:4px}
.corner.tr{top:14px; right:16px} .corner.br{bottom:14px; right:16px} .corner.bl{bottom:16px; left:20px; color:var(--mute); font-size:12px}

/* ---------- знакомство ---------- */
.intro{width:min(820px, 100%); max-height:calc(100vh - 40px); overflow:auto; background:var(--panel); border:1px solid var(--line2); border-radius:20px; box-shadow:var(--sh-pop); overflow:hidden}
.intro-art{min-height:240px; background:var(--bg2); border-bottom:1px solid var(--line); display:grid; place-items:center; padding:20px}
.intro-art svg{max-width:100%; max-height:100%}
.intro-tx{padding:24px 28px 8px}
.intro-tx h2{margin:0 0 8px; font:800 24px/1.2 "Golos UI"}
.intro-tx p{margin:0; color:var(--tx2); font-size:16px; line-height:1.55}
.intro-ft{display:flex; align-items:center; gap:10px; padding:18px 28px 24px}
.dots{display:flex; gap:6px; margin-right:auto}
.dots i{width:8px; height:8px; border-radius:8px; background:var(--line2); transition:width .2s}
.dots i.on{width:24px; background:var(--acc)}
.keys{display:grid; grid-template-columns:auto 1fr auto 1fr; gap:12px 16px; align-items:center; font-size:14.5px; width:100%}
.keys kbd{margin:0; justify-self:end; min-width:36px; height:28px; font-size:12.5px}
.isteps{display:grid; grid-template-columns:repeat(6, 1fr); gap:10px; width:100%}
.isteps div{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 10px; text-align:center}
.isteps i{display:grid; place-items:center; width:30px; height:30px; margin:0 auto 8px; border-radius:50%; background:var(--acc-soft); color:var(--acc); font:800 13px "Golos UI"; font-style:normal}
.isteps b{display:block; font-size:13.5px} .isteps small{display:block; color:var(--mute); font-size:12px; margin-top:4px; line-height:1.3}

/* ---------- преподаватель ---------- */
.drop{border:2px dashed var(--line2); border-radius:14px; padding:20px; text-align:center; color:var(--tx2); transition:border-color .12s, background .12s; cursor:pointer}
.drop.over{border-color:var(--acc); background:var(--acc-soft)}
.stats{display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin:16px 0}
.stat{padding:14px 16px; border-radius:12px; background:var(--panel); border:1px solid var(--line)}
.stat small{display:block; color:var(--mute); font-size:12.5px; font-weight:600}
.stat b{font:800 26px/1.3 "Golos UI"; font-variant-numeric:tabular-nums}
table.tt{width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums}
table.tt th{position:sticky; top:0; background:var(--panel2); color:var(--mute); font-size:12px; font-weight:600; text-align:left; padding:10px; border-bottom:1px solid var(--line2)}
table.tt td{padding:10px; border-bottom:1px solid var(--line)}
table.tt tr.r{cursor:pointer} table.tt tr.r:hover td{background:var(--hover)}
table.tt td.n{text-align:right}
.lock{width:min(400px, 100%); margin:12vh auto 0}
.lock .logo{margin:0 auto 14px; width:52px; height:52px}

/* ---------- окна и уведомления ---------- */
#toasts{position:fixed; right:24px; bottom:24px; display:flex; flex-direction:column; gap:8px; z-index:50; pointer-events:none}
.toast{padding:12px 16px; border-radius:12px; background:var(--panel2); color:var(--tx); border:1px solid var(--line2); box-shadow:var(--sh-pop); font-weight:600; max-width:440px; animation:tin .2s ease-out}
.toast.bad{border-color:var(--bad); background:var(--panel2)}
.toast.out{opacity:0; transform:translateY(6px); transition:.4s}
@keyframes tin{from{opacity:0; transform:translateY(8px)}}
#modal{position:fixed; inset:0; background:var(--overlay); backdrop-filter:blur(3px); z-index:40; display:grid; place-items:center; padding:30px}
#modal[hidden]{display:none}
.mbox{background:var(--panel); border:1px solid var(--line2); border-radius:18px; box-shadow:var(--sh-pop); max-width:min(980px, 100%); width:100%; max-height:calc(100vh - 60px); display:flex; flex-direction:column}
.mbox header{display:flex; gap:12px; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line)}
.mbox header h2{margin:0 auto 0 0; font:700 17px "Golos UI"}
.mbox .mb{overflow:auto; padding:20px}
#printroot{display:none}


/* ---------- новая раскладка: верхняя полоса ---------- */
body.full #main{padding:0; overflow:hidden; display:flex; flex-direction:column}
.tb{display:flex; align-items:center; gap:18px; height:60px; padding:0 18px; background:var(--panel); border-bottom:1px solid var(--line); flex:none}
.tb-brand{display:flex; align-items:center; gap:10px; font-weight:800; white-space:nowrap}
.tb-brand .logo{width:32px; height:32px; border-radius:9px; font-size:21px}
.tb-steps{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; min-width:0}
.tb-steps s{flex:0 1 26px; height:1.5px; background:var(--line2)}
.tb-steps button{all:unset; display:flex; align-items:center; gap:8px; padding:6px 10px 6px 6px; border-radius:999px; cursor:pointer; color:var(--tx2); font-weight:600; font-size:14px; white-space:nowrap}
.tb-steps button:hover:not([disabled]){background:var(--hover)}
.tb-steps button[disabled]{opacity:.45; cursor:default}
.tb-steps button i{font-style:normal; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font:700 12px "Golos UI"; border:1.5px solid var(--line2)}
.tb-steps button.ok i{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}
.tb-steps button.on{background:var(--acc-soft); color:var(--tx)} .tb-steps button.on i{background:var(--acc); border-color:var(--acc); color:var(--acc-tx)}
.tb-act{display:flex; align-items:center; gap:2px}
.tb-who{display:flex; align-items:center; gap:8px; margin-right:8px; font-weight:600; font-size:14px; max-width:220px}
.tb-who span:last-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tb-who .ava{width:30px; height:30px; border-radius:9px; font-size:12px}
.tb-ic{all:unset; width:36px; height:36px; display:grid; place-items:center; border-radius:10px; color:var(--tx2); cursor:pointer}
.tb-ic:hover{background:var(--hover); color:var(--tx)}
@media (max-width:1600px){ .tb-brand b{display:none} .tb-steps{gap:4px} .tb-steps s{flex-basis:14px} }
@media (max-width:1300px){ .tb-steps button span{display:none} .tb-steps button.on span{display:inline} .tb-who span:last-child{display:none} }

/* ---------- обработка, выводы, отчёт под верхней полосой ---------- */
.pg{flex:1; min-height:0; overflow:auto; padding:20px 24px 32px}
.pg .head{margin-bottom:12px; min-height:0}
.pg .sticky{top:0}

/* ---------- тренажёр ---------- */
.tr{flex:1; min-height:0; display:grid; grid-template-columns:270px minmax(0, 1fr) 320px; gap:16px; padding:16px 18px; overflow:hidden}
.tr .card{padding:16px} .tr .card + .card{margin-top:12px}
.tr-l, .tr-r{min-height:0; overflow:auto; display:flex; flex-direction:column}
.tr-h{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:10px}
.tr-h b{font:800 20px/1.2 "Golos UI"} .tr-h span{color:var(--mute); font-size:13px}
.runs{display:flex; gap:4px; margin-bottom:12px} .runs i{flex:1; height:5px; border-radius:5px; background:var(--line)} .runs i.done{background:var(--ok)} .runs i.cur{background:var(--acc)}
.plan{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:2px; counter-reset:p}
.plan li{display:flex; gap:10px; align-items:flex-start; padding:7px 8px; border-radius:9px; color:var(--mute); font-size:14px; line-height:1.35}
.plan li::before{counter-increment:p; content:counter(p); flex:none; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font:700 11.5px "Golos UI"; border:1.5px solid var(--line2)}
.plan li.done{color:var(--tx2)} .plan li.done::before{content:"✓"; background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}
.plan li.cur{color:var(--tx); background:var(--acc-soft); font-weight:600}
.plan li small{display:block; font-size:12.5px; font-weight:500; color:var(--mute); margin-top:2px} .plan li.cur small{color:var(--acc)} .plan li.done small{color:var(--tx2)}
.tr .plan li{flex-wrap:wrap; padding:10px 8px} .tr .plan li > small{flex-basis:100%; padding-left:32px; margin-top:-2px} .plan li.cur::before{background:var(--acc); border-color:var(--acc); color:var(--acc-tx)}
.tr .meters{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.tr .meters .meter{min-width:0} .tr .meters .meter.proc{grid-column:1/-1; min-width:0}
.tr-c{min-width:0; min-height:0; display:flex; flex-direction:column; gap:12px}
.tr-stage{flex:1; min-height:0; display:grid; place-items:center}
.tr-stage #l3-cv{width:min(100%, calc((100vh - 60px - 32px - 150px) * 1.283)); border-radius:14px; box-shadow:var(--sh)}
.tr-dock{display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--acc); box-shadow:0 0 0 3px var(--acc-soft); border-radius:16px; padding:14px 16px}
.tr-dock .say{flex:1 1 100%; margin:0; font-size:15px; line-height:1.5; color:var(--tx2)}
.tr-dock .say b{color:var(--acc)}
.tr-dock .ctl{flex-direction:row; flex-wrap:wrap; gap:8px; flex:1}
.tr-dock .ctl .btn{justify-content:center}
.tr-dock .bar{flex-basis:100%; margin:0}
.tr-dock .read-in{flex:1 1 320px}
.tr-dock .lw-msg{flex-basis:100%; margin:0}
.tr-r h2{font-size:15px; margin-bottom:8px}
.tr-chart{flex:1; display:flex; flex-direction:column; min-height:220px}
.tr-chart .chart-h{margin-bottom:6px; gap:12px}
.tr-chart #d-chart{flex:1; height:auto; min-height:160px}
.tr-tip{display:flex; gap:10px; align-items:flex-start; font-size:13.5px; color:var(--tx2); line-height:1.45} .tr-tip .ic{color:var(--acc); margin-top:2px}
@media (max-width:1300px){ .tr{grid-template-columns:230px minmax(0, 1fr) 270px; gap:12px; padding:12px} }

/* ---------- пошагово: допуск ---------- */
.qs{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0, 1.25fr) minmax(320px, 1fr); gap:20px; padding:20px 24px; overflow:hidden}
.qs-main{min-height:0; overflow:auto; padding-right:4px}
.qs-aim{color:var(--tx2); line-height:1.55; margin-bottom:16px; font-size:15px}
.qs-side{min-height:0; overflow:auto}
.qs-dots{display:flex; gap:6px; margin-bottom:16px}
.qs-dots button{all:unset; flex:1; height:34px; border-radius:9px; display:grid; place-items:center; background:var(--panel); border:1px solid var(--line); color:var(--mute); font-weight:700; font-size:13px; cursor:pointer}
.qs-dots button:hover{border-color:var(--line2)}
.qs-dots button.ans{background:var(--panel2); color:var(--tx); border-color:var(--line2)}
.qs-dots button.ok{background:var(--ok-soft); color:var(--ok); border-color:transparent} .qs-dots button.bad{background:var(--bad-soft); color:var(--bad); border-color:transparent}
.qs-dots button.on{border-color:var(--acc); color:var(--acc); box-shadow:0 0 0 3px var(--acc-soft)}
.qs-dots button.fin{flex:0 0 46px}
.qs-card{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:28px 32px; box-shadow:var(--sh)}
.qs-n{color:var(--acc); font-weight:700; font-size:13px; letter-spacing:.5px; text-transform:uppercase}
.qs-q{margin:10px 0 24px; font:700 25px/1.3 "Golos UI"}
.qs-opts{display:flex; flex-direction:column; gap:10px}
.qs-opts button{all:unset; box-sizing:border-box; display:flex; gap:14px; align-items:center; padding:15px 18px; border-radius:14px; border:1.5px solid var(--line); background:var(--bg2); cursor:pointer; font-size:16.5px; line-height:1.4; transition:border-color .1s, background .1s}
.qs-opts button:hover{border-color:var(--line2); background:var(--hover)}
.qs-opts .lt{flex:none; width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:var(--panel2); border:1px solid var(--line2); font:700 14px "Golos UI"; color:var(--tx2)}
.qs-opts button.pick{border-color:var(--acc); background:var(--acc-soft)} .qs-opts button.pick .lt{background:var(--acc); border-color:var(--acc); color:var(--acc-tx)}
.qs-opts button.ok{border-color:var(--ok); background:var(--ok-soft)} .qs-opts button.ok .lt{background:var(--ok); border-color:var(--ok); color:#fff}
.qs-opts button.bad{border-color:var(--bad); background:var(--bad-soft)} .qs-opts button.bad .lt{background:var(--bad); border-color:var(--bad); color:#fff}
.qs-nav{display:flex; align-items:center; gap:12px; margin-top:28px} .qs-nav > span{flex:1; text-align:center}


/* ---------- ход работы ---------- */
#hod{position:fixed; top:0; bottom:0; width:300px; z-index:30; background:var(--panel); border:1px solid var(--line2); box-shadow:var(--sh-pop); display:flex; flex-direction:column; transition:transform .22s ease; visibility:hidden}
#hod.right{right:0; transform:translateX(105%)} #hod.left{left:0; transform:translateX(-105%)}
#hod.open{transform:none; visibility:visible}
body.full #hod{top:60px; width:338px}
@media (max-width:1300px){ body.full #hod{width:282px} }
#hod header{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:16px 16px 12px; border-bottom:1px solid var(--line)}
#hod header b{display:block; font:800 18px/1.2 "Golos UI"} #hod header span{display:block; color:var(--mute); font-size:12.5px; margin-top:3px}
.hod-run{margin:12px 16px 0; padding:8px 12px; border-radius:10px; background:var(--acc-soft); color:var(--acc); font-weight:700; font-size:13.5px}
#hod ol{list-style:none; margin:0; padding:10px 10px 20px; overflow:auto; flex:1}
#hod li{display:flex; gap:10px; padding:9px 8px; border-radius:10px; font-size:14px; line-height:1.45; color:var(--tx2)}
#hod li i{font-style:normal; flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font:700 12px "Golos UI"; background:var(--panel2); border:1px solid var(--line2); color:var(--tx2)}
#hod li.cur{background:var(--acc-soft); color:var(--tx)} #hod li.cur i{background:var(--acc); border-color:var(--acc); color:var(--acc-tx)}
#hod li b{color:var(--bad)}
.tb-hod{padding:7px 12px; font-size:14px; margin-right:6px}
@media print{ #hod{display:none !important} }

/* ---------- дополнения ---------- */
.hints{border-color:var(--warn); margin-top:16px} .hints p{margin:6px 0; line-height:1.5} .hints p b{color:var(--acc); margin-right:6px}
.folder-row{display:flex; align-items:center; gap:10px} .folder-row > div{flex:1; min-width:0} .folder-row p{margin:4px 0 0; word-break:break-all}
.folder code{background:var(--bg2); padding:1px 6px; border-radius:6px}
.dup{display:flex; align-items:center; gap:4px; color:var(--bad); font-size:12px; font-weight:600; margin-top:2px} .dup .ic{width:14px; height:14px}
.sum{display:grid; gap:14px; font-size:14.5px; line-height:1.55} .sum section{background:var(--card2, rgba(127,127,127,.06)); border:1px solid var(--line); border-radius:12px; padding:12px 16px}
.sum h3{display:flex; gap:8px; align-items:center; margin:0 0 6px; font-size:15px} .sum p{margin:0} .sum .pill{justify-self:start}
.sum .sum-t{width:auto; min-width:420px} .sum .sum-t td, .sum .sum-t th{padding-left:14px; padding-right:14px} .sum-qa{list-style:none; padding:0; margin:0} .sum-qa li{padding:6px 0; border-bottom:1px solid var(--line)} .sum-qa li:last-child{border:0} .sum-qa span{display:block; color:var(--tx2)}
.tdet{margin-bottom:18px} .tdet-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px}
.tqa{list-style:none; padding:0; margin:6px 0 0; font-size:13.5px} .tqa li{padding:4px 0; border-bottom:1px solid var(--line)}
.tqa li.ok{color:var(--tx2)} .tqa li.bad{color:var(--bad)} .tqa small{display:block; color:var(--mute)}

/*{{REPORT_CSS}}*/
.paper .lwp{max-width:820px}

@media (max-width:1250px){ .stage{grid-template-columns:minmax(0, 1fr) 330px} #app{grid-template-columns:236px 1fr} .rep{grid-template-columns:290px minmax(0, 1fr)} }
@media print{
  @page{size:A4; margin:12mm}
  html,body{height:auto; overflow:visible; background:#fff !important}
  #app,#toasts,#modal,.corner{display:none !important}
  #printroot{display:block}
  .lwr{display:block}.lwp{box-shadow:none; border-radius:0; padding:0; max-width:none; page-break-after:always; break-after:page}
  .lwp:last-child{page-break-after:auto; break-after:auto}
}

/* ---------- Физпрактикум: выбор работы ---------- */
:root{--text:var(--tx); --mint:var(--ok); --blue:var(--cold); --gold:var(--acc); --pink:var(--bad); --violet:#9B7BFF; --ui:"Golos UI", system-ui, sans-serif; --serif:"F2 Math", serif; --r:16px; --on-accent:var(--acc-tx); --card:var(--panel); --card2:var(--panel2)}
.labs{max-width:1100px; margin:0 auto; padding:28px 28px 40px}
.labs-h{display:flex; align-items:center; gap:14px} .labs-h h1{margin:0; font-size:26px} .labs-h p{margin:2px 0 0; color:var(--mute)} .labs-h .sp{flex:1}
.labs-t{margin:26px 2px 12px; font-weight:800; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute)}
.labs-g{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px}
.labc{position:relative; display:grid; gap:6px; text-align:left; padding:20px; border-radius:20px; border:1px solid var(--line); background:var(--panel); box-shadow:var(--sh); cursor:pointer; min-height:190px; align-content:start}
.labc:hover{border-color:var(--acc)} .labc b{font-size:18px; line-height:1.3; padding-right:56px} .labc small{color:var(--mute)} .labc em{font-style:normal; font-weight:700; color:var(--ok)}
.labc-n{font-weight:800; font-size:13px; color:var(--acc)} .labc-ic{position:absolute; right:18px; top:18px; width:48px; height:48px; border-radius:14px; display:grid; place-items:center; background:var(--acc-soft); color:var(--acc)} .labc-ic .ic{width:26px; height:26px}
.labc.done .labc-ic{background:var(--ok-soft); color:var(--ok)}
.labc-bar{margin-top:auto; height:6px; border-radius:3px; background:var(--panel2); overflow:hidden} .labc-bar i{display:block; height:100%; background:var(--acc)} .labc.done .labc-bar i{background:var(--ok)}
.labs-f{margin-top:18px}
.tb-brand b small{display:block; font-size:11.5px; font-weight:600; color:var(--mute); line-height:1.2}
.qs-card.flat{box-shadow:none; border:0; padding:0; background:none}
/* ---------- ЛР 1 и ЛР 2: экраны сайта в раскладке программы ---------- */
.slab{display:grid; gap:14px; max-width:1240px; margin:0 auto; grid-template-columns:minmax(0,1fr)} .slab > *{min-width:0}
.slab .card{margin:0} .slab .h{display:block; font-weight:800; font-size:16px; margin-bottom:6px}
.slab.live{grid-template-columns:minmax(0,1.25fr) minmax(340px,.85fr); align-items:start; grid-auto-flow:row dense}
.slab.live > *{grid-column:2}
.slab.live > .lw-stage{grid-column:1; grid-row:1 / span 12; position:sticky; top:0; background:none; padding:0}
.slab.live #lw-cv, .slab.live #l2-cv{width:100%; max-height:calc(100vh - 210px); object-fit:contain}
.slab #le-cv{display:block; width:100%; aspect-ratio:580/452; height:auto; border-radius:16px; border:1px solid rgba(128,140,160,.3)}
.slab.live #le-cv{max-height:calc(100vh - 210px); object-fit:contain}
.tb-steps.many button:not(.on) span{display:none} .tb-steps.many{gap:2px}
.lw-screw.le-knob{flex-wrap:wrap; gap:6px} .lw-screw.le-knob span{flex:1 1 100%} .lw-screw.le-knob b{min-width:76px; font-size:18px; text-align:center} .lw-screw.le-knob .lp-btn{flex:1 1 0; width:auto; min-width:40px; padding:0 4px; font-size:13px}
.lw-stage:has(#le-cv) .lw-ctl-row{flex-wrap:wrap} .lw-stage:has(#le-cv) .lw-ctl-row > .btn{flex:1 1 auto}
.lw-ctl-row.le-rec{flex-wrap:wrap} .lw-ctl-row.le-rec label{flex:1 1 96px} .lw-ctl-row.le-rec .btn{flex:1 1 120px}
.le-knob{flex-wrap:wrap; gap:6px} .le-knob span{flex:1 1 100%} .le-knob b{min-width:76px; font-size:18px} .le-knob .lp-btn{flex:1 1 0; width:auto; min-width:44px; padding:0 4px; font-size:13px}
.seg.wrap{flex-wrap:wrap} .seg.wrap button{flex:1 1 auto} .seg button.ok{outline:2px solid var(--ok, #3DD6A0)} .seg button.bad{outline:2px solid var(--bad, #FF6B8B)}
.lw-row.three label{flex:1 1 90px}
.slab .lw-msg{min-height:1.2em}
.slab .btn.wide{width:100%} .slab .mt{margin-top:10px}
.field .inp{width:100%; padding:10px 12px; border-radius:12px; border:1.5px solid var(--line2); background:var(--panel2); color:var(--tx); font:600 15px "Golos UI", system-ui}
.card .lw-ta.inp, .card textarea.inp{width:100%; min-height:300px}
.rep .paper .lwr{display:grid; gap:16px}
.ttabs{display:inline-flex; gap:4px; margin-left:14px; padding:4px; border-radius:14px; background:var(--panel2)} .ttabs button{border:0; background:none; padding:7px 14px; border-radius:10px; font-weight:700; color:var(--mute); cursor:pointer} .ttabs button.on{background:var(--panel); color:var(--tx); box-shadow:var(--sh)} .ttabs small{color:var(--acc)}
</style>
