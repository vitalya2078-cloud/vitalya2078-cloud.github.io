[package]
name = "lw3-adiabata"
version = "1.6.0"
description = "Лабораторная работа № 3: показатель адиабаты (Клеман — Дезорм)"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"
